<style>

     so it always fills the whole screen — including the home-indicator inset,
     which showed as a pale strip when only <body> carried the background.
     body stays pinned to the screen and transparent. */
  /* iOS paints the area behind the home indicator with the page's background
     COLOR — a gradient image alone leaves it white. So every mode sets both:
     the gradient, and a solid colour matching its bottom stop. */
  html { height:100%; overflow:hidden;
    background-image: linear-gradient(180deg, #8a7fc4 0%, #6a5fa8 50%, #4a4580 100%);
    background-color:#4a4580;
    transition: background-color 3s ease; }
  html.mode-focus { background-image: linear-gradient(180deg, #5b8fd4 0%, #4a6fa5 45%, #5d5ba8 100%); background-color:#5d5ba8; }
  html.mode-break { background-image: linear-gradient(180deg, #6fb98f 0%, #4a8f7b 50%, #3d6b70 100%); background-color:#3d6b70; }
  html.mode-fixed { background-image: linear-gradient(180deg, #d4a45b 0%, #a5764a 45%, #8a5d7a 100%); background-color:#8a5d7a; }
  html.mode-done  { background-image: linear-gradient(180deg, #e8a87c 0%, #c97b63 50%, #85506b 100%); background-color:#85506b; }
  html.night      { background-image: linear-gradient(180deg, #2b3160 0%, #232850 50%, #191d3c 100%); background-color:#191d3c; }
  /* body spans the DYNAMIC viewport (100dvh = the physical screen in the
     installed app, even when the layout viewport stops short of the home
     indicator) and carries the same gradient as html — so page, bar and inset
     are one unbroken surface. */
  body {
    height:100%; overflow:hidden;
    background-image: linear-gradient(180deg, #8a7fc4 0%, #6a5fa8 50%, #4a4580 100%);
    transition: background-image 3s ease;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--ink);
    user-select:none; -webkit-user-select:none;

  body.mode-focus { background-image: linear-gradient(180deg, #5b8fd4 0%, #4a6fa5 45%, #5d5ba8 100%); }
  body.mode-break { background-image: linear-gradient(180deg, #6fb98f 0%, #4a8f7b 50%, #3d6b70 100%); }
  body.mode-fixed { background-image: linear-gradient(180deg, #d4a45b 0%, #a5764a 45%, #8a5d7a 100%); }
  body.mode-done  { background-image: linear-gradient(180deg, #e8a87c 0%, #c97b63 50%, #85506b 100%); }
  body.night      { background-image: linear-gradient(180deg, #2b3160 0%, #232850 50%, #191d3c 100%); }

  /* the app column spans the dynamic viewport; the bar is its last row,
     so it sits on the physical bottom edge in the installed app */
  #app { height:100%; height:100dvh; display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 0; }

  button { cursor:pointer; font-family:inherit; }

  /* bottom tab bar — last row of the app column, transparent so the mode
     gradient runs straight through; icons ride low into the home-indicator
     strip (Calm Countdown) */
  #bar { display:flex; margin:0 -20px;
    padding:10px 0 max(calc(env(safe-area-inset-bottom) - 12px), 10px);
    border-top:1px solid rgba(255,255,255,.14); }
  #bar button { flex:1; background:none; border:none; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; }
  #bar button .ic { font-size:17px; line-height:1; }
  #bar button .lb { font-size:12px; letter-spacing:.4px; font-weight:500; }

  #mantra { font-size:16px; color:var(--ink-soft); letter-spacing:.3px; text-align:center;

  #block-label { font-size:14px; color:var(--ink-faint); letter-spacing:1.5px; text-transform:uppercase;

  /* activity glyph is the centrepiece, between the label and the time — same

  #glyph { width:78px; height:78px; opacity:.85; color:var(--ink); transition:opacity 1.2s ease;
    filter:drop-shadow(0 1px 10px rgba(20,25,60,.45)); }
  html.night #glyph { opacity:.3; }
  #glyph svg { width:100%; height:100%; overflow:visible; display:block; }
  #glyph .aura { animation:glyphbreathe 6s ease-in-out infinite; }
  @keyframes glyphbreathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #glyph .aura { animation:none; opacity:.8; } }

  #orb-wrap { position:relative; width:min(68vw, 280px); aspect-ratio:1; margin:10px 0; }
  /* aura canvas is the centerpiece — the old ring stays in the DOM but hidden */
  #aura { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  #app { position:relative; z-index:1; }
  #ring { position:absolute; inset:0; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:3; }
  #ring .track { stroke:rgba(255,255,255,.15); }
  #ring .progress { stroke:rgba(255,255,255,.85); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  #orb { position:absolute; inset:14%; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.35), rgba(255,255,255,.08) 60%, rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  /* orb glow follows last night's Oura sleep score (5 states, 1 = <60, 5 = 90+) */
  body[data-sleep="1"] #orb { box-shadow:0 0 30px 2px  rgba(140,155,220,.18); }
  body[data-sleep="2"] #orb { box-shadow:0 0 45px 6px  rgba(165,180,235,.26); }
  body[data-sleep="3"] #orb { box-shadow:0 0 60px 10px rgba(200,205,245,.34); }
  body[data-sleep="4"] #orb { box-shadow:0 0 80px 16px rgba(240,220,210,.42); }
  body[data-sleep="5"] #orb { box-shadow:0 0 110px 26px rgba(250,215,190,.55); }

    flex-shrink:0; text-align:right; line-height:1.3; max-width:62px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:84%;

    border-radius:24px 24px 0 0; border-top:1px solid var(--glass-border);

</style>

  /* ---------- live plan ----------
     PLAN below is the copy baked into this page by the 15-minute GitHub job.
     The Worker at STILL_API reads the calendars on demand, so a live fetch is
     always at least as fresh. If it's unreachable we simply keep the baked copy. */
  const STILL_API = "https://still.srv1948070.hstgr.cloud/plan";
  let LIVE = null;
  const activePlan = () => LIVE || PLAN;

  async function pullLive(){
    try {
      const r = await fetch(STILL_API, { cache:"no-store" });
      if (!r.ok) return false;
      const p = await r.json();
      if (!p || !Array.isArray(p.blocks) || !p.blocks.length) return false;
      LIVE = p;
      pullOps().then(changed => { if (changed) { render(); renderTimeline(); } });
      return true;
    } catch { return false; }
  }

  /* ---------- state: published plan + a local edit layer ---------- */
  const KEY = "still-ops-v2";
  const today = () => new Date().toDateString();
  let ops = { edits:{}, drops:[], adds:[], ts:0 };
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.date === today()) ops = { edits:d.edits||{}, drops:d.drops||[], adds:d.adds||[], ts:d.ts||0 };
  } catch {}
  /* edits sync across devices through the Worker (/ops, KV, last-write-wins):
     every save stamps ts and pushes; every plan refresh pulls and adopts a
     newer day. The desktop orb speaks the same protocol. */
  const OPS_API = STILL_API.replace("/plan", "/ops");
  const saveOps = () => {
    ops.ts = Date.now();
    localStorage.setItem(KEY, JSON.stringify({date:today(), ...ops}));
    fetch(OPS_API, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ date:today(), ...ops }) }).catch(() => {});
  };
  async function pullOps(){
    try {
      const r = await fetch(OPS_API + "?d=" + encodeURIComponent(today()), { cache:"no-store" });
      if (!r.ok) return false;
      const d = await r.json();
      if (d && d.date === today() && (d.ts||0) > (ops.ts||0)) {
        ops = { edits:d.edits||{}, drops:d.drops||[], adds:d.adds||[], ts:d.ts };
        localStorage.setItem(KEY, JSON.stringify({date:today(), ...ops}));
        return true;
      }
    } catch {}
    return false;
  }

  const keyOf = b => b.s + "|" + b.t;

  function allBlocks(){
    const out = [];
    activePlan().blocks.forEach(b => {
      const k = keyOf(b);
      if (ops.drops.includes(k)) return;
      const ed = ops.edits[k];
      out.push({ ...b, key:k,
        s: new Date(ed?.s ?? b.s), e: new Date(ed?.e ?? b.e), t: ed?.t ?? b.t });
    });
    ops.adds.forEach(a => out.push({ ...a, key:a.key, s:new Date(a.s), e:new Date(a.e), extra:true }));
    return out.sort((x,y) => x.s - y.s);
  }

  /* Sounds removed by request — the app is silent. */
  function chime(){}

  const fmtT = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const fmtC = s => {
    const m = Math.ceil(s/60);
    if (m > 60) return `${Math.floor(m/60)}h ${m%60}m`;
    return `${m} min`;
  };
  const toField = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  function fromField(v, ref){
    const [h,m] = v.split(":").map(Number);
    const d = new Date(ref); d.setHours(h, m, 0, 0); return d;
  }

  /* the latest-starting block containing "now" wins, so anything you
     slot in mid-block takes the stage over what it interrupts */
  function currentIdx(blocks, now){
    let hit = -1;
    for (let i=0;i<blocks.length;i++) if (now >= blocks[i].s && now < blocks[i].e) hit = i;
    return hit;
  }
  function nextIdx(blocks, now){
    for (let i=0;i<blocks.length;i++) if (now < blocks[i].s) return i;
    return -1;
  }

  /* ---------- edit operations ---------- */
  function writeEdit(b, s, e, t){
    if (b.extra) {
      const a = ops.adds.find(x => x.key === b.key);
      if (a) { a.s = s.toISOString(); a.e = e.toISOString(); a.t = t; }
    } else {
      ops.edits[b.key] = { s:s.toISOString(), e:e.toISOString(), t };
    }
    saveOps();
  }
  function removeBlock(b){
    if (b.extra) ops.adds = ops.adds.filter(x => x.key !== b.key);
    else { if (!ops.drops.includes(b.key)) ops.drops.push(b.key); delete ops.edits[b.key]; }
    saveOps();
  }
  function pushRest(fromBlock, minutes){
    const ms = minutes*60000;
    allBlocks().forEach(b => {
      if (b.s < fromBlock.s) return;
      writeEdit(b, new Date(b.s.getTime()+ms), new Date(b.e.getTime()+ms), b.t);
    });
  }

  /* ---------- render ---------- */
  let manualIdx = null, lastKey = "", pausedAt = null;

  function render(){
    const now = pausedAt || new Date();
    const blocks = allBlocks();
    let idx = manualIdx !== null ? Math.min(manualIdx, blocks.length-1) : currentIdx(blocks, now);
    let phase, label, remaining=0, total=0, sub="", next="";
    let gTitle = null, gType = null, gOpen = false, gPre = false;

    if (idx === -1) {
      const ni = nextIdx(blocks, now);
      if (ni === -1) { phase="done"; label="your day is complete"; }
      else {
        // nothing has started yet today — "waking up", not "open space" (Junyan, 2026-09-04)
        gPre = blocks.every(b => now < b.s);
        phase="break"; label = gPre ? "waking up" : "open space"; gTitle = blocks[ni].t; gType = blocks[ni].type; gOpen = true;
        remaining = total = (blocks[ni].s - now)/1000;
        sub = "until " + fmtT(blocks[ni].s);
        next = `${blocks[ni].t} at ${fmtT(blocks[ni].s)}`;
      }
    } else {
      const b = blocks[idx];
      phase = b.type === "task" ? "focus" : b.type;
      label = b.t; gTitle = b.t; gType = b.type;
      total = (b.e - b.s)/1000;
      remaining = Math.max(0, (b.e - now)/1000);
      sub = (b.type === "break") ? "rest" : "";
      if (blocks[idx+1]) next = `${blocks[idx+1].t} at ${fmtT(blocks[idx+1].s)}`;
    }

    const k = phase + ":" + label;
    if (lastKey && k !== lastKey && manualIdx === null) {
      chime(phase === "focus" ? [523.25,659.25,783.99] : [783.99,659.25]);
    }
    lastKey = k;

    $("time").textContent = phase === "done" ? "☺" : fmtC(remaining);
    $("time-sub").textContent = sub;
    $("block-label").textContent = label;
    $("next-up").textContent = next;
    GLYPH.show(blocks.length ? GLYPH.pick(gTitle, gType, document.documentElement.classList.contains("night"), phase === "done", gOpen, gPre) : "");
    document.body.className = "mode-" + (phase === "fixed" ? "fixed" : phase) + (pausedAt ? "" : " running");
    // <html> paints the gradient, so it needs the same mode class
    document.documentElement.classList.remove("mode-focus","mode-break","mode-fixed","mode-done");
    document.documentElement.classList.add("mode-" + (phase === "fixed" ? "fixed" : phase));
    $("now-btn").textContent = pausedAt ? "▶" : "❚❚";
    document.querySelector("#ring .progress").style.strokeDashoffset = total ? CIRC*(remaining/total) : CIRC;
  }

  setInterval(() => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    const phase = i === -1 ? "break" : blocks[i].type;
    const pool = (phase === "focus" || phase === "task") ? FOCUS_MANTRAS
               : phase === "fixed" ? FIXED_MANTRAS : BREAK_MANTRAS;
    const el = $("mantra");
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = pool[Math.floor(Math.random()*pool.length)]; el.style.opacity = 1; }, 1200);
  }, 45000);

  /* ---------- main-screen controls ---------- */
  /* ❚❚/▶ — pause freezes the countdown; resuming gives the block back the
     paused time by pushing its end out, so no focus minutes are lost */
  $("now-btn").onclick = () => {
    if (pausedAt === null) {
      const blocks = allBlocks();
      if (currentIdx(blocks, new Date()) === -1) return;   // nothing running
      pausedAt = new Date();
    } else {
      const delta = Date.now() - pausedAt.getTime();
      const blocks = allBlocks();
      const i = currentIdx(blocks, pausedAt);
      if (i !== -1 && delta > 5000) {
        const b = blocks[i];
        writeEdit(b, b.s, new Date(b.e.getTime() + delta), b.t);
      }
      pausedAt = null;
    }
    manualIdx = null;
    render();
  };
  $("ext-btn").onclick = () => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    if (i === -1) return;
    const b = blocks[i];
    writeEdit(b, b.s, new Date(b.e.getTime() + 15*60000), b.t);
    render();
  };
  $("done-btn").onclick = () => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    if (i === -1) return;
    const b = blocks[i], now = new Date();
    if (now > b.s) writeEdit(b, b.s, now, b.t);
    chime([523.25, 659.25, 783.99]);
    manualIdx = null; render(); renderTimeline();
  };

  /* ---------- timeline sheet ---------- */
  function renderTimeline(){
    const now = new Date();
    const blocks = allBlocks();
    $("plan-meta").textContent = activePlan().label;
    $("timeline").innerHTML = blocks.map((b,i) => {
      const cls = now >= b.e ? "past" : (now >= b.s ? "now" : "");
      const tag = b.type === "fixed" ? (b.cal||"") : b.type === "task" ? (b.cal||"you") : b.type;
      return `<button class="tl t-${b.type} ${cls}" data-i="${i}">
        <span class="when">${fmtT(b.s)}–${fmtT(b.e)}</span>
        <span class="what">${esc(b.t)}</span>
        <span class="tag">${esc(tag)}</span>
      </button>`;
    }).join("");
    document.querySelectorAll("#timeline .tl").forEach(el => {
      el.onclick = () => openEdit(blocks[+el.dataset.i]);
    });
    const cur = document.querySelector("#timeline .now");
    if (cur) cur.scrollIntoView({block:"center"});
  }
  const syncScrim = () => {
    const any = ["sheet","tsheet"].some(id => $(id).classList.contains("open"));
    $("scrim").classList.toggle("show", any);
    $("now-tab").classList.toggle("on", !any);
  };
  const openSheet = v => {
    $("sheet").classList.toggle("open", v);
    $("day-btn").classList.toggle("on", v);
    if (v) {
      $("tsheet").classList.remove("open"); $("tasks-btn").classList.remove("on");
      renderTimeline(); refreshLive();
    }
    syncScrim();
  };

  $("now-tab").onclick = () => { openSheet(false); openTasks(false); manualIdx = null; render(); };

  /* ---------- focus sheet: Tasks Inbox ---------- */
  let tasks = [], tasksLoaded = false;
  async function pullTasks(){
    try {
      const r = await fetch(STILL_API.replace("/plan", "/tasks"), { cache:"no-store" });
      if (!r.ok) return false;
      const d = await r.json();
      if (!Array.isArray(d.tasks)) return false;
      tasks = d.tasks; tasksLoaded = true;
      return true;
    } catch { return false; }
  }
  /* Focus opens on the three that matter — the inbox order already puts Next
     Action first, then priority. "show everything" reveals the rest. */
  let showAllTasks = false;
  function renderTasks(){
    if (!tasksLoaded) { $("tmeta").textContent = "Reaching your Tasks Inbox…"; $("tlist").innerHTML = ""; return; }
    const open = tasks.filter(t => !t.done);
    // the three, plus anything already ticked this session so it doesn't vanish
    const top3 = new Set(open.slice(0, 3));
    const shown = showAllTasks ? tasks : tasks.filter(t => top3.has(t) || t.done);
    $("tmeta").textContent = open.length
      ? (showAllTasks
          ? `${open.length} open · tap to clear`
          : `your three · ${open.length} open in the inbox`)
      : "Inbox clear. Breathe.";
    $("tlist").innerHTML = shown.map(t => `
      <button class="task ${t.done ? "done-t" : ""}" data-i="${tasks.indexOf(t)}">
        <span class="box">${t.done ? "✓" : ""}</span>
        <span class="t-name">${esc(t.task)}</span>
        <span class="t-tag">${esc((t.priority || "").replace(/[^\p{Emoji}]/gu, ""))} ${esc(t.estimate || "")}</span>
      </button>`).join("")
      + (open.length > 3
          ? `<button class="task t-more" id="t-more">
               <span class="t-name">${showAllTasks ? "just my three" : `show everything (${open.length - 3} more)`}</span>
             </button>`
          : "");
    document.querySelectorAll("#tlist .task[data-i]").forEach(el => {
      el.onclick = () => toggleTask(+el.dataset.i);
    });
    const more = $("t-more");
    if (more) more.onclick = () => { showAllTasks = !showAllTasks; renderTasks(); };
  }
  async function toggleTask(i){
    const t = tasks[i];
    t.done = !t.done;                 // optimistic
    renderTasks();
    if (t.done) chime([659.25, 783.99, 1046.5]);
    try {
      const r = await fetch(STILL_API.replace("/plan", "/tasks/done"), {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ id: t.id, done: t.done }),
      });
      if (!r.ok) throw new Error();
    } catch {
      t.done = !t.done;               // roll back — Notion was not updated
      renderTasks();
      $("tmeta").textContent = "Couldn't reach your Tasks Inbox — change not saved.";
    }
  }
  const openTasks = v => {
    $("tsheet").classList.toggle("open", v);
    $("tasks-btn").classList.toggle("on", v);
    if (v) {
      $("sheet").classList.remove("open"); $("day-btn").classList.remove("on");
      renderTasks(); pullTasks().then(ok => {
        if (ok) renderTasks();
        else if (!tasksLoaded) $("tmeta").textContent = "Can't reach your Tasks Inbox right now.";
      });
    }
    syncScrim();
  };
  $("tasks-btn").onclick = () => openTasks(!$("tsheet").classList.contains("open"));

  /* pull the calendar again — on demand, and whenever the sheet opens */
  let pulling = false;
  async function refreshLive(manual){
    if (pulling) return;
    pulling = true;
    const btn = $("refresh-btn");
    btn.classList.add("busy");
    if (manual) btn.textContent = "⟳ checking your calendar…";
    const ok = await pullLive();
    btn.classList.remove("busy");
    btn.textContent = ok ? "⟳ refresh from my calendar"
                         : "⟳ refresh from my calendar (offline)";
    pulling = false;
    if (ok) { render(); renderTimeline(); }
  }
  $("refresh-btn").onclick = () => refreshLive(true);
  $("day-btn").onclick = () => openSheet(!$("sheet").classList.contains("open"));
  $("scrim").onclick = () => { openSheet(false); openTasks(false); };

  /* ---------- edit modal ---------- */
  let editing = null;
  function openEdit(b){
    editing = b;
    $("edit-title").textContent = b.type === "fixed" ? "Adjust — from " + (b.cal||"calendar") : "Adjust this block";
    $("ed-name").value = b.t;
    $("ed-start").value = toField(b.s);
    $("ed-end").value = toField(b.e);
    $("edit-modal").classList.add("open");
  }
  const closeEdit = () => { $("edit-modal").classList.remove("open"); editing = null; };
  $("ed-cancel").onclick = closeEdit;
  $("edit-modal").onclick = e => { if (e.target === $("edit-modal")) closeEdit(); };
  $("ed-save").onclick = () => {
    if (!editing) return;
    const s = fromField($("ed-start").value, editing.s);
    let e = fromField($("ed-end").value, editing.e);
    if (e <= s) e = new Date(s.getTime() + 15*60000);
    writeEdit(editing, s, e, $("ed-name").value.trim() || editing.t);
    closeEdit(); manualIdx = null; render(); renderTimeline();
  };
  $("ed-del").onclick = () => {
    if (!editing) return;
    removeBlock(editing);
    closeEdit(); manualIdx = null; render(); renderTimeline();
  };
  document.querySelectorAll("#edit-modal .quick button").forEach(btn => {
    btn.onclick = () => {
      if (!editing) return;
      const act = btn.dataset.act, now = new Date();
      if (act === "now") {
        const dur = editing.e - editing.s;
        writeEdit(editing, now, new Date(now.getTime() + dur), $("ed-name").value.trim() || editing.t);
      } else if (act === "plus15") {
        writeEdit(editing, editing.s, new Date(editing.e.getTime() + 15*60000), editing.t);
      } else if (act === "push15") { pushRest(editing, 15); }
      else if (act === "push30") { pushRest(editing, 30); }
      closeEdit(); manualIdx = null; render(); renderTimeline();
    };
  });

  /* ---------- quick add (starts now) ---------- */
  let durMin = 5;
  document.querySelectorAll("#add-chips button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("#add-chips button").forEach(b => b.classList.remove("sel"));
      btn.classList.add("sel"); durMin = +btn.dataset.m;
    };
  });
  $("add-btn").onclick = () => { $("add-modal").classList.add("open"); $("add-name").focus(); };
  $("add-cancel").onclick = () => $("add-modal").classList.remove("open");
  $("add-modal").onclick = e => { if (e.target === $("add-modal")) $("add-modal").classList.remove("open"); };
  function addBlock(name, start, end){
    ops.adds.push({ key:"x"+start.getTime(), s:start.toISOString(), e:end.toISOString(),
      t:name, type:"task", cal:"you" });
    saveOps();
  }
  $("add-go").onclick = () => {
    const name = $("add-name").value.trim();
    if (!name) { $("add-name").focus(); return; }
    const now = new Date();
    addBlock(name, now, new Date(now.getTime() + durMin*60000));
    $("add-name").value = "";
    $("add-modal").classList.remove("open");
    manualIdx = null; chime([659.25, 783.99]); render(); renderTimeline();
  };
  $("add-name").addEventListener("keydown", e => { if (e.key === "Enter") $("add-go").onclick(); });

  /* add a block at a chosen time, straight from the timeline */
  $("new-block").onclick = () => {
    const now = new Date();
    const s = new Date(now.getTime() + 30*60000); s.setSeconds(0,0);
    addBlock("New block", s, new Date(s.getTime() + 30*60000));
    renderTimeline();
    openEdit(allBlocks().find(b => b.key === "x"+s.getTime()));
  };

  /* ---------- stale-plan guard ----------
     The plan is rebuilt in the cloud every 30 min. Phones cache aggressively and
     this page is often left open overnight, so poll our own version stamp and
     reload when the server has something newer. */
  const MY_VERSION = document.querySelector('meta[name="still-version"]')?.content || "";
  async function checkForNewPlan(){
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache:"no-store" });
      if (!r.ok) return;
      const txt = await r.text();
      const m = txt.match(/name="still-version" content="([^"]*)"/);
      if (m && m[1] && m[1] !== MY_VERSION) location.reload();
    } catch {}
  }
  setInterval(checkForNewPlan, 15*60*1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { checkForNewPlan(); refreshLive(); }
  });

  /* keep the live plan warm while the app sits open on the desk */
  setInterval(refreshLive, 5*60*1000);

  /* if the plan on screen isn't for today, say so instead of "day complete" */
  /* A plan is stale only if NOTHING in it touches today. Judging by the first
     block alone was wrong: a plan legitimately opens with last night's late
     event (a social that runs past midnight), which reads as yesterday. */
  function planIsStale(){
    const today = new Date().toDateString();
    return !activePlan().blocks.some(b =>
      new Date(b.s).toDateString() === today || new Date(b.e).toDateString() === today);
  }

  /* ---------- tick, wake lock ---------- */
  setInterval(() => {
    render();
    if (planIsStale()) {
      $("block-label").textContent = "today's plan is on its way";
      $("time").textContent = "…";
      $("time-sub").textContent = "";
      $("next-up").textContent = "pull down to refresh";
      GLYPH.show("");
    }
  }, 1000);
  let wakeLock;
  async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
  document.addEventListener("click", keepAwake, { once:true });

  render();
  refreshLive().then(() => { render(); });   // live calendar on first open

  /* ---------- Oura sleep score -> orb glow (5 states, 50 and below = bottom) ---------- */
  (() => {
    async function pullSleep(){
      try {
        const r = await fetch("https://still.srv1948070.hstgr.cloud/sleep", { cache:"no-store" });
        if (!r.ok) return;
        const { score } = await r.json();
        if (typeof score !== "number") return;
        document.body.dataset.sleep =
          score < 60 ? 1 : score < 70 ? 2 : score < 80 ? 3 : score < 90 ? 4 : 5;
      } catch {}
    }
    pullSleep();
    setInterval(pullSleep, 60*60*1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pullSleep(); });
  })();

  /* ---------- night ----------
     After 22:00 (until 05:00) device-local the field goes dark and quiet, but
     the orb stays — text has to stay readable, which the moon never allowed.
     The canvas is unused now; it stays in the DOM for future centerpieces. */
  (() => {
    const cv = $("aura"), x = cv.getContext("2d");
    function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
    size(); addEventListener("resize", size);
    (function loop(){
      const hour = new Date().getHours();
      const night = hour >= 22 || hour < 5;
      document.body.classList.toggle("night", night);
      document.documentElement.classList.toggle("night", night);
      x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      x.clearRect(0,0,innerWidth,innerHeight);
      requestAnimationFrame(loop);
    })();
  })();

  /* ---------- floating mini-timer (desktop) ----------
     Document Picture-in-Picture gives a genuine always-on-top window — the OS
     keeps it above every app, which a normal browser window can't do. Desktop
     Chrome/Edge only; the ⧉ button never appears where the API is missing
     (Safari, iOS), so phones are untouched. The pip window renders nothing of
     its own: it mirrors the main screen once a second, and its pause button
     just forwards to the real one. */
  (() => {
    if (!("documentPictureInPicture" in window)) return;
    const btn = document.createElement("button");
    btn.className = "ctl"; btn.id = "float-btn";
    btn.title = "float a mini timer above your other apps";
    btn.textContent = "⧉";
    $("controls").appendChild(btn);

    let pw = null;
    function syncPip(){
      if (!pw) return;
      const d = pw.document;
      d.getElementById("p-label").textContent = $("block-label").textContent;
      d.getElementById("p-time").textContent  = $("time").textContent;
      d.getElementById("p-sub").textContent   = $("time-sub").textContent || $("next-up").textContent;
      d.getElementById("p-pause").textContent = $("now-btn").textContent;
      d.body.style.background = getComputedStyle(document.documentElement).backgroundImage;
    }
    setInterval(syncPip, 1000);

    btn.onclick = async () => {
      if (pw) { pw.close(); return; }
      try {
        pw = await documentPictureInPicture.requestWindow({ width: 280, height: 180 });
      } catch { pw = null; return; }   // embedded browsers expose the API but can't open the window
      const d = pw.document;
      d.head.innerHTML = `<style>
        *{box-sizing:border-box;margin:0;}
        body{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:5px;font-family:-apple-system,"SF Pro Display","Segoe UI",sans-serif;
          color:rgba(255,255,255,.95);transition:background 2s ease;
          -webkit-user-select:none;user-select:none;}
        #p-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);
          max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        #p-time{font-size:46px;font-weight:200;letter-spacing:1px;line-height:1.1;
          font-variant-numeric:tabular-nums;}
        #p-sub{font-size:11px;letter-spacing:.5px;color:rgba(255,255,255,.45);min-height:14px;
          max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        #p-pause{margin-top:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
          color:inherit;border-radius:17px;width:62px;height:30px;font-size:13px;cursor:pointer;}
      </style>`;
      d.body.innerHTML = `<div id="p-label"></div><div id="p-time">--:--</div>
        <div id="p-sub"></div><button id="p-pause">❚❚</button>`;
      d.getElementById("p-pause").onclick = () => $("now-btn").onclick();
      pw.addEventListener("pagehide", () => { pw = null; });
      syncPip();
    };
  })();
})();
</script>
</body>
</html>
