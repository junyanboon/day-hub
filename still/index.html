<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="still-version" content="2026-08-03T01:06:35-04:00">
<title>Still — a calm day</title>
<style>
  :root {
    --ink: rgba(255,255,255,.95);
    --ink-soft: rgba(255,255,255,.65);
    --ink-faint: rgba(255,255,255,.4);
    --glass: rgba(255,255,255,.12);
    --glass-border: rgba(255,255,255,.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #8a7fc4 0%, #6a5fa8 50%, #4a4580 100%);
    transition: background 3s ease;
    user-select:none; -webkit-user-select:none;
  }
  body.mode-focus { background: linear-gradient(180deg, #5b8fd4 0%, #4a6fa5 45%, #5d5ba8 100%); }
  body.mode-break { background: linear-gradient(180deg, #6fb98f 0%, #4a8f7b 50%, #3d6b70 100%); }
  body.mode-fixed { background: linear-gradient(180deg, #d4a45b 0%, #a5764a 45%, #8a5d7a 100%); }
  body.mode-done  { background: linear-gradient(180deg, #e8a87c 0%, #c97b63 50%, #85506b 100%); }

  #app { height:100%; display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px); }

  header { display:flex; justify-content:space-between; align-items:center; }
  #clock { font-size:15px; font-weight:500; color:var(--ink-soft); letter-spacing:.5px; }
  .hdr-btns { display:flex; gap:8px; }
  #day-btn, #add-btn { background:var(--glass); border:1px solid var(--glass-border); color:var(--ink);
    border-radius:20px; padding:7px 14px; font-size:13px; font-weight:500;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  #add-btn { border-radius:50%; width:33px; height:33px; padding:0; font-size:17px; }
  button { cursor:pointer; font-family:inherit; }

  #stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:0; }
  #mantra { font-size:16px; color:var(--ink-soft); letter-spacing:.3px; text-align:center;
    min-height:22px; transition:opacity 1.2s ease; padding:0 10px; }
  #block-label { font-size:14px; color:var(--ink-faint); letter-spacing:1.5px; text-transform:uppercase;
    text-align:center; max-width:90%; }
  #next-up { font-size:13px; color:var(--ink-faint); text-align:center; min-height:18px; }

  #orb-wrap { position:relative; width:min(68vw, 280px); aspect-ratio:1; margin:10px 0; }
  #ring { position:absolute; inset:0; transform:rotate(-90deg); }
  #ring circle { fill:none; stroke-width:3; }
  #ring .track { stroke:rgba(255,255,255,.15); }
  #ring .progress { stroke:rgba(255,255,255,.85); stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  #orb { position:absolute; inset:14%; border-radius:50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.35), rgba(255,255,255,.08) 60%, rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  body.running #orb { animation:breathe 8s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(.94);} 50%{transform:scale(1.04);} }
  @media (prefers-reduced-motion: reduce) { body.running #orb { animation:none; } }
  #time { font-size:48px; font-weight:200; letter-spacing:1px; font-variant-numeric:tabular-nums; }
  #time-sub { font-size:12px; color:var(--ink-faint); letter-spacing:1px; }

  #controls { display:flex; align-items:center; gap:14px; margin-top:4px; }
  .ctl { background:var(--glass); border:1px solid var(--glass-border); color:var(--ink);
    border-radius:26px; min-width:52px; height:52px; padding:0 14px; font-size:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; }
  .ctl.big { width:68px; height:68px; border-radius:50%; padding:0; font-size:22px;
    background:rgba(255,255,255,.9); color:#3a4a6b; border:none; }

  /* sheets + modals */
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:84%;
    background:rgba(30,35,60,.8); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border-radius:24px 24px 0 0; border-top:1px solid var(--glass-border);
    transform:translateY(100%); transition:transform .35s cubic-bezier(.3,.9,.3,1);
    display:flex; flex-direction:column;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 16px); z-index:10; }
  #sheet.open { transform:translateY(0); }
  #sheet .handle { width:36px; height:4px; border-radius:2px; background:var(--ink-faint); margin:0 auto 14px; }
  #sheet h2 { font-size:17px; font-weight:600; margin-bottom:2px; }
  #sheet .sub { font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  #sheet .hint { font-size:11.5px; color:var(--ink-faint); margin-bottom:12px; }
  #timeline { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; }
  .tl { display:flex; align-items:center; gap:11px; border-radius:13px; padding:10px 13px;
    background:var(--glass); border:1px solid var(--glass-border); text-align:left; width:100%;
    color:var(--ink); font-family:inherit; }
  .tl:focus-visible { outline:2px solid rgba(255,255,255,.7); outline-offset:2px; }
  .tl.past { opacity:.4; }
  .tl.now { background:rgba(255,255,255,.24); }
  .tl .when { font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums; width:96px; flex-shrink:0; }
  .tl .what { flex:1; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tl .tag { font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-faint); flex-shrink:0; }
  .tl.t-focus .tag { color:#9fc7ff; }
  .tl.t-fixed .tag { color:#ffce9f; }
  .tl.t-break .tag { color:#9fe3b0; }
  .tl.t-task  .tag { color:#8fe0da; }
  #new-block { margin-top:10px; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink); border-radius:12px; padding:11px; font-size:14px; width:100%; }
  #refresh-btn { background:var(--glass); border:1px solid var(--glass-border); color:var(--ink);
    border-radius:11px; padding:9px; font-size:13px; width:100%; margin-bottom:10px; }
  #refresh-btn.busy { opacity:.55; }

  .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .modal.open { display:flex; }
  .card { width:min(88vw, 350px); background:rgba(30,35,60,.9);
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid var(--glass-border); border-radius:20px; padding:20px;
    max-height:86vh; overflow-y:auto; }
  .card h3 { font-size:16px; font-weight:600; margin-bottom:14px; }
  .card label { display:block; font-size:11.5px; letter-spacing:.8px; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:5px; }
  .card input { width:100%; background:var(--glass); border:1px solid var(--glass-border);
    border-radius:12px; padding:11px 13px; color:var(--ink); font-size:15px; font-family:inherit; outline:none; }
  .card input:focus-visible { outline:2px solid rgba(255,255,255,.6); outline-offset:1px; }
  .card input::placeholder { color:var(--ink-faint); }
  .field { margin-bottom:13px; }
  .two { display:flex; gap:10px; }
  .two .field { flex:1; }
  .chips { display:flex; gap:8px; margin-bottom:15px; }
  .chips button { flex:1; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink); border-radius:11px; padding:9px 0; font-size:13.5px; }
  .chips button.sel { background:rgba(255,255,255,.9); color:#3a4a6b; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:15px; }
  .quick button { flex:1 1 46%; background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink); border-radius:11px; padding:10px 4px; font-size:12.5px; }
  .acts { display:flex; gap:8px; }
  .acts button { flex:1; border-radius:12px; padding:12px; font-size:14.5px; font-weight:500;
    background:var(--glass); border:1px solid var(--glass-border); color:var(--ink); }
  .acts .primary { background:rgba(255,255,255,.9); color:#3a4a6b; border:none; }
  .danger { color:#ffb3ba; }
  #scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none;
    transition:opacity .3s; z-index:5; }
  #scrim.show { opacity:1; pointer-events:auto; }

  footer { display:flex; justify-content:center; gap:6px; padding-top:10px; }
  .pip { width:7px; height:7px; border-radius:50%; background:var(--ink-faint); }
  .pip.filled { background:var(--ink); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="clock">--:--</div>
    <div class="hdr-btns">
      <button id="add-btn" title="slot something in now">＋</button>
      <button id="day-btn">my day ☼</button>
    </div>
  </header>
  <div id="stage">
    <div id="block-label"></div>
    <div id="orb-wrap">
      <svg id="ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="47"></circle>
        <circle class="progress" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="295.3"></circle>
      </svg>
      <div id="orb"><div id="time">--:--</div><div id="time-sub"></div></div>
    </div>
    <div id="mantra">take a deep breath</div>
    <div id="next-up"></div>
    <div id="controls">
      <button class="ctl" id="ext-btn" title="give this block 15 more minutes">+15</button>
      <button class="ctl big" id="now-btn" title="back to now">◉</button>
      <button class="ctl" id="done-btn" title="finished early">done</button>
    </div>
  </div>
  <footer id="pips"></footer>
</div>

<!-- quick add: start something right now -->
<div class="modal" id="add-modal">
  <div class="card">
    <h3>Slot something in, right now</h3>
    <div class="field">
      <input id="add-name" placeholder="grooming, stretch, call mom…" autocomplete="off">
    </div>
    <div class="chips" id="add-chips">
      <button data-m="5" class="sel">5m</button>
      <button data-m="15">15m</button>
      <button data-m="30">30m</button>
      <button data-m="45">45m</button>
    </div>
    <div class="acts">
      <button id="add-cancel">not now</button>
      <button id="add-go" class="primary">begin</button>
    </div>
  </div>
</div>

<!-- edit any block -->
<div class="modal" id="edit-modal">
  <div class="card">
    <h3 id="edit-title">Adjust this block</h3>
    <div class="field">
      <label for="ed-name">What</label>
      <input id="ed-name" autocomplete="off">
    </div>
    <div class="two">
      <div class="field">
        <label for="ed-start">Starts</label>
        <input id="ed-start" type="time">
      </div>
      <div class="field">
        <label for="ed-end">Ends</label>
        <input id="ed-end" type="time">
      </div>
    </div>
    <div class="quick">
      <button data-act="now">▶ start it now</button>
      <button data-act="plus15">+15 min longer</button>
      <button data-act="push15">↓ push rest of day +15</button>
      <button data-act="push30">↓ push rest of day +30</button>
    </div>
    <div class="acts">
      <button id="ed-del" class="danger">remove</button>
      <button id="ed-cancel">cancel</button>
      <button id="ed-save" class="primary">save</button>
    </div>
  </div>
</div>

<div id="scrim"></div>
<div id="sheet">
  <div class="handle"></div>
  <h2>Your day, gently planned</h2>
  <div class="sub" id="plan-meta"></div>
  <button id="refresh-btn">⟳ refresh from my calendar</button>
  <div class="hint">Tap any block to rename it, move it, or start it now.</div>
  <div id="timeline"></div>
  <button id="new-block">＋ add a block at a set time</button>
</div>

<script>
/* ============================================================
   DAY PLAN — rebuilt every 30 min by the day-hub GitHub Action
   (scripts/still_plan.py) from Joint Plans + Junyan.
   Your in-app edits are layered on top and always survive a rebuild.
   ============================================================ */
// STILL:PLAN:START — regenerated by scripts/still_plan.py. Hand-edits here are overwritten.
const PLAN = {
  generated: "2026-08-03T01:06:35-04:00",
  label: "Mon Aug 3 · synced from Joint Plans + Junyan",
  blocks: [
    { s:"2026-08-03T07:30:00-04:00", e:"2026-08-03T08:00:00-04:00", t:"🧘 Shambhavi", type:"fixed", cal:"Joint Plans" },
    { s:"2026-08-03T08:00:00-04:00", e:"2026-08-03T08:30:00-04:00", t:"Deep work I", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T08:30:00-04:00", e:"2026-08-03T09:30:00-04:00", t:"Hotel breakfast (included)", type:"fixed", cal:"Joint Plans" },
    { s:"2026-08-03T09:30:00-04:00", e:"2026-08-03T10:20:00-04:00", t:"Deep work II", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T10:20:00-04:00", e:"2026-08-03T10:30:00-04:00", t:"Rest", type:"break", cal:"" },
    { s:"2026-08-03T10:30:00-04:00", e:"2026-08-03T11:20:00-04:00", t:"Deep work III", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T11:20:00-04:00", e:"2026-08-03T11:30:00-04:00", t:"Rest", type:"break", cal:"" },
    { s:"2026-08-03T11:30:00-04:00", e:"2026-08-03T12:20:00-04:00", t:"Deep work IV", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T12:20:00-04:00", e:"2026-08-03T12:30:00-04:00", t:"Rest", type:"break", cal:"" },
    { s:"2026-08-03T12:30:00-04:00", e:"2026-08-03T13:00:00-04:00", t:"Deep work V", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T13:00:00-04:00", e:"2026-08-03T18:00:00-04:00", t:"🏜️ Lagoa das Emendadas", type:"fixed", cal:"Joint Plans" },
    { s:"2026-08-03T18:00:00-04:00", e:"2026-08-03T19:00:00-04:00", t:"Dinner", type:"fixed", cal:"Joint Plans" },
    { s:"2026-08-03T19:00:00-04:00", e:"2026-08-03T19:50:00-04:00", t:"Deep work VI", type:"focus", cal:"Junyan" },
    { s:"2026-08-03T19:50:00-04:00", e:"2026-08-03T20:00:00-04:00", t:"Rest", type:"break", cal:"" },
    { s:"2026-08-03T20:00:00-04:00", e:"2026-08-03T20:50:00-04:00", t:"Deep work VII", type:"focus", cal:"Junyan" }
  ]
};
// STILL:PLAN:END

(() => {
  const FOCUS_MANTRAS = ["settle into this moment","one thing, softly held","let the rest wait","breathe in, begin","stay with it, gently","this block is enough"];
  const BREAK_MANTRAS = ["release your shoulders","look far away","take a slow breath","stand, stretch, soften","let your mind wander"];
  const FIXED_MANTRAS = ["be where your feet are","this, fully","present and unhurried"];
  const CIRC = 295.3;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---------- live plan ----------
     PLAN below is the copy baked into this page by the 15-minute GitHub job.
     The Worker at STILL_API reads the calendars on demand, so a live fetch is
     always at least as fresh. If it's unreachable we simply keep the baked copy. */
  const STILL_API = "https://still-api.still-api.workers.dev/plan";
  let LIVE = null;
  const activePlan = () => LIVE || PLAN;

  async function pullLive(){
    try {
      const r = await fetch(STILL_API, { cache:"no-store" });
      if (!r.ok) return false;
      const p = await r.json();
      if (!p || !Array.isArray(p.blocks) || !p.blocks.length) return false;
      LIVE = p;
      return true;
    } catch { return false; }
  }

  /* ---------- state: published plan + a local edit layer ---------- */
  const KEY = "still-ops-v2";
  const today = () => new Date().toDateString();
  let ops = { edits:{}, drops:[], adds:[] };
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.date === today()) ops = { edits:d.edits||{}, drops:d.drops||[], adds:d.adds||[] };
  } catch {}
  const saveOps = () => localStorage.setItem(KEY, JSON.stringify({date:today(), ...ops}));

  const keyOf = b => b.s + "|" + b.t;

  function allBlocks(){
    const out = [];
    activePlan().blocks.forEach(b => {
      const k = keyOf(b);
      if (ops.drops.includes(k)) return;
      const ed = ops.edits[k];
      out.push({ ...b, key:k,
        s: new Date(ed?.s ?? b.s), e: new Date(ed?.e ?? b.e), t: ed?.t ?? b.t });
    });
    ops.adds.forEach(a => out.push({ ...a, key:a.key, s:new Date(a.s), e:new Date(a.e), extra:true }));
    return out.sort((x,y) => x.s - y.s);
  }

  /* ---------- soft chimes ---------- */
  let ac;
  function chime(freqs){
    try {
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      freqs.forEach((f,i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type="sine"; o.frequency.value=f;
        g.gain.setValueAtTime(0, ac.currentTime + i*.4);
        g.gain.linearRampToValueAtTime(.18, ac.currentTime + i*.4 + .05);
        g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + i*.4 + 2.2);
        o.connect(g).connect(ac.destination);
        o.start(ac.currentTime + i*.4); o.stop(ac.currentTime + i*.4 + 2.4);
      });
    } catch {}
  }

  const fmtT = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const fmtC = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const toField = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  function fromField(v, ref){
    const [h,m] = v.split(":").map(Number);
    const d = new Date(ref); d.setHours(h, m, 0, 0); return d;
  }

  /* the latest-starting block containing "now" wins, so anything you
     slot in mid-block takes the stage over what it interrupts */
  function currentIdx(blocks, now){
    let hit = -1;
    for (let i=0;i<blocks.length;i++) if (now >= blocks[i].s && now < blocks[i].e) hit = i;
    return hit;
  }
  function nextIdx(blocks, now){
    for (let i=0;i<blocks.length;i++) if (now < blocks[i].s) return i;
    return -1;
  }

  /* ---------- edit operations ---------- */
  function writeEdit(b, s, e, t){
    if (b.extra) {
      const a = ops.adds.find(x => x.key === b.key);
      if (a) { a.s = s.toISOString(); a.e = e.toISOString(); a.t = t; }
    } else {
      ops.edits[b.key] = { s:s.toISOString(), e:e.toISOString(), t };
    }
    saveOps();
  }
  function removeBlock(b){
    if (b.extra) ops.adds = ops.adds.filter(x => x.key !== b.key);
    else { if (!ops.drops.includes(b.key)) ops.drops.push(b.key); delete ops.edits[b.key]; }
    saveOps();
  }
  function pushRest(fromBlock, minutes){
    const ms = minutes*60000;
    allBlocks().forEach(b => {
      if (b.s < fromBlock.s) return;
      writeEdit(b, new Date(b.s.getTime()+ms), new Date(b.e.getTime()+ms), b.t);
    });
  }

  /* ---------- render ---------- */
  let manualIdx = null, lastKey = "";

  function render(){
    const now = new Date();
    const blocks = allBlocks();
    let idx = manualIdx !== null ? Math.min(manualIdx, blocks.length-1) : currentIdx(blocks, now);
    let phase, label, remaining=0, total=0, sub="", next="";

    if (idx === -1) {
      const ni = nextIdx(blocks, now);
      if (ni === -1) { phase="done"; label="your day is complete"; }
      else {
        phase="break"; label="open space";
        remaining = total = (blocks[ni].s - now)/1000;
        sub = "until " + fmtT(blocks[ni].s);
        next = `next · ${blocks[ni].t} at ${fmtT(blocks[ni].s)}`;
      }
    } else {
      const b = blocks[idx];
      phase = b.type === "task" ? "focus" : b.type;
      label = b.t;
      total = (b.e - b.s)/1000;
      remaining = Math.max(0, (b.e - now)/1000);
      sub = (b.type === "focus" || b.type === "task") ? "focus" : b.type === "break" ? "rest" : "in session";
      if (blocks[idx+1]) next = `next · ${blocks[idx+1].t} at ${fmtT(blocks[idx+1].s)}`;
    }

    const k = phase + ":" + label;
    if (lastKey && k !== lastKey && manualIdx === null) {
      chime(phase === "focus" ? [523.25,659.25,783.99] : [783.99,659.25]);
    }
    lastKey = k;

    $("time").textContent = phase === "done" ? "☺" : fmtC(remaining);
    $("time-sub").textContent = sub;
    $("block-label").textContent = label;
    $("next-up").textContent = next;
    document.body.className = "mode-" + (phase === "fixed" ? "fixed" : phase) + " running";
    document.querySelector("#ring .progress").style.strokeDashoffset = total ? CIRC*(remaining/total) : CIRC;

    const focusish = blocks.filter(b => b.type === "focus" || b.type === "task");
    $("pips").innerHTML = focusish.map(b => `<div class="pip ${now >= b.e ? "filled" : ""}"></div>`).join("");
  }

  setInterval(() => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    const phase = i === -1 ? "break" : blocks[i].type;
    const pool = (phase === "focus" || phase === "task") ? FOCUS_MANTRAS
               : phase === "fixed" ? FIXED_MANTRAS : BREAK_MANTRAS;
    const el = $("mantra");
    el.style.opacity = 0;
    setTimeout(() => { el.textContent = pool[Math.floor(Math.random()*pool.length)]; el.style.opacity = 1; }, 1200);
  }, 45000);

  /* ---------- main-screen controls ---------- */
  $("now-btn").onclick = () => { manualIdx = null; render(); };
  $("ext-btn").onclick = () => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    if (i === -1) return;
    const b = blocks[i];
    writeEdit(b, b.s, new Date(b.e.getTime() + 15*60000), b.t);
    render();
  };
  $("done-btn").onclick = () => {
    const blocks = allBlocks();
    const i = currentIdx(blocks, new Date());
    if (i === -1) return;
    const b = blocks[i], now = new Date();
    if (now > b.s) writeEdit(b, b.s, now, b.t);
    chime([523.25, 659.25, 783.99]);
    manualIdx = null; render(); renderTimeline();
  };

  /* ---------- timeline sheet ---------- */
  function renderTimeline(){
    const now = new Date();
    const blocks = allBlocks();
    $("plan-meta").textContent = activePlan().label;
    $("timeline").innerHTML = blocks.map((b,i) => {
      const cls = now >= b.e ? "past" : (now >= b.s ? "now" : "");
      const tag = b.type === "fixed" ? (b.cal||"") : b.type === "task" ? (b.cal||"you") : b.type;
      return `<button class="tl t-${b.type} ${cls}" data-i="${i}">
        <span class="when">${fmtT(b.s)}–${fmtT(b.e)}</span>
        <span class="what">${esc(b.t)}</span>
        <span class="tag">${esc(tag)}</span>
      </button>`;
    }).join("");
    document.querySelectorAll("#timeline .tl").forEach(el => {
      el.onclick = () => openEdit(blocks[+el.dataset.i]);
    });
    const cur = document.querySelector("#timeline .now");
    if (cur) cur.scrollIntoView({block:"center"});
  }
  const openSheet = v => {
    $("sheet").classList.toggle("open", v);
    $("scrim").classList.toggle("show", v);
    if (v) { renderTimeline(); refreshLive(); }
  };

  /* pull the calendar again — on demand, and whenever the sheet opens */
  let pulling = false;
  async function refreshLive(manual){
    if (pulling) return;
    pulling = true;
    const btn = $("refresh-btn");
    btn.classList.add("busy");
    if (manual) btn.textContent = "⟳ checking your calendar…";
    const ok = await pullLive();
    btn.classList.remove("busy");
    btn.textContent = ok ? "⟳ refresh from my calendar"
                         : "⟳ refresh from my calendar (offline)";
    pulling = false;
    if (ok) { render(); renderTimeline(); }
  }
  $("refresh-btn").onclick = () => refreshLive(true);
  $("day-btn").onclick = () => openSheet(true);
  $("scrim").onclick = () => openSheet(false);

  /* ---------- edit modal ---------- */
  let editing = null;
  function openEdit(b){
    editing = b;
    $("edit-title").textContent = b.type === "fixed" ? "Adjust — from " + (b.cal||"calendar") : "Adjust this block";
    $("ed-name").value = b.t;
    $("ed-start").value = toField(b.s);
    $("ed-end").value = toField(b.e);
    $("edit-modal").classList.add("open");
  }
  const closeEdit = () => { $("edit-modal").classList.remove("open"); editing = null; };
  $("ed-cancel").onclick = closeEdit;
  $("edit-modal").onclick = e => { if (e.target === $("edit-modal")) closeEdit(); };
  $("ed-save").onclick = () => {
    if (!editing) return;
    const s = fromField($("ed-start").value, editing.s);
    let e = fromField($("ed-end").value, editing.e);
    if (e <= s) e = new Date(s.getTime() + 15*60000);
    writeEdit(editing, s, e, $("ed-name").value.trim() || editing.t);
    closeEdit(); manualIdx = null; render(); renderTimeline();
  };
  $("ed-del").onclick = () => {
    if (!editing) return;
    removeBlock(editing);
    closeEdit(); manualIdx = null; render(); renderTimeline();
  };
  document.querySelectorAll("#edit-modal .quick button").forEach(btn => {
    btn.onclick = () => {
      if (!editing) return;
      const act = btn.dataset.act, now = new Date();
      if (act === "now") {
        const dur = editing.e - editing.s;
        writeEdit(editing, now, new Date(now.getTime() + dur), $("ed-name").value.trim() || editing.t);
      } else if (act === "plus15") {
        writeEdit(editing, editing.s, new Date(editing.e.getTime() + 15*60000), editing.t);
      } else if (act === "push15") { pushRest(editing, 15); }
      else if (act === "push30") { pushRest(editing, 30); }
      closeEdit(); manualIdx = null; render(); renderTimeline();
    };
  });

  /* ---------- quick add (starts now) ---------- */
  let durMin = 5;
  document.querySelectorAll("#add-chips button").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll("#add-chips button").forEach(b => b.classList.remove("sel"));
      btn.classList.add("sel"); durMin = +btn.dataset.m;
    };
  });
  $("add-btn").onclick = () => { $("add-modal").classList.add("open"); $("add-name").focus(); };
  $("add-cancel").onclick = () => $("add-modal").classList.remove("open");
  $("add-modal").onclick = e => { if (e.target === $("add-modal")) $("add-modal").classList.remove("open"); };
  function addBlock(name, start, end){
    ops.adds.push({ key:"x"+start.getTime(), s:start.toISOString(), e:end.toISOString(),
      t:name, type:"task", cal:"you" });
    saveOps();
  }
  $("add-go").onclick = () => {
    const name = $("add-name").value.trim();
    if (!name) { $("add-name").focus(); return; }
    const now = new Date();
    addBlock(name, now, new Date(now.getTime() + durMin*60000));
    $("add-name").value = "";
    $("add-modal").classList.remove("open");
    manualIdx = null; chime([659.25, 783.99]); render(); renderTimeline();
  };
  $("add-name").addEventListener("keydown", e => { if (e.key === "Enter") $("add-go").onclick(); });

  /* add a block at a chosen time, straight from the timeline */
  $("new-block").onclick = () => {
    const now = new Date();
    const s = new Date(now.getTime() + 30*60000); s.setSeconds(0,0);
    addBlock("New block", s, new Date(s.getTime() + 30*60000));
    renderTimeline();
    openEdit(allBlocks().find(b => b.key === "x"+s.getTime()));
  };

  /* ---------- stale-plan guard ----------
     The plan is rebuilt in the cloud every 30 min. Phones cache aggressively and
     this page is often left open overnight, so poll our own version stamp and
     reload when the server has something newer. */
  const MY_VERSION = document.querySelector('meta[name="still-version"]')?.content || "";
  async function checkForNewPlan(){
    try {
      const r = await fetch(location.pathname + "?v=" + Date.now(), { cache:"no-store" });
      if (!r.ok) return;
      const txt = await r.text();
      const m = txt.match(/name="still-version" content="([^"]*)"/);
      if (m && m[1] && m[1] !== MY_VERSION) location.reload();
    } catch {}
  }
  setInterval(checkForNewPlan, 15*60*1000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { checkForNewPlan(); refreshLive(); }
  });

  /* keep the live plan warm while the app sits open on the desk */
  setInterval(refreshLive, 5*60*1000);

  /* if the plan on screen isn't for today, say so instead of "day complete" */
  function planIsStale(){
    const first = activePlan().blocks[0];
    return !first || new Date(first.s).toDateString() !== new Date().toDateString();
  }

  /* ---------- clock, wake lock ---------- */
  setInterval(() => {
    $("clock").textContent = fmtT(new Date());
    render();
    if (planIsStale()) {
      $("block-label").textContent = "today's plan is on its way";
      $("time").textContent = "…";
      $("time-sub").textContent = "";
      $("next-up").textContent = "pull down to refresh";
    }
  }, 1000);
  let wakeLock;
  async function keepAwake(){ try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });
  document.addEventListener("click", keepAwake, { once:true });

  $("clock").textContent = fmtT(new Date());
  render();
  refreshLive().then(() => { render(); });   // live calendar on first open
})();
</script>
</body>
</html>
