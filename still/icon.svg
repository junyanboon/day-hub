<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8fd6"/>
      <stop offset=".42" stop-color="#5f6bb8"/>
      <stop offset=".72" stop-color="#4c4f96"/>
      <stop offset="1" stop-color="#38366e"/>
    </linearGradient>
    <radialGradient id="moon" cx=".42" cy=".38" r=".9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f2ecff"/>
      <stop offset="1" stop-color="#d9d2f5"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#sky)"/>

  <!-- soft halo behind the moon -->
  <circle cx="90" cy="62" r="52" fill="url(#halo)"/>

  <!-- moon -->
  <circle cx="90" cy="62" r="26" fill="url(#moon)"/>

  <!-- water line -->
  <rect x="0" y="106" width="180" height="74" fill="url(#water)"/>
  <path d="M0 106 H180" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.4"/>

  <!-- moon reflection, broken into calm ripples -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M70 116 H110"  stroke-width="4.5" stroke-opacity=".8"/>
    <path d="M76 126 H104"  stroke-width="3.6" stroke-opacity=".55"/>
    <path d="M72 136 H108"  stroke-width="3"   stroke-opacity=".38"/>
    <path d="M80 146 H100"  stroke-width="2.6" stroke-opacity=".26"/>
    <path d="M76 156 H104"  stroke-width="2.2" stroke-opacity=".16"/>
  </g>

  <!-- faint outer ripple rings around reflection -->
  <g stroke="#ffffff" fill="none">
    <ellipse cx="90" cy="121" rx="44" ry="9"  stroke-opacity=".14" stroke-width="1.2"/>
    <ellipse cx="90" cy="128" rx="62" ry="14" stroke-opacity=".08" stroke-width="1.2"/>
  </g>
</svg>
