<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quest">
<link rel="icon" type="image/svg+xml" href="quest-icon.svg">
<link rel="manifest" href="quest.webmanifest">
<meta name="theme-color" content="#191d3c">
<link rel="apple-touch-icon" href="quest-icon-180.png">
<title>Day Quest</title>
<!--
  Day Quest — the game layer on Stillness (prototype, 2026-09-28).

  Reads the same live sources as Stillness (still-api /plan, /ops, /tasks) and
  writes through the same protocol, so a shift made here shows on the phone app
  and the desktop orb. It adds what Stillness lacks: a check-in at every block
  start, a "did it close?" at every block end, a one-tap log for whatever comes
  up mid-block, and XP for keeping the day. Health blocks (sleep, practice,
  body, fuel) score double: the One System map says defend them.

  Skills (ticket 16, 2026-10-08): a Skills section and "Train a skill" in Your move.
  Skill cards, content offers (one-line summary + ideas) and wiki pages come from
  Junyan's private life wiki via still-api /quest/skills, /quest/content, /quest/wiki;
  the insight agent writes them. Videos play inside the app (youtube-nocookie).

  URL switches for testing:
    ?dry=1                     never POST (no /ops, no /tasks/done writes)
    ?at=2026-09-28T11:35       run a virtual clock from that moment (implies the
                               plan for that date; real time keeps ticking)
  Silent by design (Stillness dropped sound by request). Pings are browser
  notifications + vibration while the page is open.
-->
<style>
  :root {
    --ink: rgba(255,255,255,.95);
    --ink-soft: rgba(255,255,255,.7);
    --ink-faint: rgba(255,255,255,.42);
    --glass: rgba(255,255,255,.12);
    --glass-2: rgba(255,255,255,.2);
    --glass-border: rgba(255,255,255,.2);
    --gold: #ffd479;
    --good: #8fe3b0;
    --warn: #ffc27a;
    --bad: #ff9c9c;
    --zap: #c9b6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; background:#4a4580;
    background-image: linear-gradient(180deg, #8a7fc4 0%, #6a5fa8 50%, #4a4580 100%);
    background-attachment: fixed; transition: background-color 2s ease; }
  html.mode-focus { background-image: linear-gradient(180deg, #5b8fd4 0%, #4a6fa5 45%, #5d5ba8 100%); background-color:#5d5ba8; }
  html.mode-break { background-image: linear-gradient(180deg, #6fb98f 0%, #4a8f7b 50%, #3d6b70 100%); background-color:#3d6b70; }
  html.mode-fixed { background-image: linear-gradient(180deg, #d4a45b 0%, #a5764a 45%, #8a5d7a 100%); background-color:#8a5d7a; }
  html.mode-health{ background-image: linear-gradient(180deg, #6fb98f 0%, #4f8f86 50%, #4a5f8a 100%); background-color:#4a5f8a; }
  html.mode-zap   { background-image: linear-gradient(180deg, #9a7fd4 0%, #6d5aa8 50%, #3f3a78 100%); background-color:#3f3a78; }
  html.night      { background-image: linear-gradient(180deg, #2b3160 0%, #232850 50%, #191d3c 100%); background-color:#191d3c; }
  /* d208 (2026-10-09): a sky that follows his day (dawn, day, dusk, night), with dunes while he is in a desert place.
     It replaces the fixed night navy of 2026-09-28. */
  #sky { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; transition:background 4s ease;
    background:linear-gradient(180deg, #0b0f2c 0%, #1a1f4a 60%, #2a2453 100%); }
  html.sky-dawn #sky { background:linear-gradient(180deg, #1a1f52 0%, #3e3373 42%, #a5607a 78%, #e7a06a 100%); }
  html.sky-day  #sky { background:linear-gradient(180deg, #14336a 0%, #23548d 50%, #3f76a6 100%); }
  html.sky-dusk #sky { background:linear-gradient(180deg, #1e1848 0%, #4e3372 44%, #b8615a 80%, #eb9a55 100%); }
  .sky-stars { position:absolute; inset:0 0 35% 0; opacity:1; transition:opacity 4s; }
  .sky-stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:skyTw 4s ease-in-out infinite; }
  @keyframes skyTw { 50% { opacity:.25; } }
  html.sky-dawn .sky-stars, html.sky-dusk .sky-stars { opacity:.3; } html.sky-day .sky-stars { opacity:0; }
  .sky-orb { position:absolute; width:120px; height:120px; border-radius:50%; left:calc(var(--orbx, .7) * 100%); top:calc(var(--orby, .2) * 100%);
    transform:translate(-50%, -50%); transition:left 60s linear, top 60s linear, background 4s;
    background:radial-gradient(circle, #f4f1ff 0 16%, rgba(220,215,255,.35) 18%, transparent 62%); }
  html.sky-day .sky-orb, html.sky-dawn .sky-orb, html.sky-dusk .sky-orb { background:radial-gradient(circle, #fff6d8 0 14%, rgba(255,200,110,.45) 18%, transparent 64%); }
  .sky-dunes { position:absolute; left:0; right:0; bottom:0; width:100%; height:24vh; display:none; }
  html.desert .sky-dunes { display:block; }
  .sky-dunes .d1 { fill:var(--dune1, #1d1a3e); } .sky-dunes .d2 { fill:var(--dune2, #16132f); } .sky-dunes .d3 { fill:var(--dune3, #0f0d24); }
  html.sky-dawn { --dune1:#6a4660; --dune2:#4c3150; --dune3:#33223f; }
  html.sky-day  { --dune1:#9c7446; --dune2:#7d5a37; --dune3:#5e432b; }
  html.sky-dusk { --dune1:#7a4250; --dune2:#5a2f45; --dune3:#3c2036; }
  /* d207: the pixel font on headings and numbers, to match the sprites */
  h2, .eyebrow, .hgl, .win-lb, .quest-title, .summary b, .count .big, .hud-title b, #altTxt, #bodyTxt, .htile b, .combo .n, .combo .l,
  .pa-all, .side-quest b, .sq b, .mo-open-t b { font-family:"Pixelify Sans", ui-sans-serif, system-ui; letter-spacing:.02em; }
  body { background:transparent; color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased; }
  #app { max-width:480px; margin:0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }

  /* ---------- HUD ---------- */
  .hud { display:flex; align-items:center; gap:12px; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--glass-2);
    border:1px solid var(--glass-border); display:grid; place-items:center; font-size:24px; flex:none; overflow:hidden;
    box-shadow:0 0 calc(4px + 18px * var(--p, 0)) rgba(255,196,110, calc(.15 + .7 * var(--p, 0))); }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  /* Prana and Body, drawn with Junyan's sprites (2026-10-09): the seated meditator is Prana, its aura grows
     with it and the hands open from 60%; the standing figure is Body, teal fills it from the feet, paler when tired */
  #being { margin:12px 0 16px; }
  .bg-stage { position:relative; display:grid; grid-template-columns:1fr 1fr; height:250px; border-radius:22px; overflow:hidden;
    border:1px solid var(--glass-border);
    background:radial-gradient(55% 65% at 25% 62%, rgba(255,184,92, calc(.04 + .3 * var(--p))), transparent 72%),
      radial-gradient(55% 65% at 75% 62%, rgba(95,211,196, calc(.04 + .2 * var(--b))), transparent 72%),
      linear-gradient(180deg, #0b0e28, #161a3f 70%, #1d1f47); }
  .bg-stage::after { content:""; position:absolute; left:6%; right:6%; bottom:52px; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); }
  .bg-col { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:0; }
  .bg-fig { position:relative; flex:1; min-height:0; width:100%; margin-top:8px; }
  .bg-fig img, .bg-fill { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:50% 100%; }
  .bg-glow { -webkit-mask:radial-gradient(closest-side, #000 72%, transparent); mask:radial-gradient(closest-side, #000 72%, transparent); mix-blend-mode:screen; opacity:calc(.08 + .92 * var(--p)); transform:scale(calc(1 + .22 * var(--p))); transform-origin:50% 80%;
    animation:bgPulse 5s ease-in-out infinite; transition:opacity 1.2s, transform 1.2s; }
  .bg-body .bg-glow { opacity:calc(.06 + .7 * var(--b)); transform:scale(calc(1 + .12 * var(--b))); }
  .bg-seat { animation:bgBreath 6s ease-in-out infinite; transform-origin:50% 95%; }
  .bg-stand { filter:saturate(calc(.3 + .7 * var(--b))) brightness(calc(.62 + .38 * var(--b))); transition:filter 1.2s; }
  .bg-fill { -webkit-mask:var(--mask, url(sprites/stand.webp)) 50% 100% / contain no-repeat; mask:var(--mask, url(sprites/stand.webp)) 50% 100% / contain no-repeat;
    background:linear-gradient(0deg, rgba(95,211,196,.42) calc(var(--b) * 100%), transparent calc(var(--b) * 100% + 1px)); mix-blend-mode:screen; }
  .bg-lab { position:relative; text-align:center; padding:4px 0 10px; line-height:1.1; }
  .bg-n { font-family:"Pixelify Sans", ui-sans-serif, system-ui; font-size:26px; font-weight:700; }
  .bg-k { font-family:"Pixelify Sans", ui-sans-serif, system-ui; font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  .bg-h { display:block; font-size:11px; color:var(--ink-soft); margin-top:3px; }
  .bg-prana .bg-n, .bg-prana .bg-k { color:#ffd479; text-shadow:0 0 calc(4px + 14px * var(--p)) rgba(255,196,110,.6); }
  .bg-body .bg-n, .bg-body .bg-k { color:#7fe3d4; }
  .bg-motes { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bg-motes i { position:absolute; bottom:60px; width:3px; height:3px; border-radius:50%; background:#ffe3a6; opacity:0; animation:bgRise linear infinite; }
  @keyframes bgPulse { 50% { filter:brightness(1.25); } }
  @keyframes bgBreath { 50% { transform:scale(1.015); } }
  @keyframes bgRise { 0% { transform:translateY(0); opacity:0 } 20% { opacity:.9 } 100% { transform:translateY(-170px); opacity:0 } }
  @media (prefers-reduced-motion: reduce) { .bg-stage * { animation:none !important; } }
  .hud-mid { flex:1; min-width:0; }
  .hud-title { font-size:13px; color:var(--ink-soft); display:flex; justify-content:space-between; }
  .hud-title b { color:var(--ink); font-weight:600; }
  .bar { height:8px; border-radius:6px; background:rgba(0,0,0,.2); margin-top:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--gold), #fff0c4);
    border-radius:6px; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .hi-img { width:30px; height:30px; object-fit:contain; image-rendering:auto; }
  .htile b.mb { color:#5fd3c4; } .htile b.mp { color:var(--gold); }
  .hkey { font-size:11.5px; color:var(--ink-faint); margin:2px 0 8px; } .hkey .mb { color:#5fd3c4; } .hkey .mp { color:var(--gold); }
  .hud-body { margin-top:6px; font-size:11.5px; } .bar-body { height:5px; margin-top:4px; }
  .bar-body > i { background:linear-gradient(90deg, #5fd3c4, #b8f3e9) !important; }
  .bar > i.mid { background:linear-gradient(90deg, #ffb36b, #ffd479); } .bar > i.low { background:linear-gradient(90deg, #ff7f7f, #ffb0a0); }
  .o2row { gap:10px; white-space:nowrap; overflow:hidden; } .o2row .ok { color:#8fe3b0; }
  .float.down { color:#ff9c9c; } .log div span.xp.neg { color:#ff9c9c; }
  .pline { width:100%; height:80px; margin-top:10px; } .pline path { fill:none; stroke:var(--gold); stroke-width:2.5; stroke-linejoin:round; }
  .pline path.pl-b { stroke:#5fd3c4; stroke-width:2; opacity:.9; }
  .pl-key { display:flex; gap:14px; font-size:12px; margin-top:4px; } .pl-key .pl-p { color:var(--gold); } .pl-key .pl-b { color:#5fd3c4; }
  .pline .p70 { stroke:rgba(255,255,255,.25); stroke-dasharray:4 4; }
  .brief li { margin:4px 0; } .brief ul { margin:8px 0 0; padding-left:18px; color:var(--ink-soft); font-size:14px; }
  /* habit tiles: small, many, fun to tap (quest-fx.js does the bursts and sound) */
  .hhead { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .hsnd { background:var(--glass); border-radius:50%; width:28px; height:28px; font-size:13px; }
  .hgrp { margin-top:8px; } .hgl { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 4px 2px; }
  .hgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); gap:6px; }
  .htile { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    min-height:62px; padding:8px 4px 5px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-border);
    text-align:center; transition:transform .12s, background .25s, border-color .25s; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  .htile:active { transform:scale(.9); }
  .htile .hi { font-size:20px; line-height:1; position:relative; }
  .htile .hl { font-size:10.5px; line-height:1.15; color:var(--ink); position:relative; }
  .htile .hc { font-size:10px; color:#8fe3b0; position:relative; font-weight:600; }
  .htile b { position:absolute; top:3px; right:5px; font-size:9.5px; color:var(--gold); font-weight:700; }
  .htile .glass { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(143,227,176,.30), rgba(143,227,176,.12));
    transition:height .6s cubic-bezier(.2,.8,.2,1); }
  .htile.water .glass { background:linear-gradient(180deg, rgba(127,208,255,.45), rgba(127,208,255,.18)); }
  .htile.full { background:linear-gradient(160deg, rgba(255,212,121,.30), rgba(255,212,121,.08)); border-color:rgba(255,212,121,.6); }
  .htile.full .hc { color:var(--gold); }
  .htile.auto { border-style:dashed; } .htile.auto b { color:var(--ink-faint); } .htile.earned { border-color:rgba(143,227,176,.7); }
  .calx { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; background:#191d3c;
    transform:translateY(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); padding-top:env(safe-area-inset-top); }
  .calx.open { transform:none; }
  .calx-top { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:17px; }
  .calx-top .btn { flex:none; padding:8px 16px; }
  .calx iframe { flex:1; width:100%; border:0; background:#191d3c; }
  .calx-zap { margin:8px 14px calc(env(safe-area-inset-bottom) + 10px); padding:10px; border-radius:14px; background:var(--glass); color:var(--ink-soft); font-size:13px; }
  .sq { display:flex; gap:12px; align-items:center; margin-top:12px; padding:12px 14px; border-radius:16px; background:var(--glass); border:1px solid var(--glass-border); }
  .sq.done { border-color:rgba(143,227,176,.65); background:linear-gradient(135deg, rgba(143,227,176,.18), rgba(127,208,255,.10)); }
  .sq-i { font-size:22px; } .sq-t { flex:1; font-weight:600; font-size:14px; }
  .sq-t small { display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .sq-bar { display:block; height:6px; border-radius:4px; background:rgba(0,0,0,.25); margin-top:7px; overflow:hidden; }
  .sq-bar b { display:block; height:100%; width:0; background:linear-gradient(90deg, #7fd0ff, #8fe3b0); border-radius:4px; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .hgrid.sugg { grid-template-columns:repeat(3, 1fr); }
  .hgrid.sugg .htile { min-height:76px; }
  .why-tip { position:fixed; z-index:300; display:none; padding:9px 11px; border-radius:12px; background:#0f1230; border:1px solid var(--glass-border);
    color:var(--ink); font-size:12.5px; line-height:1.35; box-shadow:0 10px 30px rgba(0,0,0,.45); pointer-events:none; }
  .htile { -webkit-touch-callout:none; }
  .pa-all { width:100%; display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding:11px 14px; border-radius:14px;
    background:var(--glass); border:1px solid var(--glass-border); font-weight:600; font-size:14px; }
  .pa-all span { color:var(--ink-soft); font-weight:400; font-size:12px; }
  .pa-btn { width:100%; display:flex; align-items:center; gap:12px; margin-top:12px; padding:14px 16px; border-radius:18px;
    background:linear-gradient(135deg, rgba(255,212,121,.22), rgba(143,227,176,.14)); border:1px solid rgba(255,212,121,.45); text-align:left; }
  .pa-btn:active { transform:scale(.98); }
  .pa-i { font-size:24px; } .pa-t { flex:1; font-weight:700; font-size:16px; } .pa-t small { display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .pa-go { font-size:24px; color:var(--gold); }
  .fx-layer { position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden; }
  .fx-p { position:absolute; font-size:18px; will-change:transform, opacity; }
  .fx-p.spark { width:6px; height:6px; border-radius:50%; }
  .fx-ring { position:absolute; width:40px; height:40px; border-radius:50%; border:2px solid rgba(127,208,255,.85); }
  .fx-tag { position:absolute; font-weight:800; font-size:17px; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.45); white-space:nowrap; }
  .fx-tag.combo { color:#ff9ad5; font-size:14px; } .fx-tag.full { color:#fff; font-size:12px; }
  .warnline { margin-top:10px; font-size:13px; color:#ffcf8a; }
  .gear { flex:none; width:36px; height:36px; border-radius:50%; background:var(--glass); font-size:17px; }
  .gear.warn { box-shadow:0 0 0 2px var(--warn); }
  .combo { flex:none; text-align:center; min-width:52px; }
  .combo .n { font-size:22px; font-weight:700; line-height:1; }
  .combo .l { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px; }
  .combo.hot .n { color:var(--gold); text-shadow:0 0 12px rgba(255,212,121,.6); }

  .status { font-size:11px; color:var(--ink-faint); margin:10px 2px 0; display:flex; justify-content:space-between; }
  .status .dry { color:var(--warn); }

  /* ---------- cards ---------- */
  .card { background:var(--glass); border:1px solid var(--glass-border); border-radius:22px;
    padding:18px; margin-top:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .eyebrow { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px; }
  .eyebrow .tag { background:rgba(255,255,255,.18); border-radius:20px; padding:2px 8px; letter-spacing:.06em; }
  .eyebrow .tag.x2 { background:rgba(143,227,176,.28); color:#dfffe9; }
  .quest-title { font-size:26px; font-weight:600; line-height:1.15; margin-top:10px; display:flex; gap:10px; align-items:flex-start; }
  .quest-title .em { font-size:28px; }
  .quest-time { font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .count { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .ring { width:74px; height:74px; flex:none; }
  .ring circle { fill:none; stroke-width:7; }
  .ring .bg { stroke:rgba(255,255,255,.16); }
  .ring .fg { stroke:#fff; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset 1s linear; }
  .count .big { font-size:34px; font-weight:300; font-variant-numeric:tabular-nums; }
  .count .sub { font-size:12px; color:var(--ink-soft); }

  .actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .btn { flex:1; min-width:0; padding:13px 10px; border-radius:14px; background:rgba(255,255,255,.2);
    font-size:15px; font-weight:600; white-space:normal; line-height:1.2; overflow-wrap:anywhere; }   /* wrap, never cut words off (2026-10-09) */
  .btn.primary { background:#fff; color:#3b3670; }
  .btn.ghost { background:transparent; border:1px solid var(--glass-border); color:var(--ink-soft); font-weight:500; }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.45; }

  .loose { border-color:rgba(255,194,122,.45); background:rgba(255,194,122,.14); }
  .loose .q { font-size:17px; font-weight:600; margin-top:6px; }

  .next { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--ink-soft);
    margin-top:12px; padding:0 4px; }
  .next b { color:var(--ink); font-weight:600; }

  /* side quest */
  .side-list { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .side { display:flex; align-items:center; gap:10px; text-align:left; width:100%; padding:11px 12px;
    border-radius:14px; background:rgba(255,255,255,.12); font-size:14px; }
  .side .pr { flex:none; font-size:12px; }
  .side .nm { flex:1; min-width:0; }
  .side .xp { flex:none; font-size:12px; color:var(--gold); font-weight:600; }
  .active-side { margin-top:12px; padding:12px; border-radius:14px; background:rgba(255,212,121,.16);
    border:1px solid rgba(255,212,121,.4); }
  .active-side .k { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
  .active-side .nm { font-size:16px; font-weight:600; margin-top:4px; }



  /* ---------- gym log ---------- */
  .sheet.tall { max-height:90vh; max-height:90dvh; overflow-y:auto; }
  .gym-head { display:flex; justify-content:space-between; align-items:center; }
  .btn.small { flex:none; padding:8px 12px; font-size:13px; }
  .glabel { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px; }
  #gProg { width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,.25); color:var(--ink); border:1px solid var(--glass-border); font:inherit; font-size:15px; }
  .gmove { margin-top:12px; padding:12px; border-radius:14px; background:rgba(255,255,255,.08); }
  .gtop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .gtop b { font-size:15px; }
  .gl { display:flex; align-items:center; gap:6px; flex:none; }
  .lv { width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.16); font-size:18px; }
  .lvn { font:700 14px ui-monospace, Menlo, monospace; min-width:54px; text-align:center; }
  .lvn.up { color:var(--gold); }
  .gsub { font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .grow { display:grid; grid-template-columns:36px repeat(4, 1fr); gap:6px; margin-top:8px; align-items:center; }
  .gk { font:600 11px ui-monospace, Menlo, monospace; color:var(--ink-faint); }
  .sheet input.set { margin:0; padding:10px 4px; text-align:center; font-size:16px; border-radius:10px; min-width:0; }
  .gchips { display:flex; flex-wrap:wrap; gap:6px; }
  .gchip { padding:9px 12px; border-radius:20px; background:rgba(255,255,255,.12); font-size:14px; }
  .gchip.on { background:var(--good); color:#173b2a; font-weight:600; }
  .gfoot { display:flex; gap:8px; margin-top:16px; position:sticky; bottom:-20px; padding:10px 0; background:#3d3872; }
  .gnote { font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  /* ---------- altitude ---------- */
  .hud-title { gap:8px; }
  .hud-title > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #altTxt { white-space:nowrap; flex:none; font-variant-numeric:tabular-nums; }
  .o2row { display:flex; align-items:center; gap:6px; margin-top:5px; font:600 10.5px ui-monospace, Menlo, monospace; color:var(--ink-soft); }
  .o2bar { flex:1; height:5px; border-radius:4px; background:rgba(0,0,0,.25); overflow:hidden; }
  .o2bar i { display:block; height:100%; width:80%; background:#7fd8ff; border-radius:4px; transition:width .6s; }
  .o2bar i.mid { background:#ffd479; } .o2bar i.thin { background:#ff9c9c; }
  .cline { width:100%; margin-top:10px; padding:11px 12px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(0,0,0,.2); color:var(--ink); font:inherit; font-size:15px; }
  .season { display:grid; gap:4px; margin-top:6px; font-size:13px; }
  .season div { display:grid; grid-template-columns:1fr 1.3fr auto; gap:8px; color:var(--ink-soft); }
  .season b { color:var(--ink); font-variant-numeric:tabular-nums; }
  /* ---------- the mountain ---------- */
  .place { color:var(--ink); font-weight:600; }
  #mtn { margin-top:4px; }
  .mtn-svg { width:100%; height:auto; display:block; border-radius:22px;
    background:linear-gradient(#0f1229, #262c62); }
  .mtn-svg .m1 { fill:#2d336f; } .mtn-svg .m2 { fill:#3a4184; opacity:.55; }
  .mtn-svg .star { fill:#eef0ff; animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity:.2; } }
  .mtn-svg .seg { fill:none; stroke:#4a518f; stroke-width:5; stroke-linecap:round; stroke-dasharray:1 9; }
  .mtn-svg .seg.walked { stroke:var(--gold); stroke-dasharray:none; stroke-width:3; opacity:.85; }
  .mtn-svg .stopg { cursor:pointer; }
  .mtn-svg .stopg.past { opacity:.7; }
  .mtn-svg .hit { fill:transparent; }
  .mtn-svg .sym.skip { opacity:.4; }
  .quest-title .badge { flex:none; }
  .mtn-svg .dotm { fill:#262c62; stroke:#a7abd8; stroke-width:2; }
  .mtn-svg .dotm.done { fill:var(--good); stroke:var(--good); }
  .mtn-svg .dotm.skip { stroke-dasharray:3 3; opacity:.5; }
  .mtn-svg .ringm { fill:none; stroke:var(--gold); stroke-width:2; animation:mpulse 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes mpulse { 50% { transform:scale(1.25); opacity:.4; } }
  .mtn-svg .logr { fill:#9a7452; }
  .mtn-svg .flame { fill:#3a4184; opacity:.8; }
  .mtn-svg .flame2 { fill:var(--gold); opacity:0; }
  .mtn-svg .glow { fill:#ff9c7a; opacity:0; }
  .mtn-svg .fire.lit .flame { fill:#ff9c7a; opacity:1; transform-box:fill-box; transform-origin:50% 100%; animation:flick .6s ease-in-out infinite alternate; }
  .mtn-svg .fire.lit .flame2 { opacity:1; transform-box:fill-box; transform-origin:50% 100%; animation:flick .45s ease-in-out infinite alternate-reverse; }
  .mtn-svg .fire.lit .glow { opacity:.28; }
  @keyframes flick { from { transform:scale(1,1) skewX(-3deg); } to { transform:scale(.9,1.12) skewX(4deg); } }
  .mtn-svg .tm { font:600 9.5px ui-monospace, Menlo, monospace; fill:#a7abd8; }
  .mtn-svg .nm { font:600 12.5px -apple-system, BlinkMacSystemFont, sans-serif; fill:#eef0ff; }
  .mtn-svg .nm.gone { fill:#a7abd8; text-decoration:line-through; }
  .mtn-svg .emo { font-size:22px; } .mtn-svg .emo.sm { font-size:15px; }
  .mtn-svg .halo { fill:var(--gold); opacity:.25; animation:mpulse 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .mtn-svg .me { fill:var(--gold); stroke:#141833; stroke-width:2; }
  .mtn-svg .cloud ellipse { fill:#767bab; }
  .mtn-svg .rain { stroke:#9fb4ff; stroke-width:1.5; stroke-linecap:round; animation:rain .7s linear infinite; }
  @keyframes rain { from { transform:translateY(-3px); opacity:1; } to { transform:translateY(7px); opacity:0; } }
  .mtn-svg .bolt { fill:var(--gold); animation:tw 1.2s steps(2) infinite; }
  @media (prefers-reduced-motion: reduce) { .mtn-svg * { animation:none !important; } }
  /* ---------- trail ---------- */
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;
    margin:26px 4px 10px; display:flex; justify-content:space-between; }
  .trail { position:relative; padding-left:8px; }

    background:rgba(255,255,255,.2); border-radius:2px; }
  .node { position:relative; display:flex; align-items:center; gap:12px; padding:7px 0; }
  .dot { width:36px; height:36px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:17px;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.22); z-index:1; }
  .node .txt { flex:1; min-width:0; }
  .node .t { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node .m { font-size:12px; color:var(--ink-faint); margin-top:1px; }

  .add-btn { background:rgba(255,255,255,.18); border-radius:20px; padding:4px 12px; font-size:12px; letter-spacing:.06em;
    text-transform:none; font-weight:600; color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row label { flex:1; font-size:12px; color:var(--ink-soft); }
  .row label input { margin-top:4px; }
  .check { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:14px; color:var(--ink-soft); }
  .sheet .check input { width:20px; height:20px; margin:0; flex:none; accent-color:#fff; }
  .btn.danger { background:transparent; border:1px solid rgba(255,156,156,.5); color:var(--bad); font-weight:500; }
  .node.now .dot { background:#fff; border-color:#fff; box-shadow:0 0 0 6px rgba(255,255,255,.18), 0 0 22px rgba(255,255,255,.5);
    animation:pulse 2.4s ease-in-out infinite; }
  .node.now .t { font-weight:700; }
  .node.in .dot { border-color:var(--good); }
  .node.late .dot { border-color:var(--warn); }
  .node.skip .dot { border-color:var(--bad); }
  .b-in { color:var(--good); } .b-late { color:var(--warn); } .b-skip { color:var(--bad); } .b-zap { color:var(--zap); }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(255,255,255,.08), 0 0 30px rgba(255,255,255,.6); } }

  .log { font-size:13px; color:var(--ink-soft); }
  .log div { padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; gap:8px; }
  .log div span:first-child { color:var(--ink-faint); flex:none; width:58px; font-variant-numeric:tabular-nums; }
  .log div span.xp { margin-left:auto; color:var(--gold); flex:none; }

  /* ---------- zap button + sheet ---------- */
  .zap { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:min(448px, calc(100% - 32px)); padding:16px; border-radius:20px; font-size:17px; font-weight:700;
    background:linear-gradient(135deg, #b9a4ff, #8f7cf0); color:#fff; box-shadow:0 10px 30px rgba(40,20,90,.45); z-index:5; }
  .zap:active { transform:translateX(-50%) scale(.98); }
  .zap.back { background:linear-gradient(135deg, #fff, #efeaff); color:#4a3f98; }

  .scrim { position:fixed; inset:0; background:rgba(15,10,40,.45); z-index:9; display:none; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%, 110%); width:min(480px, 100%);
    background:#3d3872; border-radius:24px 24px 0 0; padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
    z-index:10; transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,.35); }
  .sheet.open { transform:translate(-50%, 0); }
  .sheet h3 { font-size:19px; font-weight:600; }
  .win-hd { display:flex; gap:12px; align-items:center; }
  .win-hd .tt { font-size:21px; font-weight:600; } .win-hd .sb { font-size:13px; color:var(--ink-soft); }
  .win-lb { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:16px; }
  .wck { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:11px 2px; border-top:1px solid rgba(255,255,255,.08); font-size:15px; color:var(--ink); background:none; }
  .wck .bx { width:22px; height:22px; border-radius:6px; border:2px solid var(--ink-faint); flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .wck.on .bx { background:#85B7EB; border-color:#85B7EB; color:#0c3a66; }
  .quest-title { cursor:pointer; }
  .sheet p { font-size:14px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .chip { padding:14px 10px; border-radius:14px; background:rgba(255,255,255,.12); font-size:15px; text-align:left; }
  .chip.sel { background:#fff; color:#3b3670; font-weight:600; }
  .sheet input { width:100%; margin-top:12px; padding:13px 14px; border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(0,0,0,.18); color:var(--ink); font:inherit; font-size:16px; }
  .sheet input::placeholder { color:var(--ink-faint); }

  /* ---------- toasts ---------- */
  .float { position:fixed; left:50%; top:30%; transform:translateX(-50%); font-size:30px; font-weight:800; color:var(--gold);
    text-shadow:0 2px 14px rgba(0,0,0,.3); pointer-events:none; z-index:20; animation:rise 1.4s ease-out forwards; }
  .float small { display:block; font-size:13px; font-weight:600; color:#fff; text-align:center; }
  @keyframes rise { 0% { opacity:0; transform:translate(-50%, 20px) scale(.8); } 15% { opacity:1; transform:translate(-50%,0) scale(1.08); }
    100% { opacity:0; transform:translate(-50%, -70px) scale(1); } }
  .lvlup { position:fixed; inset:0; display:grid; place-items:center; z-index:30; pointer-events:none; }
  .lvlup > div { background:rgba(20,15,50,.8); border:1px solid var(--gold); border-radius:24px; padding:26px 30px; text-align:center;
    animation:pop 2.6s ease forwards; }
  .lvlup .a { font-size:44px; } .lvlup .b { font-size:12px; letter-spacing:.14em; color:var(--gold); margin-top:8px; }
  .lvlup .c { font-size:22px; font-weight:700; margin-top:4px; }
  @keyframes pop { 0% { opacity:0; transform:scale(.7); } 12% { opacity:1; transform:scale(1.05); } 20% { transform:scale(1); }
    85% { opacity:1; } 100% { opacity:0; } }

  .empty { text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:15px; }
  .ping-ask { font-size:13px; color:var(--ink-soft); text-decoration:underline; background:none; margin-top:10px; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .summary div { background:rgba(255,255,255,.1); border-radius:14px; padding:12px 8px; text-align:center; }
  .summary b { display:block; font-size:22px; }
  .summary span { font-size:11px; color:var(--ink-soft); }
  /* skills (ticket 16) */
  .side small, .sug small, .idea small { display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }
  .side.offer { cursor:default; align-items:flex-start; }
  .side .oline, .sheet .oneline { display:block; font-size:14px; color:var(--ink); margin-top:4px; line-height:1.35; }
  .sheet .oneline { font-size:16px; font-weight:500; margin-top:8px; }
  .sug { border-top:1px solid rgba(255,255,255,.08); padding:12px 0 2px; }
  .sug .actions { margin-top:8px; }
  .idea { display:flex; flex-direction:column; gap:8px; border-top:1px solid rgba(255,255,255,.08); padding:12px 0; }
  .idea .btn { flex:none; align-self:flex-start; padding:10px 14px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; margin-top:12px; border-radius:14px; overflow:hidden; background:#000; }
  .player iframe, .player #ytBox { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .endcard { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px;
    background:linear-gradient(180deg, #2b3160, #191d3c); font-size:15px; line-height:1.4; }
  .skchips { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 18px; }
  .skchip { padding:9px 12px; border-radius:20px; background:var(--glass); border:1px solid var(--glass-border); font-size:14px; }
  .skchip b { color:var(--gold); margin-left:2px; }
  .skchip.sug { border-style:dashed; color:var(--ink-soft); }
  /* practice (d191 to d194) */
  .skcard { background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:12px 14px; margin:4px 0 12px; }
  .skc-top { display:block; width:100%; text-align:left; background:none; border:0; color:var(--ink); font:inherit; padding:0; cursor:pointer; }
  .skc-top > span { font-size:15px; } .skc-top small { display:block; color:var(--ink-soft); font-size:12px; margin-top:3px; }
  .pq-bar { display:block; height:5px; border-radius:3px; background:rgba(255,255,255,.1); margin:8px 0 4px; overflow:hidden; }
  .pq-bar i { display:block; height:100%; background:linear-gradient(90deg, #8fe3b0, #ffd479); border-radius:3px; }
  .skc-next, .pq-next { display:block; width:100%; text-align:left; margin-top:10px; padding:10px 12px; border-radius:12px; cursor:pointer; font:inherit; font-size:14px;

  .skc-next span, .pq-next span { display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#8fe3b0; margin-bottom:2px; }
  .pq-next b { font-weight:600; }
  .pq-ladder { display:flex; flex-direction:column; gap:6px; }
  .pq-st { display:flex; gap:10px; padding:8px 10px; border-radius:12px; color:var(--ink-faint); }
  .pq-st b { display:block; font-size:14px; } .pq-st small { display:block; font-size:12px; margin-top:2px; }
  .pq-st.now { background:var(--glass); border:1px solid var(--glass-border); color:var(--ink); }
  .pq-st.now small { color:var(--ink-soft); } .pq-st .pq-how { color:var(--ink); margin-top:6px; }
  .pq-st.done { color:var(--ink-soft); }
  .pq-n { flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:rgba(255,255,255,.08); }
  .pq-st.now .pq-n { background:#ffd479; color:#2a1d05; } .pq-st.done .pq-n { background:rgba(143,227,176,.25); color:#8fe3b0; }
  .pq-lis { display:flex; gap:6px; flex-wrap:wrap; } .pq-lis span { padding:4px 9px; border-radius:10px; background:var(--glass); font-size:13px; }
  .pq-hint { display:block; color:var(--ink-faint); font-size:12px; margin-top:4px; }
  .pq-q { margin:8px 0 10px; font-size:14px; } .pq-a { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; } .pq-a .btn { flex:1; padding:8px 6px; font-size:13px; }
  .pq-hist div { display:flex; gap:6px; align-items:center; font-size:12px; margin-top:6px; } .pq-hist span { width:70px; color:var(--ink-faint); }
  .pq-hist i { font-style:normal; padding:3px 8px; border-radius:8px; background:var(--glass); } .pq-hist i.ok { color:#8fe3b0; } .pq-hist i.mid { color:#ffd479; } .pq-hist i.bad { color:#ff9c9c; }
  .pq-line { font-size:14px; margin:6px 0; } .pq-line small { color:var(--ink-faint); }
  .pg { position:fixed; inset:0; z-index:70; background:linear-gradient(180deg, #0f1430, #1a2146); color:var(--ink); display:flex; flex-direction:column;
    opacity:0; transition:opacity .3s; padding-top:env(safe-area-inset-top); }
  .pg.open { opacity:1; }
  .pg-top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; font-size:16px; } .pg-top .btn { flex:none; padding:8px 16px; }
  .pg-body { flex:1; overflow:auto; padding:0 20px calc(env(safe-area-inset-bottom) + 30px); max-width:520px; width:100%; margin:0 auto; text-align:center; }
  .pg-t { font-size:24px; font-weight:700; margin:14px 0 6px; } .pg-d { font-size:15px; color:var(--ink-soft); line-height:1.45; margin:0 0 10px; }
  .pg-list { text-align:left; padding-left:20px; } .pg-list li { margin:10px 0; } .pg-list small { display:block; color:var(--ink-soft); font-size:13px; margin-top:2px; }
  .pg-dots { display:flex; gap:6px; justify-content:center; margin-top:8px; } .pg-dots i { width:28px; height:5px; border-radius:3px; background:rgba(255,255,255,.12); }
  .pg-dots i.done { background:#8fe3b0; } .pg-dots i.now { background:#ffd479; }
  .pg-ring { position:relative; width:200px; height:200px; margin:14px auto 6px; } .pg-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .pg-ring .bg { fill:none; stroke:rgba(255,255,255,.08); stroke-width:10; } .pg-ring .fg { fill:none; stroke:#7fd8ff; stroke-width:10; stroke-linecap:round; }
  .pg-num { position:absolute; inset:0; display:grid; place-items:center; font-size:54px; font-weight:700; font-variant-numeric:tabular-nums; }
  .pg-cue { min-height:22px; font-size:16px; color:#ffd479; margin:6px 0 14px; } .pg-big { font-size:60px; margin-top:30px; }
  .pg .btn.pulse { animation:pgPulse 1.2s ease-in-out infinite; } @keyframes pgPulse { 50% { transform:scale(1.06); } }
  textarea.cline { resize:none; line-height:1.35; }
  .endcard[hidden] { display:none; }
  .knowcard { margin-top:14px; padding:14px 14px 10px; border-radius:16px; background:rgba(255,212,121,.12); border:1px solid rgba(255,212,121,.35); }
  .knowcard p { color:var(--ink); margin-top:8px; font-size:15px; }
  .knowcard p span { color:var(--ink-soft); font-size:13px; }
  .wlink { background:none; color:var(--gold); text-decoration:underline; padding:0; font:inherit; }
  .wiki p.wli { margin-top:4px; }
  .wiki a { color:var(--gold); }
  a.btn { text-decoration:none; text-align:center; }
  /* the morning (d147: the Story design) */
  .mo-open { position:relative; overflow:hidden; width:100%; display:flex; align-items:center; gap:12px; margin:0 0 12px; padding:18px 16px;
    border-radius:20px; text-align:left; background:linear-gradient(135deg, #ffb37a 0%, #c2557a 55%, #3b2a6b 100%); color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  .mo-open-art { position:absolute; inset:auto 0 0 0; height:60%; opacity:.45; pointer-events:none; }
  .mo-open-art svg { width:100%; height:100%; display:block; }
  .mo-open-t { position:relative; flex:1; min-width:0; } .mo-open-t b { display:block; font-size:18px; }
  .mo-open-t small { display:block; font-size:13px; opacity:.85; margin-top:2px; white-space:normal; }

<script>
(() => {
  /* ---------- config + clock ---------- */
  const API = new URLSearchParams(location.search).get("api") || "https://still.srv1948070.hstgr.cloud";

  /* ---------- pairing ----------
     The page is public, so it holds no secret. Pairing stores the code on
     this device; the server then lets it save XP, change the calendar and
     receive pings. A #pair=CODE link pairs in one tap. */
  const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
  const hashPair = /[#&]pair=([^&]+)/.exec(location.hash);
  if (hashPair) { store.set("quest-key", decodeURIComponent(hashPair[1]).trim()); history.replaceState(null, "", location.pathname + location.search); }
  const questKey = () => store.get("quest-key") || "";
  async function qfetch(path, opts = {}){
    const r = await fetch(API + path, { ...opts, cache:"no-store",
      headers:{ "Content-Type":"application/json", "X-Quest-Key":questKey(), ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || "HTTP " + r.status);
    return body;
  }
  const qs = new URLSearchParams(location.search);
  const DRY = qs.get("dry") === "1";
  const AT = qs.get("at");
  const clockOffset = AT ? (new Date(AT).getTime() - Date.now()) : 0;
  const now = () => new Date(Date.now() + clockOffset);

  /* The day runs on the calendar's clock: the plan says which zone Junyan is
     in (still-api reads it from his calendar, 2026-10-05). Before the plan
     loads, the device's zone stands in. */
  let PLAN_TZ = null;
  const TZ = () => PLAN_TZ || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tzParts = (d, o) => Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone:TZ(), ...o })
    .formatToParts(d).map(x => [x.type, x.value]));
  const tzYmd = d => { const p = tzParts(d, { year:"numeric", month:"2-digit", day:"2-digit" }); return `${p.year}-${p.month}-${p.day}`; };
  /* The game's day runs to 4 AM, or to the end of a late block that is still
     going (sleep to 5 AM), not to midnight (Junyan, d67). pullPlan picks the
     day; before it loads, "4 hours ago" stands in. */
  let GAME_YMD = null;
  const gameYmd = () => GAME_YMD || tzYmd(new Date(now() - 4 * 3600000));
  // same shape as Date.toDateString(), which Stillness uses for the /ops key
  const dayKey = () => new Date(gameYmd() + "T12:00:00Z").toLocaleDateString("en-US", { timeZone:"UTC", weekday:"short", month:"short", day:"2-digit", year:"numeric" }).replace(/,/g, "");
  function tzOff(d){
    const v = tzParts(d, { timeZoneName:"longOffset" }).timeZoneName || "";
    const m = v.match(/GMT([+-])(\d{2}):(\d{2})/);
    return m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) : 0;
  }
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  const fmtT = d => d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit", timeZone:TZ() });
  // minutes and hours only, no seconds (Junyan, 2026-09-28)
  const fmtHM = min => { const h = Math.floor(min / 60), m = min % 60;
    return h ? (m ? `${h} hr ${m} min` : `${h} hr`) : `${m} min`; };
  const fmtLeft = sec => fmtHM(Math.max(0, Math.ceil(sec / 60)));    // time remaining rounds up
  const fmtAgo = sec => fmtHM(Math.max(0, Math.floor(sec / 60)));    // time elapsed rounds down
  const fmtMin = min => min >= 60 ? `${Math.floor(min/60)}h ${min%60}m` : `${min} min`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  /* ---------- game state (localStorage, per viewer) ---------- */
  const GKEY = "quest-v1";
  let G = { xp:0, bestCombo:0, day:null };
  try { const d = JSON.parse(localStorage.getItem(GKEY)); if (d) G = { ...G, ...d }; } catch {}
  function freshDay(){ return { date:dayKey(), since:now().toISOString(), prana:null, pl:[], caches:{}, missed:{}, xp:0, checks:{}, closes:{}, zaps:[], zap:null, side:null, log:[] }; }
  if (!G.day) G.day = freshDay();   // a stale day is rolled over once the plan says which day it is
  /* XP lives on this device AND on the server (still-api quest:state), so it
     survives a cleared browser and is the same on phone and Mac. The two copies
     are merged, not newest-wins (quest-merge.js, 2026-10-08): check-ins, habits
     and log lines from either device survive. */
  let syncTimer = null, syncErr = null;
  // fold a server copy in; true when this device holds something the server lacks
  function adopt(srv){
    if (!srv || typeof srv.xp !== "number") return true;
    /* A device that has never synced (just paired) played its own separate game:
       take the server's instead of folding those numbers in (2026-10-08). */
    const first = store.get("quest-synced") !== store.get("quest-key");
    store.set("quest-synced", store.get("quest-key"));
    const m = first ? { ...srv } : QuestMerge.mergeQuest(G, srv);
    if (!QuestMerge.same(m, G) || m.ts !== G.ts) {
      G = m;
      try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch {}
      if (hasBag()) setTimeout(() => { try { Bag.render(); } catch {} }, 0);
    }
    return !QuestMerge.same(m, srv);
  }
  const pushG = (keepalive) => { clearTimeout(syncTimer); syncTimer = null;
    return qfetch("/quest/state", { method:"POST", body:JSON.stringify(G), keepalive:!!keepalive })
      .then(r => { syncErr = null; adopt(r && r.state); }).catch(e => { syncErr = e.message; }); };
  const saveG = () => {
    G.ts = Date.now();
    try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch {}
    if (!questKey() || DRY) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushG, 1500);
  };
  async function pullState(){
    if (!questKey()) return;
    try {
      const srv = await qfetch("/quest/state");
      syncErr = null;
      if (adopt(srv) && !DRY) saveG();   // this device has news: push it up (the server merges too)
    } catch (e) { syncErr = e.message; }
  }

  /* ---------- live data: plan + edit layer + tasks ---------- */
  let PLAN = null, OPS = { edits:{}, drops:[], adds:[], ts:0 }, TASKS = [], lastPull = null, pullErr = null, INSIGHTS = {};

  async function getPlan(date){
    const r = await fetch(API + "/plan?date=" + date, { cache:"no-store" });
    if (!r.ok) throw new Error("plan HTTP " + r.status);
    const p = await r.json();
    if (!p || !Array.isArray(p.blocks)) throw new Error("plan has no blocks");
    return p;
  }
  async function pullPlan(){
    const t = now(), today = tzYmd(t);
    let p = await getPlan(today);
    PLAN_TZ = p.tz || null;
    let day = today;
    const hour = +tzParts(t, { hour:"numeric", hourCycle:"h23" }).hour;
    if (hour < 12) {
      // Stay on yesterday's mountain until 4 AM, or until its last block ends
      // if that is later (capped at 9 AM, and at today's first fixed block).
      const y = tzYmd(new Date(t - 86400000));
      const prev = await getPlan(y).catch(() => null);
      if (prev && prev.blocks.length) {
        const at4 = new Date(`${today}T04:00:00Z`).getTime() - tzOff(t) * 60000;
        const lastEnd = Math.max(...prev.blocks.map(b => +new Date(b.e)));
        const firstFixed = p.blocks.filter(b => !/^open space|^rest$/i.test(b.t)).map(b => +new Date(b.s));
        const cutoff = Math.max(at4, Math.min(lastEnd, at4 + 5 * 3600000, ...firstFixed));
        if (+t < cutoff) { p = prev; day = y; }
      }
    }
    PLAN = p;
    PLAN_TZ = p.tz || null;
    GAME_YMD = day;
  }
  async function pullOps(){
    const r = await fetch(API + "/ops?d=" + encodeURIComponent(dayKey()), { cache:"no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.date === dayKey()) OPS = { edits:d.edits||{}, drops:d.drops||[], adds:d.adds||[], ts:d.ts||0 };
  }
  async function pullTasks(){
    const r = await fetch(API + "/tasks", { cache:"no-store" });
    if (!r.ok) return;
    const d = await r.json();
    TASKS = (d.tasks || []).filter(t => !t.done);
  }
  async function pullAll(){
    try {
      await pullPlan();   // first: it sets the zone, which decides today's date key
      await Promise.all([pullOps(), pullTasks().catch(() => {}), pullState()]);
      seedFromOura();
      pullSteps();
      pullBedtime();
      if (questKey()) qfetch("/quest/insights").then(j => { INSIGHTS = j || {};
        // the insight agent answered: drop those "Research this" requests
        const left = (G.research || []).filter(r => !INSIGHTS[r.key]);
        if (left.length !== (G.research || []).length) { G.research = left; saveG(); } }).catch(() => {});
      pullSkills().then(() => { if (!$("sheet").classList.contains("open")) render(); }).catch(() => {});
      pullKeeps();
      lastPull = new Date(); pullErr = null;
      setTimeout(openPending, 0);
    } catch (e) { pullErr = String(e.message || e); }
    render();
  }
  /* Same protocol as Stillness: the whole day's edit layer, last-write-wins on
     ts. Pull first so a phone edit made a minute ago is not overwritten. */
  async function writeOps(mutate){
    await pullOps().catch(() => {});
    mutate(OPS);
    OPS.ts = Date.now();
    if (DRY) { render(); return; }
    await fetch(API + "/ops", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ date:dayKey(), ...OPS }) }).catch(() => {});
    render();
  }

  const keyOf = b => b.s + "|" + b.t;
  function blocks(){
    if (!PLAN) return [];
    const out = [];
    PLAN.blocks.forEach(b => {
      const k = keyOf(b);
      if (OPS.drops.includes(k)) return;
      const ed = OPS.edits[k];
      out.push({ ...b, key:k, s:new Date(ed?.s ?? b.s), e:new Date(ed?.e ?? b.e), t:ed?.t ?? b.t });
    });
    OPS.adds.forEach(a => out.push({ ...a, key:a.key, s:new Date(a.s), e:new Date(a.e), extra:true }));
    return out.map(b => ({ ...b, kind:kindOf(b) })).sort((x,y) => x.s - y.s);
  }
  // Stillness's shift: every block from `from` onward moves by `min` minutes.
  function shiftFrom(fromKey, min){
    return writeOps(o => {
      const ms = min * 60000, all = blocks(), from = all.find(b => b.key === fromKey);
      if (!from) return;
      all.forEach(b => {
        if (b.s < from.s) return;
        const s = new Date(b.s.getTime()+ms).toISOString(), e = new Date(b.e.getTime()+ms).toISOString();
        if (b.extra) { const a = o.adds.find(x => x.key === b.key); if (a) { a.s = s; a.e = e; } }
        else o.edits[b.key] = { s, e, t:b.t };
      });
    });
  }

  /* ---------- what kind of block is this ---------- */
  const KINDS = {
    rest:     { em:"🌙", name:"Rest",     health:true },
    practice: { em:"🪷", name:"Practice", health:true },
    body:     { em:"💪", name:"Body",     health:true },
    fuel:     { em:"🥗", name:"Fuel",     health:true },
    travel:   { em:"🧳", name:"Journey" },
    call:     { em:"📞", name:"Call" },
    dance:    { em:"💃", name:"Dance" },
    open:     { em:"🗺️", name:"Open space" },
    break:    { em:"🍃", name:"Breather" },
    fixed:    { em:"📌", name:"Appointment" },
  };
  const RULES = [
    [/sleep|nap\b|nap |wind.?down|\bbed\b|rest\b/i, "rest"],
    [/shambhavi|sadhana|yoga|meditat|pooja|kriya|bhuta|angamardana|surya|nadi shuddhi|breath/i, "practice"],
    [/breakfast|brunch|lunch|dinner|\beat\b|cook|meal|pudding|veggie|snack|groceries/i, "fuel"],
    [/ride|drive|flight|airport|check.?in|security|transfer|uber|\btrain\b|lounge|board|pack|\b[A-Z]{2}\d{2,4}\b/i, "travel"],
    [/gym|sauna|\brun\b|walk|mobility|swim|workout|training|stretch/i, "body"],
    [/zouk|dance|class|social|workshop|rehearsal/i, "dance"],
    [/\bcall\b|meet|zoom|chat with/i, "call"],
  ];
  function kindOf(b){
    if (b.type === "break") return "break";
    if (/^open space/i.test(b.t) || b.type === "focus") return "open";

  /* Three picks for right now (Junyan, 2026-10-09: "only suggestions for this exact

  function suggestions(n = 3){
    const t = now(), all = blocks(), p = tzParts(t, { hour:"numeric", minute:"numeric", hourCycle:"h23" }), h = +p.hour + +p.minute / 60;
    const meal = all.find(b => isMeal(b) && +b.s - 20 * 60000 <= +t && +t <= +b.e + 40 * 60000);
    const afterMeal = all.some(b => isMeal(b) && +b.e <= +t && +t - +b.e <= 45 * 60000);

    HABITS.forEach(([id, , , max, , , flag], k) => {

      let sc = 10 + habitGain(id) / 3 - k * 0.01;
      if (w[1] - h < 1.5) sc += 4;                                     // its window closes soon

      if (id === "water") { const due = Math.floor((h - 6.5) / 1.25) + 1; sc += (due - (G.day.habits.water || 0)) * 3; }

  const nearNewMoon = t => { const a = (((+t - Date.UTC(2000, 0, 6, 18, 14)) / 86400000) % 29.530588 + 29.530588) % 29.530588; return a < 1.5 || a > 28; };
  let SUGG = null;   // keep the same three on screen until one is tapped or the hour turns

    for (const id of Object.keys((prev && prev.earn) || {})) {

        id:b.id, calId:b.calId, raw:b.raw, s:s.toISOString(), e:e.toISOString(), title: t !== b.t ? t : "" }) });
    } catch (err) {
      alert(`Could not change the calendar (${err.message}). Saved for today only.`);
      return saveBlock(b, s, e, t, moveLater);
    }
    log(`Changed ${b.t} in the calendar${t !== b.t ? ` to ${t}` : ""}: ${fmtT(s)} to ${fmtT(e)}`);
    const de = e - b.e;
    await writeOps(o => {
      delete o.edits[b.key];   // the calendar now holds the change
      if (moveLater && de) blocks().forEach(x => {
        if (x.key === b.key || x.s < b.e) return;
        setBlock(o, x, new Date(x.s.getTime() + de), new Date(x.e.getTime() + de), x.t);
      });
    });
    await pullAll();
  }
  async function addBlockCal(t, s, e, makeRoom){
    try { await qfetch("/cal/event", { method:"POST", body:JSON.stringify({ s:s.toISOString(), e:e.toISOString(), title:t }) }); }
    catch (err) { alert(`Could not add it to the calendar (${err.message}). Added for today only.`); return addBlock(t, s, e, makeRoom); }
    log(`Added ${t} to the calendar: ${fmtT(s)} to ${fmtT(e)}`);
    if (makeRoom) await writeOps(o => blocks().forEach(x => {
      if (x.s < s) return;
      setBlock(o, x, new Date(x.s.getTime() + (e - s)), new Date(x.e.getTime() + (e - s)), x.t);
    }));
    await pullAll();
  }
  function dropBlock(b){
    log(`Removed ${b.t} from today`);
    return writeOps(o => {
      if (b.extra) o.adds = o.adds.filter(x => x.key !== b.key);
      else { if (!o.drops.includes(b.key)) o.drops.push(b.key); delete o.edits[b.key]; }
    });
  }
  function addBlock(t, s, e, makeRoom){
    log(`Added ${t}: ${fmtT(s)} to ${fmtT(e)}`);
    const dur = e - s;
    return writeOps(o => {
      if (makeRoom) blocks().forEach(x => {
        if (x.s < s) return;
        setBlock(o, x, new Date(x.s.getTime() + dur), new Date(x.e.getTime() + dur), x.t);
      });
      o.adds.push({ key:"x" + s.getTime(), s:s.toISOString(), e:e.toISOString(), t, type:"task", cal:"you" });
    });
  }
  // time inputs speak the calendar's clock, not the device's
  const toField = d => { const p = tzParts(d, { hour:"2-digit", minute:"2-digit", hourCycle:"h23" });
    return `${p.hour === "24" ? "00" : p.hour}:${p.minute}`; };
  function fromField(v, ref){
    const [h, m] = v.split(":").map(Number);
    const p = tzParts(ref, { year:"numeric", month:"2-digit", day:"2-digit" });
    const guess = Date.UTC(+p.year, +p.month - 1, +p.day, h, m);
    return new Date(guess - tzOff(new Date(guess)) * 60000);
  }

  /* ---------- gym log (2026-10-05) ----------

     1-7 per move) and Matthew I. Smith's Pike & Head to Toe mobility. Sets are
     the Two Set Method he logs by hand: 2 warm-up + 2 working. Saving sends the
     session to still-api, which keeps it and writes his Workout Tracker rows. */
  const LADDER = {
    PPU: ["Zero weight","Shoulders distance from rings","Tuck","Hips level with shoulders","Extend hips","Advanced tuck 90°","Full lay"],
    FLR: ["Zero weight","Shoulders distance from rings","Tuck","Hips level with shoulders","Extend hips","Advanced tuck 90°","Full lay"],
    HSPU: ["Zero weight","Pike","Elevate feet","Shoulder stand","Partial range strap assisted","Partial range unassisted","Archer push-ups"],
    NC: ["Support with hands","Support with hands","Support with hands","No hands partial range","No hands negative","No hands positive","Weighted body flat"],
    OAC: ["2-arm dead hang","One-arm dead hang","2-arm partial range","2-arm full range","Partial range negative OAC","Full range negative OAC","Partial range positive"],
    SLS: ["Use arms, no weight","Negative only","Positive as well","10 kg","20 kg","30 kg","40 kg"],

  const PROGRAMS = {
    "Jack Woods · Day 1": { strength:["NC","OAC","SLS"], mobility:["Bridge","Pike","Butterfly","Front Split","Pancake","Handstand"] },
    "Jack Woods · Day 2": { strength:["HSPU","FLR","PPU"], mobility:["Bridge","Pike","Front Split","Pancake","V-sit"] },
    "Matthew I. Smith · Phase 1": { mis:[["Rolling Feet","90s per side","1-2"],["Calf Stretch, single-leg standing","90s","2-3"],
      ["Sciatic Nerve Ankle Joint Floss","8 reps · 3s up / 3s down","2-3"],["Hip Internal Rotation, lying","3 reps · 10s hold","2-3"],
      ["Pike Hang, standing B-stance","5 reps · contract 5s / relax 5s","2-3"]] },
    "Matthew I. Smith · Phase 2": { mis:[["Donkey Calf Stretch, single leg","90s","2-3"],["Your Pigeon Variation","30s","2-3"],
      ["Sciatic Nerve Knee Joint Floss","8 reps · 3-1-3-1","2-3"],["Hip Internal Rotation, seated","8 reps · 3s lift / 3s rest","2-3"],
      ["Pike Good Morning, standing round back","8 reps · 3-3-1-0","2-3"]] },
    "Matthew I. Smith · Phase 3": { mis:[["Knee Extension Calf Stretch, single leg","8 reps · 3s","2-3"],["Sciatic Nerve Ankle Joint Glide","6 reps · 3-1-3-1","2-3"],
      ["Pike Good Morning, leg elevated","8 reps · 2-3-1-0","2-3"],["Pike Active Lifts, seated single leg","5 reps · 1-1-1-5","2-3"]] },
  };
  const isGym = b => !!b && /\bgym\b|workout|calisthenics|rings/i.test(b.t);
  const ymdLocal = () => { const p = tzParts(now(), { year:"numeric", month:"2-digit", day:"2-digit" }); return `${p.year}-${p.month}-${p.day}`; };
  let GYM = null, gymTimer = null, gymInfo = { levels:{}, last:[] };

  async function loadGymInfo(){
    if (!questKey()) return;

  function gymDraftKey(){ return "quest-gym-" + ymdLocal(); }
  function newGym(program){

    (P.mobility || []).forEach(m => { e["m:" + m] = { done:false }; });

      <p class="gnote" id="gMsg">Sets save to your Workout Tracker in Notion: 2 warm-up, 2 working, reps and lbs. Leave a box empty to skip it.</p>`;
    openSheet(h, true);
    const sh = $("sheet");
    $("gClose").onclick = () => { saveDraft(); stopRest(); closeSheet(); };

  async function saveGym(){
    const P = PROGRAMS[GYM.program], entries = [];
    (P.strength || []).forEach(c => { const x = GYM.e[c];
      if (x.reps.some(v => v !== "") || (x.start != null && x.level !== x.start))
        entries.push({ code:c, name:MOVE[c], kind:"strength", level:x.level, levelName:LADDER[c][x.level - 1], reps:x.reps, lbs:x.lbs }); });
    (P.mobility || []).forEach(m => { if (GYM.e["m:" + m].done) entries.push({ name:m, kind:"mobility", setsDone:1, note:"mobility" }); });
    (P.mis || []).forEach(([m, how]) => { const x = GYM.e["mis:" + m]; if (x.sets) entries.push({ name:m, kind:"mobility", setsDone:x.sets, note:how }); });
    if (!entries.length) { $("gMsg").textContent = "Nothing logged yet. Fill in at least one set."; return; }
    const ups = entries.filter(x => x.code && GYM.e[x.code].start != null && x.level > GYM.e[x.code].start);
    const working = entries.reduce((a, x) => a + (x.reps ? x.reps.slice(2).filter(v => v !== "").length : (x.setsDone || 0)), 0);
    $("gSave").disabled = true; $("gMsg").textContent = "Saving…";
    let msg;
    if (DRY) msg = "Test mode: nothing sent.";
    else if (!questKey()) msg = "Pair this device in ⚙️ to save to Notion. Your sets are kept on this phone for now.";
    else {
      try {
        const r = await qfetch("/quest/workout", { method:"POST", body:JSON.stringify({ date:ymdLocal(), program:GYM.program, entries }) });
        msg = r.notion && r.notion.rows ? `Saved. ${r.notion.rows} rows added to your Workout Tracker.` : "Saved on the server.";
        if (r.notion && r.notion.errors && r.notion.errors.length) msg += ` Notion refused ${r.notion.errors.length}: ${r.notion.errors[0]}`;
        try { localStorage.removeItem(gymDraftKey()); } catch {}
      } catch (e) { $("gSave").disabled = false; $("gMsg").textContent = "Could not save: " + e.message + ". Your sets are still here."; return; }
    }
    const warm = entries.reduce((a, x) => a + (x.reps ? x.reps.slice(0, 2).filter(v => v !== "").length : 0), 0);
    log(`Gym log: ${GYM.program}, ${entries.length} moves (${warm} warm-up, ${working} working sets)`); saveG();
    ups.forEach((x, i) => setTimeout(() => {
      log(`Level up: ${x.name} L${x.level} (${x.levelName})`); saveG();
      banner("🪢", "LEVEL UP", `${x.name} level ${x.level}`); }, 900 * (i + 1)));
    const b = GYM.blockKey && blocks().find(x => x.key === GYM.blockKey);
    if (b && !G.day.closes[gk(b)]) G.day.closes[gk(b)] = "done";
    saveG();

  }

  const moLeave = d => d.go ? `<div class="mo-leave">🧭 Leave by <b>${fmtT(new Date(+d.go.s - 30 * 60000))}</b> for ${esc(moName(d.go))}</div>` : "";

  /* weather: Open-Meteo (free, no key). Where: the phone's location when he allows it (he is
     there), else the calendar's place looked up by name, else nothing. Cached for 2 hours. */
  const WX = { 0:["☀️","Clear"], 1:["🌤️","Mostly clear"], 2:["⛅","Partly cloudy"], 3:["☁️","Cloudy"], 45:["🌫️","Fog"], 48:["🌫️","Fog"],
    51:["🌦️","Drizzle"], 53:["🌦️","Drizzle"], 55:["🌦️","Drizzle"], 61:["🌧️","Rain"], 63:["🌧️","Rain"], 65:["🌧️","Heavy rain"],
    71:["🌨️","Snow"], 73:["🌨️","Snow"], 75:["🌨️","Snow"], 80:["🌦️","Showers"], 81:["🌧️","Showers"], 82:["⛈️","Heavy showers"],
    95:["⛈️","Thunderstorms"], 96:["⛈️","Thunderstorms"], 99:["⛈️","Thunderstorms"] };
  let WEATHER = null, wxBusy = false;
  async function wxWhere(){
    try { const c = JSON.parse(store.get("quest-geo") || "null"); if (c && Date.now() - c.at < 6 * 3600000) return c; } catch {}
    const geo = await new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lon:p.coords.longitude, at:Date.now(), how:"here" }),
        () => res(null), { timeout:8000, maximumAge:3600000 });
    });
    if (geo) { store.set("quest-geo", JSON.stringify(geo)); return geo; }
    // the calendar's place by name, then the time zone's city as a last resort (named on the slide)
    const parts = String(placeNow() || "").split(/\s*[+&,/]\s*/).filter(Boolean).concat([(TZ().split("/").pop() || "").replace(/_/g, " ")]);
    const tzCity = parts.pop();
    const look = async name => { try {
        const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&name=${encodeURIComponent(name)}`)).json();
        return j.results && j.results[0] ? { lat:j.results[0].latitude, lon:j.results[0].longitude, name:j.results[0].name, how:"place", at:Date.now() } : null;
      } catch { return null; } };
    for (const name of parts) { const g = await look(name); if (g) { store.set("quest-geo-place", JSON.stringify(g)); return g; } }
    // a tour stop the map does not know ("Famine Stella"): the last place found in the last 2 days (yesterday's Aswan)
    try { const g = JSON.parse(store.get("quest-geo-place") || "null"); if (g && Date.now() - g.at < 48 * 3600000) return g; } catch {}
    return tzCity ? look(tzCity) : null;
  }
  async function loadWeather(){
    if (wxBusy || (WEATHER && Date.now() - WEATHER.at < 2 * 3600000)) return;
    wxBusy = true;
    try {
      const w = await wxWhere();
      if (!w) { WEATHER = { at:Date.now(), none:true }; return; }
      const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}` +
        `&daily=temperature_2m_max,temperature_2m_min,weather_code,uv_index_max,sunrise,sunset,precipitation_probability_max,wind_speed_10m_max` +
        `&hourly=temperature_2m,weather_code&timezone=auto&forecast_days=2`)).json();
      WEATHER = { at:Date.now(), where:w, daily:j.daily, hourly:j.hourly, utcOff:j.utc_offset_seconds || 0 };
    } catch { WEATHER = { at:Date.now(), none:true }; }
    finally { wxBusy = false; const el = $("morning"); if (el && el.className === "open") openMorning(); }
  }
  // the hourly reading closest to a moment's start
  function wxAt(date){
    if (!WEATHER || !WEATHER.hourly) return null;
    const H = WEATHER.hourly, local = new Date(+date + WEATHER.utcOff * 1000).toISOString().slice(0, 13);
    const i = H.time.findIndex(x => x.slice(0, 13) === local);
    return i < 0 ? null : { temp:Math.round(H.temperature_2m[i]), code:H.weather_code[i] };
  }
  const wxHm = s => { const [h, m] = s.slice(11, 16).split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };

  function moSlides(d){
    const s = [];

      if ((D.precipitation_probability_max[0] || 0) >= 40) tips.push(`${D.precipitation_probability_max[0]}% chance of rain: bring a layer.`);
      if ((D.wind_speed_10m_max[0] || 0) >= 30) tips.push(`Wind up to ${Math.round(D.wind_speed_10m_max[0])} km/h: sand and dust in open places.`);
      wx = `<div class="mo-wx-ic">${ic}</div><div class="mo-big">${Math.round(D.temperature_2m_max[0])}° <span class="mo-lo">/ ${Math.round(D.temperature_2m_min[0])}°</span></div>

    const pal = [["#ffd39a", "#e0785a", "#5b2d5e"], ["#9fe3d0", "#3f8fa0", "#22305e"], ["#ffc2d1", "#b8579a", "#2f2a66"], ["#ffe08a", "#d98a3a", "#4a2f4f"]];

          <button class="mo-more-btn" data-fold="${esc(m.b.key)}">${moOpen.has(m.b.key) ? "Show less ⌃" : "Everything for this ⌄"}</button></div>` });
    });
    s.push({ pal:["#fff1c9", "#f0a35e", "#7b3f61"], html:`<div class="mo-kicker">Before you go</div><div class="mo-big">Practices for today</div>
      <p class="mo-soft" style="margin-top:6px">Tap one when it's done. Each fills your prana.</p>${moPractices()}
      <button class="mo-go" data-mo="begin">Let's go</button>` });
    return s;
  }

  // one activity, opened in place: a meal's plate, an event's what-to-know and packing list
  const moOpen = new Set();
  function moDetail(b, packFirst){
    const k = gk(b), mins = Math.round((b.e - b.s) / 60000);
    let h = `<div class="mo-det-time">${fmtT(b.s)} to ${fmtT(b.e)} · ${fmtHM(mins)}</div>`;

        ${items.map((x, i) => `<button class="mo-ck${W.tick[i] ? " on" : ""}" data-tick="${i}" data-k="${esc(b.key)}"><span class="bx">${W.tick[i] ? "✓" : ""}</span>${esc(x.t)}</button>`).join("")}`;
      if (packFirst) h += knowH;   // about to go: what to bring comes first
      if (!know.length && !items.length && !mind.length) h += (G.research || []).some(r => r.key === k)
        ? `<p class="mo-det-none">Asked. The insight agent preps it on its next run.</p>`
        : `<button class="mo-det-btn" data-ask="${esc(b.key)}">🔎 Prep this for me</button>`;

  }

  function soonHtml(b, t){
    const mins = Math.round((b.s - t) / 60000), go = ["travel", "major"].includes(groupOf(b));
    const h = wxAt(b.s);

  // checklists and folds inside a detail block (the morning's schedule and the coming-up card)

    root.querySelectorAll("[data-phone]").forEach(b => b.onclick = e => { e.stopPropagation();
      const blk = blkOf(b.dataset.phone); if (!blk) return; const M = G.day.meals[gk(blk)]; M.phone = !M.phone; saveG(); redraw(); });

      const i = b.dataset.tick, blk = blkOf(b.dataset.k); if (!blk) return;

  let moSlide = 0;

    if (!Object.keys(INSIGHTS).length && questKey() && !openMorning.asked) { openMorning.asked = true;
      qfetch("/quest/insights").then(j => { INSIGHTS = j || {}; const el = $("morning"); if (el && el.className === "open") openMorning(); }).catch(() => {}); }

      <div class="mo-slide" style="--g1:${S.pal[0]};--g2:${S.pal[1]};--g3:${S.pal[2]}">${S.hills ? moHills(260) : ""}

      if (a === "next") { if (moSlide < slides.length - 1) { moSlide++; openMorning(); } return; }

  document.addEventListener("keydown", e => {
    const el = $("morning"); if (!el || el.className !== "open" || /input|textarea/i.test(document.activeElement.tagName)) return;

  /* ---------- skills (ticket 16, 2026-10-08) ----------
     A skill is a name, what he is working on, and content for it (no levels, d140).
     The life wiki on his Mac is the source; the insight agent copies skill cards,
     content offers (one-line summary + ideas) and pages to still-api. Quest writes
     back what he does; the agent folds it into the wiki on its next run. */
  let SKILLS = [], CONTENT = [], WIKI = [], PRACTICE = { plans:{}, progress:{} };
  async function pullSkills(){
    if (!questKey()) return;
    const [s, c, w, pr] = await Promise.all([qfetch("/quest/skills"), qfetch("/quest/content"), qfetch("/quest/wiki"),
      qfetch("/quest/practice").catch(() => null)]);
    SKILLS = s.skills || []; CONTENT = c.items || []; WIKI = (w.pages || []).map(p => p.path);
    if (pr && pr.plans) PRACTICE = pr;
  }
  const skillOf = id => SKILLS.find(s => s.id === id);
  const KIND_IC = { video:"▶", article:"📄", podcast:"🎧" };
  async function skillOp(body){
    if (DRY) return null;
    return qfetch("/quest/skills", { method:"POST", body:JSON.stringify(body) });
  }
  async function contentOp(it, body){
    if (DRY) return;
    try { await qfetch(`/quest/content/${encodeURIComponent(it.id)}/state`, { method:"POST", body:JSON.stringify(body) }); } catch {}
  }
  function setState(it, state, line){
    it.state = state; it.stateAt = now().toISOString();
    if (line) it.note = line;
    contentOp(it, { state, ...(line ? { line } : {}) });
  }
  /* ---------- practice: getting better at a skill (Junyan, 2026-10-09, d191 to d195) ----------
     "this one needs to be about helping me to develop the skill ... i don't want to gain any prana".
     A skill with a plan (still-api /quest/practice) shows its stage and one next step; its page has
     the stages, "Do it with me" (the routine step by step with timers), the details to make habits,
     a weekly check and the lines he kept. Nothing here gives or takes prana. */
  const planOf = id => (PRACTICE.plans || {})[id];
  const progOf = id => ((PRACTICE.progress || {})[id] = (PRACTICE.progress || {})[id] || { stage:1, runs:[], days:{}, ticks:{}, checks:[] });
  async function practiceOp(id, body){
    if (DRY) return;
    try { const r = await qfetch("/quest/practice", { method:"POST", body:JSON.stringify({ id, ...body }) }); if (r && r.progress) PRACTICE.progress[id] = r.progress; } catch {}
  }
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n);
    const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return `${t.getUTCFullYear()}-W${String(Math.ceil(((t - y) / 86400000 + 1) / 7)).padStart(2, "0")}`; };
  function stageInfo(id){
    const pl = planOf(id), pr = progOf(id); if (!pl) return null;
    const n = Math.min(pr.stage || 1, pl.stages.length), st = pl.stages[n - 1], tg = st.target || {};
    const notes = CONTENT.filter(it => it.skill === id && it.note).length;
    const have = tg.kind === "runs" ? pr.runs.length : tg.kind === "days" ? Object.keys(pr.days || {}).length
      : tg.kind === "ticks" ? Object.keys(pr.ticks || {}).filter(k => (pl.finetune || []).includes(k)).length : tg.kind === "notes" ? notes : 0;
    const need = tg.kind === "ticks" ? (pl.finetune || []).length : tg.count || 0;
    return { n, of:pl.stages.length, st, have, need, ready: need > 0 && have >= need && n < pl.stages.length, pl, pr };
  }
  function checkDue(id){
    const pr = progOf(id), last = pr.checks[pr.checks.length - 1];
    if (last) return Date.now() - Date.parse(last.at) >= 7 * 86400000;
    return pr.runs.length >= 3 || Object.keys(pr.days || {}).length >= 3;
  }
  // the one next step, in plain words, and what tapping it does
  function nextStep(id){
    const si = stageInfo(id); if (!si) return null;
    const slot = now().getHours() < 15 ? "this morning" : "tonight";
    if (checkDue(id)) return { text:"Your weekly check: three quick questions", go:"check" };
    if (si.ready) return { text:`Stage ${si.n} done. Ready for stage ${si.n + 1}: ${si.pl.stages[si.n].name}`, go:"open" };
    const k = (si.st.target || {}).kind;
    if (k === "runs") return { text:`Do the routine ${slot} with the guide (${si.have} of ${si.need})`, go:"guide" };
    if (k === "days") return { text:`Routine ${slot} without the guide, then tick Dr Ellie ${slot === "tonight" ? "PM" : "AM"} (${si.have} of ${si.need} days)`, go:"open" };
    if (k === "ticks") { const left = (si.pl.finetune || []).find(x => !(si.pr.ticks || {})[x]); if (left) return { text:`Make this a habit: ${left}`, go:"open" }; }
    const vid = CONTENT.filter(it => it.skill === id && (it.state || "new") === "new").sort((a, b) => a.mins - b.mins)[0];
    if (vid) return { text:`Watch: ${vid.title} (${vid.mins} min), and keep one line`, go:"content", it:vid };
    return { text:"Open your skill", go:"open" };
  }
  function doNext(id){
    const nx = nextStep(id); if (!nx) return openSkill(id);
