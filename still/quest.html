    if (nx.go === "content") return openContent(nx.it, () => openSkill(id));
    openSkill(id, nx.go === "check" ? "check" : null);
  }
  // a day with the routine morning and night counts toward "without looking" (once a day)
  function practiceDay(){
    for (const [id, pl] of Object.entries(PRACTICE.plans || {})) {
      const hs = pl.dayHabits || []; if (!hs.length || !hs.every(h => (G.day.habits || {})[h] > 0)) continue;
      const pr = progOf(id), d = gameYmd(); if ((pr.days || {})[d]) continue;
      (pr.days = pr.days || {})[d] = true; practiceOp(id, { op:"day", date:d });
    }
  }
  function practiceHtml(id, focus){
    const si = stageInfo(id); if (!si) return "";
    const { pl, pr } = si, nx = nextStep(id);
    const ladder = pl.stages.map((st, i) => { const n = i + 1, cls = n < si.n ? "done" : n === si.n ? "now" : "";
      return `<div class="pq-st ${cls}"><span class="pq-n">${n < si.n ? "✓" : n}</span><span><b>${esc(st.name)}</b><small>${esc(st.goal)}</small>
        ${n === si.n ? `<small class="pq-how">${esc(st.how)}</small>${si.need ? `<span class="pq-bar"><i style="width:${Math.min(100, Math.round(si.have / si.need * 100))}%"></i></span>
          <small>${si.have} of ${si.need} ${esc((st.target || {}).label || "")}</small>` : si.have ? `<small>${si.have} ${esc((st.target || {}).label || "")}</small>` : ""}` : ""}</span></div>`; }).join("");
    const lis = pr.runs.map(r => r.secs && r.secs.listerine).filter(Boolean).slice(-6);
    const qs = (pl.check || {}).qs || [];
    const due = checkDue(id) || focus === "check";
    const lastChecks = pr.checks.slice(-4).reverse();
    return `<div class="pq">
      ${nx ? `<button class="pq-next" data-pq="next"><span>Next</span><b>${esc(nx.text)}</b></button>` : ""}
      ${pl.routine ? `<div class="actions"><button class="btn primary" data-pq="guide">🪥 Do it with me</button></div>` : ""}
      <div class="win-lb">Your stages</div><div class="pq-ladder">${ladder}</div>
      ${si.n < si.of ? `<div class="actions"><button class="btn${si.ready ? " primary" : " ghost"}" data-pq="up">${si.ready ? `On to stage ${si.n + 1}` : `I'm ready for stage ${si.n + 1}`}</button></div>` : ""}
      ${si.n > 1 ? `<div class="actions" style="margin-top:-4px"><button class="btn ghost" data-pq="down" style="font-size:12px">Back to stage ${si.n - 1}</button></div>` : ""}
      ${lis.length ? `<div class="win-lb">Listerine, seconds before it burns</div><div class="pq-lis">${lis.map(x => `<span>${x}s</span>`).join("")}</div>
        <small class="pq-hint">Dr Ellie: this grows as your mouth gets healthier.</small>` : ""}
      ${(pl.finetune || []).length && si.n >= 3 ? `<div class="win-lb">The details</div>${pl.finetune.map((x, i) => `<label class="check"><input type="checkbox" data-tick="${i}"${(pr.ticks || {})[x] ? " checked" : ""}> ${esc(x)}</label>`).join("")}` : ""}
      ${qs.length ? `<div class="win-lb" id="pqCheck">Weekly check${due ? "" : pr.checks.length ? " · done for this week" : " · opens after a few days of practice"}</div>
        ${due ? `${qs.map(q => `<div class="pq-q"><div>${esc(q.q)}</div><div class="pq-a">${q.a.map((a, j) => `<button class="btn" data-q="${esc(q.id)}" data-a="${j}">${esc(a)}</button>`).join("")}</div></div>`).join("")}
          <div class="actions"><button class="btn primary" data-pq="check" disabled>Save this week</button></div>` : ""}
        ${lastChecks.length ? `<div class="pq-hist">${lastChecks.map(c => `<div><span>${esc(c.week || "")}</span>${qs.map(q => { const v = (c.answers || {})[q.id];
          return `<i title="${esc(q.q)}: ${esc(v || "")}" class="${v === q.a[0] ? "ok" : v === q.a[1] ? "mid" : "bad"}">${esc(v || "·")}</i>`; }).join("")}</div>`).join("")}</div>` : ""}` : ""}
    </div>`;
  }
  function wirePractice(id, back){
    const sh = $("sheet"), q = sel => sh.querySelector(sel);
    const on = (k, f) => { const el = q(`[data-pq="${k}"]`); if (el) el.onclick = f; };
    on("next", () => doNext(id));
    on("guide", () => openGuide(id));
    on("up", () => { const pr = progOf(id); pr.stage = (pr.stage || 1) + 1; practiceOp(id, { op:"stage", stage:pr.stage });
      log(`${skillOf(id) ? skillOf(id).name : id}: stage ${pr.stage}`); saveG(); back(); });
    on("down", () => { const pr = progOf(id); pr.stage = Math.max(1, (pr.stage || 1) - 1); practiceOp(id, { op:"stage", stage:pr.stage }); back(); });
    sh.querySelectorAll("[data-tick]").forEach(cb => cb.onchange = () => { const pl = planOf(id), item = pl.finetune[+cb.dataset.tick], pr = progOf(id);
      if (cb.checked) pr.ticks[item] = true; else delete pr.ticks[item]; practiceOp(id, { op:"tick", item, on:cb.checked }); });
    const ans = {};
    sh.querySelectorAll("[data-q]").forEach(bn => bn.onclick = () => {
      const qq = ((planOf(id).check || {}).qs || []).find(x => x.id === bn.dataset.q); ans[qq.id] = qq.a[+bn.dataset.a];
      sh.querySelectorAll(`[data-q="${qq.id}"]`).forEach(x => x.classList.toggle("primary", x === bn));
      const sv = q('[data-pq="check"]'); if (sv) sv.disabled = Object.keys(ans).length < (planOf(id).check.qs || []).length;
    });
    on("check", () => { const pr = progOf(id), week = isoWeek(now());
      pr.checks = pr.checks.filter(c => c.week !== week).concat({ at:now().toISOString(), week, answers:{ ...ans } });
      practiceOp(id, { op:"check", week, answers:ans }); log(`${skillOf(id) ? skillOf(id).name : id}: weekly check`); saveG(); back(); });
  }

  /* "Do it with me": the routine, one step at a time, with a timer and a soft bell between steps */
  function openGuide(id){
    const pl = planOf(id); if (!pl || !pl.routine) return;
    closeSheet();
    const R = pl.routine, slot = now().getHours() < 15 ? "am" : "pm", secs = {};
    const el = document.createElement("div"); el.id = "guide"; el.className = "pg";
    document.body.appendChild(el);
    let i = -1, t0 = 0, raf = 0, ended = false;
    const bell = () => { try { const AC = window.AudioContext || window.webkitAudioContext, a = (bell.a = bell.a || new AC()); a.resume && a.resume();
      [[880, .12], [1318.5, .05]].forEach(([f, v]) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f;
        g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(v, a.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + 2.2);
        o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 2.3); }); } catch {} if (navigator.vibrate) navigator.vibrate(30); };
    const C = 2 * Math.PI * 88;
    function draw(){
      cancelAnimationFrame(raf);
      if (i < 0) {
        el.innerHTML = `<div class="pg-top"><b>🪥 ${esc(R.name)}</b><button class="btn" data-g="x">Close</button></div>
          <div class="pg-body"><p class="pg-d">${R.steps.length} steps, about ${Math.round(R.steps.reduce((s, x) => s + (x.secs || 30), 0) / 60)} minutes. ${esc(R.before || "")}</p>
          <ol class="pg-list">${R.steps.map(x => `<li><b>${esc(x.t)}</b><small>${esc(x.d)}</small></li>`).join("")}</ol>
          <div class="actions"><button class="btn primary" data-g="go">Start</button></div></div>`;
      } else if (i >= R.steps.length) {
        el.innerHTML = `<div class="pg-top"><b>🪥 Done</b><button class="btn" data-g="x">Close</button></div>
          <div class="pg-body"><div class="pg-big">✨</div><p class="pg-t">That's the whole routine.</p><p class="pg-d">${esc((R.after || {})[slot] || "")}</p>
          ${secs.listerine ? `<p class="pg-d">Listerine: ${secs.listerine} seconds before it burned.</p>` : ""}
          ${(G.day.habits || {})[slot === "am" ? "mouthAm" : "mouth"] ? "" : `<div class="actions"><button class="btn" data-g="tick">Tick Dr Ellie ${slot.toUpperCase()} in Prana actions too</button></div>`}
          <div class="actions"><button class="btn primary" data-g="x">Close</button></div></div>`;
        if (!ended) { ended = true; const pr = progOf(id); pr.runs.push({ at:now().toISOString(), slot, secs:{ ...secs } });
          practiceOp(id, { op:"run", slot, secs }); log(`${skillOf(id) ? skillOf(id).name : id}: guided routine (${slot === "am" ? "morning" : "night"})`); }
      } else {
        const st = R.steps[i], up = st.count === "up";
        el.innerHTML = `<div class="pg-top"><b>Step ${i + 1} of ${R.steps.length}</b><button class="btn" data-g="x">Close</button></div>
          <div class="pg-body"><div class="pg-dots">${R.steps.map((_, j) => `<i class="${j < i ? "done" : j === i ? "now" : ""}"></i>`).join("")}</div>
          <p class="pg-t">${esc(st.t)}</p><p class="pg-d">${esc(st.d)}</p>
          <div class="pg-ring"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" class="bg"/><circle cx="100" cy="100" r="88" class="fg" id="pgFg" style="stroke-dasharray:${C};stroke-dashoffset:${up ? C : 0}"/></svg>
            <div class="pg-num" id="pgNum">${up ? "0" : st.secs}</div></div>
          <p class="pg-cue" id="pgCue">${esc(st.cues ? st.cues[0][1] : "")}</p>
          <div class="actions">${up ? `<button class="btn primary" data-g="spit">It burns: spit now</button>` : `<button class="btn primary" data-g="next">${i + 1 < R.steps.length ? "Next step" : "Finish"}</button>`}</div></div>`;
        t0 = performance.now();
        const tick = () => {
          const el2 = (performance.now() - t0) / 1000, num = $("pgNum"), fg = $("pgFg"); if (!num) return;
          if (up) { num.textContent = Math.floor(el2); fg.style.strokeDashoffset = C * (1 - Math.min(1, el2 / st.secs)); if (el2 >= st.secs) { secs[st.id] = st.secs; bell(); i++; return draw(); } }
          else {
            const left = Math.max(0, st.secs - el2); num.textContent = Math.ceil(left); fg.style.strokeDashoffset = C * (el2 / st.secs);
            if (st.cues) { const c = st.cues.filter(x => el2 >= x[0]).pop(); const ce = $("pgCue"); if (c && ce.textContent !== c[1]) { ce.textContent = c[1]; if (el2 > 1) bell(); } }
            if (left <= 0) { bell(); $("pgCue").textContent = st.end || ""; const nb = el.querySelector('[data-g="next"]'); if (nb) nb.classList.add("pulse"); return; }
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      }
    }
    el.addEventListener("click", e => {
      const b = e.target.closest("[data-g]"); if (!b) return;
      const k = b.dataset.g;
      if (k === "x") { cancelAnimationFrame(raf); el.classList.remove("open"); setTimeout(() => el.remove(), 300); render(); return; }
      if (k === "go") { bell(); i = 0; draw(); }
      if (k === "next") { i++; draw(); }
      if (k === "spit") { secs[R.steps[i].id] = Math.round((performance.now() - t0) / 1000); i++; draw(); }
      if (k === "tick") { logHabit(slot === "am" ? "mouthAm" : "mouth"); b.remove(); }
    });
    draw();
    requestAnimationFrame(() => el.classList.add("open"));
  }

  // what fits a free window: unwatched, for an active skill or for something coming up, short enough
  function offersFor(min){
    const t = +now(), skip = (G.day.skillSkip = G.day.skillSkip || []);
    const soon = it => it.forAt && Date.parse(it.forAt) > t && Date.parse(it.forAt) - t < 36 * 3600000;
    return CONTENT.filter(it => ["new", "later"].includes(it.state || "new") && !skip.includes(it.id) && it.mins <= min
        && ((skillOf(it.skill) || {}).status === "active" || soon(it)))
      .sort((a, b) => (soon(b) - soon(a)) || ((a.forAt || "9") < (b.forAt || "9") ? -1 : 1)
        || ((a.state === "later") - (b.state === "later")) || (Date.parse(b.added || 0) - Date.parse(a.added || 0)));
  }
  function trainHtml(cur, t){
    if (!questKey()) return "";
    const left = Math.floor((cur.e - t) / 60000), bed = blocks().find(b => isSleep(b) && b.s > t);
    if (bed && bed.s - t < 60 * 60000) return "";                     // nothing in the last hour before bed
    const act = SKILLS.filter(s => s.status === "active"), sug = SKILLS.filter(s => s.status === "suggested");
    const it = left >= 13 ? offersFor(left - 10)[0] : null;
    let h = `<div class="eyebrow" style="margin-top:14px">Train a skill</div>`;
    if (it) {
      const sk = skillOf(it.skill);
      h += `<div class="side-list"><div class="side offer"><span class="pr">${KIND_IC[it.kind] || "▶"}</span><span class="nm">
        <b>${esc(it.title)}</b> <span style="color:var(--ink-faint)">· ${it.mins} min</span>
        <span class="oline">${esc(it.line)}</span>
        <small>${esc(sk ? sk.name : it.skill)}${it.forTitle ? ` · for ${esc(it.forTitle)}` : ""}${it.why ? ` · ${esc(it.why)}` : ""}</small></span></div></div>
        <div class="actions"><button class="btn primary" id="tWatch">${it.kind === "video" ? "▶ Watch" : it.kind === "podcast" ? "🎧 Listen" : "📄 Read"}</button>
        <button class="btn" id="tNext" data-id="${esc(it.id)}">Another</button><button class="btn ghost" id="tNot" data-id="${esc(it.id)}">Not now</button></div>`;
      trainHtml.it = it;
    } else if (act.length) {
      h += `<div class="side-list"><button class="side" id="tSkills"><span class="pr">🎯</span><span class="nm">${left < 13 ? "Too short for a video. Open your skills" : "Nothing new that fits. See your skills"}</span></button></div>`;
    } else {
      h += `<div class="side-list"><button class="side" id="tSkills"><span class="pr">🎯</span><span class="nm">${sug.length ? `${sug.length} skills suggested from your days. Pick yours` : "Add a skill to train"}</span></button></div>`;
    }
    return h;
  }
  // the Skills section on the main screen: what he is training, and how much is new for each
  function skillsRowHtml(){
    if (!questKey()) return `<div class="skchips"><button class="skchip" data-sk="">Pair this device to see your skills</button></div>`;
    const act = SKILLS.filter(s => s.status === "active"), sug = SKILLS.filter(s => s.status === "suggested");
    const fresh = s => CONTENT.filter(it => it.skill === s.id && (it.state || "new") === "new").length;
    // a skill with a practice plan shows its stage and one next step (d191), not a count of videos
    const card = s => { const si = stageInfo(s.id), nx = nextStep(s.id);
      return `<div class="skcard"><button class="skc-top" data-sk="${esc(s.id)}"><span>🎯 <b>${esc(s.name)}</b></span><small>Stage ${si.n} of ${si.of} · ${esc(si.st.name)}</small>
        ${si.need ? `<span class="pq-bar"><i style="width:${Math.min(100, Math.round(si.have / si.need * 100))}%"></i></span>` : ""}</button>
        <button class="skc-next" data-sknext="${esc(s.id)}"><span>Next</span>${esc(nx.text)}</button></div>`; };
    const withPlan = act.filter(s => planOf(s.id)), rest = act.filter(s => !planOf(s.id));
    return `${withPlan.map(card).join("")}<div class="skchips">${rest.map(s => `<button class="skchip" data-sk="${esc(s.id)}">🎯 ${esc(s.name)}${fresh(s) ? ` <b>${fresh(s)}</b>` : ""}</button>`).join("")}
      ${sug.length ? `<button class="skchip sug" data-sk="">${sug.length} suggested from your days</button>` : ""}
      ${!act.length && !sug.length ? `<button class="skchip" data-sk="">＋ Add a skill</button>` : ""}</div>`;
  }
  function wireTrain(){
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    on("tWatch", () => openContent(trainHtml.it));
    on("tNext", e => { G.day.skillSkip = [...(G.day.skillSkip || []), e.currentTarget.dataset.id]; saveG(); render(); });
    on("tNot", e => { const it = CONTENT.find(x => x.id === e.currentTarget.dataset.id); if (it) setState(it, "later");
      G.day.skillSkip = [...(G.day.skillSkip || []), e.currentTarget.dataset.id]; saveG(); render(); });
    on("tSkills", () => openSkills());
  }

  function openSkills(){
    const act = SKILLS.filter(s => s.status === "active"), sug = SKILLS.filter(s => s.status === "suggested");
    const fresh = s => CONTENT.filter(it => it.skill === s.id && (it.state || "new") === "new").length;
    const row = s => `<button class="side" data-skill="${esc(s.id)}"><span class="pr">🎯</span><span class="nm"><b>${esc(s.name)}</b>
      ${s.focus ? `<small>Working on: ${esc(s.focus)}</small>` : ""}</span>${fresh(s) ? `<span class="xp">${fresh(s)} new</span>` : ""}</button>`;
    openSheet(`<h3>Skills</h3>
      ${!questKey() ? `<p>Pair this device in ⚙️ to see your skills.</p>` : ""}
      ${act.length ? `<div class="win-lb">Training</div><div class="side-list">${act.map(row).join("")}</div>`
        : questKey() ? `<p>A skill is something your days call for. Quest finds content for it and offers it when you have time.</p>` : ""}
      ${sug.length ? `<div class="win-lb">Suggested from your days</div>${sug.map(s => `<div class="sug">
        <div><b>${esc(s.name)}</b><small>${esc(s.focus)}</small>${s.from ? `<small style="color:var(--ink-faint)">From: ${esc(s.from)}</small>` : ""}</div>
        <div class="actions"><button class="btn primary" data-yes="${esc(s.id)}">Train this</button><button class="btn ghost" data-see="${esc(s.id)}">Look first</button><button class="btn ghost" data-no="${esc(s.id)}">Not now</button></div></div>`).join("")}` : ""}
      ${questKey() ? `<div class="win-lb">Add a skill</div>
      <input id="skName" placeholder="The skill, e.g. Filming dance" maxlength="60">
      <input id="skFocus" placeholder="What are you working on? (optional)" maxlength="140">
      <div class="actions"><button class="btn primary" id="skAdd">＋ Add</button></div>
      <p id="skMsg" style="font-size:12px">Quest looks for content on the next run (6 AM or 8 PM).</p>` : ""}
      <div class="actions"><button class="btn ghost" id="skClose">Close</button></div>`, true);
    $("skClose").onclick = closeSheet;
    $("sheet").querySelectorAll("[data-skill],[data-see]").forEach(b => b.onclick = () => openSkill(b.dataset.skill || b.dataset.see));
    const decide = (id, status) => { const s = skillOf(id); if (!s) return;
      s.status = status; s.editedAt = now().toISOString(); skillOp({ op:"set", id, status }).catch(() => {});
      log(status === "active" ? `Training: ${s.name}` : `Not now: ${s.name}`); saveG(); openSkills(); };
    $("sheet").querySelectorAll("[data-yes]").forEach(b => b.onclick = () => decide(b.dataset.yes, "active"));
    $("sheet").querySelectorAll("[data-no]").forEach(b => b.onclick = () => decide(b.dataset.no, "paused"));
    if ($("skAdd")) $("skAdd").onclick = async () => {
      const name = $("skName").value.trim(), focus = $("skFocus").value.trim();
      if (!name) { $("skName").focus(); return; }
      try {
        const r = await skillOp({ op:"add", name, focus });
        const s = r ? r.skill : { id:name.toLowerCase().replace(/[^a-z0-9]+/g, "-"), name, focus, status:"active" };
        SKILLS = SKILLS.filter(x => x.id !== s.id).concat(s);
        log(`Added the skill ${name}`); saveG(); openSkills();
      } catch (e) { $("skMsg").textContent = "Could not add it: " + e.message; }
    };
  }

  function openSkill(id, focus){
    const s = skillOf(id); if (!s) return openSkills();
    const items = CONTENT.filter(it => it.skill === id).sort((a, b) => ((a.state === "new") ? 0 : 1) - ((b.state === "new") ? 0 : 1));
    const stLabel = { watched:"watched", read:"read the line", later:"later", no:"not for me" };
    openSheet(`<div class="win-hd"><span style="font-size:30px">🎯</span><div><div class="tt">${esc(s.name)}</div>
        <div class="sb">${s.status === "active" ? "Training" : s.status === "suggested" ? "Suggested from your days" : "Paused"}${s.from ? ` · ${esc(s.from)}` : ""}</div></div></div>
      ${s.status !== "active" ? `<div class="actions"><button class="btn primary" id="sYes">Train this</button></div>` : ""}
      ${s.status === "active" ? practiceHtml(id, focus) : ""}
      ${CONTENT.some(it => it.skill === id && it.note) ? `<div class="win-lb">Lines you kept</div>${CONTENT.filter(it => it.skill === id && it.note).map(it => `<p class="pq-line">“${esc(it.note)}” <small>· ${esc(it.title)}</small></p>`).join("")}` : ""}
      <div class="win-lb">Working on</div>
      <textarea id="sFocus" class="cline" rows="2" maxlength="140" placeholder="What are you working on?">${esc(s.focus)}</textarea>
      <div class="win-lb">Content</div>
      ${items.length ? items.map(it => `<button class="wck" data-it="${esc(it.id)}"><span class="bx">${KIND_IC[it.kind] || "▶"}</span>
        <span><b>${esc(it.title)}</b> <small style="color:var(--ink-faint)">· ${it.mins} min${stLabel[it.state] ? ` · ${stLabel[it.state]}` : ""}</small>
        <br><small style="color:var(--ink-soft)">${esc(it.line)}</small></span></button>`).join("")
        : `<p>Nothing yet. ${s.research ? "Asked: it looks on the next run (6 AM or 8 PM)." : ""}</p>`}
      <div class="actions">${s.research ? "" : `<button class="btn" id="sFind">🔎 Find content for this</button>`}
        ${WIKI.includes(s.page) ? `<button class="btn" id="sWiki">📖 Wiki page</button>` : ""}</div>
      <div class="actions"><button class="btn ghost" id="sBack">All skills</button>${s.status === "active" ? `<button class="btn ghost" id="sPause">Pause this skill</button>` : ""}</div>`, true);
    const set = (patch, msg) => { Object.assign(s, patch, { editedAt:now().toISOString() }); skillOp({ op:"set", id, ...patch }).catch(() => {}); if (msg) { log(msg); saveG(); } };
    $("sFocus").onchange = e => set({ focus:e.target.value.trim() }, `${s.name}: working on ${e.target.value.trim()}`);
    if ($("sYes")) $("sYes").onclick = () => { set({ status:"active" }, `Training: ${s.name}`); openSkill(id); };
    if ($("sPause")) $("sPause").onclick = () => { set({ status:"paused" }, `Paused: ${s.name}`); openSkills(); };
    if ($("sFind")) $("sFind").onclick = () => { set({ research:true }, `Asked for content: ${s.name}`); openSkill(id); };
    if ($("sWiki")) $("sWiki").onclick = () => openWikiPage(s.page, () => openSkill(id));
    $("sBack").onclick = openSkills;
    if (s.status === "active" && planOf(id)) { wirePractice(id, () => openSkill(id)); if (focus === "check" && $("pqCheck")) $("pqCheck").scrollIntoView({ block:"center" }); }
    $("sheet").querySelectorAll("[data-it]").forEach(b => b.onclick = () => openContent(CONTENT.find(x => x.id === b.dataset.it), () => openSkill(id)));
  }

  /* the player: YouTube without YouTube (nocookie embed, inline, no autoplay). When it
     ends, the ideas card covers YouTube's end screen. */
  let ytReady = null;
  function loadYT(){
    if (ytReady) return ytReady;
    ytReady = new Promise(res => {
      if (window.YT && YT.Player) return res();
      window.onYouTubeIframeAPIReady = () => res();
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    });
    return ytReady;
  }
  function openContent(it, back){
    if (!it) return;
    const sk = skillOf(it.skill), vid = it.kind !== "article" && it.yt;
    const late = (() => { const t = now(), c = currentOf(blocks(), t); return c && isSadhana(c) ? "It's your sadhana time. It will be here after."
      : blocks().some(b => isSleep(b) && b.s > t && b.s - t < 3600000) ? "Bed is close. This keeps for tomorrow too." : ""; })();
    openSheet(`<div class="eyebrow">${esc(sk ? sk.name : it.skill)}${it.forTitle ? ` · for ${esc(it.forTitle)}` : ""}</div>
      <h3 style="margin-top:4px">${esc(it.title)}</h3>
      <p class="oneline">${esc(it.line)}</p>
      ${late ? `<p style="font-size:12px">${esc(late)}</p>` : ""}
      ${vid ? `<div class="player"><div id="ytBox"></div><div class="endcard" id="endCard" hidden></div></div>
        <div class="actions"><button class="btn" id="cSeen">✓ I watched it</button><button class="btn" id="cRead">Read the line only</button></div>`
        : `<div class="actions"><a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener" id="cOpen">${it.kind === "podcast" ? "🎧 Listen" : "📄 Read it"} · ${it.mins} min</a></div>`}
      <p style="font-size:12px;color:var(--ink-faint)">${esc(it.by || "")}${it.by ? " · " : ""}${it.mins} min${it.why ? ` · ${esc(it.why)}` : ""}</p>
      <div id="cIdeas"></div>
      <div class="actions"><button class="btn ghost" id="cNo">Not for me</button>
        <button class="btn ghost" id="cBack">${back ? "Back" : "Close"}</button></div>`, true);
    const drawIdeas = (done) => {
      $("cIdeas").innerHTML = `${it.ideas && it.ideas.length ? `<div class="win-lb">${done ? "Worth trying?" : "Ideas in it"}</div>${it.ideas.map((x, i) => `<div class="idea">
          <div><b>${esc(x.t)}</b> <small style="color:var(--ink-faint)">· ${x.mins} min</small>${x.why ? `<small>${esc(x.why)}</small>` : ""}</div>
          ${(it.scheduled || []).some(s => s.idea === x.t) ? `<small style="color:var(--good)">On the schedule ✓</small>`
            : `<button class="btn" data-idea="${i}">📅 Put it on the schedule</button>`}</div>`).join("")}` : ""}
        <input id="cLine" class="cline" maxlength="400" placeholder="Your line: what will you take from it? (optional)" value="${esc(it.note || "")}">`;
      $("cIdeas").querySelectorAll("[data-idea]").forEach(b => b.onclick = () => openScheduleIdea(it, it.ideas[+b.dataset.idea], () => openContent(it, back)));
      $("cLine").onchange = e => { const v = e.target.value.trim(); if (!v) return; it.note = v; contentOp(it, { line:v }); log(`Note on ${it.title}`); saveG(); };
    };
    drawIdeas(false);
    if (vid) loadYT().then(() => {
      if (!$("ytBox")) return;
      new YT.Player("ytBox", { host:"https://www.youtube-nocookie.com", videoId:it.yt, width:"100%", height:"100%",
        playerVars:{ playsinline:1, rel:0, modestbranding:1, autoplay:0, enablejsapi:1, origin:location.origin },
        events:{ onStateChange: e => {
          if (e.data === 1 && !it._started) { it._started = true; log(`Watching: ${it.title}`); saveG(); }
          if (e.data === 0) finished();
        } } });
    });

  /* an idea goes straight onto the schedule as a specific block (d135): first open
     window today that fits, else tomorrow's, through the calendar or today's ops */
  async function freeSlots(ymdStr, mins){
    const t = +now() + 5 * 60000;
    const list = ymdStr === gameYmd() ? blocks() : ((await getPlan(ymdStr).catch(() => null)) || { blocks:[] }).blocks
      .map(b => ({ ...b, s:new Date(b.s), e:new Date(b.e), kind:kindOf(b) }));
    return list.filter(b => b.kind === "open").map(b => ({ s:new Date(Math.ceil(Math.max(+b.s, t) / 300000) * 300000), e:b.e }))
      .filter(w => w.e - w.s >= mins * 60000 && +tzParts(w.s, { hour:"numeric", hourCycle:"h23" }).hour >= 7);
  }
  async function openScheduleIdea(it, idea, back){
    const tomorrow = tzYmd(new Date(+new Date(gameYmd() + "T12:00:00Z") + 86400000));
    let day = gameYmd(), dur = idea.mins;
    const draw = async () => {
      const slots = await freeSlots(day, dur), first = slots[0];
      const start = first ? first.s : new Date(Math.ceil((+now() + 15 * 60000) / 300000) * 300000);
      const today = day === gameYmd(), canWrite = questKey() && !DRY;
      openSheet(`<h3>Put it on the schedule</h3>
        <input id="iT" value="${esc("🎯 " + idea.t)}" maxlength="120">
        <div class="chips" style="grid-template-columns:1fr 1fr">${[[gameYmd(), "Today"], [tomorrow, "Tomorrow"]].map(([d, l]) =>
          `<button class="chip ${d === day ? "sel" : ""}" data-day="${d}" style="text-align:center">${l}</button>`).join("")}</div>
        <div class="row"><label>Start<input id="iS" type="time" value="${toField(start)}"></label>
          <label>Minutes<input id="iD" type="number" min="5" max="240" step="5" value="${dur}"></label></div>
        <p style="font-size:12px">${first ? `First open time that fits: ${fmtT(first.s)}.` : "No open time that fits. Pick a start."}
          ${slots.slice(1, 4).map(w => `<button class="ping-ask" data-at="${w.s.toISOString()}">${fmtT(w.s)}</button>`).join(" ")}</p>
        ${canWrite ? `<label class="check"><input id="iCal" type="checkbox" checked ${today ? "" : "disabled"}> Add it to Google Calendar (Junyan)</label>` : ""}
        ${DRY ? `<p style="color:var(--warn)">Test mode: nothing is added.</p>` : !questKey() ? `<p>Pair this device to add it to the calendar.</p>` : ""}
        <div class="actions"><button class="btn ghost" id="iBack">Back</button><button class="btn primary" id="iGo">Add it</button></div>`);
      $("sheet").querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = b.dataset.day; draw(); });
      $("sheet").querySelectorAll("[data-at]").forEach(b => b.onclick = () => { $("iS").value = toField(new Date(b.dataset.at)); });
      $("iD").onchange = e => { dur = Math.max(5, Math.min(240, +e.target.value || idea.mins)); };
      $("iBack").onclick = back;
      $("iGo").onclick = async () => {
        const title = $("iT").value.trim() || idea.t;
        const s = fromField($("iS").value, new Date(day + "T12:00:00Z")), e = new Date(+s + dur * 60000);
        const cal = !today || ($("iCal") && $("iCal").checked);
        if (DRY || (!today && !questKey())) { log(`Test: would schedule ${title} at ${fmtT(s)}`); return back(); }
        closeSheet();
        if (today) await (cal ? addBlockCal : addBlock)(title, s, e, false);
        else {   // another day: only the calendar can hold it (today's edit layer is today only)
          try { await qfetch("/cal/event", { method:"POST", body:JSON.stringify({ s:s.toISOString(), e:e.toISOString(), title }) }); }
          catch (err) { alert(`Could not add it to the calendar (${err.message}). Nothing was added.`); return back(); }
          log(`Added ${title} to the calendar: tomorrow ${fmtT(s)}`);
        }
        (it.scheduled = it.scheduled || []).push({ title, s:s.toISOString(), e:e.toISOString(), idea:idea.t });
        contentOp(it, { scheduled:{ title, s:s.toISOString(), e:e.toISOString(), idea:idea.t } });
        saveG(); back();
      };
    };
    draw();
  }

  /* ---------- pings while the page is open (devices without phone push) ---------- */
  const fired = new Set();
  function ping(id, title, body){
    if (fired.has(id)) return; fired.add(id);
    if (navigator.vibrate) navigator.vibrate([60,80,60]);
    if (store.get("quest-push")) return;   // the server pings this device instead

  function pings(all, t){
    all.forEach(b => {
      if (!needsCheck(b)) return;
      const toStart = (b.s - t) / 60000, toEnd = (b.e - t) / 60000;
      if (toStart <= 5 && toStart > 4) ping("pre|" + b.key, `In 5 min: ${b.t}`, `Starts ${fmtT(b.s)}. Wrap up what you're on.`);
      if (toStart <= 0 && toStart > -1) ping("go|" + b.key, `Now: ${shortName(b)}`, `Until ${fmtT(b.e)}.`);

  /* ---------- render ----------
     Markup is only replaced when it changes, so a tap is never lost to a
     rebuild mid-press. Seconds live in data-until / data-since spans that
     tick() fills in place. */
  function put(id, html){ const el = $(id); if (el._h !== html) { el._h = html; el.innerHTML = html; } }
  function tick(){
    const t = now();
    document.querySelectorAll("[data-until]").forEach(el => el.textContent = fmtLeft((new Date(el.dataset.until) - t) / 1000));
    document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmtAgo((t - new Date(el.dataset.since)) / 1000));
    document.querySelectorAll("[data-ring-s]").forEach(el => {
      const s = new Date(el.dataset.ringS), e = new Date(el.dataset.ringE), C = 2 * Math.PI * 30;
      const frac = Math.max(0, Math.min(1, (e - t) / (e - s)));
      el.style.strokeDashoffset = C * (1 - frac);
    });
  }

  /* ---------- the mountain (Trail, chosen 2026-10-05) ----------
     One stop per calendar block. Runs of Open space and Rest fold into one
     "Free time" stop. Anchors (sleep, practice, body, fuel) are campfires that
     light on check-in. A side quest in progress is a dragon on its stop; a
     finished one leaves a flag. A storm cloud follows you while you are away. */
  function stopsOf(all){
    const out = [];
    for (const b of all) {
      const free = b.kind === "open" || b.kind === "break";
      const last = out[out.length - 1];
      if (free && last && last.free && b.s - last.e <= 15 * 60000) { last.e = new Date(Math.max(last.e, b.e)); last.blocks.push(b); continue; }
      if (b.kind === "break") continue;
      out.push({ free, s:b.s, e:b.e, t: free ? "Your move" : shortName(b), kind:b.kind, blocks:[b] });
    }
    for (const st of out) {
      const ch = st.blocks.map(b => G.day.checks[gk(b)]).filter(Boolean);
      st.anchor = !st.free && isHealth(st.blocks[0]);
      st.lit = ch.some(c => c === "in" || c === "late");
      st.skipped = ch.length > 0 && ch.every(c => c === "skip");
      st.flags = (G.day.sideDone || []).filter(k => st.blocks.some(b => gk(b) === k)).length;
    }
    return out;
  }
  function mountainSVG(stops, cur, t, zap){
    if (!stops.length) return `<div class="empty">No blocks today.</div>`;
    const n = stops.length, W = 340, ROW = 56, H = 96 + n * ROW;
    const P = stops.map((_, i) => ({ x: Math.round(170 + 92 * Math.sin(i * 1.15 + 0.5)), y: H - 58 - i * ROW }));
    const START = { x:170, y:H - 10 }, SUMMIT = { x:170, y:30 };
    const ALL = [START, ...P, SUMMIT];
    let curI = stops.findIndex(st => cur && st.blocks.some(b => b.key === cur.key));
    const passed = stops.reduce((a, st, i) => st.e <= t ? i : a, -1);
    const here = curI >= 0 ? curI : passed;              // between stops: wait at the last one passed
    const tp = here < 0 ? START : here >= n ? SUMMIT : P[here];
    let out = `<svg class="mtn-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Today's trail, ${n} stops">`;
    out += `<polygon class="m2" points="-20,${H} 60,${H * .38} 170,${H}"/><polygon class="m2" points="160,${H} 290,${H * .3} 380,${H}"/>`;
    out += `<polygon class="m1" points="0,${H} 170,8 340,${H}"/>`;
    for (let k = 0; k < 20; k++) { const sx = (k * 97) % 340, sy = (k * 53) % 150 + 6; if (Math.abs(sx - 170) < (sy + 10) * .5) continue;
      out += `<circle class="star" cx="${sx}" cy="${sy}" r="${k % 3 ? .9 : 1.4}" style="animation-delay:${(k % 7) * .4}s"/>`; }
    for (let k = 1; k < ALL.length; k++) {
      const p0 = ALL[Math.max(k - 2, 0)], p1 = ALL[k - 1], p2 = ALL[k], p3 = ALL[Math.min(k + 1, ALL.length - 1)];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6, c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      out += `<path class="seg${k - 1 <= here ? " walked" : ""}" d="M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}"/>`;
    }
    out += `<text class="tm" x="${START.x}" y="${START.y + 2}" text-anchor="middle">MORNING</text>`;
    out += `<text class="emo" x="${SUMMIT.x + 12}" y="${SUMMIT.y + 8}">⛺</text><text class="tm" x="${SUMMIT.x - 10}" y="${SUMMIT.y + 4}" text-anchor="end">${esc(peakName().toUpperCase())}</text>`;
    stops.forEach((st, i) => {
      const p = P[i], left = p.x >= 170, ax = left ? -24 : 24, anc = left ? "end" : "start";
      const isCur = i === curI, past = st.e <= t && !isCur;
      out += `<g class="stopg${past ? " past" : ""}" data-stop="${i}" transform="translate(${p.x},${p.y})">`;
      out += `<circle class="hit" r="24"/>`;
      // the symbol in its colour ring; anchors carry a small campfire that lights on check-in
      const b0 = st.blocks[0], g = GROUPS[st.free ? "calm" : groupOf(b0)], r = st.free ? 10 : 13, done = st.lit || (past && st.free);
      out += `<g class="sym${done ? " done" : ""}${st.skipped ? " skip" : ""}"><circle r="${r}" fill="${done ? g.ring : g.fill}" stroke="${g.ring}" stroke-width="2"/>` +
        `<path d="${SYM[st.free ? "compass" : symOf(b0)] || SYM["map-pin"]}" transform="translate(${-r * .62},${-r * .62}) scale(${r * .052})" fill="none" stroke="${done ? g.fill : g.ring}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>`;
      if (st.anchor) out += `<g class="fire${st.lit ? " lit" : ""}" transform="translate(${left ? 13 : -13},-12) scale(.55)"><circle class="glow" r="14"/>` +
        `<path class="flame" d="M0,6 C-9,1 -7,-8 0,-17 C1,-10 8,-8 7,-1 C6,4 3,6 0,6Z"/><path class="flame2" d="M0,5 C-4,2 -3,-3 0,-8 C1,-4 4,-3 3,1 C3,4 1,5 0,5Z"/></g>`;
      if (isCur) out += `<circle class="ringm" r="${r + 4}"/>`;
      const name = st.t.length > 24 ? st.t.slice(0, 23) + "…" : st.t;
      out += `<text class="tm" x="${ax}" y="-3" text-anchor="${anc}">${fmtT(st.s)}</text>`;
      out += `<text class="nm${st.skipped ? " gone" : ""}" x="${ax}" y="11" text-anchor="${anc}">${esc(name)}</text>`;
      const flags = (isCur && st.free && G.day.side ? "🐉" : "") + "🚩".repeat(Math.min(st.flags, 3));
      if (flags) out += `<text class="emo sm" x="${left ? 16 : -16}" y="-12" text-anchor="middle">${flags}</text>`;
      out += `</g>`;
    });
    out += `<g class="trav" transform="translate(${tp.x},${tp.y})"><circle class="halo" r="16"/><circle class="me" r="7"/>`;
    if (zap) out += `<g class="cloud" transform="translate(0,-40)"><ellipse cx="-9" cy="0" rx="11" ry="8"/><ellipse cx="6" cy="-4" rx="13" ry="10"/><ellipse cx="15" cy="2" rx="9" ry="7"/><ellipse cx="2" cy="4" rx="15" ry="6"/>` +
      [-10, -2, 6, 14].map((x, k) => `<line class="rain" x1="${x}" y1="12" x2="${x - 2}" y2="17" style="animation-delay:${k * .17}s"/>`).join("") +
      `<path class="bolt" d="M3,8 L-2,17 L2,17 L-1,24 L7,13 L3,13 L6,8Z"/></g>`;
    out += `</g></svg>`;
    return out;
  }
  // Days saved before Altitude (2026-10-05) lack its fields; the season starts at 0 m
  function ensureDay(){
    const d = G.day;
    d.caches = d.caches || {}; d.missed = d.missed || {};
    G.pr = G.pr || { level:1, ends:[], changedAt:null };
    if (d.prana == null) { d.prana = 0; d.pranaSince = now().toISOString(); d.pl = [[now().toISOString(), 0]]; }
    d.habits = d.habits || {};
    if (d.body == null) { d.body = 60; d.bl = [[now().toISOString(), 60]]; }
    if (!d.pranaSince) d.pranaSince = d.since || now().toISOString();
    if (G.mode !== "prana") { G.mode = "prana"; delete G.summits; delete G.ropes; delete G.souvenirs; }
  }
  function skyNow(t){
    const p = tzParts(t, { hour:"numeric", minute:"numeric", hourCycle:"h23" }), h = +p.hour + +p.minute / 60;
    const phase = h >= 5 && h < 7.5 ? "dawn" : h >= 7.5 && h < 17 ? "day" : h >= 17 && h < 19.5 ? "dusk" : "night";
    const desert = /^Africa\/(Cairo|Khartoum|Tripoli|Algiers)|^Asia\/(Dubai|Riyadh|Muscat|Qatar)/.test(TZ()) || /desert|sahara|aswan|luxor|hurghada|giza|stell?a|siwa|dahab/i.test(placeNow());
    const cls = `sky-${phase}${desert ? " desert" : ""}`;
    if (document.documentElement.className !== cls) document.documentElement.className = cls;
    const sky = $("sky");
    if (sky && !sky.dataset.stars) { sky.dataset.stars = 1;
      sky.querySelector(".sky-stars").innerHTML = Array.from({ length:70 }, (_, i) => `<i style="left:${(i * 53.7) % 100}%;top:${(i * 31.3) % 100}%;opacity:${.3 + (i % 5) * .15};animation-delay:${(i % 7) * .6}s"></i>`).join(""); }
    // the sun or moon arcs across the sky through its part of the day
    const f = phase === "night" ? ((h >= 19.5 ? h - 19.5 : h + 4.5) / 9.5) : (h - 5) / 14.5;
    if (sky) { sky.style.setProperty("--orbx", (.12 + .76 * Math.min(1, Math.max(0, f))).toFixed(3)); sky.style.setProperty("--orby", (.42 - .32 * Math.sin(Math.PI * Math.min(1, Math.max(0, f)))).toFixed(3)); }
  }
  /* the Prana and Body stage: built once, then only its numbers and pose change */
  const PRANA_WORD = p => p < 10 ? "Build it with sadhana" : p < 35 ? "Stirring" : p < 60 ? "Rising" : p < 85 ? "Bright" : "Radiant";
  const BODY_WORD = b => b < 25 ? "Rest restores it" : b < 50 ? "Tired" : b < 75 ? "Steady" : "Fresh";
  let beingKey = "";
  // poses Junyan makes later (d210): add the name here once sprites/<name>.webp and <name>-glow.webp exist
  const POSES = new Set([]);   // "lie" (sleep), "walk" (hikes and tours), "eat" (meals)
  function drawBeing(P, B){

          <div class="bg-lab"><div class="bg-k">Prana</div><div class="bg-n" id="bgP"></div><span class="bg-h" id="bgPh"></span></div></div>

          <div class="bg-lab"><div class="bg-k">Body</div><div class="bg-n" id="bgB"></div><span class="bg-h" id="bgBh"></span></div></div></div>`;

    }

    if (streak() >= 7 && !(G.unlocks || {}).robe) { (G.unlocks = G.unlocks || {}).robe = gameYmd(); G.outfit = "robe"; saveG();
      setTimeout(() => banner("✨", "ROBE UNLOCKED", "Seven days at 70% or more. The purple robe is yours."), 600); }
    const outfit = (G.unlocks || {}).robe && G.outfit !== "plain" ? "robe" : "stand";
    // d210: a pose for what he is doing now, once his sprites for it exist (POSES)
    const cur = currentOf(blocks(), now()), act = cur ? (isSleep(cur) ? "lie" : isMeal(cur) ? "eat" : /hike|walk|trek|climb|tour/i.test(cur.t) ? "walk" : "") : "";
    const bodyImg = POSES.has(act) ? act : outfit;
    const k = P + "|" + B + "|" + bodyImg; if (k === beingKey) return; beingKey = k;
    const st = el.firstChild;

      st.querySelector(".bg-fill").style.setProperty("--mask", `url(sprites/${bodyImg}.webp)`); }
    st.style.setProperty("--p", (P / 100).toFixed(2)); st.style.setProperty("--b", (B / 100).toFixed(2));
    document.documentElement.style.setProperty("--p", (P / 100).toFixed(2));
    $("bgP").textContent = `${P}%`; $("bgB").textContent = `${B}%`;
    $("bgPh").textContent = PRANA_WORD(P); $("bgBh").textContent = BODY_WORD(B);
    const pose = P >= 60 ? "palms" : "seat";
    if (!$("bgSeat").src.endsWith(`${pose}.webp`)) { $("bgSeat").src = `sprites/${pose}.webp`; st.querySelector(".bg-prana .bg-glow").src = `sprites/${pose}-glow.webp`; }
    // motes of light rise around the meditator, more as prana builds

    if (mo.children.length !== n) mo.innerHTML = Array.from({ length:n }, (_, i) => `<i style="left:${12 + (i * 37) % 32}%;animation-duration:${4 + (i % 4)}s;animation-delay:${(i * .9) % 5}s"></i>`).join("");

  function render(){
    if (PLAN && G.day.date !== dayKey()) rollDay();
    ensureDay();
    const t = now(), all = blocks();
    const cur = currentOf(all, t), nxt = nextOf(all, t);

    // HUD
    const P = Math.round(prana());
    $("peakName").textContent = `Prana · Lv ${lvl()}`;
    $("altTxt").textContent = `${P}%`;
    $("xpBar").style.width = `${P}%`;
    $("xpBar").className = P < 40 ? "low" : P < 70 ? "mid" : "";
    drawBeing(P, Math.round(body()));
    const Bd = Math.round(body());
    $("bodyTxt").textContent = `${Bd}%`; $("bodyBar").style.width = `${Bd}%`;
    // today's three pillars: sadhana, body, on time
    const did = b => ["in","late"].includes(G.day.checks[gk(b)]);
    const sad = all.filter(isSadhana), bod = all.filter(b => isGym(b) || b.kind === "body"), timed = all.filter(b => needsCheck(b) && b.kind !== "open" && b.s <= t);
    $("o2Txt").innerHTML = `<span class="${sad.some(did) ? "ok" : ""}">Sadhana ${sad.some(did) ? "✓" : sad.length ? "·" : "none planned"}</span>` +
      `<span class="${bod.some(did) ? "ok" : ""}">Training ${bod.some(did) ? "✓" : "·"}</span>`;
    const sk = streak();
    $("comboN").textContent = sk || "·";
    $("comboL").textContent = "days 70+";
    $("combo").classList.toggle("hot", P >= 70);
    const where = PLAN && PLAN.where && PLAN.where.place;
    $("statusL").innerHTML = pullErr ? `<span class="dry">Offline: ${esc(pullErr)}</span>`
      : PLAN ? `<span class="place">📍 ${esc(where || "Home")}</span> ${fmtT(t)} local` : "Loading your day…";
    $("statusR").innerHTML = [DRY ? `<a class="dry" href="${location.pathname}">Test mode: nothing is saved. Tap for the real game</a>` : "", AT ? `<span class="dry">clock ${fmtT(t)}</span>` : ""].filter(Boolean).join(" · ");

    // mode
    const z = G.day.zap;
    // the sky follows the hour where he is (d208), with dunes in a desert place
    skyNow(t);

    // d148 (2026-10-09): no check-ins. A block on the calendar counts as happening from its start;
    // Change course is how the day changes. Effort is counted when a block ends.
    const since = new Date(G.day.pranaSince || G.day.since);
    autoStart(all.filter(b => needsCheck(b) && b.s <= t && (b.e > since || blockHabits(b).length) && !G.day.checks[gk(b)]));
    all.filter(b => b.e <= t && ["in", "late"].includes(G.day.checks[gk(b)]) && !(G.day.spent || {})[gk(b)]).forEach(spend);
    all.filter(b => b.e <= t && ["in", "late"].includes(G.day.checks[gk(b)]) && (G.day.spent || {})[gk(b)]).forEach(respend);
    // coming up: the next real thing, with its prep, so he is ready before it starts
    const soon = z ? null : all.find(b => b.s > t && needsCheck(b) && !isMeal(b) && !isSleep(b) && !isSadhana(b)
      && b.s - t < (INSIGHTS[gk(b)] ? 3 : 1.5) * 3600000);
    put("loose", soon ? soonHtml(soon, t) : "");
    if (soon) { bindDetail($("loose"), () => { $("loose")._h = ""; render(); });
      $("loose").querySelectorAll("[data-soonfull]").forEach(bn => bn.onclick = () => openStop(soon)); }

    // d82: the morning brief, until he taps "Got it"; d77: a Shambhavi slot when none is planned
    const slot = PLAN && !z ? sadhanaSlot(all) : null;
    const hourNow = +tzParts(t, { hour:"numeric", hourCycle:"h23" }).hour;
    const ahead = all.filter(b => b.e > t && b.kind !== "open" && b.kind !== "break");
    let bh = "";
    // the morning (2026-10-09): one button that opens a full-screen morning. Shambhavi is offered in
    // Prana actions only (Junyan: "drop the add shambhavi altogether").
    if (PLAN && !z && !G.day.briefDone && hourNow >= 4 && hourNow < 13) {
      const n = all.filter(b => b.e > t && !["open", "break"].includes(b.kind) && !isSleep(b) && !isMeal(b) && !isSadhana(b)).length;
      bh = `<button class="mo-open" id="bMorning"><span class="mo-open-art">${moHills(90)}</span>
        <span class="mo-open-t"><b>☀️ Open your morning</b><small>${esc(placeNow())}${n ? ` · ${n} moment${n > 1 ? "s" : ""} today` : ""}</small></span><span class="pa-go">›</span></button>`;
    }
    // "Running low" card dropped (Junyan, 2026-10-09: "cute but it's not necessary")
    // no Oura yet: ask how long he slept, once each morning
    if (PLAN && !z && !G.day.slept && hourNow >= 4 && hourNow < 13) bh = `<div class="card brief"><div class="eyebrow">Good morning</div>
      <div class="q">How long did you sleep? Sleep sets your body for the day.</div>
      <div class="actions" style="flex-wrap:wrap">${[5, 6, 7, 8, 9].map(h => `<button class="btn" data-slept="${h}">${h} h</button>`).join("")}</div></div>` + bh;
    put("brief", bh);
    $("brief").querySelectorAll("[data-slept]").forEach(bn => bn.onclick = () => refillSleep(+bn.dataset.slept * 10, `Slept ${bn.dataset.slept} h`));
    // auto habits for tonight (paid next morning): last meal 3 hr before bed, bed on time
    const slp = all.find(isSleep);
    if (slp && t >= slp.s) {
      const was = G.day.earn || {}, e2 = { ...was };
      if (lastMealBefore(slp.s, all) && emptyStomach(slp.s, all)) e2.early = 1; else delete e2.early;
      if (lastMealBefore(slp.s, all) && !emptyStomach(slp.s, all)) e2.late = 1; else delete e2.late;   // d203
      if (e2.late && !G.day.lateHit) { G.day.lateHit = true; addPrana(-5, "Ate within 3 hours of bed", "late food", false, { k:"late:" + G.day.date }); }
      if (JSON.stringify(e2) !== JSON.stringify(was)) { G.day.earn = e2; saveG(); }
    }
    // phone and desktop alike: the steps card, three picks for right now, then the full list one tap away (2026-10-09)
    const endAt = lastItemEnd(all), nightNow = PLAN && endAt && +t >= endAt;
    if (nightNow && !G.day.nightShown && !$("sheet").classList.contains("open") && !$("calx") && !$("night")) { G.day.nightShown = true; saveG(); openNight(); }
    put("habits", PLAN ? (nightNow ? `<button class="pa-all nt-open" data-night>🌙 Day's end<span>tomorrow, deathbed, reflection ›</span></button>` : "") + stepsHTML() + suggestHTML() : ""); bindHabits($("habits"));
    $("habits").querySelectorAll("[data-night]").forEach(bn => bn.onclick = openNight);
    if (PLAN && !z && body() < 40 && !G.day.lotusGiven) { G.day.lotusGiven = true; giveItem("lotus", "Your energy is low today."); }
    if ($("bMorning")) $("bMorning").onclick = () => openMorning();
    // a ?morning=1 link opens the morning straight away, any time of day
    if ((qs.get("morning") || qs.get("brief")) && PLAN && !openMorning.auto) { openMorning.auto = true; setTimeout(() => openMorning(), 600); }

    // main card
    let html = "";
    if (!PLAN) html = `<div class="card empty">Reading your calendars…</div>`;
    else if (z) {
      html = `<div class="card"><div class="eyebrow">⚡ Side-tracked</div>
        <div class="quest-title"><span class="em">${(ZAPS.find(x => x[1] === z.type) || ["✨"])[0]}</span><span>${esc(z.type)}</span></div>
        ${z.note ? `<div class="quest-time">${esc(z.note)}</div>` : ""}
        <div class="count"><div><div class="big" data-since="${z.s}"></div><div class="sub">away from ${cur ? esc(cur.t) : "the plan"}</div></div></div></div>`;
    } else if (!cur) {
      const done = all.filter(b => b.e <= t && needsCheck(b));
      const health = done.filter(isHealth);
      if (!nxt) {
        const P2 = Math.round(prana()), sk2 = streak();
        html = `<div class="card"><div class="eyebrow">Day card · ${esc(placeNow())}</div>
          <div class="quest-title"><span class="em">${P2 >= 70 ? "🌕" : P2 >= 40 ? "🌗" : "🌑"}</span><span>Your day so far</span></div>
          ${pranaLine()}
          <div class="summary"><div><b>${all.filter(isSadhana).some(b => ["in","late"].includes(G.day.checks[gk(b)])) ? "✓" : "·"}</b><span>sadhana</span></div>
          <div><b>${health.filter(b => ["in","late"].includes(G.day.checks[gk(b)])).length}/${health.length}</b><span>fires lit</span></div>
          <div><b>${sk2}</b><span>days at 70+</span></div></div>
          <div class="quest-time" style="margin-top:8px">${P2 >= 70 ? "A 70+ day. The streak grows." : `Finish at 70% or more to grow the streak.`}</div></div>`;
      } else {
        html = `<div class="card"><div class="eyebrow">Between quests</div>
          <div class="quest-title">${badge(nxt)}<span>${esc(shortName(nxt))}</span></div>
          <div class="quest-time">Starts ${fmtT(nxt.s)} · in <span data-until="${nxt.s.toISOString()}"></span></div></div>`;
      }
    } else {
      const K = KINDS[cur.kind], st = G.day.checks[gk(cur)];
      const C = 2 * Math.PI * 30;
      html = `<div class="card"><div class="eyebrow">${cur.kind === "open" ? "Your move" : "Main quest"}
          ${cur.kind === "open" || !GROUPS[groupOf(cur)].name ? "" : `<span class="tag" style="color:${GROUPS[groupOf(cur)].ring}">${GROUPS[groupOf(cur)].name}</span>`}${energyTag(cur) ? `<span class="tag" style="text-transform:none">${energyTag(cur)}</span>` : ""}${isHealth(cur) ? `<span class="tag x2">🔥 campfire</span>` : ""}</div>
        <div class="quest-title">${badge(cur, 34, st && st !== "skip")}<span>${esc(shortName(cur))}</span></div>
        <div class="quest-time">${fmtT(cur.s)} to ${fmtT(cur.e)}${shortName(cur) !== cur.t && cur.kind !== "open" ? ` · ${esc(cur.t)}` : ""}</div>
        ${mealWarn(cur, all) ? `<div class="warnline">${esc(mealWarn(cur, all))}</div>` : ""}
        <div class="count"><svg class="ring" viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="30"/>
          <circle class="fg" cx="37" cy="37" r="30" stroke-dasharray="${C}" data-ring-s="${cur.s.toISOString()}" data-ring-e="${cur.e.toISOString()}"/></svg>
          <div><div class="big" data-until="${cur.e.toISOString()}"></div><div class="sub">left in this block</div></div></div>`;
      if (isGym(cur)) html += `<div class="actions"><button class="btn primary" id="bGym">🏋️ Open the gym log</button></div>`;
      if (cur.kind === "open") {
        // "There's no such thing as free time" (Junyan, 2026-10-06): recover, catch up, or work
        const sd = G.day.side, P0 = prana();
        const catchUp = all.filter(b => (isSadhana(b) || isGym(b) || b.kind === "body") && b.e <= t
          && !["in", "late"].includes(G.day.checks[gk(b)])).slice(-2);
        const rec = P0 < 60 ? RECOVER : RECOVER.slice(0, 1);
        if (sd) html += `<div class="active-side"><div class="k">Working on</div><div class="nm">${esc(sd.task)}</div>
          <div class="actions"><button class="btn primary" id="sDone">Complete</button><button class="btn ghost" id="sDrop">Put down</button></div></div>`;
        else {
          html += `<div class="quest-time" style="margin-top:10px">Choose what's next. Prana ${Math.round(P0)}%.</div>`;
          if (catchUp.length) html += `<div class="eyebrow" style="margin-top:14px">Catch up</div><div class="side-list">${catchUp.map(b =>
            `<button class="side" data-now="${esc(shortName(b))}|${Math.min(60, Math.round((b.e - b.s) / 60000))}"><span class="pr">${badge(b, 26)}</span><span class="nm">${esc(shortName(b))} now</span><span class="xp">${Math.min(60, Math.round((b.e - b.s) / 60000))} min</span></button>`).join("")}</div>`;
          html += `<div class="eyebrow" style="margin-top:14px">Recover${P0 < 60 ? " (you're running low)" : ""}</div><div class="side-list">${rec.map(([n, m]) =>
            `<button class="side" data-now="${n}|${m}"><span class="pr">🪷</span><span class="nm">${n}</span><span class="xp">${m} min</span></button>`).join("")}</div>`;
          if (TASKS.length) html += `<div class="eyebrow" style="margin-top:14px">Work</div><div class="side-list">
            ${sideChoices().map(x => `<button class="side" data-side="${x.id}"><span class="pr">${urgent(x) ? "⏰" : (x.priority||"").split(" ")[0] || "▫️"}</span>
            <span class="nm">${esc(x.task)}${x.estimate ? ` <span style="color:var(--ink-faint)">· ${esc(x.estimate)}</span>` : ""}</span></button>`).join("")}</div>`;
          html += trainHtml(cur, t);
        }
      }
      html += `</div>`;
    }
    put("main", html);
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    on("sDone", finishSide); on("sDrop", dropSide);
    wireTrain();
    put("skillsRow", skillsRowHtml());
    $("skillsRow").querySelectorAll("[data-sk]").forEach(b => b.onclick = () => b.dataset.sk ? openSkill(b.dataset.sk) : openSkills());
    $("skillsRow").querySelectorAll("[data-sknext]").forEach(b => b.onclick = () => doNext(b.dataset.sknext));
    practiceDay();
    on("bGym", () => openGym(cur));
    $("main").querySelectorAll("[data-side]").forEach(bn => bn.onclick = () => takeSide(bn.dataset.side));
    $("main").querySelectorAll("[data-now]").forEach(bn => bn.onclick = () => { const [n, m] = bn.dataset.now.split("|"); startNow(n, +m); });
    const qt = $("main").querySelector(".quest-title"), tb = cur || nxt;
    if (qt && tb && !z && tb.kind !== "open") qt.onclick = () => openStop(tb);

    put("nextLine", cur && nxt && !z ? `<div class="next"><span>Next: <b>${esc(shortName(nxt))}</b></span><span>${fmtT(nxt.s)}</span></div>` : "");

    // zap button
    // the big button opens the calendar to change the day right there (Junyan, 2026-10-08, d163)
    $("zap").textContent = z ? "↩︎ Back to the quest" : "🧭 Change course";
    $("zap").classList.toggle("back", !!z);
    $("zap").onclick = z ? endZap : openCal;

    // the mountain: today's stops, climbing from the morning to camp
    const stops = stopsOf(all);
    put("mtn", mountainSVG(stops, cur, t, z));
    $("mtn").querySelectorAll("[data-stop]").forEach(n => n.onclick = () => {
      const st = stops[+n.dataset.stop]; if (!st) return;
      const fixed = st.blocks.find(b => b.kind !== "open" && b.kind !== "break");
      if (fixed && isGym(fixed) && fixed.s - now() < 3 * 3600000) return openGym(blocks().find(x => x.key === fixed.key) || fixed);
      if (fixed) openStop(blocks().find(x => x.key === fixed.key) || fixed); else openAdd(st.s);
    });
    $("addBtn").onclick = () => openAdd();
    const fires = stops.filter(st => st.anchor);
    $("trailMeta").textContent = `${fires.filter(st => st.lit).length} / ${fires.length} fires lit`;

    // log
    $("dayXp").textContent = `prana ${Math.round(prana())}% · body ${Math.round(body())}%`;
    put("log", G.day.log.length ? G.day.log.map(e =>
      `<div><span>${fmtT(new Date(e.at))}</span><span>${esc(e.msg)}</span>${e.xp ? `<span class="xp${e.xp < 0 ? " neg" : ""}">${e.xp > 0 ? "+" : "−"}${Math.abs(e.xp)}</span>` : ""}</div>`).join("")
      : `<div><span></span><span>Nothing yet. Check in to your first quest.</span></div>`);
    $("gear").classList.toggle("warn", !questKey() || !!syncErr);
    pings(all, t);
    tick();
  }

  /* tick every second; render() only touches the DOM when markup changed */
  setInterval(() => { tick(); if (!$("sheet").classList.contains("open")) render(); }, 1000);
  setInterval(pullAll, 2 * 60 * 1000);
  /* A Home Screen app wakes with the page it had in memory, sometimes from
     before the last update, so the phone and the Mac ran different versions
     (2026-10-08). On wake: send any unsaved change, reload if GitHub Pages has
     a newer page, then pull. */
  async function checkFresh(){
    if ($("sheet").classList.contains("open")) return false;
    try {
      const r = await fetch(location.pathname, { method:"HEAD", cache:"no-store" });
      const lm = Date.parse(r.headers.get("last-modified") || ""), mine = Date.parse(document.lastModified);
      if (!(lm - mine > 5000) || sessionStorage.getItem("quest-reloaded") === String(lm)) return false;
      sessionStorage.setItem("quest-reloaded", String(lm));
      if (syncTimer) await pushG();
      location.reload();
      return true;
    } catch { return false; }
  }
  let lastWake = 0;
  async function wake(){
    if (Date.now() - lastWake < 5000) return;
    lastWake = Date.now();
    if (!(await checkFresh())) pullAll();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden) { if (syncTimer) pushG(true); } else wake(); });
  addEventListener("pageshow", e => { if (e.persisted) wake(); });
  addEventListener("focus", wake);
  addEventListener("pagehide", () => { if (syncTimer) pushG(true); });
  checkFresh();
  pullAll();
})();
</script>
