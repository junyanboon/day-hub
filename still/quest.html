        html = `<div class="card"><div class="eyebrow">Summit card · ${esc(peakName())}</div>
          <div class="quest-title"><span class="em">${G.day.summited ? "🏔️" : "⛺"}</span><span>You reached ${fmtM(G.day.xp)} of ${fmtM(SUMMIT_H)}</span></div>
          <div class="summary"><div><b>${health.filter(b => ["in","late"].includes(G.day.checks[gk(b)])).length}/${health.length}</b><span>fires lit</span></div>
          <div><b>${G.day.zaps.filter(x => x.mins <= 10).length}</b><span>quick comebacks</span></div>
          <div><b>${Object.values(G.day.caches || {}).filter(c => c.state === "found").length}</b><span>caches found</span></div></div>
          <div class="eyebrow" style="margin-top:14px">Season peaks</div>
          <div class="season">${season.map(([d, x]) => `<div><span>${esc(x.place)}</span><span>${esc(x.peak)}</span><b>${fmtM(x.alt)}${x.h ? ` / ${fmtM(x.h)}` : ""}</b></div>`).join("")}</div>
          <div class="quest-time" style="margin-top:8px">Season total ${fmtM(G.xp)}. Nothing is ever taken off.</div></div>`;
      } else {
        html = `<div class="card"><div class="eyebrow">Between quests</div>
          <div class="quest-title"><span class="em">${KINDS[nxt.kind].em}</span><span>${esc(nxt.t)}</span></div>
          <div class="quest-time">Starts ${fmtT(nxt.s)} · in <span data-until="${nxt.s.toISOString()}"></span></div></div>`;
      }
    } else {
      const K = KINDS[cur.kind], st = G.day.checks[gk(cur)];
      const C = 2 * Math.PI * 30;
      html = `<div class="card"><div class="eyebrow">${cur.kind === "open" ? "Open space" : "Main quest"}
          ${cur.kind === "open" ? "" : `<span class="tag">${K.name}</span>`}<span class="tag" style="text-transform:none">▲ ${climbOf(cur)} m</span>${isHealth(cur) ? `<span class="tag x2">🔥 campfire</span>` : ""}</div>
        <div class="quest-title"><span class="em">${K.em}</span><span>${esc(cur.t)}</span></div>
        <div class="quest-time">${fmtT(cur.s)} to ${fmtT(cur.e)}</div>
        <div class="count"><svg class="ring" viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="30"/>
          <circle class="fg" cx="37" cy="37" r="30" stroke-dasharray="${C}" data-ring-s="${cur.s.toISOString()}" data-ring-e="${cur.e.toISOString()}"/></svg>
          <div><div class="big" data-until="${cur.e.toISOString()}"></div><div class="sub">left in this block</div></div></div>`;
      if (needsCheck(cur) && !st) {
        const lateBy = Math.floor((t - cur.s) / 60000);
        html += `<div class="actions"><button class="btn primary" id="bIn">${startLabel(cur)}</button>
          <button class="btn ghost" id="bSkip">Not today</button></div>
          <div class="quest-time" style="margin-top:8px">${lateBy <= ON_TIME_MIN ? `Tap when you actually start. Full points for the next ${ON_TIME_MIN - lateBy} min.` : `Tap when you start. It began ${lateBy} min ago, still worth half.`}</div>`;
      } else if (st && st !== "skip") {
        html += `<div class="actions"><button class="btn" id="bMore">Need more time</button>
          <button class="btn primary" id="bDone">Done early</button></div>`;
      }
      if (isGym(cur)) html += `<div class="actions"><button class="btn primary" id="bGym">🏋️ Open the gym log</button></div>`;
      if (cur.kind === "open" && !st && G.day.camps > 0) html += `<div class="actions"><button class="btn" id="bRest">⛺ Rest here (${G.day.camps} base camp${G.day.camps > 1 ? "s" : ""}): keep +${climbOf(cur)} m</button></div>`;
      if (st === "in" || st === "late") html += cacheCard(cur);
      if (cur.kind === "open" && st && st !== "skip") {
        const s = G.day.side;
        if (s) html += `<div class="active-side"><div class="k">Side quest · +${sideXp(s)} m</div><div class="nm">${esc(s.task)}</div>
          <div class="actions"><button class="btn primary" id="sDone">Complete</button><button class="btn ghost" id="sDrop">Put down</button></div></div>`;
        else if (TASKS.length) html += `<div class="eyebrow" style="margin-top:16px">Pick one side quest</div><div class="side-list">
          ${sideChoices().map(t => `<button class="side" data-side="${t.id}"><span class="pr">${urgent(t) ? "⏰" : (t.priority||"").split(" ")[0] || "▫️"}</span>
          <span class="nm">${esc(t.task)}${t.estimate ? ` <span style="color:var(--ink-faint)">· ${esc(t.estimate)}</span>` : ""}</span>
          <span class="xp">+${sideXp(t)}</span></button>`).join("")}</div>`;
      }
      html += `</div>`;
    }
    put("main", html);
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    on("bIn", () => checkIn(cur)); on("bSkip", () => skip(cur));
    on("bMore", () => openExtend(cur));
    on("bDone", () => { closeOut(cur, "done"); writeOps(o => {
      const e = now().toISOString();
      if (cur.extra) { const a = o.adds.find(x => x.key === cur.key); if (a) a.e = e; }
      else o.edits[cur.key] = { s:cur.s.toISOString(), e, t:cur.t };
    }); });
    on("sDone", finishSide); on("sDrop", dropSide);
    on("bGym", () => openGym(cur));
    on("bRest", () => restHere(cur));
    on("cFound", () => logCache(cur, "found")); on("cDnf", () => logCache(cur, "dnf"));
    on("cNext", () => { const c = cacheFor(cur); c.st.i++; saveG(); render(); });
    if ($("cLine")) $("cLine").oninput = e => { cacheFor(cur).st.line = e.target.value; };
    $("main").querySelectorAll("[data-side]").forEach(bn => bn.onclick = () => takeSide(bn.dataset.side));

    put("nextLine", cur && nxt && !z ? `<div class="next"><span>Next: <b>${KINDS[nxt.kind].em} ${esc(nxt.t)}</b></span><span>${fmtT(nxt.s)}</span></div>` : "");

    // zap button
    $("zap").textContent = z ? "↩︎ Back to the quest" : "⚡ Something came up";
    $("zap").classList.toggle("back", !!z);
    $("zap").onclick = z ? endZap : openZapSheet;

    // the mountain: today's stops, climbing from the morning to camp
    const stops = stopsOf(all);
    put("mtn", mountainSVG(stops, cur, t, z));
    $("mtn").querySelectorAll("[data-stop]").forEach(n => n.onclick = () => {
      const st = stops[+n.dataset.stop]; if (!st) return;
      const fixed = st.blocks.find(b => b.kind !== "open" && b.kind !== "break");
      if (fixed && isGym(fixed) && fixed.s - now() < 3 * 3600000) return openGym(blocks().find(x => x.key === fixed.key) || fixed);
      if (fixed) openEdit(blocks().find(x => x.key === fixed.key) || fixed); else openAdd(st.s);
    });
    $("addBtn").onclick = () => openAdd();
    const fires = stops.filter(st => st.anchor);
    $("trailMeta").textContent = `${fires.filter(st => st.lit).length} / ${fires.length} fires lit`;

    // log
    $("dayXp").textContent = `${fmtM(G.day.xp)} today`;
    put("log", G.day.log.length ? G.day.log.map(e =>
      `<div><span>${fmtT(new Date(e.at))}</span><span>${esc(e.msg)}</span>${e.xp ? `<span class="xp">+${e.xp}</span>` : ""}</div>`).join("")
      : `<div><span></span><span>Nothing yet. Check in to your first quest.</span></div>`);
    $("gear").classList.toggle("warn", !questKey() || !!syncErr);
    pings(all, t);
    tick();
  }

  /* tick every second; render() only touches the DOM when markup changed */
  setInterval(() => { tick(); if (!$("sheet").classList.contains("open")) render(); }, 1000);
  setInterval(pullAll, 2 * 60 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pullAll(); });
  pullAll();
})();
</script>
</body>
</html>
