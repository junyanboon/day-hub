<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quest">
<link rel="icon" type="image/svg+xml" href="quest-icon.svg">
<link rel="manifest" href="quest.webmanifest">
<meta name="theme-color" content="#191d3c">
<link rel="apple-touch-icon" href="quest-icon-180.png">
<title>Day Quest</title>
<!--
  Day Quest — the game layer on Stillness (prototype, 2026-09-28).

  Reads the same live sources as Stillness (still-api /plan, /ops, /tasks) and
  writes through the same protocol, so a shift made here shows on the phone app
  and the desktop orb. It adds what Stillness lacks: a check-in at every block
  start, a "did it close?" at every block end, a one-tap log for whatever comes
  up mid-block, and XP for keeping the day. Health blocks (sleep, practice,
  body, fuel) score double: the One System map says defend them.

  URL switches for testing:
    ?dry=1                     never POST (no /ops, no /tasks/done writes)
    ?at=2026-09-28T11:35       run a virtual clock from that moment (implies the
                               plan for that date; real time keeps ticking)
  Silent by design (Stillness dropped sound by request). Pings are browser
  notifications + vibration while the page is open.
-->
<style>
  :root {
    --ink: rgba(255,255,255,.95);
    --ink-soft: rgba(255,255,255,.7);
    --ink-faint: rgba(255,255,255,.42);
    --glass: rgba(255,255,255,.12);
    --glass-2: rgba(255,255,255,.2);
    --glass-border: rgba(255,255,255,.2);
    --gold: #ffd479;
    --good: #8fe3b0;
    --warn: #ffc27a;
    --bad: #ff9c9c;
    --zap: #c9b6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { min-height:100%; background:#4a4580;
    background-image: linear-gradient(180deg, #8a7fc4 0%, #6a5fa8 50%, #4a4580 100%);
    background-attachment: fixed; transition: background-color 2s ease; }
  html.mode-focus { background-image: linear-gradient(180deg, #5b8fd4 0%, #4a6fa5 45%, #5d5ba8 100%); background-color:#5d5ba8; }
  html.mode-break { background-image: linear-gradient(180deg, #6fb98f 0%, #4a8f7b 50%, #3d6b70 100%); background-color:#3d6b70; }
  html.mode-fixed { background-image: linear-gradient(180deg, #d4a45b 0%, #a5764a 45%, #8a5d7a 100%); background-color:#8a5d7a; }
  html.mode-health{ background-image: linear-gradient(180deg, #6fb98f 0%, #4f8f86 50%, #4a5f8a 100%); background-color:#4a5f8a; }
  html.mode-zap   { background-image: linear-gradient(180deg, #9a7fd4 0%, #6d5aa8 50%, #3f3a78 100%); background-color:#3f3a78; }
  html.night      { background-image: linear-gradient(180deg, #2b3160 0%, #232850 50%, #191d3c 100%); background-color:#191d3c; }
  body { background:transparent; color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased; }
  #app { max-width:480px; margin:0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px); }
  button { font:inherit; color:inherit; border:0; cursor:pointer; }

  /* ---------- HUD ---------- */
  .hud { display:flex; align-items:center; gap:12px; }
  .avatar { width:46px; height:46px; border-radius:50%; background:var(--glass-2);
    border:1px solid var(--glass-border); display:grid; place-items:center; font-size:24px; flex:none; }
  .hud-mid { flex:1; min-width:0; }
  .hud-title { font-size:13px; color:var(--ink-soft); display:flex; justify-content:space-between; }
  .hud-title b { color:var(--ink); font-weight:600; }
  .bar { height:8px; border-radius:6px; background:rgba(0,0,0,.2); margin-top:6px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--gold), #fff0c4);
    border-radius:6px; transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .gear { flex:none; width:36px; height:36px; border-radius:50%; background:var(--glass); font-size:17px; }
  .gear.warn { box-shadow:0 0 0 2px var(--warn); }
  .combo { flex:none; text-align:center; min-width:52px; }
  .combo .n { font-size:22px; font-weight:700; line-height:1; }
  .combo .l { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-top:3px; }
  .combo.hot .n { color:var(--gold); text-shadow:0 0 12px rgba(255,212,121,.6); }

  .status { font-size:11px; color:var(--ink-faint); margin:10px 2px 0; display:flex; justify-content:space-between; }
  .status .dry { color:var(--warn); }

  /* ---------- cards ---------- */
  .card { background:var(--glass); border:1px solid var(--glass-border); border-radius:22px;
    padding:18px; margin-top:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .eyebrow { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px; }
  .eyebrow .tag { background:rgba(255,255,255,.18); border-radius:20px; padding:2px 8px; letter-spacing:.06em; }
  .eyebrow .tag.x2 { background:rgba(143,227,176,.28); color:#dfffe9; }
  .quest-title { font-size:26px; font-weight:600; line-height:1.15; margin-top:10px; display:flex; gap:10px; align-items:flex-start; }
  .quest-title .em { font-size:28px; }
  .quest-time { font-size:13px; color:var(--ink-soft); margin-top:6px; }
  .count { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .ring { width:74px; height:74px; flex:none; }
  .ring circle { fill:none; stroke-width:7; }
  .ring .bg { stroke:rgba(255,255,255,.16); }
  .ring .fg { stroke:#fff; stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%;
    transition:stroke-dashoffset 1s linear; }
  .count .big { font-size:34px; font-weight:300; font-variant-numeric:tabular-nums; }
  .count .sub { font-size:12px; color:var(--ink-soft); }

  .actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .btn { flex:1; min-width:0; padding:13px 10px; border-radius:14px; background:rgba(255,255,255,.2);
    font-size:15px; font-weight:600; white-space:nowrap; }
  .btn.primary { background:#fff; color:#3b3670; }
  .btn.ghost { background:transparent; border:1px solid var(--glass-border); color:var(--ink-soft); font-weight:500; }
  .btn:active { transform:scale(.97); }
  .btn[disabled] { opacity:.45; }

  .loose { border-color:rgba(255,194,122,.45); background:rgba(255,194,122,.14); }
  .loose .q { font-size:17px; font-weight:600; margin-top:6px; }

  .next { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--ink-soft);
    margin-top:12px; padding:0 4px; }
  .next b { color:var(--ink); font-weight:600; }

  /* side quest */
  .side-list { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .side { display:flex; align-items:center; gap:10px; text-align:left; width:100%; padding:11px 12px;
    border-radius:14px; background:rgba(255,255,255,.12); font-size:14px; }
  .side .pr { flex:none; font-size:12px; }
  .side .nm { flex:1; min-width:0; }
  .side .xp { flex:none; font-size:12px; color:var(--gold); font-weight:600; }
  .active-side { margin-top:12px; padding:12px; border-radius:14px; background:rgba(255,212,121,.16);
    border:1px solid rgba(255,212,121,.4); }
  .active-side .k { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
  .active-side .nm { font-size:16px; font-weight:600; margin-top:4px; }



  /* ---------- gym log ---------- */
  .sheet.tall { max-height:90vh; max-height:90dvh; overflow-y:auto; }
  .gym-head { display:flex; justify-content:space-between; align-items:center; }
  .btn.small { flex:none; padding:8px 12px; font-size:13px; }
  .glabel { display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 6px; }
  #gProg { width:100%; padding:12px; border-radius:12px; background:rgba(0,0,0,.25); color:var(--ink); border:1px solid var(--glass-border); font:inherit; font-size:15px; }
  .gmove { margin-top:12px; padding:12px; border-radius:14px; background:rgba(255,255,255,.08); }
  .gtop { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .gtop b { font-size:15px; }
  .gl { display:flex; align-items:center; gap:6px; flex:none; }
  .lv { width:32px; height:32px; border-radius:10px; background:rgba(255,255,255,.16); font-size:18px; }
  .lvn { font:700 14px ui-monospace, Menlo, monospace; min-width:54px; text-align:center; }
  .lvn.up { color:var(--gold); }
  .gsub { font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .grow { display:grid; grid-template-columns:36px repeat(4, 1fr); gap:6px; margin-top:8px; align-items:center; }
  .gk { font:600 11px ui-monospace, Menlo, monospace; color:var(--ink-faint); }
  .sheet input.set { margin:0; padding:10px 4px; text-align:center; font-size:16px; border-radius:10px; min-width:0; }
  .gchips { display:flex; flex-wrap:wrap; gap:6px; }
  .gchip { padding:9px 12px; border-radius:20px; background:rgba(255,255,255,.12); font-size:14px; }
  .gchip.on { background:var(--good); color:#173b2a; font-weight:600; }
  .gfoot { display:flex; gap:8px; margin-top:16px; position:sticky; bottom:-20px; padding:10px 0; background:#3d3872; }
  .gnote { font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  /* ---------- altitude ---------- */
  .hud-title { gap:8px; }
  .hud-title > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #altTxt { white-space:nowrap; flex:none; font-variant-numeric:tabular-nums; }
  .o2row { display:flex; align-items:center; gap:6px; margin-top:5px; font:600 10.5px ui-monospace, Menlo, monospace; color:var(--ink-soft); }
  .o2bar { flex:1; height:5px; border-radius:4px; background:rgba(0,0,0,.25); overflow:hidden; }
  .o2bar i { display:block; height:100%; width:80%; background:#7fd8ff; border-radius:4px; transition:width .6s; }
  .o2bar i.mid { background:#ffd479; } .o2bar i.thin { background:#ff9c9c; }
  .cache { margin-top:14px; padding:12px; border-radius:14px; background:rgba(127,216,255,.1); border:1px dashed rgba(127,216,255,.45); }
  .cache .ck { font:600 11px ui-monospace, Menlo, monospace; color:#7fd8ff; letter-spacing:.04em; }
  .cache .ct { font-weight:700; font-size:16px; margin-top:4px; }
  .cache .cx { font-size:14px; color:var(--ink-soft); margin-top:4px; line-height:1.4; }
  .cache .cdone { margin-top:8px; font-size:13.5px; color:var(--good); }
  .cline { width:100%; margin-top:10px; padding:11px 12px; border-radius:12px; border:1px solid var(--glass-border); background:rgba(0,0,0,.2); color:var(--ink); font:inherit; font-size:15px; }
  .season { display:grid; gap:4px; margin-top:6px; font-size:13px; }
  .season div { display:grid; grid-template-columns:1fr 1.3fr auto; gap:8px; color:var(--ink-soft); }
  .season b { color:var(--ink); font-variant-numeric:tabular-nums; }
  /* ---------- the mountain ---------- */
  .place { color:var(--ink); font-weight:600; }
  #mtn { margin-top:4px; }
  .mtn-svg { width:100%; height:auto; display:block; border-radius:22px;
    background:linear-gradient(#0f1229, #262c62); }
  .mtn-svg .m1 { fill:#2d336f; } .mtn-svg .m2 { fill:#3a4184; opacity:.55; }
  .mtn-svg .star { fill:#eef0ff; animation:tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity:.2; } }
  .mtn-svg .seg { fill:none; stroke:#4a518f; stroke-width:5; stroke-linecap:round; stroke-dasharray:1 9; }
  .mtn-svg .seg.walked { stroke:var(--gold); stroke-dasharray:none; stroke-width:3; opacity:.85; }
  .mtn-svg .stopg { cursor:pointer; }
  .mtn-svg .stopg.past { opacity:.7; }
  .mtn-svg .hit { fill:transparent; }
  .mtn-svg .dotm { fill:#262c62; stroke:#a7abd8; stroke-width:2; }
  .mtn-svg .dotm.done { fill:var(--good); stroke:var(--good); }
  .mtn-svg .dotm.skip { stroke-dasharray:3 3; opacity:.5; }
  .mtn-svg .ringm { fill:none; stroke:var(--gold); stroke-width:2; animation:mpulse 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes mpulse { 50% { transform:scale(1.25); opacity:.4; } }
  .mtn-svg .logr { fill:#9a7452; }
  .mtn-svg .flame { fill:#3a4184; opacity:.8; }
  .mtn-svg .flame2 { fill:var(--gold); opacity:0; }
  .mtn-svg .glow { fill:#ff9c7a; opacity:0; }
  .mtn-svg .fire.lit .flame { fill:#ff9c7a; opacity:1; transform-box:fill-box; transform-origin:50% 100%; animation:flick .6s ease-in-out infinite alternate; }
  .mtn-svg .fire.lit .flame2 { opacity:1; transform-box:fill-box; transform-origin:50% 100%; animation:flick .45s ease-in-out infinite alternate-reverse; }
  .mtn-svg .fire.lit .glow { opacity:.28; }
  @keyframes flick { from { transform:scale(1,1) skewX(-3deg); } to { transform:scale(.9,1.12) skewX(4deg); } }
  .mtn-svg .tm { font:600 9.5px ui-monospace, Menlo, monospace; fill:#a7abd8; }
  .mtn-svg .nm { font:600 12.5px -apple-system, BlinkMacSystemFont, sans-serif; fill:#eef0ff; }
  .mtn-svg .nm.gone { fill:#a7abd8; text-decoration:line-through; }
  .mtn-svg .emo { font-size:22px; } .mtn-svg .emo.sm { font-size:15px; }
  .mtn-svg .halo { fill:var(--gold); opacity:.25; animation:mpulse 2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .mtn-svg .me { fill:var(--gold); stroke:#141833; stroke-width:2; }
  .mtn-svg .cloud ellipse { fill:#767bab; }
  .mtn-svg .rain { stroke:#9fb4ff; stroke-width:1.5; stroke-linecap:round; animation:rain .7s linear infinite; }
  @keyframes rain { from { transform:translateY(-3px); opacity:1; } to { transform:translateY(7px); opacity:0; } }
  .mtn-svg .bolt { fill:var(--gold); animation:tw 1.2s steps(2) infinite; }
  @media (prefers-reduced-motion: reduce) { .mtn-svg * { animation:none !important; } }
  /* ---------- trail ---------- */
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;
    margin:26px 4px 10px; display:flex; justify-content:space-between; }
  .trail { position:relative; padding-left:8px; }
  .trail::before { content:""; position:absolute; left:25px; top:10px; bottom:10px; width:2px;
    background:rgba(255,255,255,.2); border-radius:2px; }
  .node { position:relative; display:flex; align-items:center; gap:12px; padding:7px 0; }
  .dot { width:36px; height:36px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:17px;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.22); z-index:1; }
  .node .txt { flex:1; min-width:0; }
  .node .t { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node .m { font-size:12px; color:var(--ink-faint); margin-top:1px; }
  .node .badge { font-size:12px; font-weight:600; flex:none; }
  .node { cursor:pointer; border-radius:14px; }
  .node:active { background:rgba(255,255,255,.08); }
  .node.past { opacity:.62; }
  .add-btn { background:rgba(255,255,255,.18); border-radius:20px; padding:4px 12px; font-size:12px; letter-spacing:.06em;
    text-transform:none; font-weight:600; color:var(--ink); }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row label { flex:1; font-size:12px; color:var(--ink-soft); }
  .row label input { margin-top:4px; }
  .check { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:14px; color:var(--ink-soft); }
  .sheet .check input { width:20px; height:20px; margin:0; flex:none; accent-color:#fff; }
  .btn.danger { background:transparent; border:1px solid rgba(255,156,156,.5); color:var(--bad); font-weight:500; }
  .node.now .dot { background:#fff; border-color:#fff; box-shadow:0 0 0 6px rgba(255,255,255,.18), 0 0 22px rgba(255,255,255,.5);
    animation:pulse 2.4s ease-in-out infinite; }
  .node.now .t { font-weight:700; }
  .node.in .dot { border-color:var(--good); }
  .node.late .dot { border-color:var(--warn); }
  .node.skip .dot { border-color:var(--bad); }
  .b-in { color:var(--good); } .b-late { color:var(--warn); } .b-skip { color:var(--bad); } .b-zap { color:var(--zap); }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px rgba(255,255,255,.08), 0 0 30px rgba(255,255,255,.6); } }

  .log { font-size:13px; color:var(--ink-soft); }
  .log div { padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; gap:8px; }
  .log div span:first-child { color:var(--ink-faint); flex:none; width:58px; font-variant-numeric:tabular-nums; }
  .log div span.xp { margin-left:auto; color:var(--gold); flex:none; }

  /* ---------- zap button + sheet ---------- */
  .zap { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 18px);
    width:min(448px, calc(100% - 32px)); padding:16px; border-radius:20px; font-size:17px; font-weight:700;
    background:linear-gradient(135deg, #b9a4ff, #8f7cf0); color:#fff; box-shadow:0 10px 30px rgba(40,20,90,.45); z-index:5; }
  .zap:active { transform:translateX(-50%) scale(.98); }
  .zap.back { background:linear-gradient(135deg, #fff, #efeaff); color:#4a3f98; }

  .scrim { position:fixed; inset:0; background:rgba(15,10,40,.45); z-index:9; display:none; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%, 110%); width:min(480px, 100%);
    background:#3d3872; border-radius:24px 24px 0 0; padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
    z-index:10; transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,.35); }
  .sheet.open { transform:translate(-50%, 0); }
  .sheet h3 { font-size:19px; font-weight:600; }
  .sheet p { font-size:14px; color:var(--ink-soft); margin-top:6px; line-height:1.4; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .chip { padding:14px 10px; border-radius:14px; background:rgba(255,255,255,.12); font-size:15px; text-align:left; }
  .chip.sel { background:#fff; color:#3b3670; font-weight:600; }
  .sheet input { width:100%; margin-top:12px; padding:13px 14px; border-radius:14px; border:1px solid var(--glass-border);
    background:rgba(0,0,0,.18); color:var(--ink); font:inherit; font-size:16px; }
  .sheet input::placeholder { color:var(--ink-faint); }

  /* ---------- toasts ---------- */
  .float { position:fixed; left:50%; top:30%; transform:translateX(-50%); font-size:30px; font-weight:800; color:var(--gold);
    text-shadow:0 2px 14px rgba(0,0,0,.3); pointer-events:none; z-index:20; animation:rise 1.4s ease-out forwards; }
  .float small { display:block; font-size:13px; font-weight:600; color:#fff; text-align:center; }
  @keyframes rise { 0% { opacity:0; transform:translate(-50%, 20px) scale(.8); } 15% { opacity:1; transform:translate(-50%,0) scale(1.08); }
    100% { opacity:0; transform:translate(-50%, -70px) scale(1); } }
  .lvlup { position:fixed; inset:0; display:grid; place-items:center; z-index:30; pointer-events:none; }
  .lvlup > div { background:rgba(20,15,50,.8); border:1px solid var(--gold); border-radius:24px; padding:26px 30px; text-align:center;
    animation:pop 2.6s ease forwards; }
  .lvlup .a { font-size:44px; } .lvlup .b { font-size:12px; letter-spacing:.14em; color:var(--gold); margin-top:8px; }
  .lvlup .c { font-size:22px; font-weight:700; margin-top:4px; }
  @keyframes pop { 0% { opacity:0; transform:scale(.7); } 12% { opacity:1; transform:scale(1.05); } 20% { transform:scale(1); }
    85% { opacity:1; } 100% { opacity:0; } }

  .empty { text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:15px; }
  .ping-ask { font-size:13px; color:var(--ink-soft); text-decoration:underline; background:none; margin-top:10px; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .summary div { background:rgba(255,255,255,.1); border-radius:14px; padding:12px 8px; text-align:center; }
  .summary b { display:block; font-size:22px; }
  .summary span { font-size:11px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="avatar" id="avatar">🧗</div>
    <div class="hud-mid">
      <div class="hud-title"><span><b id="peakName">Today's peak</b></span><span id="altTxt">0 m</span></div>
      <div class="bar"><i id="xpBar"></i></div>
      <div class="o2row"><span>O₂</span><div class="o2bar"><i id="o2Bar"></i></div><span id="o2Txt">80%</span></div>
    </div>
    <div class="combo" id="combo"><div class="n" id="comboN">·</div><div class="l" id="comboL">wind</div></div>
    <button class="gear" id="gear" aria-label="Settings">⚙️</button>
  </div>
  <div class="status"><span id="statusL">Loading your day…</span><span id="statusR"></span></div>

  <div id="loose"></div>
  <div id="main"></div>
  <div id="nextLine"></div>

  <h2><span>Today's mountain <span id="trailMeta" style="font-weight:400;color:var(--ink-faint)"></span></span><button class="add-btn" id="addBtn">＋ Add</button></h2>
  <div id="mtn"></div>

  <h2><span>Quest log</span><span id="dayXp"></span></h2>
  <div class="log" id="log"></div>
</div>

<button class="zap" id="zap">⚡ Something came up</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<script>
(() => {
  /* ---------- config + clock ---------- */
  const API = new URLSearchParams(location.search).get("api") || "https://still.srv1948070.hstgr.cloud";

  /* ---------- pairing ----------
     The page is public, so it holds no secret. Pairing stores the code on
     this device; the server then lets it save XP, change the calendar and
     receive pings. A #pair=CODE link pairs in one tap. */
  const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
  const hashPair = /[#&]pair=([^&]+)/.exec(location.hash);
  if (hashPair) { store.set("quest-key", decodeURIComponent(hashPair[1]).trim()); history.replaceState(null, "", location.pathname + location.search); }
  const questKey = () => store.get("quest-key") || "";
  async function qfetch(path, opts = {}){
    const r = await fetch(API + path, { ...opts, cache:"no-store",
      headers:{ "Content-Type":"application/json", "X-Quest-Key":questKey(), ...(opts.headers || {}) } });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || "HTTP " + r.status);
    return body;
  }
  const qs = new URLSearchParams(location.search);
  const DRY = qs.get("dry") === "1";
  const AT = qs.get("at");
  const clockOffset = AT ? (new Date(AT).getTime() - Date.now()) : 0;
  const now = () => new Date(Date.now() + clockOffset);

  /* The day runs on the calendar's clock: the plan says which zone Junyan is
     in (still-api reads it from his calendar, 2026-10-05). Before the plan
     loads, the device's zone stands in. */
  let PLAN_TZ = null;
  const TZ = () => PLAN_TZ || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const tzParts = (d, o) => Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone:TZ(), ...o })
    .formatToParts(d).map(x => [x.type, x.value]));
  const tzYmd = d => { const p = tzParts(d, { year:"numeric", month:"2-digit", day:"2-digit" }); return `${p.year}-${p.month}-${p.day}`; };
  /* The game's day runs to 4 AM, or to the end of a late block that is still
     going (sleep to 5 AM), not to midnight (Junyan, d67). pullPlan picks the
     day; before it loads, "4 hours ago" stands in. */
  let GAME_YMD = null;
  const gameYmd = () => GAME_YMD || tzYmd(new Date(now() - 4 * 3600000));
  // same shape as Date.toDateString(), which Stillness uses for the /ops key
  const dayKey = () => new Date(gameYmd() + "T12:00:00Z").toLocaleDateString("en-US", { timeZone:"UTC", weekday:"short", month:"short", day:"2-digit", year:"numeric" }).replace(/,/g, "");
  function tzOff(d){
    const v = tzParts(d, { timeZoneName:"longOffset" }).timeZoneName || "";
    const m = v.match(/GMT([+-])(\d{2}):(\d{2})/);
    return m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) : 0;
  }
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  const fmtT = d => d.toLocaleTimeString([], { hour:"numeric", minute:"2-digit", timeZone:TZ() });
  // minutes and hours only, no seconds (Junyan, 2026-09-28)
  const fmtHM = min => { const h = Math.floor(min / 60), m = min % 60;
    return h ? (m ? `${h} hr ${m} min` : `${h} hr`) : `${m} min`; };
  const fmtLeft = sec => fmtHM(Math.max(0, Math.ceil(sec / 60)));    // time remaining rounds up
  const fmtAgo = sec => fmtHM(Math.max(0, Math.floor(sec / 60)));    // time elapsed rounds down
  const fmtMin = min => min >= 60 ? `${Math.floor(min/60)}h ${min%60}m` : `${min} min`;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  /* ---------- game state (localStorage, per viewer) ---------- */
  const GKEY = "quest-v1";
  let G = { xp:0, bestCombo:0, day:null };
  try { const d = JSON.parse(localStorage.getItem(GKEY)); if (d) G = { ...G, ...d }; } catch {}
  function freshDay(){ return { date:dayKey(), since:now().toISOString(), o2:80, o2At:now().toISOString(), ledge:0, sw:false, caches:{}, camps:0, xp:0, combo:0, checks:{}, closes:{}, zaps:[], zap:null, side:null, log:[] }; }
  if (!G.day) G.day = freshDay();   // a stale day is replaced once the plan says which day it is
  /* XP lives on this device AND on the server (still-api quest:state), so it
     survives a cleared browser and is the same on phone and Mac. Newest wins. */
  let syncTimer = null, syncErr = null;
  const saveG = () => {
    G.ts = Date.now();
    try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch {}
    if (!questKey() || DRY) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => qfetch("/quest/state", { method:"POST", body:JSON.stringify(G) })
      .then(() => { syncErr = null; }).catch(e => { syncErr = e.message; }), 1500);
  };
  async function pullState(){
    if (!questKey()) return;
    try {
      const srv = await qfetch("/quest/state");
      syncErr = null;
      if (srv && typeof srv.xp === "number" && (srv.ts || 0) > (G.ts || 0)) {
        G = { ...G, ...srv };
        if (!G.day || G.day.date !== dayKey()) G.day = freshDay();
        try { localStorage.setItem(GKEY, JSON.stringify(G)); } catch {}
      } else if ((G.ts || 0) > (srv.ts || 0)) saveG();   // this device is newer: push it up
    } catch (e) { syncErr = e.message; }
  }

  /* ---------- live data: plan + edit layer + tasks ---------- */
  let PLAN = null, OPS = { edits:{}, drops:[], adds:[], ts:0 }, TASKS = [], lastPull = null, pullErr = null;

  async function getPlan(date){
    const r = await fetch(API + "/plan?date=" + date, { cache:"no-store" });
    if (!r.ok) throw new Error("plan HTTP " + r.status);
    const p = await r.json();
    if (!p || !Array.isArray(p.blocks)) throw new Error("plan has no blocks");
    return p;
  }
  async function pullPlan(){
    const t = now(), today = tzYmd(t);
    let p = await getPlan(today);
    PLAN_TZ = p.tz || null;
    let day = today;
    const hour = +tzParts(t, { hour:"numeric", hourCycle:"h23" }).hour;
    if (hour < 12) {
      // Stay on yesterday's mountain until 4 AM, or until its last block ends
      // if that is later (capped at 9 AM, and at today's first fixed block).
      const y = tzYmd(new Date(t - 86400000));
      const prev = await getPlan(y).catch(() => null);
      if (prev && prev.blocks.length) {
        const at4 = new Date(`${today}T04:00:00Z`).getTime() - tzOff(t) * 60000;
        const lastEnd = Math.max(...prev.blocks.map(b => +new Date(b.e)));
        const firstFixed = p.blocks.filter(b => !/^open space|^rest$/i.test(b.t)).map(b => +new Date(b.s));
        const cutoff = Math.max(at4, Math.min(lastEnd, at4 + 5 * 3600000, ...firstFixed));
        if (+t < cutoff) { p = prev; day = y; }
      }
    }
    PLAN = p;
    PLAN_TZ = p.tz || null;
    GAME_YMD = day;
  }
  async function pullOps(){
    const r = await fetch(API + "/ops?d=" + encodeURIComponent(dayKey()), { cache:"no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.date === dayKey()) OPS = { edits:d.edits||{}, drops:d.drops||[], adds:d.adds||[], ts:d.ts||0 };
  }
  async function pullTasks(){
    const r = await fetch(API + "/tasks", { cache:"no-store" });
    if (!r.ok) return;
    const d = await r.json();
    TASKS = (d.tasks || []).filter(t => !t.done);
  }
  async function pullAll(){
    try {
      await pullPlan();   // first: it sets the zone, which decides today's date key
      await Promise.all([pullOps(), pullTasks().catch(() => {}), pullState()]);
      lastPull = new Date(); pullErr = null;
    } catch (e) { pullErr = String(e.message || e); }
    render();
  }
  /* Same protocol as Stillness: the whole day's edit layer, last-write-wins on
     ts. Pull first so a phone edit made a minute ago is not overwritten. */
  async function writeOps(mutate){
    await pullOps().catch(() => {});
    mutate(OPS);
    OPS.ts = Date.now();
    if (DRY) { render(); return; }
    await fetch(API + "/ops", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ date:dayKey(), ...OPS }) }).catch(() => {});
    render();
  }

  const keyOf = b => b.s + "|" + b.t;
  function blocks(){
    if (!PLAN) return [];
    const out = [];
    PLAN.blocks.forEach(b => {
      const k = keyOf(b);
      if (OPS.drops.includes(k)) return;
      const ed = OPS.edits[k];
      out.push({ ...b, key:k, s:new Date(ed?.s ?? b.s), e:new Date(ed?.e ?? b.e), t:ed?.t ?? b.t });
    });
    OPS.adds.forEach(a => out.push({ ...a, key:a.key, s:new Date(a.s), e:new Date(a.e), extra:true }));
    return out.map(b => ({ ...b, kind:kindOf(b) })).sort((x,y) => x.s - y.s);
  }
  // Stillness's shift: every block from `from` onward moves by `min` minutes.
  function shiftFrom(fromKey, min){
    return writeOps(o => {
      const ms = min * 60000, all = blocks(), from = all.find(b => b.key === fromKey);
      if (!from) return;
      all.forEach(b => {
        if (b.s < from.s) return;
        const s = new Date(b.s.getTime()+ms).toISOString(), e = new Date(b.e.getTime()+ms).toISOString();
        if (b.extra) { const a = o.adds.find(x => x.key === b.key); if (a) { a.s = s; a.e = e; } }
        else o.edits[b.key] = { s, e, t:b.t };
      });
    });
  }

  /* ---------- what kind of block is this ---------- */
  const KINDS = {
    rest:     { em:"🌙", name:"Rest",     health:true },
    practice: { em:"🪷", name:"Practice", health:true },
    body:     { em:"💪", name:"Body",     health:true },
    fuel:     { em:"🥗", name:"Fuel",     health:true },
    travel:   { em:"🧳", name:"Journey" },
    call:     { em:"📞", name:"Call" },
    dance:    { em:"💃", name:"Dance" },
    open:     { em:"🗺️", name:"Open space" },
    break:    { em:"🍃", name:"Breather" },
    fixed:    { em:"📌", name:"Appointment" },
  };
  const RULES = [
    [/sleep|nap\b|nap |wind.?down|\bbed\b|rest\b/i, "rest"],
    [/shambhavi|sadhana|yoga|meditat|pooja|kriya|bhuta|breath/i, "practice"],
    [/ride|drive|flight|airport|check.?in|security|transfer|uber|\btrain\b|lounge|board|pack|\b[A-Z]{2}\d{2,4}\b/i, "travel"],
    [/gym|sauna|\brun\b|walk|mobility|swim|workout|training|stretch/i, "body"],
    [/breakfast|lunch|dinner|\beat\b|cook|meal|pudding|veggie|snack|groceries/i, "fuel"],
    [/zouk|dance|class|social|workshop|rehearsal/i, "dance"],
    [/\bcall\b|meet|zoom|chat with/i, "call"],
  ];
  function kindOf(b){
    if (b.type === "break") return "break";
    if (/^open space/i.test(b.t) || b.type === "focus") return "open";
    for (const [re, k] of RULES) if (re.test(b.t)) return k;
    return "fixed";
  }
  const isHealth = b => !!KINDS[b.kind]?.health;

  /* ---------- Altitude (Trail · Altitude, chosen 2026-10-05) ----------
     XP is metres climbed. Each block's climb comes from a Difficulty/Terrain
     route (geocaching style): (D + T) × 40 m. Oxygen is a second meter: every
     climb uses some, it thins 4% an hour, and anchors (sleep, meals, gym,
     Shambhavi) are campfires that refill it. Below 30% the climb still counts
     but its metres wait on a ledge until the next campfire. Altitude never
     drops. A comeback within 10 min after ⚡ gives a Second Wind: next climb ×2.
     G.xp is the season's total metres, G.day.xp today's. */
  const PEAKS = { Hurghada:"Red Sea Ridge", Cairo:"Muqattam Crest", Luxor:"Theban Hills", Aswan:"Granite Cataract",
    Madrid:"Guadarrama Crest", Toronto:"Escarpment Line", London:"Thames Ridge", "São Paulo":"Serra do Mar" };
  const placeNow = () => (PLAN && PLAN.where && PLAN.where.place) || "Home";
  const peakName = () => PEAKS[placeNow()] || `${placeNow()} Ridge`;
  function route(b){                                   // [Difficulty, Terrain]
    if (isGym(b)) return [3, 4];
    if (/tour|quad|hike|trek|safari|dive|snorkel|climb/i.test(b.t)) return [4, 5];
    switch (b.kind) {
      case "body": return [3, 3];   case "dance": return [3, 4];
      case "travel": return (b.e - b.s) >= 2 * 3600000 ? [2, 3] : [1, 2];
      case "practice": return [2, 1];  case "rest": return [2, 1];  case "call": return [2, 1];
      case "fuel": return /dinner/i.test(b.t) ? [2, 1] : [1, 1];
      case "open": return [1, 1];   default: return [2, 2];
    }
  }
  const climbOf = b => { const [D, T] = route(b); return (D + T) * 40; };
  const o2Cost = b => { const [D, T] = route(b); return (D + T) * 3; };
  const FIRE = { rest:100, fuel:35, body:30, practice:30 };
  const SIDE_M = 50;
  const fmtM = m => `${Math.round(m).toLocaleString()} m`;
  function o2Now(){ const d = G.day; const hrs = (now() - new Date(d.o2At || now())) / 3600000;
    return Math.max(0, Math.min(100, (d.o2 ?? 80) - Math.max(0, hrs) * 4)); }
  function settleO2(){ G.day.o2 = o2Now(); G.day.o2At = now().toISOString(); }
  function summitOf(all){
    const m = all.filter(needsCheck).reduce((a, b) => a + climbOf(b), 0) + SIDE_M * Math.min(3, TASKS.length);
    return Math.max(500, Math.ceil(m / 50) * 50);
  }
  let SUMMIT_H = 0;

  function addAlt(m, msg, label){
    m = Math.round(m); if (!m) { log(msg); return; }
    G.xp += m; G.day.xp += m;
    log(msg, m); floatXp(m, label || "");
    (G.summits = G.summits || {})[G.day.date] = { place:placeNow(), peak:peakName(), alt:G.day.xp, h:SUMMIT_H };
    if (SUMMIT_H && !G.day.summited && G.day.xp >= SUMMIT_H) {
      G.day.summited = true;
      setTimeout(() => banner("🏔️", "SUMMIT", `${peakName()} · ${fmtM(SUMMIT_H)}`), 900);
      log(`Summit of ${peakName()} reached`);
    }
    saveG();
  }
  // every other reward is metres too (side quests, logging what came up, replans)
  function award(m, msg, opts = {}){ addAlt(m, msg, opts.label); }

  function climb(b, frac, why){
    settleO2();
    const thin = G.day.o2 < 30, sw = !!G.day.sw;
    const m = Math.round((climbOf(b) + (isGym(b) ? 20 * (G.ropes || 0) : 0)) * frac * (sw ? 2 : 1));
    G.day.sw = false;
    G.day.o2 = Math.max(0, G.day.o2 - o2Cost(b) * (thin ? 2 : 1));
    if (thin) { G.day.ledge = (G.day.ledge || 0) + m; log(`${why}: ${fmtM(m)} wait on a ledge (thin air). Light a campfire to bring them home.`); floatXp(0, "thin air: metres on a ledge"); saveG(); }
    else addAlt(m, `${why}${sw ? " · second wind ×2" : ""}`, sw ? "second wind!" : "");
  }
  function campfire(b){
    const f = FIRE[b.kind]; if (!f) return;
    settleO2(); const was = Math.round(G.day.o2);
    G.day.o2 = f >= 100 ? 100 : Math.min(100, G.day.o2 + f);
    log(`🔥 Campfire at ${b.t}: oxygen ${was}% to ${Math.round(G.day.o2)}%`);
    if (G.day.ledge) { const m = G.day.ledge; G.day.ledge = 0; addAlt(m, "Ledge metres brought home", "from the ledge"); }
    saveG();
  }

  function log(msg, xp = 0){
    G.day.log.unshift({ at:now().toISOString(), msg, xp });
    G.day.log = G.day.log.slice(0, 80);
    saveG();
  }
  function floatXp(n, label){
    const el = document.createElement("div");
    el.className = "float"; el.innerHTML = `${n ? `+${Math.round(n)} m` : ""}${label ? `<small>${esc(label)}</small>` : ""}`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1500);
    if (navigator.vibrate) navigator.vibrate(30);
  }
  function banner(icon, top, line){
    const el = document.createElement("div");
    el.className = "lvlup";
    el.innerHTML = `<div><div class="a">${icon}</div><div class="b">${esc(top)}</div><div class="c">${esc(line)}</div></div>`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2700);
    if (navigator.vibrate) navigator.vibrate([40,60,40]);
  }

  /* ---------- field caches: a real-world challenge on each block ----------
     Geocaching vocabulary on purpose: type, D/T, Found it, Did not find (still
     logged, still climbs a little). A find pitches a base camp, which can be
     spent to rest through a free-time stop and keep its metres. */
  const CTYPE = { trad:"📦 Traditional", multi:"🔢 Multi-stage", myst:"❓ Mystery", earth:"🌍 EarthCache", night:"🌙 Night cache" };
  const CACHE_LIB = {
    gym: [["multi",2,2,"Heaviest iron","Stage 1: find the heaviest dumbbell in the gym and log its weight. Stage 2: carry it 20 steps and put it back."],
          ["myst",3,2,"Plate puzzle","Add up every plate on the most loaded bar in the room. Log the total in kg and in lbs."],
          ["trad",1,1,"Best window","Find the gym's best window and log one thing you can see from it."]],
    fuel: [["trad",1,1,"New protein","Find a protein you have not eaten yet this trip and put it on your plate."],
           ["earth",2,1,"Grown here","Find one thing on the table grown near {place}. Ask where it comes from and log the place."],
           ["myst",2,1,"Menu word","Find one word in the local language on a menu or sign. Learn what it means and log it."]],
    dinner: [["trad",2,1,"Staff favourite","Ask a staff member their favourite local dish and log the name."],
             ["myst",2,1,"Menu word","Find one word in the local language on the menu. Learn what it means and log it."]],
    open: [["trad",2,2,"High point","Find the highest spot you can reach on foot within 10 minutes. Log the view in one line."],
           ["earth",1,1,"Three sounds","Stand still for one minute anywhere outside. Log three sounds you can name."],
           ["trad",2,2,"Sea colour","Find something for sale in {place} that is the colour of the sea. Log what it was."],
           ["multi",2,3,"Oldest thing","Stage 1: find the oldest-looking thing within a short walk. Stage 2: find out how old it really is."]],
    travel: [["earth",3,3,"Stone bands","At the first stop, pick up a stone and name its colour bands. What made them? Put it back after."],
             ["multi",3,4,"Track reader","Stage 1: count the stops on the way. Stage 2: at the last one, find a track and guess who made it."],
             ["trad",2,2,"Road sign","Find a sign with a place name you have never heard of. Log it."]],
    rest: [["night",3,1,"Summer Triangle","After dark, find Vega, Deneb and Altair high in the west. A DNF is a fine log."],
           ["night",1,1,"Five breaths","Lights off. Count five slow breaths before sleep. Log how you feel in two words."]],
    practice: [["trad",1,1,"Sit spot","Practise facing a window. Log the first thing you see when you open your eyes."]],
    call: [["trad",1,2,"Walk and talk","Take the call standing or walking. Log roughly how far you went."]],
    dance: [["multi",3,3,"Borrowed move","Stage 1: learn one move from someone new. Stage 2: teach it back to Caney. Log the move."]],
    fixed: [["trad",1,1,"Never seen","Find one thing here you have never seen before. Log it."]],
  };
  function cacheFor(b){
    const lib = isGym(b) ? CACHE_LIB.gym : /dinner/i.test(b.t) ? CACHE_LIB.dinner
      : /tour|quad|safari|hike/i.test(b.t) ? CACHE_LIB.travel : CACHE_LIB[b.kind] || CACHE_LIB.fixed;
    const st = (G.day.caches[gk(b)] = G.day.caches[gk(b)] || { i:(b.s.getHours() + b.t.length) % lib.length, state:null, line:"" });
    const [t, D, T, title, text] = lib[st.i % lib.length];
    return { st, lib, t, D, T, title, text:text.replace("{place}", placeNow()) };
  }
  function cacheCard(b){
    const c = cacheFor(b), done = c.st.state === "found" || c.st.state === "dnf";
    return `<div class="cache"><div class="ck">${CTYPE[c.t]} · D${c.D} / T${c.T}</div>
      <div class="ct">${esc(c.title)}</div><div class="cx">${esc(c.text)}</div>
      ${done ? `<div class="cdone">${c.st.state === "found" ? "✓ Found it" : "Did not find, logged"}${c.st.line ? `: “${esc(c.st.line)}”` : ""}</div>`
        : `<input id="cLine" class="cline" placeholder="Logbook line (optional)" maxlength="120" value="${esc(c.st.line)}">
           <div class="actions"><button class="btn primary" id="cFound">Found it</button><button class="btn" id="cDnf">Did not find</button>
           ${c.lib.length > 1 ? `<button class="btn ghost" id="cNext">Another</button>` : ""}</div>`}</div>`;
  }
  function logCache(b, state){
    const c = cacheFor(b), line = ($("cLine") && $("cLine").value.trim()) || "";
    c.st.state = state; c.st.line = line;
    if (state === "found") { G.day.camps = (G.day.camps || 0) + 1;
      addAlt(30 + 10 * c.D, `⛺ Found “${c.title}”${line ? `: ${line}` : ""}. Base camp pitched`, "cache found");
      if (!(G.souvenirs = G.souvenirs || {})[placeNow()]) { G.souvenirs[placeNow()] = G.day.date; setTimeout(() => banner("🏅", "SOUVENIR", `First find in ${placeNow()}`), 1200); }
    } else addAlt(10, `Did not find “${c.title}”${line ? `: ${line}` : ""}`, "DNF logged");
    saveG(); render();
  }
  function restHere(b){
    if (!(G.day.camps > 0)) return;
    G.day.camps--; G.day.checks[gk(b)] = "rest"; settleO2(); G.day.o2 = Math.min(100, G.day.o2 + 10);
    addAlt(climbOf(b), `⛺ Rested at base camp through ${b.t}. Kept its metres, +10% oxygen`, "rested");
    render();
  }

  /* ---------- the day's loop ---------- */
  // latest-starting block containing now wins (same rule as Stillness)
  function currentOf(all, t){ let hit = null; all.forEach(b => { if (t >= b.s && t < b.e) hit = b; }); return hit; }
  function nextOf(all, t){ return all.find(b => b.s > t) || null; }
  const needsCheck = b => b.kind !== "break";
  // Check-ins follow the calendar event, not its time: a block that moves (in
  // Google Calendar or in Stillness) keeps "started" and "closed". Blocks with
  // no event id (Stillness's own, or added today) use their edit key.
  const gk = b => b && b.id ? "id:" + b.id : b && b.key;
  const ON_TIME_MIN = 5;
  // The check-in button says what you are starting (Junyan, 2026-10-05: "I don't get the I'm in button")
  function startLabel(b){
    if (isGym(b)) return "▶ Start the workout";
    if (/sleep|bed|wind.?down/i.test(b.t)) return "🌙 Going to bed";
    if (/nap|rest\b/i.test(b.t)) return "😌 Lying down";
    const k = b.kind;
    if (k === "practice") return "🪷 Starting practice";
    if (k === "fuel") return "🍽️ Sitting down to eat";
    if (k === "call") return "📞 Starting the call";
    if (k === "travel") return "🧳 Heading out";
    if (k === "dance") return "💃 Starting to dance";
    if (k === "open") return "▶ Start free time";
    return "▶ Starting now";
  }

  function checkIn(b){
    const late = (now() - b.s) / 60000 > ON_TIME_MIN;
    G.day.checks[gk(b)] = late ? "late" : "in";
    const [D, T] = route(b);
    climb(b, late ? 0.5 : 1, `Climbed ${b.t} (D${D}/T${T})${late ? ", started late" : ""}`);
    if (isHealth(b)) campfire(b);
    render();
  }
  function skip(b){
    G.day.checks[gk(b)] = "skip"; G.day.closes[gk(b)] = "skipped";
    log(`Not today: ${b.t}. Nothing lost`); saveG(); render();
  }
  function closeOut(b, how){
    G.day.closes[gk(b)] = how;
    if (how === "done") award(15, `Closed ${b.t}`, { x2:isHealth(b), label:"closed" });
    else if (how === "carried") { log(`Carried ${b.t} forward`); saveG(); }
    render();
  }
  function extend(b, min){
    log(`Asked ${b.t} for +${min} min`);
    return stretch(b, min);
  }
  // this block ends `min` later and everything after it moves by the same amount
  function stretch(b, min){
    return writeOps(o => {
      const ms = min * 60000, all = blocks();
      all.forEach(x => {
        if (x.key === b.key) {
          const e = new Date(x.e.getTime()+ms).toISOString();
          if (x.extra) { const a = o.adds.find(y => y.key === x.key); if (a) a.e = e; }
          else o.edits[x.key] = { s:x.s.toISOString(), e, t:x.t };
        } else if (x.s >= b.e) {
          const s = new Date(x.s.getTime()+ms).toISOString(), e = new Date(x.e.getTime()+ms).toISOString();
          if (x.extra) { const a = o.adds.find(y => y.key === x.key); if (a) { a.s = s; a.e = e; } }
          else o.edits[x.key] = { s, e, t:x.t };
        }
      });
    });
  }

  /* side quests: one at a time (WIP limit 1) */
  const PRI = t => /High/i.test(t.priority) ? 3 : /Medium/i.test(t.priority) ? 2 : 1;
  const sideXp = t => SIDE_M + (urgent(t) ? 25 : 0);
  // One System map, ticket 001: payment deadlines outrank everything else
  const dueIn = t => { const m = /due (\d{4}-\d{2}-\d{2})/i.exec(t.task); return m ? Math.round((new Date(m[1] + "T12:00") - now()) / 86400000) : null; };
  const urgent = t => { const d = dueIn(t); return d !== null && d <= 2; };
  function sideChoices(){
    return [...TASKS].sort((a,b) => (urgent(b) - urgent(a)) || (b.nextAction - a.nextAction) || (PRI(b) - PRI(a))).slice(0, 5);
  }
  function takeSide(id){
    const t = TASKS.find(x => x.id === id); if (!t) return;
    G.day.side = { id:t.id, task:t.task, priority:t.priority, at:now().toISOString() };
    log(`Took side quest: ${t.task}`); saveG(); render();
  }
  async function finishSide(){
    const s = G.day.side; if (!s) return;
    if (!DRY) {
      try {
        const r = await fetch(API + "/tasks/done", { method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ id:s.id, done:true }) });
        if (!r.ok) throw new Error("HTTP " + r.status);
      } catch (e) { alert("Could not mark it done in Notion: " + e.message); return; }
    }
    TASKS = TASKS.filter(t => t.id !== s.id);
    G.day.side = null;
    const at = currentOf(blocks(), now());
    (G.day.sideDone = G.day.sideDone || []).push(at ? gk(at) : "");   // a flag on the mountain
    award(sideXp(s), `Side quest done: ${s.task}`, { label:"side quest" });
    render();
  }
  function dropSide(){ if (!G.day.side) return; log(`Put down: ${G.day.side.task}`); G.day.side = null; saveG(); render(); }

  /* ⚡ interruptions: log what came up, then come back */
  const ZAPS = [["🧡","Caney"],["📞","Call or text"],["🏢","Studio or renter"],["🛒","Errand"],["🧠","Rabbit hole"],["✨","Other"]];
  function startZap(type, note){
    G.day.zap = { type, note, s:now().toISOString(), during: currentOf(blocks(), now())?.key || null };
    log(`⚡ ${type}${note ? ": " + note : ""}`);
    award(5, "Logged what came up", { label:"honest log" });
    render();
  }
  function endZap(){
    const z = G.day.zap; if (!z) return;
    const mins = Math.max(1, Math.round((now() - new Date(z.s)) / 60000));
    G.day.zaps.push({ ...z, e:now().toISOString(), mins });
    G.day.zap = null; saveG();
    const all = blocks(), cur = currentOf(all, now()), nxt = nextOf(all, now());
    if (mins <= 10) { G.day.sw = true; log(`Back in ${mins} min: Second Wind, your next climb counts double`); floatXp(0, "second wind ready"); saveG(); }
    openRecover(mins, cur, nxt, z);
  }

  /* ---------- changing the schedule ----------
     Same edit layer as Stillness (/ops): a change here shows on the phone app
     and the desktop orb. Calendar blocks are keyed by their original start and
     title; blocks you add are keyed "x<start ms>". */
  function setBlock(o, b, s, e, t){
    if (b.extra) { const a = o.adds.find(x => x.key === b.key); if (a) { a.s = s.toISOString(); a.e = e.toISOString(); a.t = t; } }
    else o.edits[b.key] = { s:s.toISOString(), e:e.toISOString(), t };
  }
  function saveBlock(b, s, e, t, moveLater){
    const ds = s - b.s, de = e - b.e;
    log(`Changed ${b.t}${t !== b.t ? ` to ${t}` : ""}: ${fmtT(s)} to ${fmtT(e)}`);
    return writeOps(o => {
      // later blocks move by however much this one's end moved
      if (moveLater && de) blocks().forEach(x => {
        if (x.key === b.key || x.s < b.e) return;
        setBlock(o, x, new Date(x.s.getTime() + de), new Date(x.e.getTime() + de), x.t);
      });
      setBlock(o, b, s, e, t);
    });
  }
  /* Calendar writes: a block that came from Google Calendar (it has an id) can
     be moved or renamed in the calendar itself. Blocks moved along with it
     ("move everything after") stay today-only, so a flight or a shared Joint
     Plans event is never shifted in the calendar by accident. */
  const canCal = b => !!(b.id && b.calId && questKey() && !DRY);
  async function saveBlockCal(b, s, e, t, moveLater){
    try {
      await qfetch("/cal/event", { method:"POST", body:JSON.stringify({
        id:b.id, calId:b.calId, raw:b.raw, s:s.toISOString(), e:e.toISOString(), title: t !== b.t ? t : "" }) });
    } catch (err) {
      alert(`Could not change the calendar (${err.message}). Saved for today only.`);
      return saveBlock(b, s, e, t, moveLater);
    }
    log(`Changed ${b.t} in the calendar${t !== b.t ? ` to ${t}` : ""}: ${fmtT(s)} to ${fmtT(e)}`);
    const de = e - b.e;
    await writeOps(o => {
      delete o.edits[b.key];   // the calendar now holds the change
      if (moveLater && de) blocks().forEach(x => {
        if (x.key === b.key || x.s < b.e) return;
        setBlock(o, x, new Date(x.s.getTime() + de), new Date(x.e.getTime() + de), x.t);
      });
    });
    await pullAll();
  }
  async function addBlockCal(t, s, e, makeRoom){
    try { await qfetch("/cal/event", { method:"POST", body:JSON.stringify({ s:s.toISOString(), e:e.toISOString(), title:t }) }); }
    catch (err) { alert(`Could not add it to the calendar (${err.message}). Added for today only.`); return addBlock(t, s, e, makeRoom); }
    log(`Added ${t} to the calendar: ${fmtT(s)} to ${fmtT(e)}`);
    if (makeRoom) await writeOps(o => blocks().forEach(x => {
      if (x.s < s) return;
      setBlock(o, x, new Date(x.s.getTime() + (e - s)), new Date(x.e.getTime() + (e - s)), x.t);
    }));
    await pullAll();
  }
  function dropBlock(b){
    log(`Removed ${b.t} from today`);
    return writeOps(o => {
      if (b.extra) o.adds = o.adds.filter(x => x.key !== b.key);
      else { if (!o.drops.includes(b.key)) o.drops.push(b.key); delete o.edits[b.key]; }
    });
  }
  function addBlock(t, s, e, makeRoom){
    log(`Added ${t}: ${fmtT(s)} to ${fmtT(e)}`);
    const dur = e - s;
    return writeOps(o => {
      if (makeRoom) blocks().forEach(x => {
        if (x.s < s) return;
        setBlock(o, x, new Date(x.s.getTime() + dur), new Date(x.e.getTime() + dur), x.t);
      });
      o.adds.push({ key:"x" + s.getTime(), s:s.toISOString(), e:e.toISOString(), t, type:"task", cal:"you" });
    });
  }
  // time inputs speak the calendar's clock, not the device's
  const toField = d => { const p = tzParts(d, { hour:"2-digit", minute:"2-digit", hourCycle:"h23" });
    return `${p.hour === "24" ? "00" : p.hour}:${p.minute}`; };
  function fromField(v, ref){
    const [h, m] = v.split(":").map(Number);
    const p = tzParts(ref, { year:"numeric", month:"2-digit", day:"2-digit" });
    const guess = Date.UTC(+p.year, +p.month - 1, +p.day, h, m);
    return new Date(guess - tzOff(new Date(guess)) * 60000);
  }

  function openEdit(b){
    openSheet(`<h3>Change this block</h3>
      <input id="eT" value="${esc(b.t)}" maxlength="80">
      <div class="row"><label>Start<input id="eS" type="time" value="${toField(b.s)}"></label>
        <label>End<input id="eE" type="time" value="${toField(b.e)}"></label></div>
      ${canCal(b) ? `<label class="check"><input id="eCal" type="checkbox" checked> Change it in Google Calendar (${esc(b.cal)})</label>` : ""}
      <label class="check"><input id="eMove" type="checkbox"> Move everything after it too (today only)</label>
      <div class="actions"><button class="btn ghost" id="eCancel">Cancel</button><button class="btn primary" id="eSave">Save</button></div>
      <div class="actions"><button class="btn danger" id="eDrop">Remove from today</button></div>
      <p style="font-size:12px">${canCal(b) ? "Remove only hides it for today. It never deletes the calendar event."
        : b.id && !questKey() ? "Pair this device in ⚙️ to change the calendar too. Until then, changes last for today."
        : "This block is not a calendar event (Stillness made it), so changes last for today."} Stillness shows every change.</p>`);
    $("eCancel").onclick = closeSheet;
    $("eSave").onclick = () => {
      const t = $("eT").value.trim() || b.t;
      const s = fromField($("eS").value, b.s);
      let e = fromField($("eE").value, b.s);
      if (e <= s) e = new Date(e.getTime() + 86400000);   // runs past midnight
      const cal = $("eCal") && $("eCal").checked;
      closeSheet(); (cal ? saveBlockCal : saveBlock)(b, s, e, t, $("eMove").checked);
    };
    $("eDrop").onclick = () => { closeSheet(); dropBlock(b); };
  }

  function openAdd(from){
    const t0 = new Date(Math.ceil(Math.max(now().getTime(), from ? from.getTime() : 0) / 300000) * 300000);
    let dur = 30;
    openSheet(`<h3>Add to today</h3>
      <input id="aT" placeholder="What is it?" maxlength="80">
      <div class="row"><label>Start<input id="aS" type="time" value="${toField(t0)}"></label></div>
      <div class="chips" style="grid-template-columns:repeat(4,1fr)">${[15,30,60,90].map(m =>
        `<button class="chip ${m === dur ? "sel" : ""}" data-d="${m}" style="text-align:center">${m < 60 ? m + "m" : m/60 + "h"}</button>`).join("")}</div>
      ${questKey() && !DRY ? `<label class="check"><input id="aCal" type="checkbox" checked> Add it to Google Calendar (Junyan)</label>` : ""}
      <label class="check"><input id="aRoom" type="checkbox"> Make room (push what follows later, today only)</label>
      <div class="actions"><button class="btn ghost" id="aCancel">Cancel</button><button class="btn primary" id="aGo">Add</button></div>`);
    $("sheet").querySelectorAll("[data-d]").forEach(c => c.onclick = () => {
      $("sheet").querySelectorAll("[data-d]").forEach(x => x.classList.remove("sel"));
      c.classList.add("sel"); dur = +c.dataset.d;
    });
    $("aCancel").onclick = closeSheet;
    $("aGo").onclick = () => {
      const t = $("aT").value.trim(); if (!t) { $("aT").focus(); return; }
      const s = fromField($("aS").value, now()), e = new Date(s.getTime() + dur * 60000);
      const cal = $("aCal") && $("aCal").checked;
      closeSheet(); (cal ? addBlockCal : addBlock)(t, s, e, $("aRoom").checked);
    };
    setTimeout(() => $("aT").focus(), 300);
  }


  /* ---------- gym log (2026-10-05) ----------
     Tapping a gym block opens a logger for Junyan's two programs, from his
     Notion "Gym" page: Jack Woods rings calisthenics (Day 1 / Day 2, levels
     1-7 per move) and Matthew I. Smith's Pike & Head to Toe mobility. Sets are
     the Two Set Method he logs by hand: 2 warm-up + 2 working. Saving sends the
     session to still-api, which keeps it and writes his Workout Tracker rows. */
  const LADDER = {
    PPU: ["Zero weight","Shoulders distance from rings","Tuck","Hips level with shoulders","Extend hips","Advanced tuck 90°","Full lay"],
    FLR: ["Zero weight","Shoulders distance from rings","Tuck","Hips level with shoulders","Extend hips","Advanced tuck 90°","Full lay"],
    HSPU: ["Zero weight","Pike","Elevate feet","Shoulder stand","Partial range strap assisted","Partial range unassisted","Archer push-ups"],
    NC: ["Support with hands","Support with hands","Support with hands","No hands partial range","No hands negative","No hands positive","Weighted body flat"],
    OAC: ["2-arm dead hang","One-arm dead hang","2-arm partial range","2-arm full range","Partial range negative OAC","Full range negative OAC","Partial range positive"],
    SLS: ["Use arms, no weight","Negative only","Positive as well","10 kg","20 kg","30 kg","40 kg"],
  };
  const MOVE = { NC:"Nordic Hamstring Curl", OAC:"One-Arm Chin", SLS:"Single-Leg Squat", HSPU:"Handstand Push-Up", FLR:"Front Lever Rows", PPU:"Planche Push-Up" };
  const PROGRAMS = {
    "Jack Woods · Day 1": { strength:["NC","OAC","SLS"], mobility:["Bridge","Pike","Butterfly","Front Split","Pancake","Handstand"] },
    "Jack Woods · Day 2": { strength:["HSPU","FLR","PPU"], mobility:["Bridge","Pike","Front Split","Pancake","V-sit"] },
    "Matthew I. Smith · Phase 1": { mis:[["Rolling Feet","90s per side","1-2"],["Calf Stretch, single-leg standing","90s","2-3"],
      ["Sciatic Nerve Ankle Joint Floss","8 reps · 3s up / 3s down","2-3"],["Hip Internal Rotation, lying","3 reps · 10s hold","2-3"],
      ["Pike Hang, standing B-stance","5 reps · contract 5s / relax 5s","2-3"]] },
    "Matthew I. Smith · Phase 2": { mis:[["Donkey Calf Stretch, single leg","90s","2-3"],["Your Pigeon Variation","30s","2-3"],
      ["Sciatic Nerve Knee Joint Floss","8 reps · 3-1-3-1","2-3"],["Hip Internal Rotation, seated","8 reps · 3s lift / 3s rest","2-3"],
      ["Pike Good Morning, standing round back","8 reps · 3-3-1-0","2-3"]] },
    "Matthew I. Smith · Phase 3": { mis:[["Knee Extension Calf Stretch, single leg","8 reps · 3s","2-3"],["Sciatic Nerve Ankle Joint Glide","6 reps · 3-1-3-1","2-3"],
      ["Pike Good Morning, leg elevated","8 reps · 2-3-1-0","2-3"],["Pike Active Lifts, seated single leg","5 reps · 1-1-1-5","2-3"]] },
  };
  const isGym = b => !!b && /\bgym\b|workout|calisthenics|rings/i.test(b.t);
  const ymdLocal = () => { const p = tzParts(now(), { year:"numeric", month:"2-digit", day:"2-digit" }); return `${p.year}-${p.month}-${p.day}`; };
  let GYM = null, gymTimer = null, gymInfo = { levels:{}, last:[] };

  async function loadGymInfo(){
    if (!questKey()) return;
    try { gymInfo = await qfetch("/quest/workout"); } catch {}
  }
  function gymDraftKey(){ return "quest-gym-" + ymdLocal(); }
  function newGym(program){
    const P = PROGRAMS[program], e = {};
    // start is null until the server knows his level: the first session sets it, it is not a level-up
    (P.strength || []).forEach(c => { const start = gymInfo.levels?.[c]?.level || null;
      e[c] = { level:start || 1, start, reps:["","","",""], lbs:["","","",""] }; });
    (P.mobility || []).forEach(m => { e["m:" + m] = { done:false }; });
    (P.mis || []).forEach(([m]) => { e["mis:" + m] = { sets:0 }; });
    return { program, e, at: now().toISOString() };
  }
  function suggestProgram(){
    const last = (gymInfo.last || []).slice().reverse().find(w => /Jack Woods/.test(w.program || ""));
    return last && /Day 1/.test(last.program) ? "Jack Woods · Day 2" : "Jack Woods · Day 1";
  }
  function saveDraft(){ try { localStorage.setItem(gymDraftKey(), JSON.stringify(GYM)); } catch {} }

  async function openGym(block){
    if (block && !G.day.checks[gk(block)]) checkIn(block);       // opening the log means you're there
    await loadGymInfo();
    try { GYM = JSON.parse(localStorage.getItem(gymDraftKey())); } catch { GYM = null; }
    if (!GYM || !PROGRAMS[GYM.program]) GYM = newGym(suggestProgram());
    GYM.blockKey = block ? block.key : null;
    drawGym();
  }
  function drawGym(){
    const P = PROGRAMS[GYM.program];
    const cell = (c, kind, i) => `<input class="set" id="g-${c}-${kind}-${i}" data-c="${c}" data-k="${kind}" data-i="${i}" inputmode="decimal"
      placeholder="${["W1","W2","S1","S2"][i]}" value="${esc(GYM.e[c][kind][i])}" aria-label="${MOVE[c]} ${kind} ${["warm-up 1","warm-up 2","working set 1","working set 2"][i]}">`;
    let h = `<div class="gym-head"><h3>🏋️ Gym log</h3><button class="btn ghost small" id="gClose">Close</button></div>
      <label class="glabel" for="gProg">Program</label>
      <select id="gProg">${Object.keys(PROGRAMS).map(k => `<option ${k === GYM.program ? "selected" : ""}>${k}</option>`).join("")}</select>`;
    (P.strength || []).forEach(c => {
      const x = GYM.e[c], up = x.start != null && x.level > x.start;
      h += `<div class="gmove"><div class="gtop"><b>${MOVE[c]}</b><span class="gl">
        <button class="lv" data-lv="${c}" data-d="-1" aria-label="Level down">−</button>
        <span class="lvn${up ? " up" : ""}">L${x.level}</span>
        <button class="lv" data-lv="${c}" data-d="1" aria-label="Level up">+</button></span></div>
        <div class="gsub">${esc(LADDER[c][x.level - 1])}${up ? " · new level" : x.start == null ? " · first time: set your current level" : ""}</div>
        <div class="grow"><span class="gk">reps</span>${[0,1,2,3].map(i => cell(c, "reps", i)).join("")}</div>
        <div class="grow"><span class="gk">lbs</span>${[0,1,2,3].map(i => cell(c, "lbs", i)).join("")}</div></div>`;
    });
    if (P.mobility) h += `<div class="glabel">Mobility</div><div class="gchips">${P.mobility.map(m =>
      `<button class="gchip${GYM.e["m:" + m].done ? " on" : ""}" data-mob="${esc(m)}">${GYM.e["m:" + m].done ? "✓ " : ""}${esc(m)}</button>`).join("")}</div>`;
    (P.mis || []).forEach(([m, how, sets]) => {
      const x = GYM.e["mis:" + m];
      h += `<div class="gmove"><div class="gtop"><b>${esc(m)}</b><span class="gl">
        <button class="lv" data-mis="${esc(m)}" data-d="-1" aria-label="One set fewer">−</button>
        <span class="lvn">${x.sets} sets</span>
        <button class="lv" data-mis="${esc(m)}" data-d="1" aria-label="One more set">+</button></span></div>
        <div class="gsub">${esc(how)} · ${sets} sets</div></div>`;
    });
    h += `<div class="gfoot"><button class="btn" id="gRest">Rest 90s</button><button class="btn primary" id="gSave">Finish and save</button></div>
      <p class="gnote" id="gMsg">Sets save to your Workout Tracker in Notion: 2 warm-up, 2 working, reps and lbs. Leave a box empty to skip it.</p>`;
    openSheet(h, true);
    const sh = $("sheet");
    $("gClose").onclick = () => { saveDraft(); stopRest(); closeSheet(); };
    $("gProg").onchange = e => { GYM = newGym(e.target.value); saveDraft(); drawGym(); };
    sh.querySelectorAll("input.set").forEach(inp => inp.oninput = () => { GYM.e[inp.dataset.c][inp.dataset.k][+inp.dataset.i] = inp.value.trim(); saveDraft(); });
    sh.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { const x = GYM.e[b.dataset.lv]; x.level = Math.min(7, Math.max(1, x.level + +b.dataset.d)); saveDraft(); drawGym(); });
    sh.querySelectorAll("[data-mob]").forEach(b => b.onclick = () => { const x = GYM.e["m:" + b.dataset.mob]; x.done = !x.done; saveDraft(); drawGym(); });
    sh.querySelectorAll("[data-mis]").forEach(b => b.onclick = () => { const x = GYM.e["mis:" + b.dataset.mis]; x.sets = Math.max(0, x.sets + +b.dataset.d); saveDraft(); drawGym(); });
    $("gRest").onclick = startRest;
    $("gSave").onclick = saveGym;
  }
  // the rest timer is the one place seconds make sense
  function startRest(){
    stopRest(); let left = 90; const b = $("gRest");
    const step = () => { if (!b.isConnected) return stopRest(); b.textContent = left > 0 ? `Rest ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : "Go!";
      if (left-- <= 0) { stopRest(); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); } };
    step(); gymTimer = setInterval(step, 1000);
  }
  function stopRest(){ clearInterval(gymTimer); gymTimer = null; }

  async function saveGym(){
    const P = PROGRAMS[GYM.program], entries = [];
    (P.strength || []).forEach(c => { const x = GYM.e[c];
      if (x.reps.some(v => v !== "") || (x.start != null && x.level !== x.start))
        entries.push({ code:c, name:MOVE[c], kind:"strength", level:x.level, levelName:LADDER[c][x.level - 1], reps:x.reps, lbs:x.lbs }); });
    (P.mobility || []).forEach(m => { if (GYM.e["m:" + m].done) entries.push({ name:m, kind:"mobility", setsDone:1, note:"mobility" }); });
    (P.mis || []).forEach(([m, how]) => { const x = GYM.e["mis:" + m]; if (x.sets) entries.push({ name:m, kind:"mobility", setsDone:x.sets, note:how }); });
    if (!entries.length) { $("gMsg").textContent = "Nothing logged yet. Fill in at least one set."; return; }
    const ups = entries.filter(x => x.code && GYM.e[x.code].start != null && x.level > GYM.e[x.code].start);
    const working = entries.reduce((a, x) => a + (x.reps ? x.reps.slice(2).filter(v => v !== "").length : (x.setsDone || 0)), 0);
    $("gSave").disabled = true; $("gMsg").textContent = "Saving…";
    let msg;
    if (DRY) msg = "Test mode: nothing sent.";
    else if (!questKey()) msg = "Pair this device in ⚙️ to save to Notion. Your sets are kept on this phone for now.";
    else {
      try {
        const r = await qfetch("/quest/workout", { method:"POST", body:JSON.stringify({ date:ymdLocal(), program:GYM.program, entries }) });
        msg = r.notion && r.notion.rows ? `Saved. ${r.notion.rows} rows added to your Workout Tracker.` : "Saved on the server.";
        if (r.notion && r.notion.errors && r.notion.errors.length) msg += ` Notion refused ${r.notion.errors.length}: ${r.notion.errors[0]}`;
        try { localStorage.removeItem(gymDraftKey()); } catch {}
      } catch (e) { $("gSave").disabled = false; $("gMsg").textContent = "Could not save: " + e.message + ". Your sets are still here."; return; }
    }
    const warm = entries.reduce((a, x) => a + (x.reps ? x.reps.slice(0, 2).filter(v => v !== "").length : 0), 0);
    award(5 * warm + 15 * working, `Gym log: ${GYM.program}, ${entries.length} moves (${warm} warm-up, ${working} working sets)`, { label:"sets climbed" });
    ups.forEach((x, i) => setTimeout(() => { G.ropes = (G.ropes || 0) + 1;
      award(50, `Level up: ${x.name} L${x.level} (${x.levelName}). Fixed rope added: +20 m on every gym climb from now on`, { label:`${x.code} level ${x.level}!` });
      banner("🪢", "FIXED ROPE", `${x.name} level ${x.level}`); }, 900 * (i + 1)));
    const b = GYM.blockKey && blocks().find(x => x.key === GYM.blockKey);
    if (b && !G.day.closes[gk(b)]) G.day.closes[gk(b)] = "done";
    saveG();
    $("gMsg").textContent = msg; $("gSave").textContent = "Saved";
  }

  /* ---------- pings while the page is open (devices without phone push) ---------- */
  const fired = new Set();
  function ping(id, title, body){
    if (fired.has(id)) return; fired.add(id);
    if (navigator.vibrate) navigator.vibrate([60,80,60]);
    if (store.get("quest-push")) return;   // the server pings this device instead
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification(title, { body, icon:"quest-icon-180.png", tag:id }); } catch {}
    }
  }
  function pings(all, t){
    all.forEach(b => {
      if (!needsCheck(b)) return;
      const toStart = (b.s - t) / 60000, toEnd = (b.e - t) / 60000;
      if (toStart <= 5 && toStart > 4) ping("pre|" + b.key, `In 5 min: ${b.t}`, `Starts ${fmtT(b.s)}. Wrap up what you're on.`);
      if (toStart <= 0 && toStart > -1) ping("go|" + b.key, `Time to climb: ${b.t}`, `Tap Start within 5 min for the full climb.`);
      if (toEnd <= 5 && toEnd > 4 && G.day.checks[gk(b)]) ping("end|" + b.key, `5 min left: ${b.t}`, `Start closing it out.`);
    });
  }

  /* ---------- render ----------
     Markup is only replaced when it changes, so a tap is never lost to a
     rebuild mid-press. Seconds live in data-until / data-since spans that
     tick() fills in place. */
  function put(id, html){ const el = $(id); if (el._h !== html) { el._h = html; el.innerHTML = html; } }
  function tick(){
    const t = now();
    document.querySelectorAll("[data-until]").forEach(el => el.textContent = fmtLeft((new Date(el.dataset.until) - t) / 1000));
    document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmtAgo((t - new Date(el.dataset.since)) / 1000));
    document.querySelectorAll("[data-ring-s]").forEach(el => {
      const s = new Date(el.dataset.ringS), e = new Date(el.dataset.ringE), C = 2 * Math.PI * 30;
      const frac = Math.max(0, Math.min(1, (e - t) / (e - s)));
      el.style.strokeDashoffset = C * (1 - frac);
    });
  }

  /* ---------- the mountain (Trail, chosen 2026-10-05) ----------
     One stop per calendar block. Runs of Open space and Rest fold into one
     "Free time" stop. Anchors (sleep, practice, body, fuel) are campfires that
     light on check-in. A side quest in progress is a dragon on its stop; a
     finished one leaves a flag. A storm cloud follows you while you are away. */
  function stopsOf(all){
    const out = [];
    for (const b of all) {
      const free = b.kind === "open" || b.kind === "break";
      const last = out[out.length - 1];
      if (free && last && last.free && b.s - last.e <= 15 * 60000) { last.e = new Date(Math.max(last.e, b.e)); last.blocks.push(b); continue; }
      if (b.kind === "break") continue;
      out.push({ free, s:b.s, e:b.e, t: free ? "Free time" : b.t, kind:b.kind, blocks:[b] });
    }
    for (const st of out) {
      const ch = st.blocks.map(b => G.day.checks[gk(b)]).filter(Boolean);
      st.anchor = !st.free && isHealth(st.blocks[0]);
      st.lit = ch.some(c => c === "in" || c === "late");
      st.skipped = ch.length > 0 && ch.every(c => c === "skip");
      st.flags = (G.day.sideDone || []).filter(k => st.blocks.some(b => gk(b) === k)).length;
    }
    return out;
  }
  function mountainSVG(stops, cur, t, zap){
    if (!stops.length) return `<div class="empty">No blocks today.</div>`;
    const n = stops.length, W = 340, ROW = 56, H = 96 + n * ROW;
    const P = stops.map((_, i) => ({ x: Math.round(170 + 92 * Math.sin(i * 1.15 + 0.5)), y: H - 58 - i * ROW }));
    const START = { x:170, y:H - 10 }, SUMMIT = { x:170, y:30 };
    const ALL = [START, ...P, SUMMIT];
    let curI = stops.findIndex(st => cur && st.blocks.some(b => b.key === cur.key));
    const passed = stops.reduce((a, st, i) => st.e <= t ? i : a, -1);
    const here = curI >= 0 ? curI : passed;              // between stops: wait at the last one passed
    const tp = here < 0 ? START : here >= n ? SUMMIT : P[here];
    let out = `<svg class="mtn-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Today's trail, ${n} stops">`;
    out += `<polygon class="m2" points="-20,${H} 60,${H * .38} 170,${H}"/><polygon class="m2" points="160,${H} 290,${H * .3} 380,${H}"/>`;
    out += `<polygon class="m1" points="0,${H} 170,8 340,${H}"/>`;
    for (let k = 0; k < 20; k++) { const sx = (k * 97) % 340, sy = (k * 53) % 150 + 6; if (Math.abs(sx - 170) < (sy + 10) * .5) continue;
      out += `<circle class="star" cx="${sx}" cy="${sy}" r="${k % 3 ? .9 : 1.4}" style="animation-delay:${(k % 7) * .4}s"/>`; }
    for (let k = 1; k < ALL.length; k++) {
      const p0 = ALL[Math.max(k - 2, 0)], p1 = ALL[k - 1], p2 = ALL[k], p3 = ALL[Math.min(k + 1, ALL.length - 1)];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6, c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      out += `<path class="seg${k - 1 <= here ? " walked" : ""}" d="M${p1.x},${p1.y} C${c1x},${c1y} ${c2x},${c2y} ${p2.x},${p2.y}"/>`;
    }
    out += `<text class="tm" x="${START.x}" y="${START.y + 2}" text-anchor="middle">MORNING</text>`;
    out += `<text class="emo" x="${SUMMIT.x + 12}" y="${SUMMIT.y + 8}">⛺</text><text class="tm" x="${SUMMIT.x - 10}" y="${SUMMIT.y + 4}" text-anchor="end">${esc(peakName().toUpperCase())} · ${fmtM(SUMMIT_H)}</text>`;
    stops.forEach((st, i) => {
      const p = P[i], left = p.x >= 170, ax = left ? -22 : 22, anc = left ? "end" : "start";
      const isCur = i === curI, past = st.e <= t && !isCur;
      out += `<g class="stopg${past ? " past" : ""}" data-stop="${i}" transform="translate(${p.x},${p.y})">`;
      out += `<circle class="hit" r="24"/>`;
      if (st.anchor) {
        out += `<g class="fire${st.lit ? " lit" : ""}"><circle class="glow" r="19"/>` +
          `<rect class="logr" x="-10" y="4" width="20" height="4" rx="2" transform="rotate(18)"/><rect class="logr" x="-10" y="4" width="20" height="4" rx="2" transform="rotate(-18)"/>` +
          `<path class="flame" d="M0,6 C-9,1 -7,-8 0,-17 C1,-10 8,-8 7,-1 C6,4 3,6 0,6Z"/><path class="flame2" d="M0,5 C-4,2 -3,-3 0,-8 C1,-4 4,-3 3,1 C3,4 1,5 0,5Z"/></g>`;
      } else {
        out += `<circle class="dotm${st.lit || (past && st.free) ? " done" : ""}${st.skipped ? " skip" : ""}" r="${st.free ? 6 : 8}"/>`;
      }
      if (isCur) out += `<circle class="ringm" r="15"/>`;
      const name = st.t.length > 24 ? st.t.slice(0, 23) + "…" : st.t;
      const tag = ` · +${st.blocks.filter(needsCheck).reduce((a, b) => a + climbOf(b), 0)} m`;
      out += `<text class="tm" x="${ax}" y="-3" text-anchor="${anc}">${fmtT(st.s)}${tag}</text>`;
      out += `<text class="nm${st.skipped ? " gone" : ""}" x="${ax}" y="11" text-anchor="${anc}">${esc(name)}</text>`;
      const badge = (isCur && st.free && G.day.side ? "🐉" : "") + "🚩".repeat(Math.min(st.flags, 3));
      if (badge) out += `<text class="emo sm" x="${left ? 14 : -14}" y="-10" text-anchor="middle">${badge}</text>`;
      out += `</g>`;
    });
    out += `<g class="trav" transform="translate(${tp.x},${tp.y})"><circle class="halo" r="16"/><circle class="me" r="7"/>`;
    if (zap) out += `<g class="cloud" transform="translate(0,-40)"><ellipse cx="-9" cy="0" rx="11" ry="8"/><ellipse cx="6" cy="-4" rx="13" ry="10"/><ellipse cx="15" cy="2" rx="9" ry="7"/><ellipse cx="2" cy="4" rx="15" ry="6"/>` +
      [-10, -2, 6, 14].map((x, k) => `<line class="rain" x1="${x}" y1="12" x2="${x - 2}" y2="17" style="animation-delay:${k * .17}s"/>`).join("") +
      `<path class="bolt" d="M3,8 L-2,17 L2,17 L-1,24 L7,13 L3,13 L6,8Z"/></g>`;
    out += `</g></svg>`;
    return out;
  }
  // Days saved before Altitude (2026-10-05) lack its fields; the season starts at 0 m
  function ensureDay(){
    const d = G.day;
    if (d.o2 == null) { d.o2 = 80; d.o2At = now().toISOString(); }
    d.caches = d.caches || {}; d.camps = d.camps || 0; d.ledge = d.ledge || 0;

    // loose ends: the latest ended block that was started but never closed
    const loose = all.filter(b => b.e <= t && G.day.checks[gk(b)] && G.day.checks[gk(b)] !== "skip" && !G.day.closes[gk(b)]).pop();
    put("loose", loose && !z ? `<div class="card loose"><div class="eyebrow">Loose end</div>
      <div class="q">Did “${esc(loose.t)}” actually close?</div>

    $("loose").querySelectorAll("[data-close]").forEach(bn => bn.onclick = () => closeOut(loose, bn.dataset.close));

        <div class="quest-title"><span class="em">${(ZAPS.find(x => x[1] === z.type) || ["✨"])[0]}</span><span>${esc(z.type)}</span></div>

    } else if (!cur) {
