  /* ---------- feelings and needs (Junyan, 2026-10-10: "I want it to actually help me with my
     NVC practice") ----------
     Two ways in. "How are you, really?" is a check-in (asked twice a day, about 1 PM and 8 PM,
     and any time from the Heart actions): a feeling word from the CNVC inventory, how strong,
     the need behind it, an optional line on what happened. "Conflict" walks Rosenberg's four
     steps on the spot (ground first, then observation, feelings, needs, a guess at theirs, a
     request) and keeps the result in his Feelings journal on still-api. Both read prana
     and body from the feelings (nvc-words.js has each family's amounts; d12). The words he
     uses are counted across days, so the app can show his vocabulary growing and offer words
     he has not used yet. */
  const NV = window.NVC_WORDS || { families:[], needs:[], thoughts:[] };
  const NV_FAM = w => NV.families.find(f => f.words.includes(w) || f.name.toLowerCase() === w);
  const NV_STRONG = [["a little", .5], ["clearly", 1], ["strongly", 1.5]];
  const nvLabel = w => w.replace(/-/g, " ");
  const nvVocab = () => (G.nvc = G.nvc || { words:{}, needs:{} });
  function nvScore(words, strong = 1){
    const fams = [...new Set(words.map(NV_FAM).filter(Boolean))];
    const k = (NV_STRONG[strong] || NV_STRONG[1])[1];
    const p = Math.max(-10, Math.min(10, Math.round(fams.reduce((a, f) => a + f.p, 0) * k)));
    const b = Math.max(-6, Math.min(6, Math.round(fams.reduce((a, f) => a + f.b, 0) * k)));
    return { p, b };
  }
  // twice a day: about 1 PM and 8 PM, once per window
  const NV_WINDOWS = [[12.5, 16, "afternoon"], [19.5, 23, "evening"]];
  function nvDue(){
    const p = tzParts(now(), { hour:"numeric", minute:"numeric", hourCycle:"h23" }), h = +p.hour + +p.minute / 60;
    const w = NV_WINDOWS.find(([a, z]) => h >= a && h < z); if (!w) return null;
    return (G.day.feel || []).some(x => x.kind === "checkin" && x.win === w[2]) ? null : w[2];
  }
  // the word picker: met or not met, a family, then the exact word. New words are marked.
  function nvFeelPicker(sel, side, opts = {}){
    const V = nvVocab().words, open = opts.open || "";
    const fams = NV.families.filter(f => side === "met" ? f.met : side === "unmet" ? !f.met : true);
    const famBtns = fams.map(f => {
      const n = f.words.filter(w => sel.includes(w)).length;
      return `<button class="nvc-fam${open === f.name ? " open" : ""}${n ? " on" : ""}" data-fam="${f.name}">${f.icon} ${f.name}${n ? ` · ${n}` : ""}</button>`;
    }).join("");
    const f = fams.find(x => x.name === open);
    const words = f ? `<div class="nvc-words">${f.words.map(w => `<button class="nvc-w${sel.includes(w) ? " on" : ""}" data-w="${w}">${nvLabel(w)}${V[w] ? "" : `<i>new</i>`}</button>`).join("")}</div>
      <p class="nvc-tip">Pick the exact word. ${f.words.filter(w => !V[w]).length} here you have not used yet.</p>` : "";
    return `<div class="nvc-fams">${famBtns}</div>${words}`;
  }
  function nvNeedPicker(sel, open){
    const V = nvVocab().needs;
    const cats = NV.needs.map(c => `<button class="nvc-fam${open === c.name ? " open" : ""}${c.words.some(w => sel.includes(w)) ? " on" : ""}" data-cat="${c.name}">${c.name}</button>`).join("");
    const c = NV.needs.find(x => x.name === open);
    return `<div class="nvc-fams">${cats}</div>${c ? `<div class="nvc-words">${c.words.map(w => `<button class="nvc-w${sel.includes(w) ? " on" : ""}" data-n="${w}">${nvLabel(w)}${V[w] ? "" : `<i>new</i>`}</button>`).join("")}</div>` : ""}`;
  }
  function nvRemember(feel, needs){
    const V = nvVocab();
    feel.forEach(w => V.words[w] = (V.words[w] || 0) + 1);
    needs.forEach(w => V.needs[w] = (V.needs[w] || 0) + 1);
  }
  const nvTotal = () => NV.families.reduce((a, f) => a + f.words.length, 0);
  const nvList = a => a.map(nvLabel).join(", ").replace(/, ([^,]*)$/, " and $1");
  function nvApply(entry){
    const sc = nvScore(entry.feelings, entry.strong);
    entry.p = sc.p; entry.b = sc.b;
    (G.day.feel = G.day.feel || []).push(entry);
    nvRemember(entry.feelings, entry.needs);
    const what = entry.kind === "conflict" ? "Conflict worked through" : "Check-in";
    if (sc.p) addPrana(sc.p, `${what}: ${nvList(entry.feelings)}`, "feelings");
    if (sc.b) addBody(sc.b, `${what}: ${nvList(entry.feelings)}`, "feelings");
    if (!sc.p && !sc.b) { log(`${what}: ${nvList(entry.feelings)}`); saveG(); }
  }

  // "How are you, really?"
  function openCheckin(S = { side:"", feel:[], strong:1, needs:[], note:"", open:"", openN:"", step:0 }){
    const sc = nvScore(S.feel, S.strong), V = nvVocab(), used = Object.keys(V.words).length;
    const head = `<h3>🫶 How are you, really?</h3><p class="nvc-tip">Your feeling words so far: ${used} of ${nvTotal()}.</p>`;
    let body = "";
    if (S.step === 0) body = `<div class="win-lb">Right now my needs are</div>
      <div class="actions"><button class="btn${S.side === "met" ? " primary" : ""}" data-side="met">🌞 Met</button><button class="btn${S.side === "unmet" ? " primary" : ""}" data-side="unmet">🌧️ Not met</button><button class="btn${S.side === "both" ? " primary" : ""}" data-side="both">Both</button></div>
      ${S.side ? `<div class="win-lb">I feel ${S.feel.length ? `<b>${esc(nvList(S.feel))}</b>` : "…"}</div>${nvFeelPicker(S.feel, S.side === "both" ? "" : S.side, { open:S.open })}` : ""}
      ${S.feel.length ? `<div class="win-lb">How strongly</div><div class="actions">${NV_STRONG.map(([t], i) => `<button class="btn${S.strong === i ? " primary" : ""}" data-strong="${i}">${t}</button>`).join("")}</div>
        <div class="actions"><button class="btn primary" data-next>Next: the need behind it ›</button></div>` : ""}`;
    else body = `<div class="win-lb">I feel ${esc(nvList(S.feel))} because I need ${S.needs.length ? `<b>${esc(nvList(S.needs))}</b>` : "…"}</div>
      ${nvNeedPicker(S.needs, S.openN)}
      <div class="win-lb">What happened (what a camera would see)</div>
      <textarea id="nvNote" rows="2" class="nvc-in" placeholder="Optional">${esc(S.note)}</textarea>
      <div class="actions"><button class="btn ghost" data-back>‹ Back</button><button class="btn primary" id="nvOk" ${S.needs.length ? "" : "disabled"}>Save · ${esc(mqSum(sc))}</button></div>`;
    openSheet(head + body + `<div class="actions"><button class="btn ghost" id="nvX">Not now</button></div>` + nvPastHTML(S), true);
    const sh = $("sheet"), keep = () => { const n = $("nvNote"); if (n) S.note = n.value; };
    nvPastBind(S, sh);
    const again = () => { keep(); const top = sh.scrollTop; openCheckin(S); $("sheet").scrollTop = top; };
    sh.querySelectorAll("[data-side]").forEach(b => b.onclick = () => { S.side = b.dataset.side; S.open = ""; again(); });
    sh.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => { S.open = S.open === b.dataset.fam ? "" : b.dataset.fam; again(); });
    sh.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { const w = b.dataset.w; S.feel = S.feel.includes(w) ? S.feel.filter(x => x !== w) : [...S.feel, w].slice(-3); again(); });
    sh.querySelectorAll("[data-strong]").forEach(b => b.onclick = () => { S.strong = +b.dataset.strong; again(); });
    sh.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.openN = S.openN === b.dataset.cat ? "" : b.dataset.cat; again(); });
    sh.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { const w = b.dataset.n; S.needs = S.needs.includes(w) ? S.needs.filter(x => x !== w) : [...S.needs, w].slice(-2); again(); });
    const nx = sh.querySelector("[data-next]"); if (nx) nx.onclick = () => { S.step = 1; again(); };
    const bk = sh.querySelector("[data-back]"); if (bk) bk.onclick = () => { S.step = 0; again(); };
    $("nvX").onclick = closeSheet;
    if ($("nvOk")) $("nvOk").onclick = () => {
      keep();
      const e = { id:"f" + Date.now(), kind:"checkin", at:now().toISOString(), win:nvDue() || "", feelings:S.feel, strong:S.strong, needs:S.needs, observation:S.note.trim() };
      nvApply(e);
      (G.nvcOut = G.nvcOut || []).push(e); saveG();   // into the feelings journal on the server
      nvSend();
      closeSheet(); render();
    };
  }

  // "Conflict": Rosenberg's four steps on the spot, then into the Feelings journal
  const NV_EVAL = /\b(always|never|you are|you're|should|rude|lazy|selfish|ignored|on purpose|every time|again)\b/i;
  const NV_DEMAND = /\b(stop|don'?t|never|quit|have to|must)\b/i;
  const NV_DEMAND_MSG = "Say what you do want, not what to stop. Something they can do now.";
  const nvEvalMsg = t => `"${(t.match(NV_EVAL) || [""])[0]}" sounds like an evaluation. What exactly did they say or do?`;
  const NV_STEPS = ["Ground", "What happened", "I feel", "I need", "Their side", "My request", "Say it"];
  function nvTranslation(S){
    const o = S.obs.trim().replace(/^when\s+/i, "").replace(/^(?!I\b)\w/, c => c.toLowerCase());
    const mine = `When ${o || "…"}, I feel ${nvList(S.feel) || "…"} because I need ${nvList(S.needs) || "…"}.${S.req.trim() ? ` ${S.req.trim()}` : ""}`;
    const theirs = S.tFeel.length || S.tNeeds.length ? `\nAre you feeling ${nvList(S.tFeel) || "…"} because you need ${nvList(S.tNeeds) || "…"}?` : "";
    return mine + theirs;
  }
  function openConflict(S = { step:0, who:"", obs:"", feel:[], needs:[], tFeel:[], tNeeds:[], req:"Would you be willing to ", say:"", open:"", openN:"", strong:1 }){
    const pills = `<div class="nvc-steps">${NV_STEPS.map((t, i) => `<span class="${i === S.step ? "on" : i < S.step ? "done" : ""}">${t}</span>`).join("")}</div>`;
    const nav = (next, ok = true) => `<div class="actions">${S.step ? `<button class="btn ghost" data-back>‹ Back</button>` : ""}<button class="btn primary" data-go ${ok ? "" : "disabled"}>${next}</button></div>`;
    let body = "";
    if (S.step === 0) body = `<p><b>Breathe first.</b> Don't just do something, stand there. Listen to understand, not to respond.</p>
      <p>If you are losing control: <i>"I need a moment to step away, is that okay with you?"</i> Twenty minutes is enough.</p>
      <div class="actions"><button class="btn" id="nvAway">🚶 Step away now</button></div>${nav("I'm calm enough, start ›")}`;
    if (S.step === 1) { const ev = NV_EVAL.test(S.obs); body = `<div class="win-lb">With</div><input id="nvWho" class="nvc-in" value="${esc(S.who)}" placeholder="Who (optional)">
      <div class="win-lb">When I saw or heard</div><textarea id="nvObs" rows="3" class="nvc-in" placeholder="Only what a camera would record: the words said, the thing done.">${esc(S.obs)}</textarea>
      <p class="nvc-warn" id="nvObsW">${ev ? nvEvalMsg(S.obs) : ""}</p>${nav("Next: what I feel ›", !!S.obs.trim())}`; }
    if (S.step === 2) body = `<div class="win-lb">I feel ${S.feel.length ? `<b>${esc(nvList(S.feel))}</b>` : "…"}</div>${nvFeelPicker(S.feel, "unmet", { open:S.open })}
      <div class="win-lb">Thinking a word like these? Tap it to find the feeling under it</div>
      <div class="nvc-words">${NV.thoughts.map(t => `<button class="nvc-w thought" data-t="${t.w}">"${t.w}"</button>`).join("")}</div>
      ${S.hint ? `<p class="nvc-tip">"${esc(S.hint.w)}" is a thought about them. Underneath it you may feel <b>${esc(nvList(S.hint.feel))}</b>, needing <b>${esc(nvList(S.hint.need))}</b>. Tap the words that fit.</p>
        <div class="nvc-words">${S.hint.feel.map(w => `<button class="nvc-w${S.feel.includes(w) ? " on" : ""}" data-w="${w}">${nvLabel(w)}</button>`).join("")}</div>` : ""}
      ${S.feel.length ? `<div class="win-lb">How strongly</div><div class="actions">${NV_STRONG.map(([t], i) => `<button class="btn${S.strong === i ? " primary" : ""}" data-strong="${i}">${t}</button>`).join("")}</div>` : ""}
      ${nav("Next: what I need ›", S.feel.length > 0)}`;
    if (S.step === 3) body = `<div class="win-lb">I feel ${esc(nvList(S.feel))} because I need ${S.needs.length ? `<b>${esc(nvList(S.needs))}</b>` : "…"}</div>
      ${nvNeedPicker(S.needs, S.openN)}${S.hint && S.hint.need.length ? `<p class="nvc-tip">From "${esc(S.hint.w)}": maybe ${esc(nvList(S.hint.need))}.</p><div class="nvc-words">${S.hint.need.map(w => `<button class="nvc-w${S.needs.includes(w) ? " on" : ""}" data-n="${w}">${nvLabel(w)}</button>`).join("")}</div>` : ""}
      <p class="nvc-tip">A need is never about a person doing something. "I need you to listen" is a request; the need is to be heard.</p>${nav("Next: their side ›", S.needs.length > 0)}`;
    if (S.step === 4) body = `<p>Giraffe ears: guess what is alive in ${esc(S.who || "them")}. Silent guesses count.</p>
      <div class="win-lb">They may feel ${S.tFeel.length ? `<b>${esc(nvList(S.tFeel))}</b>` : "…"}</div>${nvFeelPicker(S.tFeel, "", { open:S.tOpen })}
      <div class="win-lb">Because they need ${S.tNeeds.length ? `<b>${esc(nvList(S.tNeeds))}</b>` : "…"}</div>${nvNeedPicker(S.tNeeds, S.tOpenN).replace(/data-cat=/g, "data-tcat=").replace(/data-n=/g, "data-tn=")}
      ${nav(S.tFeel.length || S.tNeeds.length ? "Next: my request ›" : "Skip ›")}`;
    if (S.step === 5) { const dem = NV_DEMAND.test(S.req); body = `<div class="win-lb">My request</div>
      <textarea id="nvReq" rows="2" class="nvc-in">${esc(S.req)}</textarea>
      <p class="nvc-warn" id="nvReqW">${dem ? NV_DEMAND_MSG : ""}</p><p class="nvc-tip">Positive, doable, now. If a no would upset you, it is a demand.</p>
      ${nav("Next: say it ›", S.req.trim().length > 10)}`; }
    if (S.step === 6) body = `<div class="win-lb">Giraffe translation</div>
      <textarea id="nvSay" rows="5" class="nvc-in">${esc(S.say || nvTranslation(S))}</textarea>
      <p class="nvc-tip">Change any word so it sounds like you. Saving keeps it in your Feelings journal.</p>
      <div class="actions"><button class="btn ghost" data-back>‹ Back</button><button class="btn primary" id="nvSave">Save · ${esc(mqSum(nvScore(S.feel, S.strong)))}</button></div>`;
    openSheet(`<h3>⚡ Conflict</h3>${pills}${body}<div class="actions"><button class="btn ghost" id="nvX">Close</button></div>` + nvPastHTML(S), true);
    const sh = $("sheet");
    nvPastBind(S, sh);
    const keep = () => { if ($("nvWho")) S.who = $("nvWho").value; if ($("nvObs")) S.obs = $("nvObs").value; if ($("nvReq")) S.req = $("nvReq").value; if ($("nvSay")) S.say = $("nvSay").value; };
    const again = () => { keep(); const top = sh.scrollTop; openConflict(S); $("sheet").scrollTop = top; };
    const tog = (arr, w, max) => arr.includes(w) ? arr.filter(x => x !== w) : [...arr, w].slice(-max);
    sh.querySelectorAll("[data-fam]").forEach(b => b.onclick = () => { if (S.step === 4) S.tOpen = S.tOpen === b.dataset.fam ? "" : b.dataset.fam; else S.open = S.open === b.dataset.fam ? "" : b.dataset.fam; again(); });
    sh.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { if (S.step === 4) S.tFeel = tog(S.tFeel, b.dataset.w, 3); else S.feel = tog(S.feel, b.dataset.w, 3); again(); });
    sh.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.hint = NV.thoughts.find(t => t.w === b.dataset.t); again(); });
    sh.querySelectorAll("[data-strong]").forEach(b => b.onclick = () => { S.strong = +b.dataset.strong; again(); });
    sh.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.openN = S.openN === b.dataset.cat ? "" : b.dataset.cat; again(); });
    sh.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { S.needs = tog(S.needs, b.dataset.n, 2); again(); });
    sh.querySelectorAll("[data-tcat]").forEach(b => b.onclick = () => { S.tOpenN = S.tOpenN === b.dataset.tcat ? "" : b.dataset.tcat; again(); });
    sh.querySelectorAll("[data-tn]").forEach(b => b.onclick = () => { S.tNeeds = tog(S.tNeeds, b.dataset.tn, 2); again(); });
    ["nvObs", "nvReq"].forEach(id => { const el = $(id); if (el) el.oninput = () => {
      keep(); const go = sh.querySelector("[data-go]"); if (go) go.disabled = id === "nvObs" ? !S.obs.trim() : S.req.trim().length <= 10;
      if (id === "nvObs") $("nvObsW").textContent = NV_EVAL.test(S.obs) ? nvEvalMsg(S.obs) : "";
      else $("nvReqW").textContent = NV_DEMAND.test(S.req) ? NV_DEMAND_MSG : "";
    }; });
    const go = sh.querySelector("[data-go]"); if (go) go.onclick = () => { keep(); S.step++; if (S.step === 6) S.say = ""; again(); };
    const bk = sh.querySelector("[data-back]"); if (bk) bk.onclick = () => { keep(); S.step--; again(); };
    if ($("nvAway")) $("nvAway").onclick = () => { log("Stepped away to calm down (Conflict)"); saveG(); closeSheet(); render(); };
    $("nvX").onclick = closeSheet;
    if ($("nvSave")) $("nvSave").onclick = () => {
      keep();
      const e = { id:"c" + Date.now(), kind:"conflict", at:now().toISOString(), who:S.who.trim(), observation:S.obs.trim(), feelings:S.feel, strong:S.strong,
        needs:S.needs, theirFeelings:S.tFeel, theirNeeds:S.tNeeds, request:S.req.trim(), translation:(S.say || nvTranslation(S)).trim() };
      nvApply(e);
      (G.nvcOut = G.nvcOut || []).push(e); saveG();
      nvSend();
      closeSheet(); render();
    };
  }
  /* The feelings journal (Junyan, 2026-10-10: "make a new Db somewhere easy"): every check-in
     and conflict is kept on still-api (/quest/nvc), the one store (d15: not Notion). Since d72
     (2026-10-20) it has no tile of its own: it sits collapsed as "Past entries" at the bottom of the
     How am I? and Conflict sheets and loads only when he opens it. It reads back what his words show:
     how many he uses, the ones he leans on, the families he has not touched, the needs that keep coming up. */
  async function nvJournalLoad(){
    let list = (G.day.feel || []).slice().reverse(), from = "today on this device";
    if (questKey() && !DRY) try { const r = await qfetch("/quest/nvc"); if (Array.isArray(r.entries) && r.entries.length) { list = r.entries; from = "all your entries"; } } catch {}
    return { list, from };
  }
  function nvJournalHTML({ list, from }){
    const V = nvVocab(), top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n);
    const usedFams = new Set(Object.keys(V.words).map(w => NV_FAM(w)).filter(Boolean).map(f => f.name));
    const untouched = NV.families.filter(f => !usedFams.has(f.name)).map(f => `${f.icon} ${f.name}`);
    const when = a => new Date(a).toLocaleString("en-US", { timeZone:PLAN_TZ || undefined, weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    const row = e => `<div class="nvc-entry"><div class="nvc-tip">${esc(when(e.at))} · ${e.kind === "conflict" ? `⚡ Conflict${e.who ? " with " + esc(e.who) : ""}` : "🫶 Check-in"}${e.p ? ` · prana ${e.p > 0 ? "+" : ""}${e.p}` : ""}</div>
      <div>I feel <b>${esc(nvList(e.feelings || []))}</b>${(e.needs || []).length ? ` because I need <b>${esc(nvList(e.needs))}</b>` : ""}.</div>
      ${e.observation ? `<div class="nvc-tip">${esc(e.observation)}</div>` : ""}${e.request ? `<div class="nvc-tip">${esc(e.request)}</div>` : ""}</div>`;
    return `<div class="win-lb">Your words</div>
      <p>${Object.keys(V.words).length} of ${nvTotal()} feeling words used, ${Object.keys(V.needs).length} needs named.</p>
      ${top(V.words, 5).length ? `<p class="nvc-tip">Most used: ${top(V.words, 5).map(([w, c]) => `${esc(nvLabel(w))} (${c})`).join(", ")}</p>` : ""}
      ${top(V.needs, 5).length ? `<p class="nvc-tip">Needs that keep coming up: ${top(V.needs, 5).map(([w, c]) => `${esc(nvLabel(w))} (${c})`).join(", ")}</p>` : ""}
      ${untouched.length ? `<p class="nvc-tip">Families you have not used yet: ${esc(untouched.join(", "))}</p>` : ""}
      <div class="win-lb">Entries (${esc(from)})</div>
      ${list.length ? list.slice(0, 60).map(row).join("") : `<p>No entries yet.</p>`}`;
  }
  // closed by default; S.past keeps it open across the sheet's redraws, S.pastData keeps the loaded entries
  function nvPastHTML(S){
    return `<details class="nvc-past"${S.past ? " open" : ""}><summary>📓 Past entries</summary>
      <div id="nvPast">${S.pastData ? nvJournalHTML(S.pastData) : S.past ? `<p class="nvc-tip">Loading…</p>` : ""}</div></details>`;
  }
  let nvPastOwner = null;   // the sheet state now on screen; a late answer only fills its own sheet (redraws replace the element)
  function nvPastBind(S, sh){
    nvPastOwner = S;
    const d = sh.querySelector(".nvc-past"); if (!d) return;
    const fill = () => { const el = $("nvPast"); if (el && nvPastOwner === S && S.pastData) el.innerHTML = nvJournalHTML(S.pastData); };
    const load = () => {
      if (S.pastData || S.pastLoading) return;
      S.pastLoading = nvJournalLoad().then(r => { S.pastData = r; S.pastLoading = null; fill(); });
    };
    d.ontoggle = () => {
      S.past = d.open;
      if (!d.open) return;
      if (S.pastData) fill(); else { $("nvPast").innerHTML = `<p class="nvc-tip">Loading…</p>`; load(); }   // closed mid-load, opened again: show what came
    };
    if (S.past && !S.pastData) load();
  }
  // check-ins and conflicts go to still-api (d15: not Notion); anything that could not go yet waits in G.nvcOut
  async function nvSend(){
    if (DRY || !questKey() || !(G.nvcOut || []).length) return;
    for (const e of [...G.nvcOut]) {
      try {
        const r = await qfetch("/quest/nvc", { method:"POST", body:JSON.stringify({ entry:e }) });
        G.nvcOut = G.nvcOut.filter(x => x.id !== e.id);
        if (e.kind === "conflict" && r.ok) log(`Saved to your Feelings journal: ${e.observation.slice(0, 40)}`);
        saveG();
      } catch { break; }   // offline: try again on the next pull
    }
  }

  // Sadhana (d86): Shambhavi with a 21-minute timer that starts with the tap
  const SHAMBHAVI_MIN = 21;
  let sadTimer = null;
  function openSadhana(b){
    const all = blocks(), k = gk(b), st = G.day.checks[k], closed = !!G.day.closes[k];
    const S = ((G.day.sad = G.day.sad || {})[k] = G.day.sad[k] || {});
    const endAt = S.at ? new Date(+new Date(S.at) + SHAMBHAVI_MIN * 60000) : null, t = now();
    const lastFood = lastMealBefore(t, all), empty = emptyStomach(t, all);
    openSheet(`${winHead(b)}
      <p>${empty ? "Empty stomach: a good time to practice." : `Last food ended ${fmtT(lastFood)}, ${fmtHM(Math.round((t - lastFood) / 60000))} ago. Isha asks for an empty stomach; do it anyway, lightly.`}</p>
      <div class="count"><div><div class="big">${endAt && endAt > t ? `<span data-until="${endAt.toISOString()}"></span>` : endAt ? "Complete" : `${SHAMBHAVI_MIN} min`}</div>
        <div class="sub">${endAt && endAt > t ? "left in Shambhavi" : endAt ? "Shambhavi done" : "Shambhavi Mahamudra Kriya"}</div></div></div>
      <div class="actions">${!S.at ? `<button class="btn primary" id="sStart">🪷 Start the ${SHAMBHAVI_MIN} min timer</button>` : ""}</div>
      <div class="actions"><button class="btn" id="sList">✓ Back to the checklist</button><button class="btn ghost" id="sEdit">Change time or name</button></div>`);
    clearTimeout(sadTimer);
    if (endAt && endAt > t && !closed) sadTimer = setTimeout(() => {
      banner("🪷", "SHAMBHAVI", "21 minutes. Sit a moment longer."); if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      if ($("sheet").classList.contains("open")) openSadhana(b);
    }, endAt - t);
    if ($("sStart")) $("sStart").onclick = () => { S.at = now().toISOString(); if (!st) checkIn(b); else saveG(); openSadhana(blocks().find(x => gk(x) === k) || b); };
    $("sEdit").onclick = () => openEdit(b);
    $("sList").onclick = () => openBasic(blocks().find(x => gk(x) === k) || b);
  }

  /* A booking's facts as one card (Junyan, 2026-10-16: "I need the check in and check out dates, room type and
     upgrade details clearly somewhere. The confirmation can be in smaller text just below the hotel name with a small
     copy button. Contact info and cancellation is also important."). The insight agent sends it as an item
     {kind:"booking", conf, via, in:{date,time,note}, out:{date,time,note}, room, guests, upgrade:{state,text},
     paid, card, cardWhy, perks:[[label,text]], phone, address, maps, cancel, cancelState}, read from the Travel Planner. */
  function bookingHtml(k){
    const row = (lb, v) => v ? `<div class="bk-row"><span>${esc(lb)}</span><span>${v}</span></div>` : "";
    const day = (lb, d) => d ? `<div><div class="bk-lb">${lb}</div><div class="bk-big">${esc(d.date || "")}</div><div class="bk-sm">${esc(d.time || "")}</div>${d.note ? `<div class="bk-note">${esc(d.note)}</div>` : ""}</div>` : "";
    const u = k.upgrade || null, pill = (st, txt) => `<span class="bk-pill ${esc(st)}">${esc(txt)}</span>`;
    const upTxt = { yes:"Approved", pending:"Pending", no:"Not given" };
    return `<div class="bk">
      ${k.conf ? `<div class="bk-conf">Confirmation <b>${esc(k.conf)}</b><button class="bk-copy" data-copy="${esc(k.conf)}">Copy</button>${k.via ? `<span>· ${esc(k.via)}</span>` : ""}</div>` : ""}
      ${k.in || k.out ? `<div class="bk-dates">${day("Check-in", k.in)}${day("Check-out", k.out)}</div>` : ""}
      <div class="bk-rows">
        ${row("Room", k.room ? `<b>${esc(k.room)}</b>${k.guests ? `<small>${esc(k.guests)}</small>` : ""}` : "")}
        ${row("Upgrade", u ? `${pill(u.state, upTxt[u.state] || u.state)}${esc(u.text || "")}` : "")}
        ${row("Paid", k.paid ? esc(k.paid) : "")}
        ${row("Card", k.card ? `<b>${esc(k.card)}</b>${k.cardWhy ? `<small>${esc(k.cardWhy)}</small>` : ""}` : "")}
        ${(k.perks || []).map(p => row(p[0], esc(p[1]))).join("")}
        ${row("Contact", [k.phone ? `${esc(k.phone)} <button class="bk-copy" data-copy="${esc(k.phone)}">Copy</button>` : "",
          k.address ? `<small>${k.maps ? `<a href="${esc(k.maps)}" target="_blank" rel="noopener">${esc(k.address)}</a>` : esc(k.address)}</small>` : ""].join(""))}
        ${row("Cancel", k.cancel ? `${k.cancelState ? pill(k.cancelState, k.cancelState === "passed" ? "Passed" : "Free") : ""}${esc(k.cancel)}` : "")}
      </div></div>`;
  }
  document.addEventListener("click", e => {
    const c = e.target.closest && e.target.closest("[data-copy]"); if (!c) return;
    e.stopPropagation();
    const done = () => { const o = c.textContent; c.textContent = "Copied"; setTimeout(() => c.textContent = o, 1400); };

  const LV = window.QuestLevels, GL = window.QuestGymLog;

  async function saveGym(){

    (P.strength || []).forEach(c => { const e = LV.toEntry(c, MOVE[c], GYM.e[c]); if (e) entries.push(e); });
    (P.mobility || []).forEach(m => { if (GYM.e["m:" + m].done) entries.push({ name:m, kind:"mobility", setsDone:1, note:"mobility" }); });
    (P.mis || []).forEach(([m, how]) => { const x = GYM.e["mis:" + m]; if (x.sets) entries.push({ name:m, kind:"mobility", setsDone:x.sets, note:how }); });
    const bw = LV.parseLbs(GYM.bw);
    if (GYM.bw && bw == null) { $("gMsg").textContent = "Body weight looks off. Type it in lbs, like 172.4."; return; }
    if (!entries.length && bw == null) { $("gMsg").textContent = "Nothing logged yet. Tap how a set went, or add your body weight."; return; }
    const fk = gymFeelKey();
    if (entries.length && !GYM.feel && !(G.day.mealq || {})[fk]) { $("gMsg").textContent = "How do you feel now? Tap one above, then save."; return; }
    const date = ymdLocal(), body = { date, program:GYM.program, entries };
    if (bw != null) body.bodyWeightLbs = bw;
    $("gSave").disabled = true; $("gMsg").textContent = "Saving…";
    let msg;
    if (DRY) msg = "Test mode: nothing sent.";
    else if (!questKey()) msg = "Pair this device in ⚙️ to save to Notion. Your log is kept on this phone for now.";
    else {
      try {
        const r = await qfetch("/quest/workout", { method:"POST", body:JSON.stringify(body) });
        msg = r.notion && r.notion.rows ? `Saved. ${r.notion.rows} rows added to your Workout Tracker.` : entries.length ? "Saved on the server." : "Body weight saved.";
        if (r.notion && r.notion.errors && r.notion.errors.length) msg += ` Notion refused ${r.notion.errors.length}: ${r.notion.errors[0]}`;
        try { localStorage.removeItem(gymDraftKey()); } catch {}
        // the weekly gym count and the body weight trend read this list (a body-weight-only save is not a session)
        if (entries.length) gymInfo.last = [...(gymInfo.last || []), { ...body, savedAt:now().toISOString() }];
        if (bw != null) gymInfo.body = LV.addReading(LV.readingsFrom(gymInfo.body, gymInfo.last), date, bw, now().toISOString());
        gymInfo.levels = LV.saveLevels(gymInfo.levels || {}, entries, date);   // only a passed Test moves a level, as on the server
      } catch (e) { $("gSave").disabled = false; $("gMsg").textContent = "Could not save: " + e.message + ". Your log is still here."; return; }
    }
    const tested = entries.reduce((a, x) => a + (x.tests ? x.tests.length : 0), 0);
    log(`Gym log: ${GYM.program}, ${entries.length} moves${tested ? `, ${tested} tests` : ""}${bw != null ? `, body weight ${bw} lbs` : ""}`); saveG();
    const b = GYM.blockKey && blocks().find(x => x.key === GYM.blockKey);
    if (entries.length && b && !G.day.closes[gk(b)]) G.day.closes[gk(b)] = "done";
    // the answer to "How do you feel now?" is what pays, once per gym block (logging alone earns nothing, d15)
    const pay = GL.feelPay(G.day.mealq, fk, GYM.feel, entries.length, gainMult());
    if (pay) {
      const said = `Gym: ${GL.feelById(GYM.feel).text.toLowerCase()}`;
      (G.day.mealq = G.day.mealq || {})[fk] = GL.feelRecord(GYM.feel, pay, now().toISOString());
      if (pay.b) addBody(pay.b, said, "gym");
      if (pay.p) addPrana(pay.p, said, "gym");
      if (!pay.b && !pay.p) log(said);
    }
    saveG();
    $("gMsg").textContent = msg; $("gSave").textContent = "Saved";
    const tEl = $("gBwT"), tr = gymTrend(); if (tEl && tr) tEl.textContent = "Last: " + LV.trendText(tr);
  }

  // full names, minus tour-sheet noise ("+ Extras", trailing dots)
  const moName = b => (b.t || "").replace(/\s*\+\s*extras\b/i, "").replace(/\.{2,}$/, "").replace(/^(tour|hike)\s*-\s*/i, (m, w) => w[0].toUpperCase() + w.slice(1).toLowerCase() + ": ").trim();
  function morningData(){
    const t = now(), all = blocks();
    const sched = all.filter(b => b.e > t && !["open", "break"].includes(b.kind) && !isSleep(b));
    const moments = sched.filter(b => !isMeal(b) && !isSadhana(b)).map(b => {
      const I = INSIGHTS[gk(b)] || { items:[], links:[] };
      return { b, mind:I.items.filter(x => x.kind === "mind").map(x => x.t), know:I.items.filter(x => x.kind === "know"),
        pack:I.items.filter(x => x.kind === "pack" || !x.kind).map(x => x.t) };
    }).filter(m => m.mind.length || m.know.length || m.pack.length).slice(0, 4);   // the prepped ones get a slide
    const go = sched.find(b => ["travel", "major"].includes(groupOf(b)));

  function tapStep(btn, blk, kind, i, st, redraw){

  async function setDayMode(m){

  /* ---------- skills (ticket 16, 2026-10-08) ----------

  const planOf = id => (PRACTICE.plans || {})[id];

      h += `<div class="side-list"><button class="side" id="tSkills"><span class="pr">🎯</span><span class="nm">${left < 13 ? "Too short for a video. Open your skills" : "Nothing new that fits. See your skills"}</span></button></div>`;
    } else {
      h += `<div class="side-list"><button class="side" id="tSkills"><span class="pr">🎯</span><span class="nm">${sug.length ? `${sug.length} skills suggested from your days. Pick yours` : "Add a skill to train"}</span></button></div>`;
    }
    return h;
  }
  // the Skills section on the main screen: what he is training, and how much is new for each
  function skillsRowHtml(){
    if (!questKey()) return `<div class="skchips"><button class="skchip" data-sk="">Pair this device to see your skills</button></div>`;
    const act = SKILLS.filter(s => s.status === "active"), sug = SKILLS.filter(s => s.status === "suggested");
    const fresh = s => CONTENT.filter(it => it.skill === s.id && (it.state || "new") === "new").length;
    // a skill with a practice plan shows its stage and one next step (d191), not a count of videos
    const card = s => { const si = stageInfo(s.id), nx = nextStep(s.id);
      return `<div class="skcard"><button class="skc-top" data-sk="${esc(s.id)}"><span>🎯 <b>${esc(s.name)}</b></span><small>Stage ${si.n} of ${si.of} · ${esc(si.st.name)}</small>
        ${si.need ? `<span class="pq-bar"><i style="width:${Math.min(100, Math.round(si.have / si.need * 100))}%"></i></span>` : ""}</button>
        <button class="skc-next" data-sknext="${esc(s.id)}"><span>Next</span>${esc(nx.text)}</button></div>`; };
    const withPlan = act.filter(s => planOf(s.id)), rest = act.filter(s => !planOf(s.id));
    return `${withPlan.map(card).join("")}<div class="skchips">${rest.map(s => `<button class="skchip" data-sk="${esc(s.id)}">🎯 ${esc(s.name)}${fresh(s) ? ` <b>${fresh(s)}</b>` : ""}</button>`).join("")}
      ${sug.length ? `<button class="skchip sug" data-sk="">${sug.length} suggested from your days</button>` : ""}
      ${!act.length && !sug.length ? `<button class="skchip" data-sk="">＋ Add a skill</button>` : ""}</div>`;
  }
  function wireTrain(){
    const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
    on("tWatch", () => openContent(trainHtml.it));
    on("tNext", e => { G.day.skillSkip = [...(G.day.skillSkip || []), e.currentTarget.dataset.id]; saveG(); render(); });
    on("tNot", e => { const it = CONTENT.find(x => x.id === e.currentTarget.dataset.id); if (it) setState(it, "later");
      G.day.skillSkip = [...(G.day.skillSkip || []), e.currentTarget.dataset.id]; saveG(); render(); });
    on("tSkills", () => openSkills());
  }

  function openSkills(){
    const act = SKILLS.filter(s => s.status === "active"), sug = SKILLS.filter(s => s.status === "suggested");
    const fresh = s => CONTENT.filter(it => it.skill === s.id && (it.state || "new") === "new").length;
    const row = s => `<button class="side" data-skill="${esc(s.id)}"><span class="pr">🎯</span><span class="nm"><b>${esc(s.name)}</b>
      ${s.focus ? `<small>Working on: ${esc(s.focus)}</small>` : ""}</span>${fresh(s) ? `<span class="xp">${fresh(s)} new</span>` : ""}</button>`;
    openSheet(`<h3>Skills</h3>
      ${!questKey() ? `<p>Pair this device in ⚙️ to see your skills.</p>` : ""}
      ${act.length ? `<div class="win-lb">Training</div><div class="side-list">${act.map(row).join("")}</div>`
        : questKey() ? `<p>A skill is something your days call for. Quest finds content for it and offers it when you have time.</p>` : ""}
      ${sug.length ? `<div class="win-lb">Suggested from your days</div>${sug.map(s => `<div class="sug">
        <div><b>${esc(s.name)}</b><small>${esc(s.focus)}</small>${s.from ? `<small style="color:var(--ink-faint)">From: ${esc(s.from)}</small>` : ""}</div>
        <div class="actions"><button class="btn primary" data-yes="${esc(s.id)}">Train this</button><button class="btn ghost" data-see="${esc(s.id)}">Look first</button><button class="btn ghost" data-no="${esc(s.id)}">Not now</button></div></div>`).join("")}` : ""}
      ${questKey() ? `<div class="win-lb">Add a skill</div>
      <input id="skName" placeholder="The skill, e.g. Filming dance" maxlength="60">
      <input id="skFocus" placeholder="What are you working on? (optional)" maxlength="140">
      <div class="actions"><button class="btn primary" id="skAdd">＋ Add</button></div>
      <p id="skMsg" style="font-size:12px">Quest looks for content on the next run (6 AM or 8 PM).</p>` : ""}
      <div class="actions"><button class="btn ghost" id="skClose">Close</button></div>`, true);
    $("skClose").onclick = closeSheet;
    $("sheet").querySelectorAll("[data-skill],[data-see]").forEach(b => b.onclick = () => openSkill(b.dataset.skill || b.dataset.see));
    const decide = (id, status) => { const s = skillOf(id); if (!s) return;
      s.status = status; s.editedAt = now().toISOString(); skillOp({ op:"set", id, status }).catch(() => {});
      log(status === "active" ? `Training: ${s.name}` : `Not now: ${s.name}`); saveG(); openSkills(); };
    $("sheet").querySelectorAll("[data-yes]").forEach(b => b.onclick = () => decide(b.dataset.yes, "active"));
    $("sheet").querySelectorAll("[data-no]").forEach(b => b.onclick = () => decide(b.dataset.no, "paused"));
    if ($("skAdd")) $("skAdd").onclick = async () => {
      const name = $("skName").value.trim(), focus = $("skFocus").value.trim();
      if (!name) { $("skName").focus(); return; }
      try {
        const r = await skillOp({ op:"add", name, focus });
        const s = r ? r.skill : { id:name.toLowerCase().replace(/[^a-z0-9]+/g, "-"), name, focus, status:"active" };
        SKILLS = SKILLS.filter(x => x.id !== s.id).concat(s);
        log(`Added the skill ${name}`); saveG(); openSkills();
      } catch (e) { $("skMsg").textContent = "Could not add it: " + e.message; }
    };
  }

  function openSkill(id, focus){
    const s = skillOf(id); if (!s) return openSkills();
    const items = CONTENT.filter(it => it.skill === id).sort((a, b) => ((a.state === "new") ? 0 : 1) - ((b.state === "new") ? 0 : 1));
    const stLabel = { watched:"watched", read:"read the line", later:"later", no:"not for me" };
    openSheet(`<div class="win-hd"><span style="font-size:30px">🎯</span><div><div class="tt">${esc(s.name)}</div>
        <div class="sb">${s.status === "active" ? "Training" : s.status === "suggested" ? "Suggested from your days" : "Paused"}${s.from ? ` · ${esc(s.from)}` : ""}</div></div></div>
      ${s.status !== "active" ? `<div class="actions"><button class="btn primary" id="sYes">Train this</button></div>` : ""}
      ${s.status === "active" ? practiceHtml(id, focus) : ""}
      ${CONTENT.some(it => it.skill === id && it.note) ? `<div class="win-lb">Lines you kept</div>${CONTENT.filter(it => it.skill === id && it.note).map(it => `<p class="pq-line">“${esc(it.note)}” <small>· ${esc(it.title)}</small></p>`).join("")}` : ""}
      <div class="win-lb">Working on</div>
      <textarea id="sFocus" class="cline" rows="2" maxlength="140" placeholder="What are you working on?">${esc(s.focus)}</textarea>
      <div class="win-lb">Content</div>
      ${items.length ? items.map(it => `<button class="wck" data-it="${esc(it.id)}"><span class="bx">${KIND_IC[it.kind] || "▶"}</span>
        <span><b>${esc(it.title)}</b> <small style="color:var(--ink-faint)">· ${it.mins} min${stLabel[it.state] ? ` · ${stLabel[it.state]}` : ""}</small>
        <br><small style="color:var(--ink-soft)">${esc(it.line)}</small></span></button>`).join("")
        : `<p>Nothing yet. ${s.research ? "Asked: it looks on the next run (6 AM or 8 PM)." : ""}</p>`}
      <div class="actions">${s.research ? "" : `<button class="btn" id="sFind">🔎 Find content for this</button>`}
        ${WIKI.includes(s.page) ? `<button class="btn" id="sWiki">📖 Wiki page</button>` : ""}</div>
      <div class="actions"><button class="btn ghost" id="sBack">All skills</button>${s.status === "active" ? `<button class="btn ghost" id="sPause">Pause this skill</button>` : ""}</div>`, true);
    const set = (patch, msg) => { Object.assign(s, patch, { editedAt:now().toISOString() }); skillOp({ op:"set", id, ...patch }).catch(() => {}); if (msg) { log(msg); saveG(); } };
    $("sFocus").onchange = e => set({ focus:e.target.value.trim() }, `${s.name}: working on ${e.target.value.trim()}`);
    if ($("sYes")) $("sYes").onclick = () => { set({ status:"active" }, `Training: ${s.name}`); openSkill(id); };
    if ($("sPause")) $("sPause").onclick = () => { set({ status:"paused" }, `Paused: ${s.name}`); openSkills(); };
    if ($("sFind")) $("sFind").onclick = () => { set({ research:true }, `Asked for content: ${s.name}`); openSkill(id); };
    if ($("sWiki")) $("sWiki").onclick = () => openWikiPage(s.page, () => openSkill(id));
    $("sBack").onclick = openSkills;
    if (s.status === "active" && planOf(id)) { wirePractice(id, () => openSkill(id)); if (focus === "check" && $("pqCheck")) $("pqCheck").scrollIntoView({ block:"center" }); }
    $("sheet").querySelectorAll("[data-it]").forEach(b => b.onclick = () => openContent(CONTENT.find(x => x.id === b.dataset.it), () => openSkill(id)));
  }

  /* the player: YouTube without YouTube (nocookie embed, inline, no autoplay). When it
     ends, the ideas card covers YouTube's end screen. */
  let ytReady = null;
  function loadYT(){
    if (ytReady) return ytReady;
    ytReady = new Promise(res => {
      if (window.YT && YT.Player) return res();
      window.onYouTubeIframeAPIReady = () => res();
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    });
    return ytReady;
  }
  function openContent(it, back){
    if (!it) return;
    const sk = skillOf(it.skill), vid = it.kind !== "article" && it.yt;
    const late = (() => { const t = now(), c = currentOf(blocks(), t); return c && isSadhana(c) ? "It's your sadhana time. It will be here after."
      : blocks().some(b => isSleep(b) && b.s > t && b.s - t < 3600000) ? "Bed is close. This keeps for tomorrow too." : ""; })();
    openSheet(`<div class="eyebrow">${esc(sk ? sk.name : it.skill)}${it.forTitle ? ` · for ${esc(it.forTitle)}` : ""}</div>
      <h3 style="margin-top:4px">${esc(it.title)}</h3>
      <p class="oneline">${esc(it.line)}</p>
      ${late ? `<p style="font-size:12px">${esc(late)}</p>` : ""}
      ${vid ? `<div class="player"><div id="ytBox"></div><div class="endcard" id="endCard" hidden></div></div>
        <div class="actions"><button class="btn" id="cSeen">✓ I watched it</button><button class="btn" id="cRead">Read the line only</button></div>`
        : `<div class="actions"><a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener" id="cOpen">${it.kind === "podcast" ? "🎧 Listen" : "📄 Read it"} · ${it.mins} min</a></div>`}
      <p style="font-size:12px;color:var(--ink-faint)">${esc(it.by || "")}${it.by ? " · " : ""}${it.mins} min${it.why ? ` · ${esc(it.why)}` : ""}</p>
      <div id="cIdeas"></div>
      <div class="actions"><button class="btn ghost" id="cNo">Not for me</button>
        <button class="btn ghost" id="cBack">${back ? "Back" : "Close"}</button></div>`, true);
    const drawIdeas = (done) => {
      $("cIdeas").innerHTML = `${it.ideas && it.ideas.length ? `<div class="win-lb">${done ? "Worth trying?" : "Ideas in it"}</div>${it.ideas.map((x, i) => `<div class="idea">
          <div><b>${esc(x.t)}</b> <small style="color:var(--ink-faint)">· ${x.mins} min</small>${x.why ? `<small>${esc(x.why)}</small>` : ""}</div>
          ${(it.scheduled || []).some(s => s.idea === x.t) ? `<small style="color:var(--good)">On the schedule ✓</small>`
            : `<button class="btn" data-idea="${i}">📅 Put it on the schedule</button>`}</div>`).join("")}` : ""}
        <input id="cLine" class="cline" maxlength="400" placeholder="Your line: what will you take from it? (optional)" value="${esc(it.note || "")}">`;
      $("cIdeas").querySelectorAll("[data-idea]").forEach(b => b.onclick = () => openScheduleIdea(it, it.ideas[+b.dataset.idea], () => openContent(it, back)));
      $("cLine").onchange = e => { const v = e.target.value.trim(); if (!v) return; it.note = v; contentOp(it, { line:v }); log(`Note on ${it.title}`); saveG(); };
    };
    drawIdeas(false);
    if (vid) loadYT().then(() => {
      if (!$("ytBox")) return;
      new YT.Player("ytBox", { host:"https://www.youtube-nocookie.com", videoId:it.yt, width:"100%", height:"100%",
        playerVars:{ playsinline:1, rel:0, modestbranding:1, autoplay:0, enablejsapi:1, origin:location.origin },
        events:{ onStateChange: e => {
          if (e.data === 1 && !it._started) { it._started = true; log(`Watching: ${it.title}`); saveG(); }
          if (e.data === 0) finished();
        } } });
    });
    // the end of a video (or "I watched it"): cover YouTube's end screen with the ideas
    function finished(){
      if (it.state !== "watched") { setState(it, "watched"); log(`Watched: ${it.title}`); saveG(); }
      const ec = $("endCard"); if (!ec) return;
      ec.hidden = false;
      ec.innerHTML = `<div><b>Done.</b><br>${it.ideas && it.ideas.length ? "Pick an idea below to put on your schedule." : "Anything worth trying? Add a line below."}</div>`;
      if ($("cSeen")) $("cSeen").parentNode.remove();
      drawIdeas(true);
      $("cIdeas").scrollIntoView({ behavior:"smooth", block:"start" });
    }
    if ($("cSeen")) $("cSeen").onclick = finished;
    if ($("cOpen")) $("cOpen").onclick = () => { setState(it, "read"); log(`Opened: ${it.title}`); saveG(); };
    if ($("cRead")) $("cRead").onclick = () => { setState(it, "read"); log(`Read the line: ${it.title}`); saveG(); drawIdeas(true); };
    $("cNo").onclick = () => { setState(it, "no"); log(`Not for me: ${it.title}`); saveG(); back ? back() : closeSheet(); render(); };
    $("cBack").onclick = () => back ? back() : closeSheet();
  }

  /* an idea goes straight onto the schedule as a specific block (d135): first open
     window today that fits, else tomorrow's, through the calendar or today's ops */
  async function freeSlots(ymdStr, mins){
    const t = +now() + 5 * 60000;
    const list = ymdStr === gameYmd() ? blocks() : ((await getPlan(ymdStr).catch(() => null)) || { blocks:[] }).blocks
      .map(b => ({ ...b, s:new Date(b.s), e:new Date(b.e), kind:kindOf(b) }));
    return list.filter(b => b.kind === "open").map(b => ({ s:new Date(Math.ceil(Math.max(+b.s, t) / 300000) * 300000), e:b.e }))
      .filter(w => w.e - w.s >= mins * 60000 && +tzParts(w.s, { hour:"numeric", hourCycle:"h23" }).hour >= 7);
  }
  async function openScheduleIdea(it, idea, back){
    const tomorrow = tzYmd(new Date(+new Date(gameYmd() + "T12:00:00Z") + 86400000));
    let day = gameYmd(), dur = idea.mins;
    const draw = async () => {
      const slots = await freeSlots(day, dur), first = slots[0];
      const start = first ? first.s : new Date(Math.ceil((+now() + 15 * 60000) / 300000) * 300000);
      const today = day === gameYmd(), canWrite = questKey() && !DRY;
      openSheet(`<h3>Put it on the schedule</h3>
        <input id="iT" value="${esc("🎯 " + idea.t)}" maxlength="120">
        <div class="chips" style="grid-template-columns:1fr 1fr">${[[gameYmd(), "Today"], [tomorrow, "Tomorrow"]].map(([d, l]) =>
          `<button class="chip ${d === day ? "sel" : ""}" data-day="${d}" style="text-align:center">${l}</button>`).join("")}</div>
        <div class="row"><label>Start<input id="iS" type="time" value="${toField(start)}"></label>
          <label>Minutes<input id="iD" type="number" min="5" max="240" step="5" value="${dur}"></label></div>
        <p style="font-size:12px">${first ? `First open time that fits: ${fmtT(first.s)}.` : "No open time that fits. Pick a start."}
          ${slots.slice(1, 4).map(w => `<button class="ping-ask" data-at="${w.s.toISOString()}">${fmtT(w.s)}</button>`).join(" ")}</p>
        ${canWrite ? `<label class="check"><input id="iCal" type="checkbox" checked ${today ? "" : "disabled"}> Add it to Google Calendar (Joint Plans)</label>` : ""}
        ${DRY ? `<p style="color:var(--warn)">Test mode: nothing is added.</p>` : !questKey() ? `<p>Pair this device to add it to the calendar.</p>` : ""}
        <div class="actions"><button class="btn ghost" id="iBack">Back</button><button class="btn primary" id="iGo">Add it</button></div>`);
      $("sheet").querySelectorAll("[data-day]").forEach(b => b.onclick = () => { day = b.dataset.day; draw(); });
      $("sheet").querySelectorAll("[data-at]").forEach(b => b.onclick = () => { $("iS").value = toField(new Date(b.dataset.at)); });
      $("iD").onchange = e => { dur = Math.max(5, Math.min(240, +e.target.value || idea.mins)); };
      $("iBack").onclick = back;
      $("iGo").onclick = async () => {
        const title = $("iT").value.trim() || idea.t;
        const s = fromField($("iS").value, new Date(day + "T12:00:00Z")), e = new Date(+s + dur * 60000);
        const cal = !today || ($("iCal") && $("iCal").checked);
        if (DRY || (!today && !questKey())) { log(`Test: would schedule ${title} at ${fmtT(s)}`); return back(); }
        closeSheet();
        if (today) await (cal ? addBlockCal : addBlock)(title, s, e);
        else {   // another day: only the calendar can hold it (today's edit layer is today only)
          try { await qfetch("/cal/event", { method:"POST", body:JSON.stringify({ s:s.toISOString(), e:e.toISOString(), title, calId:jointId() }) }); }
          catch (err) { alert(`Could not add it to the calendar (${err.message}). Nothing was added.`); return back(); }
          log(`Added ${title} to the calendar: tomorrow ${fmtT(s)}`);
        }
        (it.scheduled = it.scheduled || []).push({ title, s:s.toISOString(), e:e.toISOString(), idea:idea.t });
        contentOp(it, { scheduled:{ title, s:s.toISOString(), e:e.toISOString(), idea:idea.t } });
        saveG(); back();
      };
    };
    draw();
  }

  /* a wiki page from the phone copy: headings, bullets, bold, links between pages */
  async function openWikiPage(path, back){
    openSheet(`<p>Opening ${esc(path)}…</p>`, true);
    let pg;
    try { pg = await qfetch("/quest/wiki/" + path); } catch (e) { openSheet(`<p>Could not open it: ${esc(e.message)}</p><div class="actions"><button class="btn ghost" id="wkB">Back</button></div>`); $("wkB").onclick = back || closeSheet; return; }
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, p, l) => { const k = p.trim().replace(/\.md$/, ""), label = l || (k.split("/").pop().match(/^\d{4}-\d{2}-\d{2}$/) ? k.split("/").pop() : k.split("/").pop().replace(/-/g, " "));
        return WIKI.includes(k) ? `<button class="wlink" data-wk="${k}">${label}</button>` : `<span style="color:var(--ink-faint)">${label}</span>`; })
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const html = pg.md.split("\n").map(l => /^### /.test(l) ? `<div class="win-lb">${inline(l.slice(4))}</div>`
      : /^## /.test(l) ? `<div class="win-lb">${inline(l.slice(3))}</div>` : /^# /.test(l) ? `<h3>${inline(l.slice(2))}</h3>`
      : /^\s*[-*] /.test(l) ? `<p class="wli">• ${inline(l.replace(/^\s*[-*] /, ""))}</p>` : l.trim() ? `<p>${inline(l)}</p>` : "").join("");
    openSheet(`<div class="wiki">${html}</div><p style="font-size:11px;color:var(--ink-faint)">From the life wiki${pg.updated ? `, updated ${esc(pg.updated)}` : ""}.</p>
      <div class="actions"><button class="btn ghost" id="wkB">${back ? "Back" : "Close"}</button></div>`, true);
    $("wkB").onclick = back || closeSheet;
    $("sheet").querySelectorAll("[data-wk]").forEach(b => b.onclick = () => openWikiPage(b.dataset.wk, () => openWikiPage(path, back)));
  }
  $("skillsBtn").onclick = () => { openSkills(); pullSkills().then(() => { if ($("skClose")) openSkills(); }).catch(() => {}); };

  /* ---------- pings while the page is open (devices without phone push) ---------- */
  const fired = new Set();
  function ping(id, title, body){
    if (fired.has(id)) return; fired.add(id);
    if (navigator.vibrate) navigator.vibrate([60,80,60]);
    if (store.get("quest-push")) return;   // the server pings this device instead
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification(title, { body, icon:"quest-icon-180.png", tag:id }); } catch {}
    }
  }
  function pings(all, t){
    all.forEach(b => {
      if (!needsCheck(b)) return;
      const toStart = (b.s - t) / 60000, toEnd = (b.e - t) / 60000;
      if (toStart <= 5 && toStart > 4) ping("pre|" + b.key, `In 5 min: ${b.t}`, `Starts ${fmtT(b.s)}. Wrap up what you're on.`);
      if (toStart <= 0 && toStart > -1) ping("go|" + b.key, `Now: ${shortName(b)}`, `Until ${fmtT(b.e)}.`);
    });
  }

  /* ---------- render ----------
     Markup is only replaced when it changes, so a tap is never lost to a
     rebuild mid-press. Seconds live in data-until / data-since spans that
     tick() fills in place. */
  function put(id, html){ const el = $(id); if (el._h !== html) { el._h = html; el.innerHTML = html; } }
  function tick(){
    const t = now();
    document.querySelectorAll("[data-until]").forEach(el => el.textContent = fmtLeft((new Date(el.dataset.until) - t) / 1000));
    document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmtAgo((t - new Date(el.dataset.since)) / 1000));
    document.querySelectorAll("[data-ring-s]").forEach(el => {
      const s = new Date(el.dataset.ringS), e = new Date(el.dataset.ringE), C = 2 * Math.PI * 30;
      const frac = Math.max(0, Math.min(1, (e - t) / (e - s)));
      el.style.strokeDashoffset = C * (1 - frac);
    });
  }

  /* ---------- the mountain (Trail, chosen 2026-10-05) ----------
     One stop per calendar block. Runs of Open space and Rest fold into one
     "Free time" stop. Anchors (sleep, practice, body, fuel) are campfires that
     light on check-in. A side quest in progress is a dragon on its stop; a
     finished one leaves a flag. A storm cloud follows you while you are away. */
  function stopsOf(all){
    const out = [];
