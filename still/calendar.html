<script>
/* The look saved on this device (the Look row in Settings; Studio when none) goes on here, before anything is drawn,
   so the page never opens in the wrong look first. Studio shows its day or night half by the sun in the calendar's
   time zone. Ink is the plain page with no data-look. */
(function () {
  var id = "studio", tz = "America/Toronto";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  try { id = CalCore.startLook(localStorage); tz = localStorage.getItem("cal-tz") || tz; } catch (e) {}
  try {
    var f = CalCore.lookFace(id, Date.now(), tz);
    if (f.face) document.documentElement.dataset.look = f.face;
    document.querySelector('meta[name="theme-color"]').content = f.theme;
    document.querySelector('meta[name="color-scheme"]').content = f.scheme;
  } catch (e) {}
  /* the hour height this phone last pinched to (slice 01), so the day opens at that height, never 56 first */
  try { document.documentElement.style.setProperty("--H", CalCore.startHour(localStorage, matchMedia("(hover: none) and (pointer: coarse)").matches) + "px"); } catch (e) {}
})();
</script>
<!--
  Calendar: Junyan's calendar app. Second shape (2026-11-10, one-system map ticket 026 "Build the new
  calendar shell"; approved mockup saved at fleet/wayfinder/one-system/assets/026-calendar-mockup.html):
  - a slim icon sidebar (Calendar plus one page per block type),
  - a left column (month, calendars), with the "+ New task" drop box pinned bottom left and no task list,
  - one endless strip of day columns that snaps as you swipe (touch and trackpad); 3 days by default,
  - one right panel for Now, event details, Settings and Shortcuts (no pop-up).
  Colour is by BLOCK TYPE (eleven types, calendar-core.js KINDS), guessed from the title; a hand-set type is
  kept on the Google event (extendedProperties.private.kind). Every new event goes to Joint Plans.
  Studio shifts (the Staff Scheduling calendar) sit in a slim rail on the right of each day.
  Four looks (2026-11-11): Studio (default; light by day, charcoal by night, switching at sunrise and sunset),
  Ink, Stage Lights, Velvet & Brass, picked per device in Settings > Look (calendar-core.js LOOKS, localStorage
  "cal-look", put on in the head before the first paint).
  Each type's helper and page are later tickets (034 to 043); until then a type page lists its next blocks.

  Backend: still-api /planner/* (src/planner.mjs, planner-tasks.mjs, suggestions.mjs), gated by the
  Day Quest pairing code (localStorage "quest-key", header X-Quest-Key).
  Suggestions from Claude sessions show as dashed ghosts with Accept / Skip (still/CALENDAR-SUGGESTIONS.md).
  The goal tracker's "Work block · 🎯 A/B" titles are shown exactly as written.
  No AI runs on page load; the last data is cached in localStorage so the page draws at once.
  URL switches: ?api=URL (another still-api).
-->
<style>
/* Look (2026-11-11, Junyan: "a complete colour and visual redesign to make it much more professional and exciting",
   and "the month and stuff fade out on the top edge so it needs to be clean"):
   - a calm ink background, so the block colours do the talking; no sky gradient;
   - one named palette, set once below; each block type takes one colour from it (the meaning is unchanged:
     colour = block type, calendar-core.js KINDS). Titles are near white on a solid tinted card (over 9:1),
     times over 4.5:1, checked by still/test/calendar-look.test.mjs;
   - one accent (--now, red) for "now" things only: the now line and its time pill, today, the Today button and
     the chosen view in the 1 / 3 / 7 / M switch;
   - solid header and footer bars with a hairline edge; nothing shows through them. */
:root{
/* the palette */
--fuchsia:#e040fb;--amber:#fbbf24;--orange:#fb923c;--lime:#a3e635;--emerald:#34d399;--cyan:#22d3ee;--blue:#60a5fa;--azure:#006b97;
--indigo:#818cf8;--purple:#c084fc;--pink:#f472b6;--slate:#94a3b8;--sand:#d6bc8a;--stone:#a8a29e;--red:#ff4f5e;--teal:#13aea4;
/* surfaces and text */
--bg:#0e1015;--bar:#14171e;--raise:#1a1e27;--raise2:#232835;--line:rgba(255,255,255,.09);--hair:rgba(255,255,255,.05);
--ink:#f2f4f8;--soft:#a9b0bf;--faint:#6e7686;
--now:var(--red);--accent:var(--red);--go:var(--ink);
/* text on the accent (today, the chosen view, the now pill), the accent as text (Today button), the plain colour of a
   pressed chip with no type */
--on-accent:#ffffff;--accent-ink:var(--accent);--neutral:#ffffff;
/* event cards: fill and pill tint (share of the type colour), title and time (a share of the type colour mixed into
   --ev-ink / --ev-time), and a glow round each card (0% is none) */
--ev-fill:26%;--pill-fill:22%;--ev-title:15%;--ev-ink:#ffffff;--ev-time-p:40%;--ev-time:#c3c9d4;--ev-halo:0%;
/* small washes and shadows */
--glow:rgba(255,255,255,.06);--today-col:rgba(255,255,255,.018);--past:rgba(0,0,0,.18);--drop:rgba(0,0,0,.6);--track:rgba(255,255,255,.12);
/* big shadows (the selected card, side panel, pop-ups) and the pop-up dimmer: a colour and a strength (1 is full) */
--lift:#000000;--lift-k:1;
/* an event that is over (earlier today, or a past day): its card fill, and its title (a share of the type colour
   mixed into --dim-ink); no see-through, so the title still reads at 4.5:1 or better */
--dim-fill:12%;--dim-title:20%;--dim-ink:var(--soft);--dim-time:var(--soft);
/* the strip behind the iPhone clock in home-screen mode: the header bar colour in every look (see-through shows the body, which is --bar) */
--status:transparent;
/* block types: colour means type (Packing, slice 02 d23: a teal of its own, kept clear of Social and Yoga in every look) */
--k-deep:var(--amber);--k-studio:var(--orange);--k-yoga:var(--cyan);--k-gym:var(--purple);--k-dance:var(--pink);--k-cook:var(--lime);
--k-travel:var(--blue);--k-commute:var(--azure);--k-pack:var(--teal);--k-social:var(--emerald);--k-errand:var(--indigo);--k-wind:var(--slate);--k-rest:var(--sand);--k-home:var(--fuchsia);--k-other:var(--stone);
/* old names some rules still use */
--glass:var(--raise);--glass2:var(--raise2);--panel:var(--bar);--pin:var(--bar);--deep:var(--bar);
--H:56px;--hh:68px;--gut:56px;--rail:56px;--radius:8px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
--display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
/* More looks (Junyan, 2026-11-11: "Can you give me three more colour schemes. Make it really inspirational for a
   dancer and business owner"). Picked per device from the Look row in Settings (calendar-core.js LOOKS). Each is
   colours only: every block type keeps its Ink colour family, and where the look's accent sits near a type, that
   type's shade moves away from it (still/test/calendar-look.test.mjs checks the distance and every card's contrast). */
/* Studio, the default (Junyan, 2026-11-11: "Let's go wtih the calendar mode with the night mode for when it's night"):
   two halves, put on by the sun (calendar-core.js lookFace): the day half from sunrise to sunset, the night half from
   sunset to sunrise. Both use one coral for "now", today, the Today button and the chosen view, so they feel like one look.
   Day: Studio Morning as first shipped (PR 125). A sunlit studio, a maple floor, a paper planner. Warm cream, warm ink,
   ballet coral. Coral sits near Studio On-Site, so Studio On-Site is a deep burnt orange and Deep Work an ochre. The
   iPhone strip behind the clock is the header bar's cream (2026-11-18: a dark strip there looked grey to black
   against the cream header); big shadows are a soft warm brown, not black. */
:root[data-look="studio-day"]{
--fuchsia:#e038f8;--amber:#9a7d00;--orange:#a35a0a;--lime:#4f9418;--emerald:#14946a;--cyan:#0e8fa3;--blue:#2563c8;--azure:#008fe0;--teal:#147169;
--indigo:#6358d0;--purple:#9a46c8;--pink:#c7317f;--slate:#5f6f86;--sand:#a1865a;--stone:#857d77;--red:#c42b3c;
--bg:#faf6ef;--bar:#fffdf9;--raise:#f4eee4;--raise2:#e8dfd1;--line:rgba(96,72,40,.16);--hair:rgba(96,72,40,.09);
--ink:#1f1b16;--soft:#5e554a;--faint:#736a5e;
--now:#d24a22;--accent:#d24a22;--on-accent:#ffffff;--accent-ink:#b23a17;--neutral:#1f1b16;
--ev-fill:14%;--pill-fill:16%;--ev-title:50%;--ev-ink:#1f1b16;--ev-time-p:40%;--ev-time:#4a4239;--ev-halo:0%;
--glow:rgba(210,74,34,.12);--today-col:rgba(210,74,34,.035);--past:rgba(96,72,40,.05);--drop:rgba(96,72,40,.16);--track:rgba(31,27,22,.10);
--lift:#3c2a14;--lift-k:.4;--dim-fill:7%;--dim-title:30%;
--status:#fffdf9;color-scheme:light}
/* Night: a flat neutral charcoal with off-white text and no tint, the header and bottom bar a touch lifted from the
   page. The same coral, brightened for the dark; Studio On-Site a yellower tangerine to stay clear of it. */
:root[data-look="studio-night"]{
--fuchsia:#e040f8;--amber:#fbbf24;--orange:#fc980c;--lime:#a3e635;--emerald:#34d399;--cyan:#22d3ee;--blue:#60a5fa;--azure:#0075a2;
--indigo:#818cf8;--purple:#c084fc;--pink:#f472b6;--slate:#94a3b8;--sand:#d6bc8a;--stone:#a8a29e;--red:#ff5a5f;--teal:#13aea4;
--bg:#1c1c1c;--bar:#262626;--raise:#2e2e2e;--raise2:#3a3a3a;--line:rgba(255,255,255,.10);--hair:rgba(255,255,255,.055);
--ink:#e6e6e6;--soft:#ababab;--faint:#8c8c8c;
--now:#ff7a59;--accent:#ff7a59;--on-accent:#1c1c1c;--accent-ink:#ff7a59;--neutral:#e6e6e6;
--ev-fill:26%;--pill-fill:22%;--ev-title:14%;--ev-ink:#ffffff;--ev-time-p:38%;--ev-time:#d6d6d6;--ev-halo:0%;
--glow:rgba(255,122,89,.10);--today-col:rgba(255,255,255,.02);--past:rgba(0,0,0,.2);--drop:rgba(0,0,0,.55);--track:rgba(255,255,255,.12)}
/* Stage Lights: the moment before the curtain. A plum-black stage, spotlight gold for "now", jewel-tone gels that glow.
   Gold sits near Deep Work, so Deep Work turns a deep amber-orange and Studio On-Site a vermilion. */
:root[data-look="stage"]{
--fuchsia:#f010e0;--amber:#e08000;--orange:#ff5c3a;--lime:#a6ec3c;--emerald:#28e0a0;--cyan:#2ee0e8;--blue:#3d8bff;--azure:#00bdff;--teal:#08966c;
--indigo:#8a80ff;--purple:#c46cf5;--pink:#ff4fae;--slate:#9ea6cf;--sand:#c8b49c;--stone:#a39aa3;--red:#ff5c6c;
--bg:#120d1a;--bar:#1d1529;--raise:#251b34;--raise2:#302343;--line:rgba(236,220,255,.10);--hair:rgba(236,220,255,.055);
--ink:#f7f1fb;--soft:#bdb1cc;--faint:#8a7d9e;
--now:#ffc857;--accent:#ffc857;--on-accent:#1a1024;--accent-ink:#ffc857;--neutral:#f7f1fb;
--ev-fill:30%;--pill-fill:26%;--ev-title:12%;--ev-ink:#ffffff;--ev-time-p:40%;--ev-time:#d9cfe6;--ev-halo:38%;
--glow:rgba(255,200,87,.10);--today-col:rgba(255,200,87,.035);--past:rgba(0,0,0,.22);--drop:rgba(0,0,0,.65);--track:rgba(236,220,255,.12)}
/* Velvet & Brass: a quiet, premium front office. Emerald-black, warm cream text, brushed brass for "now", calmer
   gem tones. Brass sits near Deep Work and Rest, so Deep Work is a bright citrine and Rest a pale linen. */
:root[data-look="velvet"]{
--fuchsia:#e038f8;--amber:#f5cc1f;--orange:#d0603e;--lime:#a3c45c;--emerald:#4cbf86;--cyan:#3cc6c0;--blue:#4f88e0;--azure:#00c3ff;--teal:#0d94a0;
--indigo:#9097ec;--purple:#b97ad9;--pink:#d9668f;--slate:#8ea2ac;--sand:#e0d6c2;--stone:#a39c92;--red:#e0605a;
--bg:#0b1a17;--bar:#11251f;--raise:#16302a;--raise2:#1e3c34;--line:rgba(243,234,216,.10);--hair:rgba(243,234,216,.055);
--ink:#f3ead8;--soft:#b8b4a0;--faint:#82907f;
--now:#c8a46a;--accent:#c8a46a;--on-accent:#10201b;--accent-ink:#d8b77f;--neutral:#f3ead8;
--ev-fill:26%;--pill-fill:22%;--ev-title:14%;--ev-ink:#fffaf0;--ev-time-p:38%;--ev-time:#d4ccb8;--ev-halo:0%;
--glow:rgba(200,164,106,.10);--today-col:rgba(200,164,106,.03);--past:rgba(0,0,0,.2);--drop:rgba(0,0,0,.55);--track:rgba(243,234,216,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--status);z-index:200;pointer-events:none}
body{background:var(--bar);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--now);outline-offset:1px}
[hidden]{display:none!important}
.k-deep{--c:var(--k-deep)}.k-studio{--c:var(--k-studio)}.k-yoga{--c:var(--k-yoga)}.k-gym{--c:var(--k-gym)}.k-dance{--c:var(--k-dance)}.k-cook{--c:var(--k-cook)}
.k-travel{--c:var(--k-travel)}.k-commute{--c:var(--k-commute)}.k-pack{--c:var(--k-pack)}.k-social{--c:var(--k-social)}.k-errand{--c:var(--k-errand)}.k-wind{--c:var(--k-wind)}.k-rest{--c:var(--k-rest)}.k-home{--c:var(--k-home)}.k-other{--c:var(--k-other)}
.app{display:grid;grid-template-columns:var(--rail) 236px minmax(0,1fr) 324px;height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bar)}
body.nopanel .app{grid-template-columns:var(--rail) 236px minmax(0,1fr) 0}
body.railopen{--rail:186px}
aside,nav{min-height:0;min-width:0}
aside{background:var(--bar);overflow:hidden}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:0 0 8px}
.meta{color:var(--faint);font-size:11.5px}.spacer{flex:1}
.icon{border:0;background:none;color:var(--soft);font-size:17px;padding:3px 8px;border-radius:8px;line-height:1}.icon:hover{background:var(--raise)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:6px 12px}.btn:hover{background:var(--raise2)}
.btn.pri{background:var(--ink);color:var(--bg);font-weight:700;border-color:transparent}.btn.del{color:var(--red)}
select option{background:var(--raise)}

/* sidebar of pages */
.rail{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:hidden auto}
.rail button{display:flex;align-items:center;border:0;background:none;border-radius:11px;padding:0;height:38px;width:100%;color:var(--soft);position:relative;white-space:nowrap;text-align:left;flex:none;transition:background .15s}
.rail .ic{flex:none;width:39px;height:38px;display:grid;place-items:center;font-size:18px;transition:transform .15s}
.rail .nm{opacity:0;transition:opacity .15s;font-size:13px;padding-left:4px}
body.railopen .rail .nm{opacity:1}
.rail button:hover{background:var(--raise)}.rail button:hover .ic{transform:scale(1.12)}
.rail button[aria-pressed=true]{background:color-mix(in srgb,var(--c,var(--neutral)) 18%,var(--bg));color:var(--ink);font-weight:600}
.rail .live::after{content:"";position:absolute;left:28px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px;align-self:stretch}

/* left column */
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:16px 14px 96px;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}
.mini b{color:var(--faint);font-weight:500;font-size:10.5px;padding-bottom:3px}
.mini button{border:0;background:none;border-radius:8px;aspect-ratio:1;padding:0;position:relative;font-variant-numeric:tabular-nums}
.mini button:hover{background:var(--raise)}.mini .out{color:var(--faint)}.mini .sel{background:var(--raise2)}
.mini .today{background:var(--accent);color:var(--on-accent);font-weight:700}
.cals label{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:13.5px;cursor:pointer}
.cals input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:4px;border:2px solid var(--c);margin:0;flex:none}
.cals input:checked{background:var(--c)}.cals label.off{color:var(--faint)}.cals .err{color:var(--red);font-size:11px}
.drop{position:fixed;left:calc(var(--rail) + 14px);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:208px;z-index:15;transition:left .2s}
.dropbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raise);transition:border-color .2s,box-shadow .2s}
.dropbox:focus-within{border-color:color-mix(in srgb,var(--ink) 40%,transparent);box-shadow:0 0 0 4px var(--glow)}
.dropbox input{flex:1;min-width:0;border:0;background:none;outline:none}.dropbox input::placeholder{color:var(--faint)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--raise2);border-radius:6px;padding:1px 6px;color:var(--soft)}
.fly{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-weight:600;border-radius:999px;padding:5px 12px;pointer-events:none;animation:fly .7s cubic-bezier(.3,.7,.2,1) forwards;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fly{to{transform:translateY(-70px) scale(.6);opacity:0}}

/* middle */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px 10px 20px;background:var(--bar);position:relative;z-index:9}
.bar h1{font-family:var(--display);font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em;white-space:nowrap;cursor:default;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg,.bar .btn,.bar .icon,.nav{flex:none}.nav{white-space:nowrap}
/* "November 2026": the month bold, the year light (his reference picture); a phone shows the month alone (below) */
.bar h1 span{font-weight:300;color:var(--ink)}
#title{touch-action:manipulation}   /* five quick taps open the readout; never a double-tap zoom */
.wk,.status{color:var(--faint);font-size:12.5px;white-space:nowrap}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--soft);white-space:nowrap;font-weight:500;font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
#todayBtn{color:var(--accent-ink);font-weight:600;background:color-mix(in srgb,var(--accent) 12%,var(--bar));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
#todayBtn:hover{background:color-mix(in srgb,var(--accent) 20%,var(--bar))}
.sc{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:none;background:var(--bg)}.sc::-webkit-scrollbar{display:none}
.sc.snap{scroll-snap-type:x mandatory;scroll-padding-left:var(--gut);overscroll-behavior-x:contain}
/* a finger moves days through the swipe rules in the page script (calendar-core.js swipeLock / swipeCommit), never
   through native sideways scrolling, which snapped to the next day on any sideways drift (2026-11-11). These two
   rules are a backstop now: the clipped .pane below leaves the view no sideways range to scroll. */
body.touch .sc{overflow-x:hidden;touch-action:pan-y}
/* No zoom on a phone (Junyan, 2026-11-12): iOS zooms the page when a focused text box has text under 16px, so every
   text box is 16px on touch (the editor title keeps its 20px); manipulation stops the double-tap zoom everywhere. */
body.touch input,body.touch select,body.touch textarea{font-size:16px}
@media (hover:none) and (pointer:coarse){html,body{touch-action:manipulation}}
/* No bounce on a phone (Junyan, 2026-11-12: "When I scroll up hard Sun 1 goes down butn ot the top bar"): iOS let the day
   list rubber-band past its ends and carried the sticky day header with it. none stops the bounce and the hand-off to the
   page, on the page itself and on every phone scroller: the day list and month view (.sc), the event sheet (.pbody), the
   month picker (.left) and the full pages (.page). Touch only; the desktop keeps its own scrolling. */
@media (hover:none) and (pointer:coarse){html,body,.sc,.sc.snap,.pbody,.left,.page{overscroll-behavior:none}}
body.touch .sc.snap{scroll-snap-type:none}
/* On touch the days sit in a pane that clips them sideways without scrolling (overflow-x:clip): the view has no
   sideways scroll range at all, so iOS has nothing to move during an up/down glide or a trackpad scroll. The
   strip is slid with a transform (slideTo); clip, unlike hidden, keeps the sticky day headers working. (2026-11-11) */
.pane{position:relative}
body.touch .pane{overflow-x:clip}
.strip{display:flex;width:max-content}

.strip.narrow .dn .keys{display:none}
/* Community Birthdays (display only): a small cake chip by the day number, a cake mark in the month. Neutral, so it reads in every look. */
.dn .bday{border:0;font-size:11px;font-weight:600;line-height:1.3;padding:0;background:none;color:var(--ink);cursor:pointer}
.dn .bday span{display:inline-block;border-radius:999px;padding:2px 7px;background:color-mix(in srgb,var(--faint) 24%,var(--bar))}

   strip under the day name, where it costs the name row no width. The strip stops short of it. The tap box is 44 wide (28 in a
   narrow column) and 17 tall, starting under the name row so it never covers the key chip. It sits at a fixed height, level with
   the strip, so a day with all-day pills below keeps it there. */
.strip.snug .dn .bday{position:absolute;right:0;top:29px;width:44px;max-width:50%;height:17px;min-width:0;min-height:0;margin:0;padding:0;display:flex;align-items:center;justify-content:flex-end;z-index:1}

.ev{position:absolute;text-align:left;border-radius:var(--radius);padding:4px 7px 4px 9px;font-size:12px;overflow:hidden;border:0;
  background:color-mix(in srgb,var(--c) var(--ev-fill),var(--bg));box-shadow:inset 3px 0 0 var(--c),0 0 0 1px var(--bg),0 0 14px -3px color-mix(in srgb,var(--c) var(--ev-halo),transparent);

.lk-chip.split{background:linear-gradient(var(--lk-bar) 0 30%,transparent 30%) left/50% 100% no-repeat,linear-gradient(var(--lk-bar2) 0 30%,transparent 30%) right/50% 100% no-repeat,linear-gradient(90deg,var(--lk-bg) 50%,var(--lk-bg2) 50%)}

.grab,.scrim{display:none}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--lift) calc(50% * var(--lift-k)),transparent);z-index:80;display:grid;place-items:center;padding:16px}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--raise2);border:1px solid var(--line);padding:8px 16px;border-radius:999px;font-size:12.5px;z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px color-mix(in srgb,var(--lift) calc(40% * var(--lift-k)),transparent)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{border-color:var(--red)}

/* a block type's own page */
body.onpage .left,body.onpage .main,body.onpage .panel{display:none}
.page{grid-column:2/-1;overflow-y:auto;padding:22px 28px 100px;min-width:0;background:var(--bg)}

/* The Trips page, look A (2026-11-13, d3): tabs in the calendar's pill style, one card per trip, stacked on a phone */
.ttabs{margin:0 0 16px;width:max-content;max-width:100%}

/* Stopgap until the Trips page is ported into the calendar (Junyan, 2026-11-13, d6: "6 yes, hide"): Local
   (class tdq) lead to Day Quest's Trips view, which is off under 768 px (quest-trips.js, WIDE = min-width: 768px), so a
   phone hides them. The exact opposite of that rule, so the two never disagree. To undo: delete this line, the tdq classes and the phone branches in test/e2e/calendar-trips.e2e.mjs. */
@media not all and (min-width:768px){.tdq{display:none!important}}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start;max-width:1100px}

.tcard .s{color:var(--soft);font-size:13px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tchips span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--soft);white-space:nowrap}
.tchips .now{background:var(--emerald);border-color:var(--emerald);color:var(--bg);font-weight:600}
.tchips .need{border-color:color-mix(in srgb,var(--amber) 70%,transparent);color:var(--amber)}
.tchips .paid{border-color:color-mix(in srgb,var(--emerald) 60%,transparent);color:var(--emerald)}
.tsub{margin:20px 0 10px}
#tripNew{color:var(--ink);text-decoration:none}
.tcard[data-trip]{cursor:pointer}.tcard[data-trip]:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
/* One trip: the plans left, the map, a place's card and Saved places right (slice 04, mock
   https://claude.ai/artifact/BQLvpC1YQjAUDhuBJefsRi, d35). A phone shows one at a time behind the Itinerary / Map tabs (d11). */
.trip{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:0;max-width:1240px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.tleft{padding:20px 22px 36px;min-width:0;border-right:1px solid var(--line)}
.tside{min-width:0;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--bar)}
.trip .phead{margin-bottom:10px;gap:12px}.trip .phead h2{font-size:24px;line-height:1.1;text-wrap:balance}
.trip .pi{width:46px;height:46px;border-radius:14px;font-size:24px;flex:none}
.ttop,.ttabs2{display:none}
.ttabs2 button{flex:1}
.tday{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.trow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--ink)}
.trow[data-tpin]{cursor:pointer}.trow[data-tpin]:hover{background:var(--raise)}
.trow.on{background:color-mix(in srgb,var(--c) 12%,var(--bg))}
.trow .t{width:66px;flex:none;color:var(--soft);font-variant-numeric:tabular-nums;font-size:13px;padding-top:1px}
.trow .nm{flex:1;min-width:0}.trow small{display:block;color:var(--faint);font-size:12.5px;margin-top:1px}
.tmapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--raise)}
.tmap{height:420px;z-index:0}
.tlegend{position:absolute;left:10px;bottom:10px;z-index:500;background:color-mix(in srgb,var(--bar) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;color:var(--soft);display:flex;gap:12px;pointer-events:none}
.tlegend i{font-style:normal}.tlegend .b{color:var(--c)}
.tpin{position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--bar);border:1.5px solid var(--line);font-size:14px;box-shadow:0 1px 3px var(--drop);cursor:pointer}
.tpin.on{width:34px;height:34px;margin:-3px 0 0 -3px;font-size:17px;border:3px solid var(--accent)}
.tpin .n{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--c);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.tpin.dot{width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--bar);margin:6px 0 0 6px}
.tpin.dot.on{width:22px;height:22px;margin:3px 0 0 3px;border:3px solid var(--bar)}
.tpin b{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:var(--ink);text-shadow:0 0 3px var(--bar),0 0 3px var(--bar),0 0 3px var(--bar)}
.leaflet-div-icon{background:none;border:0}
.tcardx{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:12px 14px}
.tcardx .h{display:flex;align-items:center;gap:10px}.tcardx .h b{font-size:16px;flex:1;min-width:0}
.tcardx .addr{color:var(--soft);font-size:13px;margin:2px 0 8px}
.tcardx .pl{font-size:13px;margin:4px 0;display:flex;gap:8px}
.tcardx .pl span:first-child{color:var(--soft);width:96px;flex:none;font-variant-numeric:tabular-nums}
.tcardx .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tcardx .acts .btn{white-space:nowrap;text-decoration:none;color:var(--ink);font-size:13px}
.tcardx .acts .go{background:var(--c);color:var(--on-accent);border-color:transparent;font-weight:600}
.tcardx .x{border:0;background:none;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px}
.tdrop{display:block;margin-top:12px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--soft);font-size:13px;cursor:pointer}
.tdrop.over{border-color:var(--c);color:var(--ink)}
.tsh{display:flex;align-items:center;gap:8px;font-weight:700}.tsh .n{color:var(--faint);font-weight:600;font-size:13px}
.tpl-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.tpl-row:hover{background:var(--raise)}.tpl-row.on{background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.tpl-row .e{width:30px;height:30px;border-radius:9px;background:var(--raise);display:grid;place-items:center;flex:none}
.tpl-row .nm{flex:1;min-width:0;line-height:1.25}.tpl-row small{display:block;color:var(--faint);font-size:12.5px}
.tpl-row .nopin{font-size:12px;color:var(--accent-ink);font-weight:600;white-space:nowrap}
.tadd{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;margin-top:6px}
.tadd i{font-style:normal;color:var(--accent-ink);font-weight:700}
.tadd input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;color:var(--ink)}
.tadd input::placeholder{color:var(--faint)}
/* Read a trip (slice 05, mock https://claude.ai/artifact/DoUcZHR3SbkquBrUoyKnCA, d70 to d74): a computer shows the
   full day by day plans in #tRead and a plan's details in #tCard; a phone keeps slice 04's #tDays as it was (d14). */
#tRead{display:none}
@media (min-width:768px){.tleft #tDays{display:none}#tRead{display:block}}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.tchips span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--soft)}
.tchips .need,.ttag.need,.tmiss,.tkv .need{color:var(--amber)}
.tchips .need{border-color:color-mix(in srgb,var(--amber) 60%,transparent)}
.tdays{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tdays button{border:1px solid var(--line);background:var(--bar);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--soft)}
.tdays button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:transparent}
#tRead .trow{cursor:pointer}#tRead .trow:hover{background:var(--raise)}
#tRead .trow .t{width:78px}#tRead .trow .t i{display:block;font-style:normal;color:var(--faint);font-size:12px}
#tRead .trow .nm b{font-weight:500}
.ttag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.ttag.need{background:color-mix(in srgb,var(--amber) 14%,var(--bg))}
.ttag.maybe{border:1px dashed var(--line);color:var(--soft)}
.tmiss{font-size:12.5px;margin-top:2px}
.tlog{color:var(--soft);font-size:13px;padding:4px 10px 2px 98px}.tlog b{font-weight:600;color:var(--ink)}
.tkv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px 10px;font-size:13px;margin-top:8px}
.tkv>span{color:var(--faint)}.tkv>div{min-width:0;overflow-wrap:anywhere}.tkv a{color:var(--c)}
.tchk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--soft);margin:3px 0}
.tchk i{width:14px;height:14px;border:1.5px solid var(--line);border-radius:4px;flex:none;display:grid;place-items:center;font-style:normal;font-size:10px}
.tchk.done i{background:var(--c);border-color:transparent;color:var(--on-accent)}
.tsub{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px}
@media (min-width:768px) and (max-width:900px){.trip{grid-template-columns:1fr}.tleft{border-right:0;border-bottom:1px solid var(--line)}}
@media not all and (min-width:768px){
  .trip{display:block;border:0;border-radius:0;background:none}
  .tside{padding:0;background:none}
  .tleft{padding:0;border:0}.tleft .phead{display:none}
  .ttop{display:flex;align-items:center;gap:10px}.ttop h2{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.15}
  .ttop .pi{width:46px;height:46px;border-radius:14px;font-size:24px}
  .ttabs2{display:flex;margin:12px 0 14px}
  .trip[data-ttab=Map] .tleft,.trip[data-ttab=Itinerary] .tside{display:none}
  .tmap{height:340px}
  .tlegend{position:static;border:0;border-top:1px solid var(--line);border-radius:0;font-size:11.5px;flex-wrap:wrap}
  .tcardx{background:var(--bar)}
}
.wkd{display:flex;gap:5px}
.wkd i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;color:var(--faint);border:1px solid var(--line)}
.wkd .did{background:var(--c);color:var(--bg);border-color:transparent;font-weight:700}
.wkd .tod{border:2px solid var(--c);color:var(--ink)}.wkd .plan{border:1px dashed var(--c);color:var(--soft)}
.onlyphone{display:none}

/* the Packing page (slice 01, Junyan 2026-11-13, d22: "22 yes" to mock version 4): computer only (d14), the mock's one
   cream look in every calendar look (d18), so its colours are set here on the page and every class starts pk- */
:root{--pk-bg:#faf6ef;--pk-bar:#fffdf9;--pk-raise:#f3ece1;--pk-raise2:#e8dfd1;--pk-line:rgba(96,72,40,.16);--pk-hair:rgba(96,72,40,.09);--pk-ink:#1f1b16;--pk-soft:#5e554a;--pk-faint:#736a5e;--pk-accent:#d24a22;--pk-ok:#14946a;--pk-bad:#c42b3c;--pk-week-bg:#dde7f8;--pk-week-ink:#1e4a9c;--pk-day-bg:#f8e6bf;--pk-day-ink:#7a4e00;--pk-leave-bg:#f9dbcd;--pk-leave-ink:#a53412;--pk-card:0 1px 0 rgba(96,72,40,.05),0 1px 2px rgba(60,40,10,.06);--pk-lift:0 6px 16px rgba(60,40,10,.12),0 1px 3px rgba(60,40,10,.10);--pk-shadow:0 14px 36px rgba(60,40,10,.18),0 2px 6px rgba(60,40,10,.12);--pk-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;--pk-display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--pk-white:#fff;--pk-on:#43c79b;--pk-on-ink:#06281c;--pk-now-ink:#0b6b4c;--pk-glass:rgba(255,255,255,.12);--pk-glass2:rgba(255,255,255,.14);--pk-dim:rgba(250,246,239,.72);--pk-knob:rgba(0,0,0,.25);--pk-buy-ink:#0f6b4b}
.page.pk{--bg:var(--pk-bg);--bar:var(--pk-bar);--raise:var(--pk-raise);--raise2:var(--pk-raise2);--line:var(--pk-line);--hair:var(--pk-hair);--ink:var(--pk-ink);--soft:var(--pk-soft);--faint:var(--pk-faint);--accent:var(--pk-accent);--ok:var(--pk-ok);--bad:var(--pk-bad);--week-bg:var(--pk-week-bg);--week-ink:var(--pk-week-ink);--day-bg:var(--pk-day-bg);--day-ink:var(--pk-day-ink);--leave-bg:var(--pk-leave-bg);--leave-ink:var(--pk-leave-ink);--card:var(--pk-card);--lift:var(--pk-lift);--shadow:var(--pk-shadow);--font:var(--pk-font);--display:var(--pk-display);
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;padding:26px 32px 64px;color-scheme:light}
.pk button:focus-visible,.pk input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pk small{font-size:inherit}
.pk-btn{border:1px solid var(--line);background:var(--bar);border-radius:10px;padding:7px 12px;white-space:nowrap}
.pk-btn:hover{background:var(--raise)}
.pk-btn.pk-sm{padding:4px 10px;font-size:13px}
.pk-btn.pk-danger{color:var(--bad)}
.pk-quiet{border:0;background:none;color:var(--soft);padding:4px 6px;border-radius:8px;white-space:nowrap}
.pk-quiet:hover{background:var(--raise);color:var(--ink)}
.pk-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.pk-pi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;flex:none;background:var(--bar);box-shadow:inset 0 0 0 1px var(--line)}
.pk-head h2{font-family:var(--display);font-size:30px;font-weight:750;margin:0;letter-spacing:-.025em;line-height:1.1}
.pk-tabs{display:flex;flex-wrap:wrap;gap:2px 24px;border-bottom:1px solid var(--line);margin:0 0 14px}
.pk-tab{border:0;background:none;padding:6px 2px 11px;color:var(--soft);font-weight:600;font-size:15px;border-bottom:2.5px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:baseline;white-space:nowrap}
.pk-tab small{font-size:12.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.pk-tab:hover{color:var(--ink)}
.pk-tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
.pk-trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:12px;margin:0 0 20px}
.pk-trip{position:relative;text-align:left;border:1px solid var(--line);background:var(--bar);border-radius:16px;padding:12px 14px 16px;
  display:grid;grid-template-columns:38px minmax(0,1fr);gap:2px 11px;align-items:center;box-shadow:var(--card);overflow:hidden;transition:transform .12s,box-shadow .12s}
.pk-trip:hover{transform:translateY(-1px);box-shadow:var(--lift)}
.pk-trip .pk-te{grid-row:1 / 3;width:38px;height:38px;border-radius:11px;background:var(--raise);display:grid;place-items:center;font-size:20px}
.pk-trip .pk-tn{font-family:var(--display);font-size:16.5px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-trip .pk-tc{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-trip .pk-tf{grid-column:1 / 3;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;min-width:0}
.pk-trip .pk-tp{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550}
.pk-trip .pk-tp.pk-no{color:var(--faint);font-weight:450}
.pk-bdg{font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--raise);color:var(--soft);white-space:nowrap}
.pk-bdg.pk-now{background:color-mix(in srgb,var(--ok) 16%,var(--bar));color:var(--pk-now-ink)}
.pk-trip .pk-tb{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--raise)}
.pk-trip .pk-tb i{display:block;height:100%;background:var(--ok);border-radius:0 4px 4px 0}
.pk-trip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:var(--lift)}

  .app{padding-top:max(0px,calc(env(safe-area-inset-top,0px) - var(--tuck)))}

  body.month .left{display:flex;position:fixed;top:calc(56px + max(0px,calc(env(safe-area-inset-top,0px) - var(--tuck))) - min(8px,env(safe-area-inset-top,0px)));left:8px;right:8px;z-index:25;border:1px solid var(--line);border-radius:16px;background:var(--raise);box-shadow:0 16px 40px color-mix(in srgb,var(--lift) calc(50% * var(--lift-k)),transparent);padding:14px;max-height:70%}

  .drop{display:none}

  .bar{padding:calc(8px - min(8px,env(safe-area-inset-top,0px))) 10px 8px max(16px,env(safe-area-inset-left,0px));gap:6px;flex-wrap:nowrap;min-height:calc(52px - min(8px,env(safe-area-inset-top,0px)))}
  .bar h1{font-size:22px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.bar h1 span,.status{display:none}
  .seg button{padding:6px 0;width:30px;text-align:center}
  .bar .btn{padding:6px 11px}
  #panelBtn{width:36px;height:36px;padding:0;font-size:18px}
  .sc{padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel{top:auto;left:0;width:auto;max-height:78%;border-radius:22px 22px 0 0;border:1px solid var(--line);transform:translateY(105%);padding-top:0;bottom:0}
  /* the two ways out of a phone sheet, no x (Junyan, 2026-11-12: "just me pressing the long dash at the top is good
     neough or clicking off the menu should close it"): the dash is drawn 40 x 4 but takes a tap 120 x 44, and a clear
     cover behind the open sheet takes a tap anywhere outside it, so that tap closes the sheet and does nothing else.
     Both close the way x did (closeSheet): unsaved typing is dropped. The desktop side panel keeps its x. */
  .grab{display:block;position:relative;width:120px;height:44px;margin:0 auto;padding:0;border:0;border-radius:0;background:none;flex:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .grab::before{content:"";position:absolute;left:40px;top:12px;width:40px;height:4px;border-radius:2px;background:var(--raise2)}
  body.popen .scrim{display:block;position:fixed;inset:0;z-index:29;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #pClose{display:none}
  .pbody{min-width:0;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  /* the event sheet: one-line rows (slice 02). Every box in it is 16px or more so iOS never zooms (PR 133). The time
     and day boxes lie unseen over their row text, so a tap opens the phone's own wheels and the row reads "1:45 PM". */
  .panel:has(.sheet) .ptabs{display:none}
  .panel:has(.sheet) .pbody{padding-top:4px;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .sheet{display:flex;flex-direction:column;gap:12px}
  .shead{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;min-height:44px;position:sticky;top:0;z-index:2;background:var(--bar)}
  /* keyboard up (sheetFit pins the sheet to the visual viewport, which starts at the screen's very top): the sheet pads
     its top by the status strip, so the dash, Event, Save and the Title never sit under the clock (Junyan, 2026-11-12: "Event
     title also gets pushed into the blur"); a home screen app adds its clear strip below (html.hs .panel.kb). A box

  .panel.kb{border-radius:0;padding-top:env(safe-area-inset-top,0px)}.panel.kb .pbody{padding-bottom:16px;scroll-padding-top:56px}
  /* layout D (Junyan, 2026-11-18, d43: "43 D is good"): with the keyboard up the dash leaves its own 44px row (that row pushed

  .rows{display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
  .srow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;margin:0;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font-size:15px;text-align:left}

/* The iPhone home screen app only (2026-11-12): the page script puts html.hs on in a home screen app on a phone sized
   touch screen with a top inset, and
   html.hsfill with --hsgap when iOS lays the page out short (CalCore.homeFit, WebKit bug 301994). A Safari tab and a
   desktop never get either class. The pinned boxes move by --hsshift, not --hsgap (2026-11-12h): on iOS 26 the stretch
   also grows the window and the fixed layer, so they already reach the bottom; homeFit measures what is still missing
   (CalCore.homeShift). --hstop is the top he picks in the readout: close (0) or clear (38px, below the
   system blur that fades out near 100pt). */
html.hs{--hstop:0px}

html.hsfill{height:calc(100% + var(--hsgap,0px))}
html.hsfill .drop{bottom:calc(-1 * var(--hsshift,0px))}
html.hsfill .toast{bottom:calc(18px + env(safe-area-inset-bottom,0px) - var(--hsshift,0px))}
html.hsfill .panel{bottom:calc(-1 * var(--hsshift,0px))}
html.hsfill .modal{bottom:calc(-1 * var(--hsshift,0px))}
html.hsfill body.popen .scrim{bottom:calc(-1 * var(--hsshift,0px))}
html.hs .x-left{padding-top:calc(14px + env(safe-area-inset-top,0px) + var(--hstop))}

/** The Food view (slice 03, mock v5, d29): laid out like the Bags. Before you go is a wide well across the top like

  const add = (g, hint, wide) => `<label class="pk-add${wide ? "" : " pk-fadd"}"><span class="pk-plus" aria-hidden="true">+</span><input data-pkfadd="${esc(g.id)}" placeholder="${esc(hint)}" autocomplete="off" aria-label="Add to ${esc(g.title)}"></label>`;
  const head = (g) => `<div class="pk-wh"><span class="pk-em" aria-hidden="true">${esc(g.icon)}</span><span class="pk-nm">${esc(g.title)}</span><span class="pk-ct">${esc(g.count)}</span></div>`;
  const rows = (g) => g.rows.length ? `<div class="pk-rows">${g.rows.map((o) => item(g, o)).join("")}</div>` : "";

/** Find narrows the side panel in place, with no redraw, so the box keeps his typing. */
function packFind() {
  const list = $("#pkList"); if (!list || !PK) return;
  const hits = new Set(PK.found(P.list, P.find));
  let n = 0; list.querySelectorAll(".pk-sh").forEach((el) => { const hit = hits.has(el.dataset.pkid); el.hidden = !hit; if (hit) n++; });
  const nm = $("#pkNoMatch"); if (nm) nm.hidden = n > 0;
}
function packRename() {
  const r = $("#pkRen"); if (!r || !P.edit) return;
  const id = P.edit; P.edit = null; PK.rename(id, r.value); packDraw();
}
function wirePacking() {
  const pg = $("#page"), on = () => pkOpen() && PK && PK.ready();
  pg.addEventListener("click", (e) => {
    if (!on()) return;
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.pklist) { P.list = d.pklist; P.del = P.edit = null; P.fresh = P.choose = false; P.find = ""; }
    else if (d.pktab) P.tab = d.pktab;
    else if (d.pkstart) { PK.start(P.list, d.pkstart); P.choose = false; }
    else if (d.pkact === "restart") { P.choose = true; P.del = P.edit = null; }
    else if (d.pkact === "keep") P.choose = false;
    else if (d.pkact === "allpast") P.allPast = true;
    else if (d.pkfilter) P.when = d.pkfilter;
    else if (d.pkpill) PK.cycleWhen(d.pkpill);
    else if (d.pkout) { if (P.list === "all") P.del = d.pkout; else PK.move(P.list, d.pkout, "out"); }
    else if (d.pkin) PK.bring(P.list, d.pkin);
    else if (d.pkact === "del-no") P.del = null;
    else if (d.pkact === "del-yes") { PK.remove(P.del); P.del = null; }
    else if (d.pkact === "fresh") P.fresh = true;
    else if (d.pkact === "fresh-no") P.fresh = false;
    else if (d.pkact === "fresh-yes") { PK.untickAll(P.list); P.fresh = false; }
    else if (d.pkact === "shelf") P.shelf = !P.shelf;
    /* the Food view (slice 03) */
    else if (d.pkview) { P.view = d.pkview; P.del = P.edit = null; P.fresh = false; }
    else if (d.pkact === "food-start") PK.startFood(P.list);
    else if (d.pkfpill) PK.foodCycle(P.list, d.pkfpill);
    else if (d.pkfrm) PK.foodRemove(P.list, d.pkfrm);
    else return;   // "‹ Calendar" and the rail are the calendar's own (clickRouter)
    packDraw();
  });
  pg.addEventListener("change", (e) => {
    if (!on()) return;
    const t = e.target;
    if (t.dataset.pktick) { PK.tick(P.list, t.dataset.pktick, t.checked); packDraw(); }
    else if (t.dataset.pkftick) { PK.foodTick(P.list, t.dataset.pkftick, t.checked); packDraw(); }
    else if (t.id === "pkHide") { P.hide = t.checked; packDraw(); }
  });
  pg.addEventListener("input", (e) => { if (on() && e.target.id === "pkFind") { P.find = e.target.value; packFind(); } });
  pg.addEventListener("submit", (e) => {
    if (!on() || e.target.id !== "pkAddF") return;
    e.preventDefault();
    if (PK.add(P.list, $("#pkAdd").value)) { packDraw(); $("#pkAdd").focus(); }
  });
  pg.addEventListener("dblclick", (e) => { const n = on() && e.target.closest("[data-pkname]"); if (n) { P.edit = n.dataset.pkname; packDraw(); } });
  /* Escape closes an open rename or delete ask first; with none open it leaves the page as on every page */
  pg.addEventListener("keydown", (e) => {
    if (!on()) return;
    if (e.target.id === "pkRen" && e.key === "Enter") { e.preventDefault(); packRename(); return; }
    /* "+ Add, then Enter" in a food group: added at its end, and the box stays ready for the next one */
    const g = e.target.dataset && e.target.dataset.pkfadd;
    if (g && e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      if (PK.foodAdd(P.list, g, e.target.value)) { packDraw(); const box = $(`[data-pkfadd="${g}"]`); if (box) box.focus(); }
      return;
    }
    if (e.key === "Escape" && (P.edit || P.del || P.fresh)) { e.stopPropagation(); P.edit = P.del = null; P.fresh = false; packDraw(); }
  });
  pg.addEventListener("focusout", (e) => { if (on() && e.target.id === "pkRen" && P.edit) packRename(); });
  /* drag an item between To place, the three bags and the side panel */
  const clear = () => { P.drag = null; pg.classList.remove("pk-dragging"); pg.querySelectorAll(".pk-over,.pk-drag").forEach((x) => x.classList.remove("pk-over", "pk-drag")); };
  pg.addEventListener("dragstart", (e) => {
    const el = on() && e.target.closest && e.target.closest("[data-pkid]"); if (!el) return;
    P.drag = el.dataset.pkid; el.classList.add("pk-drag"); pg.classList.add("pk-dragging");
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", P.drag); }
  });
  pg.addEventListener("dragover", (e) => {
    const z = P.drag && e.target.closest && e.target.closest("[data-pkdrop]"); if (!z) return;
    e.preventDefault();
    pg.querySelectorAll(".pk-over").forEach((x) => { if (x !== z) x.classList.remove("pk-over"); });
    z.classList.add("pk-over");
  });
  pg.addEventListener("drop", (e) => {
    const z = P.drag && e.target.closest && e.target.closest("[data-pkdrop]"); if (!z) return;
    e.preventDefault(); const id = P.drag; clear(); PK.move(P.list, id, z.dataset.pkdrop); packDraw();
  });
  pg.addEventListener("dragend", clear);
  /* the window narrows under 768 px: the Packing page closes, as it cannot open there (d14) */
  WIDE.addEventListener("change", () => { if (!WIDE.matches && S.page === "packing") showPage("cal"); });
  WIDE.addEventListener("change", () => { if (S.page === "travel" && S.trip) tripPaint(); });   // a trip's computer column draws when the window widens
}

    <input id="siUser" type="text" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="User ID" placeholder="User ID">

function wireSignIn() {
  if ($("#siRetry")) { $("#siRetry").onclick = () => { S.auth.checked = false; render(); boot(); }; return; }
  const f = $("#siForm"); if (!f) return;
  const done = () => { Object.assign(S.auth, { signedIn: true, known: true, hasPassword: true }); toast("Signed in"); boot(); };
  f.onsubmit = async (e) => {
    e.preventDefault();
    const go = $("#siGo"), pw = $("#siPw").value, user = $("#siUser") ? $("#siUser").value.trim() : "";
    if (!pw || ($("#siUser") && !user)) return;
    go.disabled = true;
    try {
      if (signInState() === "first") {
        if (pw !== $("#siPw2").value) throw new Error("The two passwords are not the same.");
        await api("/auth/password", { method: "POST", headers: { "X-Quest-Key": $("#siKey").value.trim() }, body: JSON.stringify({ password: pw }) });
      } else await send("/auth/login", "POST", { user, password: pw });
      done();
    } catch (err) { go.disabled = false; $("#siPw").select(); toast(err.message, { bad: true }); }
  };
  if ($("#siPk")) $("#siPk").onclick = async () => {

      if (S.form.sheet) { $('[data-v="types"]').hidden = true; sheetPaint(); }
      else if ($("#typeLine")) { $("#typeName").textContent = KNAME[d.kind || C.kindOf({ title: S.ev.title, calName: calOf(S.ev.calId).name })]; $("#typeChips").hidden = true; $("#typeLine").hidden = false; }
    }
    else if (d.sheet === "type") { const c = $('[data-v="types"]'); c.hidden = !c.hidden; }
    else if (t.id === "pGrab") closeSheet();
    else if (t.id === "pSave") saveEvent();
    else if (t.id === "pDel") { const ev = S.ev, sh = !!(S.form && S.form.sheet); panel("now"); if (sh) document.body.classList.remove("popen"); deleteEvent(ev); }
    else if (t.id === "pAcc") acceptSugg(S.ev, { calId: $("#pCal").value, title: $("#pTitle").value.trim() || S.ev.title });
    else if (t.id === "pSkip") skipSugg(S.ev);
    else if (t.id === "soBtn") signOut();
    else if (t.id === "pkAdd") pkAdd();
    else if (d.pkrm) pkRemove(d.pkrm);
    else if (t.id === "soAll") endDevices({ all: true });
    else if (d.end) endDevices({ id: d.end });
    else if (t.id === "pwBtn") { const f = $("#pwForm"); f.hidden = !f.hidden; if (!f.hidden) $("#pwCur").focus(); }
    else if (t.id === "pwGo") changePassword();
    else if (t.id === "pairBtn") { document.body.classList.remove("popen"); const v = $("#view"); v.classList.remove("snap"); v.innerHTML = pairHTML(); wirePair(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "railSw") { S.rail = t.checked; store.set("cal-rail", S.rail ? "1" : "0"); render(); }
    else if (t.id === "routineSw") { S.routine = t.checked; store.set("cal-routine", S.routine ? "1" : "0"); render(); }
    else if (t.id === "tz1") { S.tz = t.value; store.set("cal-tz", S.tz); S.months = {}; showLook(); render(); refresh(true); }
    else if (t.id === "tz2") { S.tz2 = t.value; store.set("cal-tz2", S.tz2); render(); }
    else if (t.closest(".sheet") && (t.dataset.f || t.id === "pCal")) { if (t.id === "pCal") { S.form.calId = t.value; sheetPaint(); } else sheetInput(t); }
    else if (t.closest("#cals")) { const id = t.dataset.id; t.checked ? S.hidden.delete(id) : S.hidden.add(id); store.set("cal-hidden", JSON.stringify([...S.hidden])); render(); }
  });
  $("#todayBtn").onclick = goToday;
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  $("#mmPrev").onclick = () => { S.miniLock = true; S.mini = C.addMonths(S.mini, -1); renderMini(); };
  $("#mmNext").onclick = () => { S.miniLock = true; S.mini = C.addMonths(S.mini, 1); renderMini(); };
  $("#mini").onclick = function miniPick(e) { const b = e.target.closest("button"); if (!b) return; document.body.classList.remove("month"); S.miniLock = false; if (S.n === "m") { S.cur = b.dataset.k; render(); refresh(); } else goTo(S.n === 7 ? C.weekStart(b.dataset.k) : b.dataset.k); };
  /* A lone tap opens or closes the month picker (phone), 350 ms later; a quick run of taps (each under 350 ms after the
     last) never does, and the fifth opens or closes the readout. A tap after a pause is a lone tap again, so a second
     tap a moment later closes the picker (d20, 2026-11-12). */
  let taps = [], tapT = 0;
  $("#title").onclick = function titleTap() {
    const now = Date.now(); if (taps.length && now - taps[taps.length - 1] > 350) taps = []; taps.push(now);
    clearTimeout(tapT);
    if (taps.length >= 5) { taps = []; readout(); return; }
    const n = taps.length;
    tapT = setTimeout(() => { if (n === 1 && innerWidth <= 760) document.body.classList.toggle("month"); }, 350);
  };
  $("#panelBtn").onclick = () => { if (innerWidth <= 1100) { if (!document.body.classList.contains("popen")) panel("now"); document.body.classList.toggle("popen"); } else { document.body.classList.toggle("nopanel"); setTimeout(size, 300); } };
  $("#scrim").onclick = closeSheet;
  $("#pClose").onclick = () => { panel("now"); document.body.classList.remove("popen"); if (innerWidth > 1100) { document.body.classList.add("nopanel"); setTimeout(size, 300); } };
  /* the phone sheet: a box being typed in updates its row at once; a time or day box opens its picker on a click with a
     mouse (a phone opens its own wheels); the box in focus stays above the keyboard */
  $("#pbody").addEventListener("input", (e) => { const t = e.target; if (t.dataset.f && t.closest(".sheet")) { sheetInput(t); if (t.tagName === "TEXTAREA") grow(t); } });
  $("#pbody").addEventListener("click", (e) => { const t = e.target; if (!TOUCH && t.matches("input.ov") && t.showPicker) try { t.showPicker(); } catch {} });
  $("#pbody").addEventListener("focusin", (e) => { if (e.target.closest(".sheet")) setTimeout(sheetFit, 350); });
  $("#pbody").addEventListener("keydown", (e) => { if (e.target.id === "pTitle" && e.key === "Enter") { if (S.ev.ghost) $("#pAcc").click(); else saveEvent(); } });
  $("#newTask").onkeydown = async (e) => {
    const inp = e.target, v = inp.value.trim();
    if (e.key === "Escape") { inp.blur(); return; }
    if (e.key !== "Enter" || !v) return;
    if (!authed()) { toast("Pair this device first", { bad: true }); return; }
    inp.value = ""; inp.disabled = true;
    try {
      await send("/planner/tasks", "POST", { title: v });
      const r = inp.getBoundingClientRect(), f = document.createElement("div"); f.className = "fly"; f.textContent = v; f.style.left = r.left + "px"; f.style.top = (r.top - 4) + "px";
      document.body.appendChild(f); setTimeout(() => f.remove(), 750); toast("In your Tasks Inbox");
    } catch (err) { inp.value = v; toast("Task not added: " + err.message, { bad: true }); }
    inp.disabled = false; inp.focus();
  };
  document.addEventListener("keydown", function keyRouter(e) {
    if (e.target.matches?.("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey || $(".modal")) return;
    const k = e.key.toLowerCase();
    if (k === "escape") { if (S.page === "cards" && window.Cards && window.Cards.onKey(e, cardsCtx)) return; if (S.page !== "cal") showPage("cal"); else { panel("now"); document.body.classList.remove("popen", "month"); } }
    else if (S.page !== "cal") return;
    else if (k === "arrowleft") step(-1, false); else if (k === "arrowright") step(1, false);   // a key jumps at once; the slide made it feel slow (2026-11-21)
    else if (k === "t") goToday(false); else if (k === "1" || k === "d") setN(1); else if (k === "3") setN(3); else if (k === "7" || k === "w") setN(7); else if (k === "m") setN("m");
    else if (k === "n") $("#newTask").focus(); else if (k === "p") $("#panelBtn").click(); else if (k === "?") panel("keys");
    else return;
    e.preventDefault();
  });
  wireSwipe($("#view")); wirePinch($("#view")); wirePacking(); tripWire();
  addEventListener("resize", function onResize() { size(); });
  addEventListener("focus", () => { if (S.tab !== "event" && authed()) { refresh(); loadSide(); } });
  setInterval(() => { showLook(); tickNow(); if (S.tab === "now" && S.page === "cal" && !dragging) paintPanel(); renderRail(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) showLook(); });
}
/** Open or close the hidden readout; its script loads the first time only. */
function readout() {
  if (window.CalReadout) { CalReadout.toggle(); return; }
  CalHook.state = () => ({ cur: S.cur, win0: S.win0, n: S.n, dw, slideX, shown: TOUCH && $("#strip") ? shownX() : null, touch: TOUCH, api: API, h: S.h });
  const s = document.createElement("script"); s.src = "calendar-readout.js?v=7"; document.head.appendChild(s);
}
async function boot() { if (SIGNIN && !S.auth.checked) await authMe(); render(); loadSide(); refresh(); }
commuteWire(); setup(); boot();
</script>
