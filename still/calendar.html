<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14171e">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="calendar-icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="calendar-icon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="calendar-icon-180.png?v=2">
<link rel="manifest" href="calendar.webmanifest?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Calendar</title>
<script src="calendar-core.js?v=14"></script>
<script>
/* The look saved on this device (the Look row in Settings; Studio when none) goes on here, before anything is drawn,
   so the page never opens in the wrong look first. Studio shows its day or night half by the sun in the calendar's
   time zone. Ink is the plain page with no data-look. */
(function () {
  var id = "studio", tz = "America/Toronto";
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  try { id = CalCore.startLook(localStorage); tz = localStorage.getItem("cal-tz") || tz; } catch (e) {}
  try {
    var f = CalCore.lookFace(id, Date.now(), tz);
    if (f.face) document.documentElement.dataset.look = f.face;
    document.querySelector('meta[name="theme-color"]').content = f.theme;
    document.querySelector('meta[name="color-scheme"]').content = f.scheme;
  } catch (e) {}
  /* the hour height this phone last pinched to (slice 01), so the day opens at that height, never 56 first */
  try { document.documentElement.style.setProperty("--H", CalCore.startHour(localStorage, matchMedia("(hover: none) and (pointer: coarse)").matches) + "px"); } catch (e) {}
})();
</script>
<!--
  Calendar: Junyan's calendar app. Second shape (2026-11-10, one-system map ticket 026 "Build the new
  calendar shell"; approved mockup saved at fleet/wayfinder/one-system/assets/026-calendar-mockup.html):
  - a slim icon sidebar (Calendar plus one page per block type),
  - a left column (month, calendars), with the "+ New task" drop box pinned bottom left and no task list,
  - one endless strip of day columns that snaps as you swipe (touch and trackpad); 3 days by default,
  - one right panel for Now, event details, Settings and Shortcuts (no pop-up).
  Colour is by BLOCK TYPE (eleven types, calendar-core.js KINDS), guessed from the title; a hand-set type is
  kept on the Google event (extendedProperties.private.kind). Every new event goes to Joint Plans.
  Studio shifts (the Staff Scheduling calendar) sit in a slim rail on the right of each day.
  Four looks (2026-11-11): Studio (default; light by day, charcoal by night, switching at sunrise and sunset),
  Ink, Stage Lights, Velvet & Brass, picked per device in Settings > Look (calendar-core.js LOOKS, localStorage
  "cal-look", put on in the head before the first paint).
  Each type's helper and page are later tickets (034 to 043); until then a type page lists its next blocks.

  Backend: still-api /planner/* (src/planner.mjs, planner-tasks.mjs, suggestions.mjs), gated by the
  Day Quest pairing code (localStorage "quest-key", header X-Quest-Key).
  Suggestions from Claude sessions show as dashed ghosts with Accept / Skip (still/CALENDAR-SUGGESTIONS.md).
  The goal tracker's "Work block · 🎯 A/B" titles are shown exactly as written.
  No AI runs on page load; the last data is cached in localStorage so the page draws at once.
  URL switches: ?api=URL (another still-api).
-->
<style>
/* Look (2026-11-11, Junyan: "a complete colour and visual redesign to make it much more professional and exciting",
   and "the month and stuff fade out on the top edge so it needs to be clean"):
   - a calm ink background, so the block colours do the talking; no sky gradient;
   - one named palette, set once below; each block type takes one colour from it (the meaning is unchanged:
     colour = block type, calendar-core.js KINDS). Titles are near white on a solid tinted card (over 9:1),
     times over 4.5:1, checked by still/test/calendar-look.test.mjs;
   - one accent (--now, red) for "now" things only: the now line and its time pill, today, the Today button and
     the chosen view in the 1 / 3 / 7 / M switch;
   - solid header and footer bars with a hairline edge; nothing shows through them. */
:root{
/* the palette */
--amber:#fbbf24;--orange:#fb923c;--lime:#a3e635;--emerald:#34d399;--cyan:#22d3ee;--blue:#60a5fa;
--indigo:#818cf8;--purple:#c084fc;--pink:#f472b6;--slate:#94a3b8;--sand:#d6bc8a;--stone:#a8a29e;--red:#ff4f5e;
/* surfaces and text */
--bg:#0e1015;--bar:#14171e;--raise:#1a1e27;--raise2:#232835;--line:rgba(255,255,255,.09);--hair:rgba(255,255,255,.05);
--ink:#f2f4f8;--soft:#a9b0bf;--faint:#6e7686;
--now:var(--red);--accent:var(--red);--go:var(--ink);
/* text on the accent (today, the chosen view, the now pill), the accent as text (Today button), the plain colour of a
   pressed chip with no type */
--on-accent:#ffffff;--accent-ink:var(--accent);--neutral:#ffffff;
/* event cards: fill and pill tint (share of the type colour), title and time (a share of the type colour mixed into
   --ev-ink / --ev-time), and a glow round each card (0% is none) */
--ev-fill:26%;--pill-fill:22%;--ev-title:15%;--ev-ink:#ffffff;--ev-time-p:40%;--ev-time:#c3c9d4;--ev-halo:0%;
/* small washes and shadows */
--glow:rgba(255,255,255,.06);--today-col:rgba(255,255,255,.018);--past:rgba(0,0,0,.18);--drop:rgba(0,0,0,.6);--track:rgba(255,255,255,.12);
/* big shadows (the selected card, side panel, pop-ups) and the pop-up dimmer: a colour and a strength (1 is full) */
--lift:#000000;--lift-k:1;
/* an event that is over (earlier today, or a past day): its card fill, and its title (a share of the type colour
   mixed into --dim-ink); no see-through, so the title still reads at 4.5:1 or better */
--dim-fill:12%;--dim-title:20%;--dim-ink:var(--soft);--dim-time:var(--soft);
/* the strip behind the iPhone clock in home-screen mode (only a light look needs one) */
--status:transparent;
/* block types: colour means type */
--k-deep:var(--amber);--k-studio:var(--orange);--k-yoga:var(--cyan);--k-gym:var(--purple);--k-dance:var(--pink);--k-cook:var(--lime);
--k-travel:var(--blue);--k-social:var(--emerald);--k-errand:var(--indigo);--k-wind:var(--slate);--k-rest:var(--sand);--k-other:var(--stone);
/* old names some rules still use */
--glass:var(--raise);--glass2:var(--raise2);--panel:var(--bar);--pin:var(--bar);--deep:var(--bar);
--H:56px;--hh:68px;--gut:56px;--rail:56px;--radius:8px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
--display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
/* More looks (Junyan, 2026-11-11: "Can you give me three more colour schemes. Make it really inspirational for a
   dancer and business owner"). Picked per device from the Look row in Settings (calendar-core.js LOOKS). Each is
   colours only: every block type keeps its Ink colour family, and where the look's accent sits near a type, that
   type's shade moves away from it (still/test/calendar-look.test.mjs checks the distance and every card's contrast). */
/* Studio, the default (Junyan, 2026-11-11: "Let's go wtih the calendar mode with the night mode for when it's night"):
   two halves, put on by the sun (calendar-core.js lookFace): the day half from sunrise to sunset, the night half from
   sunset to sunrise. Both use one coral for "now", today, the Today button and the chosen view, so they feel like one look.
   Day: Studio Morning as first shipped (PR 125). A sunlit studio, a maple floor, a paper planner. Warm cream, warm ink,
   ballet coral. Coral sits near Studio On-Site, so Studio On-Site is a deep burnt orange and Deep Work an ochre. The
   iPhone draws its clock in white over the top of the page (black-translucent), so a dark strip fills that space;
   big shadows are a soft warm brown, not black. */
:root[data-look="studio-day"]{
--amber:#9a7d00;--orange:#a35a0a;--lime:#4f9418;--emerald:#14946a;--cyan:#0e8fa3;--blue:#2563c8;
--indigo:#6358d0;--purple:#9a46c8;--pink:#c7317f;--slate:#5f6f86;--sand:#a1865a;--stone:#857d77;--red:#c42b3c;
--bg:#faf6ef;--bar:#fffdf9;--raise:#f4eee4;--raise2:#e8dfd1;--line:rgba(96,72,40,.16);--hair:rgba(96,72,40,.09);
--ink:#1f1b16;--soft:#5e554a;--faint:#736a5e;
--now:#d24a22;--accent:#d24a22;--on-accent:#ffffff;--accent-ink:#b23a17;--neutral:#1f1b16;
--ev-fill:14%;--pill-fill:16%;--ev-title:50%;--ev-ink:#1f1b16;--ev-time-p:40%;--ev-time:#4a4239;--ev-halo:0%;
--glow:rgba(210,74,34,.12);--today-col:rgba(210,74,34,.035);--past:rgba(96,72,40,.05);--drop:rgba(96,72,40,.16);--track:rgba(31,27,22,.10);
--lift:#3c2a14;--lift-k:.4;--dim-fill:7%;--dim-title:30%;
--status:#1f1b16;color-scheme:light}
/* Night: a flat neutral charcoal with off-white text and no tint, the header and bottom bar a touch lifted from the
   page. The same coral, brightened for the dark; Studio On-Site a yellower tangerine to stay clear of it. */
:root[data-look="studio-night"]{
--amber:#fbbf24;--orange:#fc980c;--lime:#a3e635;--emerald:#34d399;--cyan:#22d3ee;--blue:#60a5fa;
--indigo:#818cf8;--purple:#c084fc;--pink:#f472b6;--slate:#94a3b8;--sand:#d6bc8a;--stone:#a8a29e;--red:#ff5a5f;
--bg:#1c1c1c;--bar:#262626;--raise:#2e2e2e;--raise2:#3a3a3a;--line:rgba(255,255,255,.10);--hair:rgba(255,255,255,.055);
--ink:#e6e6e6;--soft:#ababab;--faint:#8c8c8c;
--now:#ff7a59;--accent:#ff7a59;--on-accent:#1c1c1c;--accent-ink:#ff7a59;--neutral:#e6e6e6;
--ev-fill:26%;--pill-fill:22%;--ev-title:14%;--ev-ink:#ffffff;--ev-time-p:38%;--ev-time:#d6d6d6;--ev-halo:0%;
--glow:rgba(255,122,89,.10);--today-col:rgba(255,255,255,.02);--past:rgba(0,0,0,.2);--drop:rgba(0,0,0,.55);--track:rgba(255,255,255,.12)}
/* Stage Lights: the moment before the curtain. A plum-black stage, spotlight gold for "now", jewel-tone gels that glow.
   Gold sits near Deep Work, so Deep Work turns a deep amber-orange and Studio On-Site a vermilion. */
:root[data-look="stage"]{
--amber:#e08000;--orange:#ff5c3a;--lime:#a6ec3c;--emerald:#28e0a0;--cyan:#2ee0e8;--blue:#3d8bff;
--indigo:#8a80ff;--purple:#c46cf5;--pink:#ff4fae;--slate:#9ea6cf;--sand:#c8b49c;--stone:#a39aa3;--red:#ff5c6c;
--bg:#120d1a;--bar:#1d1529;--raise:#251b34;--raise2:#302343;--line:rgba(236,220,255,.10);--hair:rgba(236,220,255,.055);
--ink:#f7f1fb;--soft:#bdb1cc;--faint:#8a7d9e;
--now:#ffc857;--accent:#ffc857;--on-accent:#1a1024;--accent-ink:#ffc857;--neutral:#f7f1fb;
--ev-fill:30%;--pill-fill:26%;--ev-title:12%;--ev-ink:#ffffff;--ev-time-p:40%;--ev-time:#d9cfe6;--ev-halo:38%;
--glow:rgba(255,200,87,.10);--today-col:rgba(255,200,87,.035);--past:rgba(0,0,0,.22);--drop:rgba(0,0,0,.65);--track:rgba(236,220,255,.12)}
/* Velvet & Brass: a quiet, premium front office. Emerald-black, warm cream text, brushed brass for "now", calmer
   gem tones. Brass sits near Deep Work and Rest, so Deep Work is a bright citrine and Rest a pale linen. */
:root[data-look="velvet"]{
--amber:#f5cc1f;--orange:#d0603e;--lime:#a3c45c;--emerald:#4cbf86;--cyan:#3cc6c0;--blue:#4f88e0;
--indigo:#9097ec;--purple:#b97ad9;--pink:#d9668f;--slate:#8ea2ac;--sand:#e0d6c2;--stone:#a39c92;--red:#e0605a;
--bg:#0b1a17;--bar:#11251f;--raise:#16302a;--raise2:#1e3c34;--line:rgba(243,234,216,.10);--hair:rgba(243,234,216,.055);
--ink:#f3ead8;--soft:#b8b4a0;--faint:#82907f;
--now:#c8a46a;--accent:#c8a46a;--on-accent:#10201b;--accent-ink:#d8b77f;--neutral:#f3ead8;
--ev-fill:26%;--pill-fill:22%;--ev-title:14%;--ev-ink:#fffaf0;--ev-time-p:38%;--ev-time:#d4ccb8;--ev-halo:0%;
--glow:rgba(200,164,106,.10);--today-col:rgba(200,164,106,.03);--past:rgba(0,0,0,.2);--drop:rgba(0,0,0,.55);--track:rgba(243,234,216,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--status);z-index:200;pointer-events:none}
body{background:var(--bar);color:var(--ink);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--now);outline-offset:1px}
[hidden]{display:none!important}
.k-deep{--c:var(--k-deep)}.k-studio{--c:var(--k-studio)}.k-yoga{--c:var(--k-yoga)}.k-gym{--c:var(--k-gym)}.k-dance{--c:var(--k-dance)}.k-cook{--c:var(--k-cook)}
.k-travel{--c:var(--k-travel)}.k-social{--c:var(--k-social)}.k-errand{--c:var(--k-errand)}.k-wind{--c:var(--k-wind)}.k-rest{--c:var(--k-rest)}.k-other{--c:var(--k-other)}
.app{display:grid;grid-template-columns:var(--rail) 236px minmax(0,1fr) 324px;height:100%;padding-top:env(safe-area-inset-top,0px);background:var(--bar)}
body.nopanel .app{grid-template-columns:var(--rail) 236px minmax(0,1fr) 0}
body.railopen{--rail:186px}
aside,nav{min-height:0;min-width:0}
aside{background:var(--bar);overflow:hidden}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:600;margin:0 0 8px}
.meta{color:var(--faint);font-size:11.5px}.spacer{flex:1}
.icon{border:0;background:none;color:var(--soft);font-size:17px;padding:3px 8px;border-radius:8px;line-height:1}.icon:hover{background:var(--raise)}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:6px 12px}.btn:hover{background:var(--raise2)}
.btn.pri{background:var(--ink);color:var(--bg);font-weight:700;border-color:transparent}.btn.del{color:var(--red)}
select option{background:var(--raise)}

/* sidebar of pages */
.rail{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:hidden auto}
.rail button{display:flex;align-items:center;border:0;background:none;border-radius:11px;padding:0;height:38px;width:100%;color:var(--soft);position:relative;white-space:nowrap;text-align:left;flex:none;transition:background .15s}
.rail .ic{flex:none;width:39px;height:38px;display:grid;place-items:center;font-size:18px;transition:transform .15s}
.rail .nm{opacity:0;transition:opacity .15s;font-size:13px;padding-left:4px}
body.railopen .rail .nm{opacity:1}
.rail button:hover{background:var(--raise)}.rail button:hover .ic{transform:scale(1.12)}
.rail button[aria-pressed=true]{background:color-mix(in srgb,var(--c,var(--neutral)) 18%,var(--bg));color:var(--ink);font-weight:600}
.rail .live::after{content:"";position:absolute;left:28px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px;align-self:stretch}

/* left column */
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:16px 14px 96px;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}
.mini b{color:var(--faint);font-weight:500;font-size:10.5px;padding-bottom:3px}
.mini button{border:0;background:none;border-radius:8px;aspect-ratio:1;padding:0;position:relative;font-variant-numeric:tabular-nums}
.mini button:hover{background:var(--raise)}.mini .out{color:var(--faint)}.mini .sel{background:var(--raise2)}
.mini .today{background:var(--accent);color:var(--on-accent);font-weight:700}
.cals label{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:13.5px;cursor:pointer}
.cals input{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:4px;border:2px solid var(--c);margin:0;flex:none}
.cals input:checked{background:var(--c)}.cals label.off{color:var(--faint)}.cals .err{color:var(--red);font-size:11px}
.drop{position:fixed;left:calc(var(--rail) + 14px);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:208px;z-index:15;transition:left .2s}
.dropbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raise);transition:border-color .2s,box-shadow .2s}
.dropbox:focus-within{border-color:color-mix(in srgb,var(--ink) 40%,transparent);box-shadow:0 0 0 4px var(--glow)}
.dropbox input{flex:1;min-width:0;border:0;background:none;outline:none}.dropbox input::placeholder{color:var(--faint)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line);background:var(--raise2);border-radius:6px;padding:1px 6px;color:var(--soft)}
.fly{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-weight:600;border-radius:999px;padding:5px 12px;pointer-events:none;animation:fly .7s cubic-bezier(.3,.7,.2,1) forwards;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fly{to{transform:translateY(-70px) scale(.6);opacity:0}}

/* middle */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px 10px 20px;background:var(--bar);position:relative;z-index:9}
.bar h1{font-family:var(--display);font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em;white-space:nowrap;cursor:default;min-width:0;overflow:hidden;text-overflow:ellipsis}
.seg,.bar .btn,.bar .icon,.nav{flex:none}.nav{white-space:nowrap}
/* "November 2026": the month bold, the year light (his reference picture); a phone shows the month alone (below) */
.bar h1 span{font-weight:300;color:var(--ink)}
#title{touch-action:manipulation}   /* five quick taps open the readout; never a double-tap zoom */
.wk,.status{color:var(--faint);font-size:12.5px;white-space:nowrap}
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;color:var(--soft);white-space:nowrap;font-weight:500;font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
#todayBtn{color:var(--accent-ink);font-weight:600;background:color-mix(in srgb,var(--accent) 12%,var(--bar));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
#todayBtn:hover{background:color-mix(in srgb,var(--accent) 20%,var(--bar))}
.sc{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:none;background:var(--bg)}.sc::-webkit-scrollbar{display:none}
.sc.snap{scroll-snap-type:x mandatory;scroll-padding-left:var(--gut);overscroll-behavior-x:contain}
/* a finger moves days through the swipe rules in the page script (calendar-core.js swipeLock / swipeCommit), never
   through native sideways scrolling, which snapped to the next day on any sideways drift (2026-11-11). These two
   rules are a backstop now: the clipped .pane below leaves the view no sideways range to scroll. */
body.touch .sc{overflow-x:hidden;touch-action:pan-y}
/* No zoom on a phone (Junyan, 2026-11-12): iOS zooms the page when a focused text box has text under 16px, so every
   text box is 16px on touch (the editor title keeps its 20px); manipulation stops the double-tap zoom everywhere. */
body.touch input,body.touch select,body.touch textarea{font-size:16px}
@media (hover:none) and (pointer:coarse){html,body{touch-action:manipulation}}
/* No bounce on a phone (Junyan, 2026-11-12: "When I scroll up hard Sun 1 goes down butn ot the top bar"): iOS let the day
   list rubber-band past its ends and carried the sticky day header with it. none stops the bounce and the hand-off to the
   page, on the page itself and on every phone scroller: the day list and month view (.sc), the event sheet (.pbody), the
   month picker (.left) and the full pages (.page). Touch only; the desktop keeps its own scrolling. */
@media (hover:none) and (pointer:coarse){html,body,.sc,.sc.snap,.pbody,.left,.page{overscroll-behavior:none}}
body.touch .sc.snap{scroll-snap-type:none}
/* On touch the days sit in a pane that clips them sideways without scrolling (overflow-x:clip): the view has no
   sideways scroll range at all, so iOS has nothing to move during an up/down glide or a trackpad scroll. The
   strip is slid with a transform (slideTo); clip, unlike hidden, keeps the sticky day headers working. (2026-11-11) */
.pane{position:relative}
body.touch .pane{overflow-x:clip}
.strip{display:flex;width:max-content}
.gut{position:sticky;left:0;z-index:7;width:var(--gut);flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex}
.gut>div{flex:1;min-width:0}
.corner{position:sticky;top:0;height:var(--hh);z-index:2;background:var(--bar);display:flex;align-items:flex-end;justify-content:center;padding:0 2px 7px;font-size:9.5px;font-weight:600;letter-spacing:.02em;color:var(--soft);border-bottom:1px solid var(--line);box-shadow:0 6px 12px -8px var(--drop);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.corner span{overflow:hidden;text-overflow:ellipsis}
.hours{position:relative;height:calc(24*var(--H))}
.hours span{position:absolute;right:7px;font-size:10.5px;color:var(--faint);transform:translateY(-50%);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.01em}

  return `<div class="field"><p class="lbl" style="margin:0">Look</p><div class="looks" role="group" aria-label="Look">${C.LOOKS.map((l) => `<button class="look" data-look="${l.id}" aria-pressed="${l.id === S.look}" style="${swatch(l)}"><span class="lk-chip ${l.day ? "split" : ""}" aria-hidden="true"><i></i><i></i><i></i></span><span class="lk-nm">${esc(l.name)}</span></button>`).join("")}</div><div class="meta">Tap one to try it on the whole calendar. This device remembers it. Studio is light by day and dark after sunset.</div></div>
    <div class="field"><p class="lbl" style="margin:0">Studio shifts</p><label class="sw" for="railSw">Show in a slim rail, not as full blocks<input type="checkbox" id="railSw" ${S.rail ? "checked" : ""}></label></div>
    <div class="field"><p class="lbl" style="margin:0">Time zones</p><label class="sw" for="tz1">Main<select id="tz1">${opts(S.tz)}</select></label><label class="sw" for="tz2">Second<select id="tz2">${opts(S.tz2, true)}</select></label></div>
    <div class="field"><p class="lbl" style="margin:0">Block types</p>${C.KINDS.map(([k, n]) => `<div class="r k-${k}" style="color:var(--soft)"><i style="width:12px;height:12px;border-radius:4px;background:var(--c)"></i>${KICON[k] ? KICON[k] + " " : ""}${n}</div>`).join("")}<div class="meta">Guessed from the title. Change one on its event and it sticks.</div></div>
    <div class="field"><p class="lbl" style="margin:0">This device</p><button class="btn" id="pairBtn">Change pairing code</button></div>`;
}
/** Put the chosen look on the whole page; for Studio, the half the sun says (day or night) in the calendar's zone.
    Runs on a tap, every 30 s and when the page comes back into view, so Studio flips at sunrise and sunset by itself. */
function showLook() {
  const f = C.lookFace(S.look, Date.now(), S.tz), root = document.documentElement;
  if ((root.dataset.look || null) !== f.face) { if (f.face) root.dataset.look = f.face; else delete root.dataset.look; }
  const tc = $('meta[name="theme-color"]'), cs = $('meta[name="color-scheme"]');
  if (tc.content !== f.theme) tc.content = f.theme;
  if (cs.content !== f.scheme) cs.content = f.scheme;
}
/** Pick a look and keep it on this device (the head script puts it back before the next paint). */
function setLook(id) {
  S.look = C.lookId(id);
  store.set("cal-look", S.look);
  showLook();
  $$("button[data-look]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.look === S.look)));
}
function pKeys() {
  const k = [["Swipe left or right", TOUCH ? "one finger, sideways" : "two fingers"], ["Back and forward", "← →"], ["Today", "T"], ["Day", "1 or D"], ["3 days", "3"], ["Week", "7 or W"], ["Month", "M"], ["New task", "N"], ["Show or hide this panel", "P"], ["Close details", "Esc"]];
  return `<div class="keys-list">${k.map(([a, b]) => `<span>${a}</span><kbd>${b}</kbd>`).join("")}</div>`;
}

/* ---------- suggestions ---------- */
async function acceptSugg(g, over = {}) {
  panel("now"); status("Saving…");
  try { const d = await send("/planner/suggestions/accept", "POST", { id: g.id, ...over }); S.sugg = S.sugg.filter((x) => x.id !== g.id); dropMonthsAround(g.start); toast("Accepted, on " + calOf(d.suggestion.eventCalId).name); await refresh(true); }
  catch (e) { status(""); toast(e.message, { bad: true }); }
}
async function skipSugg(g) {
  panel("now");
  try { await send("/planner/suggestions/skip", "POST", { id: g.id }); S.sugg = S.sugg.filter((x) => x.id !== g.id); toast("Skipped"); render(); }
  catch (e) { toast(e.message, { bad: true }); }
}

/* ---------- a block type's own page (its real content comes in later tickets) ---------- */
function renderPage() {
  const k = S.page, t = today(), now = Date.now(), ws = C.weekStart(t);
  const all = eventsFor(ws, C.addDays(t, 21)).filter((e) => e.k === k && !isStaff(e));
  const on = (d) => all.some((e) => (e.allDay ? C.coversDay(e, d) : C.wall(e.s, S.tz).day === d));
  const up = all.filter((e) => (e.allDay ? e.end > t : e.e > now)).sort((a, b) => (a.allDay ? Date.parse(a.start) : a.s) - (b.allDay ? Date.parse(b.start) : b.s)).slice(0, 6);
  let dots = ""; for (let i = 0; i < 7; i++) { const d = C.addDays(ws, i); dots += `<i class="${on(d) ? (d < t ? "did" : d === t ? "tod" : "plan") : ""}" title="${DOW[C.dowOf(d)]}">${"MTWTFSS"[i]}</i>`; }
  const pg = $("#page"); pg.className = "page k-" + k;
  pg.innerHTML = `<div class="phead"><button class="btn" data-page="cal">&#8249; Calendar</button><span class="pi">${KICON[k]}</span><div style="min-width:0"><h2>${esc(KNAME[k])}</h2><div class="meta">Will be filled from ${esc(KFROM[k])}</div></div><span class="spacer"></span><div class="wkd" aria-label="This week">${dots}</div></div>
    <div class="pgrid"><div class="card"><p class="lbl">Next ${esc(KNAME[k])} blocks</p>${up.map((e) => rowHTML(e, true)).join("") || '<span class="meta">None planned. Add one on the calendar.</span>'}</div>
    <div class="card"><p class="lbl">This page</p><div style="color:var(--soft);line-height:1.5">The ${esc(KNAME[k])} page is being built as its own step. For now it shows your next blocks of this type; tap one to see it on the calendar.</div></div></div>`;
}
function showPage(k) {
  /* t9 (Junyan, 2026-11-12, "9 yes"): a type whose page lives elsewhere (travel: Day Quest Trips) goes there, on a
     wide screen only; a phone keeps this page because Day Quest has no Trips page there. ?api= carries over. */
  const link = WIDE.matches && C.pageLink(k, location.search);
  if (link) { location.href = link.href; return; }
  if (S.page === "cal" && $("#strip")) S.top = $("#view").scrollTop;
  S.page = k; document.body.classList.toggle("onpage", k !== "cal"); document.body.classList.remove("popen", "month");
  $("#page").hidden = k === "cal"; render();
  if (k !== "cal") $("#page").scrollTop = 0;
}

/* ---------- pairing ---------- */
/* On a phone the box shows the code as plain text, offers no autofill or autocorrect, and a paste drops spaces and line
   breaks and replaces what is there (Junyan, 2026-11-12: a paste "adds extra digits"). Desktop keeps the hidden box. */
function pairHTML() {
  const box = TOUCH ? `type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-1p-ignore data-lpignore="true"` : `type="password" autocomplete="off"`;
  return `<div class="pair"><h2>Pair this device</h2><p class="meta">Enter the Day Quest pairing code to read and change your calendars and tasks.</p><input id="pairIn" ${box} aria-label="Pairing code"><button class="btn pri" id="pairGo">Pair</button></div>`;
}
function wirePair() {
  if (TOUCH) $("#pairIn").addEventListener("paste", (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData("text"); if (text == null) return;
    e.preventDefault(); e.target.value = text.replace(/\s+/g, "");
  });
  const go = async () => {
    const raw = $("#pairIn").value, val = TOUCH ? raw.replace(/\s+/g, "") : raw.trim(); if (!val) return;
    const old = questKey(); store.set("quest-key", val);
    try { await api("/planner/calendars"); toast("Paired"); boot(); }
    catch (e) { store.set("quest-key", old || null); toast("That code did not work: " + e.message, { bad: true }); }
  };
  $("#pairGo").onclick = go; $("#pairIn").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

/* ---------- controls ---------- */
function setup() {
  document.addEventListener("click", function clickRouter(e) {
    const t = e.target.closest("[data-railtog],[data-page],[data-n],[data-p],[data-key],[data-staff],[data-allday],[data-open],[data-acc],[data-skip],[data-go],[data-dur],[data-kind],[data-sheet],button[data-look],#pSave,#pDel,#pAcc,#pSkip,#pX,#pairBtn");
    if (!t || t.closest(".ev")) return;
    const d = t.dataset;
    if (t.matches("button[data-look]")) setLook(d.look);
    else if ("railtog" in d) { document.body.classList.toggle("railopen"); renderRail(); setTimeout(size, 260); }
    else if (d.page) showPage(d.page);
    else if (d.n) setN(d.n === "m" ? "m" : +d.n);
    else if (d.p) panel(d.p);
    else if (d.staff) { const k = d.staff; panel("list", { title: "Studio shifts", sub: dayLabel(k), events: eventsFor(k, k).filter((x) => isStaff(x) && C.pieces({ start: x.s, end: x.e }, [k], S.tz).length).sort((a, b) => a.s - b.s), foot: "From Staff Scheduling. They sit in the slim rail so they stop covering your own plans. Settings can turn the rail off." }); }
    else if (d.allday) { const k = d.allday; panel("list", { title: "All day", sub: dayLabel(k), events: [...eventsFor(k, k), ...ghosts()].filter((x) => x.allDay && C.coversDay(x, k)) }); }
    else if (d.open) { S.cur = d.open; setN(1); }
    else if (d.key) { const ev = findByKey(d.key); if (ev) { if (S.page !== "cal") { showPage("cal"); goTo(ev.allDay ? ev.start : C.wall(ev.s, S.tz).day, false); } panel("event", ev); } }
    else if (d.acc || d.skip || d.go) {
      const g = ghosts().find((x) => x.id === (d.acc || d.skip || d.go)); if (!g) return;
      if (d.acc) acceptSugg(g); else if (d.skip) skipSugg(g);
      else { document.body.classList.remove("popen"); if (S.n === "m") S.n = 3; goTo(g.allDay ? g.start : C.wall(g.s, S.tz).day); }
    }
    else if (d.dur) { S.form.dur = +d.dur; $$("[data-dur]").forEach((c) => c.setAttribute("aria-pressed", String(c === t))); }
    else if ("kind" in d) { S.form.kind = d.kind; $$("[data-kind]").forEach((c) => c.setAttribute("aria-pressed", String(c === t))); if (S.form.sheet) { $('[data-v="types"]').hidden = true; sheetPaint(); } }
    else if (d.sheet === "type") { const c = $('[data-v="types"]'); c.hidden = !c.hidden; }
    else if (t.id === "pX") { panel("now"); document.body.classList.remove("popen"); }
    else if (t.id === "pSave") saveEvent();
    else if (t.id === "pDel") { const ev = S.ev, sh = !!(S.form && S.form.sheet); panel("now"); if (sh) document.body.classList.remove("popen"); deleteEvent(ev); }
    else if (t.id === "pAcc") acceptSugg(S.ev, { calId: $("#pCal").value, title: $("#pTitle").value.trim() || S.ev.title });
    else if (t.id === "pSkip") skipSugg(S.ev);
    else if (t.id === "pairBtn") { document.body.classList.remove("popen"); const v = $("#view"); v.classList.remove("snap"); v.innerHTML = pairHTML(); wirePair(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "railSw") { S.rail = t.checked; store.set("cal-rail", S.rail ? "1" : "0"); render(); }
    else if (t.id === "tz1") { S.tz = t.value; store.set("cal-tz", S.tz); S.months = {}; showLook(); render(); refresh(true); }
    else if (t.id === "tz2") { S.tz2 = t.value; store.set("cal-tz2", S.tz2); render(); }
    else if (t.closest(".sheet") && (t.dataset.f || t.id === "pCal")) { if (t.id === "pCal") { S.form.calId = t.value; sheetPaint(); } else sheetInput(t); }
    else if (t.closest("#cals")) { const id = t.dataset.id; t.checked ? S.hidden.delete(id) : S.hidden.add(id); store.set("cal-hidden", JSON.stringify([...S.hidden])); render(); }
  });
  $("#todayBtn").onclick = goToday;
  $("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
  $("#mmPrev").onclick = () => { S.miniLock = true; S.mini = C.addMonths(S.mini, -1); renderMini(); };
  $("#mmNext").onclick = () => { S.miniLock = true; S.mini = C.addMonths(S.mini, 1); renderMini(); };
  $("#mini").onclick = function miniPick(e) { const b = e.target.closest("button"); if (!b) return; document.body.classList.remove("month"); S.miniLock = false; if (S.n === "m") { S.cur = b.dataset.k; render(); refresh(); } else goTo(S.n === 7 ? C.weekStart(b.dataset.k) : b.dataset.k); };
  /* A lone tap opens or closes the month picker (phone), 350 ms later; a quick run of taps (each under 350 ms after the
     last) never does, and the fifth opens or closes the readout. A tap after a pause is a lone tap again, so a second
     tap a moment later closes the picker (d20, 2026-11-12). */
  let taps = [], tapT = 0;
  $("#title").onclick = function titleTap() {
    const now = Date.now(); if (taps.length && now - taps[taps.length - 1] > 350) taps = []; taps.push(now);
    clearTimeout(tapT);
    if (taps.length >= 5) { taps = []; readout(); return; }
    const n = taps.length;
    tapT = setTimeout(() => { if (n === 1 && innerWidth <= 760) document.body.classList.toggle("month"); }, 350);
  };
  $("#panelBtn").onclick = () => { if (innerWidth <= 1100) { if (!document.body.classList.contains("popen")) panel("now"); document.body.classList.toggle("popen"); } else { document.body.classList.toggle("nopanel"); setTimeout(size, 300); } };
  $("#pClose").onclick = () => { panel("now"); document.body.classList.remove("popen"); if (innerWidth > 1100) { document.body.classList.add("nopanel"); setTimeout(size, 300); } };
  /* the phone sheet: a box being typed in updates its row at once; a time or day box opens its picker on a click with a
     mouse (a phone opens its own wheels); the box in focus stays above the keyboard */
  $("#pbody").addEventListener("input", (e) => { const t = e.target; if (t.dataset.f && t.closest(".sheet")) { sheetInput(t); if (t.tagName === "TEXTAREA") grow(t); } });
  $("#pbody").addEventListener("click", (e) => { const t = e.target; if (!TOUCH && t.matches("input.ov") && t.showPicker) try { t.showPicker(); } catch {} });
  $("#pbody").addEventListener("focusin", (e) => { if (e.target.closest(".sheet")) setTimeout(sheetFit, 350); });
  $("#pbody").addEventListener("keydown", (e) => { if (e.target.id === "pTitle" && e.key === "Enter") { if (S.ev.ghost) $("#pAcc").click(); else saveEvent(); } });
  $("#newTask").onkeydown = async (e) => {
    const inp = e.target, v = inp.value.trim();
    if (e.key === "Escape") { inp.blur(); return; }
    if (e.key !== "Enter" || !v) return;
    if (!questKey()) { toast("Pair this device first", { bad: true }); return; }
    inp.value = ""; inp.disabled = true;
    try {
      await send("/planner/tasks", "POST", { title: v });
      const r = inp.getBoundingClientRect(), f = document.createElement("div"); f.className = "fly"; f.textContent = v; f.style.left = r.left + "px"; f.style.top = (r.top - 4) + "px";
      document.body.appendChild(f); setTimeout(() => f.remove(), 750); toast("In your Tasks Inbox");
    } catch (err) { inp.value = v; toast("Task not added: " + err.message, { bad: true }); }
    inp.disabled = false; inp.focus();
  };
  document.addEventListener("keydown", function keyRouter(e) {
    if (e.target.matches?.("input,select,textarea") || e.metaKey || e.ctrlKey || e.altKey || $(".modal")) return;
    const k = e.key.toLowerCase();
    if (k === "escape") { if (S.page !== "cal") showPage("cal"); else { panel("now"); document.body.classList.remove("popen", "month"); } }
    else if (S.page !== "cal") return;
    else if (k === "arrowleft") step(-1); else if (k === "arrowright") step(1);
    else if (k === "t") goToday(); else if (k === "1" || k === "d") setN(1); else if (k === "3") setN(3); else if (k === "7" || k === "w") setN(7); else if (k === "m") setN("m");
    else if (k === "n") $("#newTask").focus(); else if (k === "p") $("#panelBtn").click(); else if (k === "?") panel("keys");
    else return;
    e.preventDefault();
  });
  wireSwipe($("#view")); wirePinch($("#view"));
  addEventListener("resize", function onResize() { size(); });
  addEventListener("focus", () => { if (S.tab !== "event" && questKey()) { refresh(); loadSide(); } });
  setInterval(() => { showLook(); tickNow(); if (S.tab === "now" && S.page === "cal" && !dragging) paintPanel(); renderRail(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) showLook(); });
}
/** Open or close the hidden readout; its script loads the first time only. */
function readout() {
  if (window.CalReadout) { CalReadout.toggle(); return; }
  CalHook.state = () => ({ cur: S.cur, win0: S.win0, n: S.n, dw, slideX, shown: TOUCH && $("#strip") ? shownX() : null, touch: TOUCH, api: API, h: S.h });
  const s = document.createElement("script"); s.src = "calendar-readout.js?v=6"; document.head.appendChild(s);
}
function boot() { render(); loadSide(); refresh(); }
setup(); boot();
</script>
</body></html>
